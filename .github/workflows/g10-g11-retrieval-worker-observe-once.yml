name: G10 G11 Retrieval Worker Observe Once

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  observe:
    if: >-
      github.event.issue.number == 88 &&
      github.event.comment.user.login == 'D22977' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, 'CONTROL_G10_G11_RETRIEVAL_WORKER_OBSERVE_V1')
    runs-on: [self-hosted, Windows, GBB-REVIEWER]
    timeout-minutes: 4
    defaults:
      run:
        shell: pwsh -NoProfile -File {0}
    steps:
      - name: Observe exact retrieval worker mechanically
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $repo='D22977/gpt-browser-bridge'; $issue=88
          $authority='5555858089'; $delivery='5555845342'; $switch='5555495204'
          $pane='w2:p1'; $session='01a0513f-4e68-7573-bf38-72e2120ebe1d'
          $herdr='C:\Users\Lupun\AppData\Local\Programs\Herdr\bin\herdr.exe'
          $headers=@{Authorization="Bearer $env:GH_TOKEN";'User-Agent'='g10-g11-retrieval-worker-observe';Accept='application/vnd.github+json'}
          function Publish([string]$text){$p=@{body=$text}|ConvertTo-Json -Compress;$r=Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/issues/$issue/comments" -Headers $headers -Method Post -Body $p -ContentType 'application/json' -TimeoutSec 30;$rb=Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/issues/comments/$($r.id)" -Headers $headers -Method Get -TimeoutSec 30;if([string]$rb.body-cne$text){throw'readback mismatch'};return [string]$r.id}
          function Safe([object]$v){$s=[string]$v;$s=$s-replace'[\r\n]+',' ';if($s.Length-gt240){$s=$s.Substring(0,240)};return $s}
          $event=Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw|ConvertFrom-Json;$body=[string]$event.comment.body
          if($body-notmatch'(?m)^CONTROL_G10_G11_RETRIEVAL_WORKER_OBSERVE_V1\s*$' -or $body-notmatch'(?m)^source_authority:\s*5555858089\s*$'){throw'bad event binding'}
          foreach($cid in @($authority,$delivery,$switch)){$c=Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/issues/comments/$cid" -Headers $headers -Method Get -TimeoutSec 30;if([string]$c.issue_url-notmatch'/issues/88$'){throw"bad authority $cid"}}
          if(-not(Test-Path $herdr)){throw'Herdr CLI missing'}
          $raw=& $herdr agent list 2>&1|Out-String;if($LASTEXITCODE-ne0){throw'herdr agent list failed'};$list=$raw|ConvertFrom-Json
          $m=@($list.result.agents|Where-Object{[string]$_.pane_id-ceq$pane-and[string]$_.agent_session.value-ceq$session})
          if($m.Count-ne1){$status='MISSING_OR_AMBIGUOUS';$name='';$cwd='';$focused=''}else{$status=Safe $m[0].agent_status;$name=Safe $m[0].name;$cwd=Safe $m[0].cwd;$focused=Safe $m[0].focused}
          $text=@('CONTROL_G10_G11_RETRIEVAL_WORKER_OBSERVATION_V1','state: PASS_READ_ONLY',"source_authority: $authority","source_delivery: $delivery","source_current_switch: $switch","target_pane: $pane","target_agent_session: $session","target_status: $status","target_name: $name","target_cwd: $cwd","target_focused: $focused",'agent_prompt_performed: false','agent_read_performed: false','browser_action_performed: false','raw_terminal_output_published: false','user_relay_count: 0',"workflow_run_id: $env:GITHUB_RUN_ID",'readback_required: true')-join"`n"
          $rid=Publish $text;Write-Output "observation receipt=$rid status=$status"
