name: G10 G11 Unattended Runtime Artifact Worker V37

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  worker-repair:
    if: github.event.issue.number == 88 && github.event.comment.user.login == 'D22977' && startsWith(github.event.comment.body, 'CONTROL_G10_G11_UNATTENDED_RUNTIME_ARTIFACT_REPAIR_WAKE_V37')
    runs-on: [self-hosted, Windows, GBB-REVIEWER]
    timeout-minutes: 80
    steps:
      - name: Deliver Repair06 once and guard READY
        shell: node {0}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import {spawnSync} from 'node:child_process';
          const repo='D22977/gpt-browser-bridge', issue=88;
          const currentSwitch='5555495204', generation='010', conversation='6a9c2234-f4b4-83ee-ba4b-82c3ee3a2562';
          const adjudication='5558852537', cardReceipt='5558856316', authority='5558864124';
          const cardId='GBB-UNATTENDED-RUNTIME-ARTIFACT-MATERIALIZATION-REPAIR-06';
          const base='fa1b0fa7c8ab8add8e1f24eed7e4ab76637b6b99';
          const branch='worker/g10-g11-unattended-runtime-artifact-repair-06';
          const terminalMarker='GBB_UNATTENDED_RUNTIME_ARTIFACT_REPAIR06_READY_V1';
          const expectedBlobs=['42e55aa194fee1243f8cf32e3c1a63e7ad86f78a','9b0822388d7bd3ecc0c51e98836846ae9b192ce3','ec3a14825ed13681e4a3d0d29ec2612ba3eb2fbf'];
          const allowed=new Set(['.github/workflows/g10-g11-ready-return-control-doorbell-v2.yml','tests/baseline.test.mjs']);
          const herdr='C:\\Users\\Lupun\\AppData\\Local\\Programs\\Herdr\\bin\\herdr.exe';
          const stateDir='D:\\AIWORK_RUNTIME\\GPT_BROWSER_BRIDGE\\g10-g11-unattended-runtime-artifact-v37';
          const stateFile=path.join(stateDir,'repair06-send.json'); fs.mkdirSync(stateDir,{recursive:true});
          const token=process.env.GH_TOKEN, sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function api(route,init={}){const r=await fetch(`https://api.github.com/repos/${repo}${route}`,{...init,headers:{Authorization:`Bearer ${token}`,Accept:'application/vnd.github+json','User-Agent':'g10-g11-v37-worker',...(init.headers||{})}});const t=await r.text();if(!r.ok)throw new Error(`GitHub ${r.status} ${route}: ${t}`);if(!t)return null;try{return JSON.parse(t)}catch{return t}}
          const first=b=>String(b||'').split(/\r?\n/,1)[0].trim();
          const line=(b,k)=>{const m=String(b||'').match(new RegExp(`^${k}:\\s*(.*?)\\s*$`,'m'));return m?m[1]:null};
          async function comment(id){const c=await api(`/issues/comments/${id}`);if(!Number.isSafeInteger(c?.id)||!String(c.issue_url||'').endsWith('/issues/88')||typeof c.body!=='string')throw new Error(`comment ${id} malformed`);return c}
          async function recent(since){const out=[];for(let p=1;p<=50;p++){const xs=await api(`/issues/88/comments?since=${encodeURIComponent(since)}&per_page=100&page=${p}`);if(!Array.isArray(xs))throw new Error('comments not array');for(const c of xs){if(!Number.isSafeInteger(c?.id)||typeof c.body!=='string')throw new Error('comment shape malformed');out.push(c)}if(xs.length<100)break}return out}
          async function verifyAuthority(){const [sw,card,adj,auth]=await Promise.all([comment(currentSwitch),comment(cardReceipt),comment(adjudication),comment(authority)]);if(first(sw.body)!=='CONTROL_GENERATION_SWITCH_V1'||line(sw.body,'state')!=='SWITCH_COMMITTED'||line(sw.body,'new_generation')!==generation||line(sw.body,'new_conversation_id')!==conversation||line(sw.body,'new_status')!=='ACTIVE')throw new Error('current switch mismatch');if(first(card.body)!=='DISPATCH_CARD_V1'||line(card.body,'card_id')!==cardId)throw new Error('card mismatch');if(first(adj.body)!=='CONTROL_G10_G11_UNATTENDED_E2E_V36_RUNTIME_ARTIFACT_ADJUDICATION_V1')throw new Error('adjudication mismatch');if(first(auth.body)!=='CONTROL_G10_G11_UNATTENDED_RUNTIME_ARTIFACT_SPLIT_TRANSPORT_AUTHORITY_V37'||line(auth.body,'state')!=='AUTHORIZED')throw new Error('transport authority mismatch');for(const c of await recent(sw.created_at)){if(String(c.id)===currentSwitch||first(c.body)!=='CONTROL_GENERATION_SWITCH_V1')continue;if(BigInt(c.id)>BigInt(currentSwitch))throw new Error(`newer switch evidence ${c.id}`)}return sw}
          async function publish(body){const x=await api(`/issues/${issue}/comments`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({body})});const rb=await comment(String(x.id));if(rb.body!==body)throw new Error('receipt readback mismatch');return String(x.id)}
          function herdrJson(args){const r=spawnSync(herdr,args,{encoding:'utf8',windowsHide:true,maxBuffer:8*1024*1024});if(r.error||r.status!==0)throw new Error(`Herdr failed: ${r.error?.message||r.stderr||r.stdout}`);return JSON.parse(String(r.stdout||'').trim())}
          const generic=list=>(Array.isArray(list?.result?.agents)?list.result.agents:[]).filter(x=>x&&x.agent==='codex'&&['idle','done'].includes(String(x.agent_status))&&!String(x.name||'').trim()&&String(x.cwd)==='C:\\WINDOWS\\system32');
          const exact=(list,pane,session)=>(Array.isArray(list?.result?.agents)?list.result.agents:[]).filter(x=>x&&String(x.pane_id)===pane&&String(x?.agent_session?.value)===session);
          let physical=0,terminal=null;
          try{
            const event=JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH,'utf8')), wake=String(event?.comment?.body||'');
            if(first(wake)!=='CONTROL_G10_G11_UNATTENDED_RUNTIME_ARTIFACT_REPAIR_WAKE_V37'||line(wake,'source_transport_authority')!==authority||line(wake,'source_repair_card')!==cardReceipt||line(wake,'source_adjudication')!==adjudication||line(wake,'source_current_switch')!==currentSwitch||!line(wake,'source_prevalidation'))throw new Error('wake binding mismatch');
            await verifyAuthority();
            if(fs.existsSync(stateFile)){const s=JSON.parse(fs.readFileSync(stateFile,'utf8'));if(s.status==='SENDING')throw new Error('UNCERTAIN_WORKER_SEND_NO_BLIND_RETRY');if(s.status==='SENT')throw new Error('NO_OP_DUPLICATE_WORKER_SEND')}
            const eligible=generic(herdrJson(['agent','list']));if(eligible.length!==1)throw new Error(`GENERIC_WORKER_COUNT_${eligible.length}`);const pane=String(eligible[0].pane_id||''),session=String(eligible[0]?.agent_session?.value||'');if(!pane||!session)throw new Error('worker binding missing');
            await verifyAuthority();
            const prompt='Read GitHub directly. Execute only D22977/gpt-browser-bridge Issue #88 card 5558856316 / GBB-UNATTENDED-RUNTIME-ARTIFACT-MATERIALIZATION-REPAIR-06 as WORKER. Base exact fa1b0fa7c8ab8add8e1f24eed7e4ab76637b6b99. Modify only the two allowed paths, push worker/g10-g11-unattended-runtime-artifact-repair-06, publish/read-back GBB_UNATTENDED_RUNTIME_ARTIFACT_REPAIR06_READY_V1, then stop. Do not edit tracked src files, do not send Control/browser messages, do not act as Control/Reviewer, and do not create/send generation011.';
            const ph=crypto.createHash('sha256').update(prompt).digest('hex');fs.writeFileSync(stateFile,JSON.stringify({status:'SENDING',pane,session,prompt_hash:ph}));
            let sent;try{sent=herdrJson(['agent','prompt',pane,prompt])}catch{throw new Error('UNCERTAIN_WORKER_SEND_NO_BLIND_RETRY')}if(String(sent?.result?.type)!=='agent_prompted'||String(sent?.result?.agent?.pane_id)!==pane||String(sent?.result?.agent?.agent_session?.value)!==session)throw new Error('UNCERTAIN_WORKER_SEND_NO_BLIND_RETRY');physical=1;
            const delivery=await publish(['CONTROL_G10_G11_UNATTENDED_RUNTIME_ARTIFACT_REPAIR06_V37_DELIVERY_V1','state: DELIVERED',`source_repair_card: ${cardReceipt}`,`target_pane: ${pane}`,`target_agent_session: ${session}`,`prompt_sha256: ${ph}`,'physical_worker_prompt_count: 1','second_physical_prompt: false','post_dispatch_terminal_guard: ACTIVE','user_relay_count: 0',`workflow_run_id: ${process.env.GITHUB_RUN_ID}`,'readback_required: true'].join('\n'));fs.writeFileSync(stateFile,JSON.stringify({status:'SENT',delivery,pane,session}));
            const since=String(event?.comment?.created_at||new Date().toISOString());let idle=0;
            for(let n=0;n<320;n++){await verifyAuthority();const m=(await recent(since)).filter(c=>first(c.body)===terminalMarker&&line(c.body,'card_id')===cardId);if(m.length>1)throw new Error('multiple Repair06 terminals');if(m.length===1){terminal=m[0];break}const ex=exact(herdrJson(['agent','list']),pane,session);if(ex.length!==1)throw new Error('bound Worker disappeared');idle=['idle','done'].includes(String(ex[0].agent_status))?idle+1:0;if(idle>=6)throw new Error('Repair06 terminal missing after Worker idle/done');await sleep(15000)}
            if(!terminal)throw new Error('Repair06 terminal timeout');if(line(terminal.body,'state')!=='READY_FOR_CONTROL_CANARY')throw new Error(`Repair06 terminal=${line(terminal.body,'state')}`);
            const head=line(terminal.body,'candidate_head'),parent=line(terminal.body,'candidate_parent'),wb=line(terminal.body,'worker_branch')||line(terminal.body,'branch');if(!/^[0-9a-f]{40}$/.test(head||'')||parent!==base||wb!==branch||line(terminal.body,'selected_return_mechanism')!=='WORKFLOW_DISPATCH')throw new Error('Repair06 READY binding invalid');
            const ref=await api(`/git/ref/heads/${branch}`);if(String(ref?.object?.sha)!==head)throw new Error('remote branch/head mismatch');const commit=await api(`/commits/${head}`);if(String(commit?.parents?.[0]?.sha)!==base)throw new Error('remote parent mismatch');const cmp=await api(`/compare/${base}...${head}`);const files=Array.isArray(cmp?.files)?cmp.files.map(f=>String(f.filename)):[];if(!files.length||files.some(f=>!allowed.has(f))||!files.includes('.github/workflows/g10-g11-ready-return-control-doorbell-v2.yml'))throw new Error(`scope invalid ${files.join(',')}`);
            const wf=await api(`/contents/.github/workflows/g10-g11-ready-return-control-doorbell-v2.yml?ref=${head}`);if(!wf?.content)throw new Error('workflow content missing');const txt=Buffer.from(String(wf.content).replace(/\n/g,''),'base64').toString('utf8');for(const marker of [...expectedBlobs,cardId,terminalMarker,'GBB-UNATTENDED-DOORBELL-BINDING-REPAIR-05','GBB_UNATTENDED_DOORBELL_BINDING_REPAIR05_READY_V1','GBB-UNATTENDED-COMPOSER-SENDER-REPAIR-04','GBB_UNATTENDED_COMPOSER_SENDER_REPAIR04_READY_V1'])if(!txt.includes(marker))throw new Error(`workflow binding missing ${marker}`);
            await publish(['CONTROL_G10_G11_UNATTENDED_RUNTIME_ARTIFACT_REPAIR06_V37_WORKER_STAGE_V1','state: READY_RUNNER_RELEASE',`source_terminal_receipt: ${terminal.id}`,`candidate_head: ${head}`,`candidate_parent: ${base}`,`worker_branch: ${branch}`,`workflow_blob_sha: ${wf.sha}`,`changed_paths_exact: ${files.join(',')}`,'physical_worker_prompt_count: 1','user_relay_count: 0',`workflow_run_id: ${process.env.GITHUB_RUN_ID}`,'readback_required: true'].join('\n'));
          }catch(e){const reason=String(e?.message||e).replace(/[\r\n]+/g,' ').slice(0,500);try{await publish(['CONTROL_G10_G11_UNATTENDED_RUNTIME_ARTIFACT_V37_WORKER_FAILURE_V1','state: CONTROL_REQUIRED',`source_repair_card: ${cardReceipt}`,`source_terminal_receipt: ${terminal?.id||'NONE'}`,`physical_worker_prompt_count: ${physical}`,'second_physical_prompt: false','user_relay_count: 0',`reason: ${reason}`,`workflow_run_id: ${process.env.GITHUB_RUN_ID}`,'readback_required: true'].join('\n'))}catch{}throw e}
