name: G10 G11 Create Candidate Once

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: g10-g11-create-candidate-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  create-candidate:
    if: >-
      github.event.issue.number == 88 &&
      github.event.comment.user.login == 'D22977' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, 'CONTROL_G10_G11_CREATE_EVENT_V1')
    runs-on: [self-hosted, Windows, GBB-REVIEWER]
    timeout-minutes: 8
    defaults:
      run:
        shell: pwsh -NoProfile -File {0}

    steps:
      - name: Create and bind exactly one generation011 candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = 'D22977/gpt-browser-bridge'
          $issue = 88
          $transportAuthority = '5555517740'
          $rotationRequired = '5555500259'
          $currentSwitch = '5555495204'
          $oldId = '6a9c2234-f4b4-83ee-ba4b-82c3ee3a2562'
          $projectRoot = 'https://chatgpt.com/g/g-p-6a7b34dba7448191ac48d7789054813b-kong-zhi-ta-zhuan-an'
          $repoRoot = 'D:\AIWORK\GPT_BROWSER_BRIDGE'
          $senderRel = 'src/gpt_send.mjs'
          $senderPath = Join-Path $repoRoot $senderRel
          $expectedSenderBlob = '6b7a523f98a9655ba2ca28f42696b80da365c92b'
          $herdr = 'C:\Users\Lupun\AppData\Local\Programs\Herdr\bin\herdr.exe'
          $pw = 'C:\Users\Lupun\AppData\Roaming\npm\node_modules\@playwright\cli\node_modules\.bin\playwright.cmd'
          $db01Root = 'D:\AIWORK_RUNTIME\GPT_BROWSER_BRIDGE\control-doorbell'
          $db01Profile = 'D:\AIWORK_RUNTIME\GPT_BROWSER_BRIDGE\control-doorbell\db01-profile'
          $session = 'HERDR-DOORBELL-DB01-G1-20260816'
          $runtimeRoot = 'D:\AIWORK_RUNTIME\GPT_BROWSER_BRIDGE\g10-g11-create-candidate-once'
          $stateRoot = Join-Path $runtimeRoot 'state'
          New-Item -ItemType Directory -Force -Path $stateRoot | Out-Null

          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            'User-Agent' = 'g10-g11-create-candidate-once'
            Accept = 'application/vnd.github+json'
          }

          function Publish([string]$text) {
            $payload = @{ body = $text } | ConvertTo-Json -Compress
            $r = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/issues/$issue/comments" -Headers $headers -Method Post -Body $payload -ContentType 'application/json' -TimeoutSec 30
            $rb = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/issues/comments/$($r.id)" -Headers $headers -Method Get -TimeoutSec 30
            if ([string]$rb.body -cne $text) { throw 'Durable receipt readback mismatch' }
            return [string]$r.id
          }

          function GetAllIssueComments {
            $all = [System.Collections.Generic.List[object]]::new()
            for ($p = 1; $p -le 40; $p++) {
              $page = @(Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/issues/$issue/comments?per_page=100&page=$p" -Headers $headers -Method Get -TimeoutSec 30)
              foreach ($x in $page) { [void]$all.Add($x) }
              if ($page.Count -lt 100) { break }
            }
            return $all
          }

          $event = Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
          if ($event.repository.full_name -cne $repo -or [int]$event.issue.number -ne $issue) { throw 'Wrong event target' }
          if ($event.comment.user.login -cne 'D22977' -or $event.comment.author_association -cne 'OWNER') { throw 'Wrong event actor' }
          $body = [string]$event.comment.body
          if ($body -notmatch '(?m)^CONTROL_G10_G11_CREATE_EVENT_V1\s*$') { throw 'Missing protocol header' }
          if ($body -notmatch '(?m)^source_transport_authority:\s*5555517740\s*$') { throw 'Wrong transport authority' }
          if ($body -notmatch '(?m)^source_rotation_required:\s*5555500259\s*$') { throw 'Wrong rotation receipt' }
          if ($body -notmatch '(?m)^source_current_switch:\s*5555495204\s*$') { throw 'Wrong current switch' }
          if ($body -notmatch '(?m)^idempotency_key:\s*G10-G11-CREATE-20260906-01\s*$') { throw 'Wrong idempotency key' }
          $sourceEvent = [string]$event.comment.id
          $statePath = Join-Path $stateRoot "$sourceEvent.json"

          foreach ($cid in @($transportAuthority, $rotationRequired, $currentSwitch)) {
            $c = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/issues/comments/$cid" -Headers $headers -Method Get -TimeoutSec 30
            if ([string]$c.issue_url -notmatch '/issues/88$') { throw "Authority $cid is not on Issue #88" }
          }

          $all = @(GetAllIssueComments)
          $switches = @($all | Where-Object {
            $_.body -match '(?m)^CONTROL_GENERATION_SWITCH_V1\s*$' -and
            $_.body -match '(?m)^state:\s*SWITCH_COMMITTED\s*$' -and
            ($_.body -match '(?m)^new_status:\s*ACTIVE\s*$' -or $_.body -match '(?m)^new_generation_status:\s*ACTIVE\s*$')
          } | Sort-Object { [int64]$_.id })
          if ($switches.Count -eq 0) { throw 'No legal ACTIVE switch found' }
          $latest = $switches[-1]
          $gm = [regex]::Match([string]$latest.body, '(?m)^new_generation:\s*(\d{3})\s*$')
          if ([string]$latest.id -cne $currentSwitch -or -not $gm.Success -or $gm.Groups[1].Value -cne '010') {
            throw "Generation010 is not latest ACTIVE switch; latest=$($latest.id)"
          }

          if (Test-Path -LiteralPath $statePath) {
            $s = Get-Content -LiteralPath $statePath -Raw | ConvertFrom-Json
            if ([string]$s.status -eq 'SENT') {
              $receipt = @(
                'CONTROL_G10_G11_CANDIDATE_CREATE_RESULT_V1',
                'state: NO_OP_DUPLICATE',
                'decision: NO_OP_DUPLICATE',
                "source_event_comment_id: $sourceEvent",
                'second_physical_send: false',
                'user_relay_count: 0',
                'readback_required: true'
              ) -join "`n"
              $rid = Publish $receipt
              Write-Output "NO_OP_DUPLICATE receipt=$rid"
              exit 0
            }
            if ([string]$s.status -eq 'SENDING') { throw 'UNCERTAIN_SEND / NO_BLIND_RETRY' }
          }

          $existing011 = @($all | Where-Object {
            $_.body -match '(?m)^CONTROL_GENERATION_011_CANDIDATE_BINDING_V1\s*$' -and
            $_.body -match '(?m)^candidate_generation:\s*011\s*$'
          })
          if ($existing011.Count -gt 0) {
            $receipt = @(
              'CONTROL_G10_G11_CANDIDATE_CREATE_RESULT_V1',
              'state: NO_OP_EXISTING_CANDIDATE',
              'decision: NO_OP_NO_SECOND_CANDIDATE',
              "source_event_comment_id: $sourceEvent",
              "existing_candidate_binding_count: $($existing011.Count)",
              'second_physical_send: false',
              'user_relay_count: 0',
              'readback_required: true'
            ) -join "`n"
            $rid = Publish $receipt
            Write-Output "NO_OP_EXISTING_CANDIDATE receipt=$rid"
            exit 0
          }

          $sendBoundaryEntered = $false
          $herdrVersion = ''
          $agentCount = ''
          $projectPreHref = ''

          try {
            $whoami = (& whoami).Trim()
            $identity = [System.Security.Principal.WindowsIdentity]::GetCurrent().Name
            $sid = [System.Diagnostics.Process]::GetCurrentProcess().SessionId
            if ($whoami -notmatch '(?i)^d22977\\lupun$' -or $identity -notmatch '(?i)^d22977\\lupun$') { throw 'PRESEND_ABORT: unexpected Windows identity' }
            if (-not [Environment]::UserInteractive -or $sid -eq 0) { throw 'PRESEND_ABORT: runner is not interactive' }
            if ($env:RUNNER_NAME -cne 'gbb-reviewer-win-01') { throw "PRESEND_ABORT: unexpected runner $env:RUNNER_NAME" }

            if (-not (Test-Path -LiteralPath $senderPath)) { throw 'PRESEND_ABORT: local canonical sender missing' }
            $senderBlob = (& git -C $repoRoot hash-object -- $senderRel).Trim()
            if ($LASTEXITCODE -ne 0 -or $senderBlob -cne $expectedSenderBlob) { throw "PRESEND_ABORT: sender blob mismatch $senderBlob" }

            if (-not (Test-Path -LiteralPath $herdr)) { throw 'PRESEND_ABORT: Herdr CLI missing' }
            $herdrVersion = (& $herdr --version 2>&1 | Out-String).Trim()
            if ($LASTEXITCODE -ne 0) { throw 'PRESEND_ABORT: Herdr version failed' }
            $agentRaw = (& $herdr agent list 2>&1 | Out-String)
            if ($LASTEXITCODE -ne 0) { throw 'PRESEND_ABORT: Herdr agent list failed' }
            try { $agentJson = $agentRaw | ConvertFrom-Json } catch { throw 'PRESEND_ABORT: Herdr agent list invalid JSON' }
            $agentCount = @($agentJson.result.agents).Count

            if (-not (Test-Path -LiteralPath $pw)) { throw 'PRESEND_ABORT: Playwright CLI missing' }
            if (-not (Test-Path -LiteralPath $db01Root -PathType Container)) { throw 'PRESEND_ABORT: DB01 runtime root missing' }
            if (-not (Test-Path -LiteralPath $db01Profile -PathType Container)) { throw 'PRESEND_ABORT: DB01 profile missing' }

            Push-Location $db01Root
            try {
              $sessions = (& $pw cli list 2>&1 | Out-String)
              if ($LASTEXITCODE -ne 0) { throw 'PRESEND_ABORT: Playwright session list failed' }
              $tabs = (& $pw cli "-s=$session" tab-list 2>&1 | Out-String)
              $tx = $LASTEXITCODE
              if ($tx -eq 1 -and $sessions -notmatch [regex]::Escape($session)) {
                $opened = (& $pw cli "-s=$session" open --persistent "--profile=$db01Profile" --headed 2>&1 | Out-String)
                if ($LASTEXITCODE -ne 0) { throw "PRESEND_ABORT: DB01 restart failed $opened" }
              } elseif ($tx -ne 0) {
                throw "PRESEND_ABORT: DB01 session ambiguous $tabs"
              }

              $tabs = (& $pw cli "-s=$session" tab-list 2>&1 | Out-String)
              if ($LASTEXITCODE -ne 0) { throw 'PRESEND_ABORT: DB01 tab-list failed' }
              $chatLines = @($tabs -split "`r?`n" | Where-Object { $_ -match '\]\(https://chatgpt\.com(?:/[^)]*)?\)\s*$' })
              if ($chatLines.Count -ne 1) { throw "PRESEND_ABORT: exact chatgpt tab count=$($chatLines.Count)" }
              $ix = [regex]::Match($chatLines[0], '^\s*-\s*(\d+):')
              if (-not $ix.Success) { throw 'PRESEND_ABORT: ChatGPT tab index parse failed' }
              $null = (& $pw cli "-s=$session" tab-select $ix.Groups[1].Value 2>&1 | Out-String)
              if ($LASTEXITCODE -ne 0) { throw 'PRESEND_ABORT: ChatGPT tab-select failed' }

              $go = (& $pw cli "-s=$session" goto $projectRoot 2>&1 | Out-String)
              if ($LASTEXITCODE -ne 0) { throw "PRESEND_ABORT: project-root navigation failed $go" }
            } finally {
              Pop-Location
            }

            $entry = Join-Path (Split-Path -Parent $pw) '..\playwright\cli.js'
            $entry = [IO.Path]::GetFullPath($entry)
            if (-not (Test-Path -LiteralPath $entry)) { throw 'PRESEND_ABORT: Playwright entrypoint missing' }

            function PwJson([string]$sub, [string[]]$args = @()) {
              $out = (& node $entry cli "-s=$session" $sub @args --json 2>&1 | Out-String)
              if ($LASTEXITCODE -ne 0) { throw "PRESEND_ABORT: CLI_EXIT_$sub $out" }
              try { $v = $out | ConvertFrom-Json } catch { throw "PRESEND_ABORT: CLI_INVALID_JSON_$sub" }
              if ($v.isError -eq $true) { throw "PRESEND_ABORT: CLI_ERROR_RESPONSE_$sub $($v.error)" }
              $r = $v.result
              if ($r -is [string]) { try { $r = $r | ConvertFrom-Json } catch {} }
              return $r
            }

            $meta = PwJson 'eval' @('() => { const id=(location.pathname.match(/\/c\/([0-9a-f-]+)/i)||[])[1]||""; const e=document.querySelector("#prompt-textarea"); const r=e?e.getBoundingClientRect():null; const s=e?getComputedStyle(e):null; return {href:location.href,pathname:location.pathname,conversationId:id,found:Boolean(e),display:s?.display||"",visibility:s?.visibility||"",pointerEvents:s?.pointerEvents||"",width:r?Math.round(r.width):0,height:r?Math.round(r.height):0}; }')
            $projectPreHref = [string]$meta.href
            if ([string]$meta.conversationId) { throw "PRESEND_ABORT: project root resolved to existing conversation $($meta.conversationId)" }
            if (-not $projectPreHref.StartsWith($projectRoot, [System.StringComparison]::OrdinalIgnoreCase)) { throw "PRESEND_ABORT: project root mismatch $projectPreHref" }
            if (-not $meta.found -or $meta.display -eq 'none' -or $meta.visibility -eq 'hidden' -or $meta.pointerEvents -eq 'none' -or [int]$meta.width -le 250 -or [int]$meta.height -le 20) {
              throw "PRESEND_ABORT: prompt composer not actionable"
            }

            $prompt = 'Read GitHub directly. Rehydrate D22977/gpt-browser-bridge from Issue #43 latest CURRENT_START_HERE, Issue #81 latest CURRENT_REGISTRY_INDEX, and Issue #88 rotation receipt 5555500259. You are the one NEW generation011 Control candidate created for this rotation. Publish and read back exactly one CONTROL_GENERATION_ACK_V1 on Issue #88 bound to generation 011, source_rotation_required 5555500259, and your exact current conversation_id + conversation_url. Do not act as Worker or Formal Reviewer. Do not mutate product state. GitHub is durable authority; Browser/Herdr is transport only. Then wait for one routing canary.'
            @{ status='SENDING'; workflow_run_id=$env:GITHUB_RUN_ID; source_event_comment_id=$sourceEvent; started_at=(Get-Date).ToString('o') } | ConvertTo-Json | Set-Content -LiteralPath $statePath -Encoding utf8
            $sendBoundaryEntered = $true

            $env:GBB_SENDER_PATH = $senderPath
            $env:GBB_SESSION = $session
            $env:GBB_RUNTIME_ROOT = $runtimeRoot
            $env:GBB_PROMPT = $prompt
            $sendScript = @'
          import { pathToFileURL } from "node:url";
          const mod = await import(pathToFileURL(process.env.GBB_SENDER_PATH).href);
          const r = await mod.sendJob({
            prompt: process.env.GBB_PROMPT,
            attempt: 1,
            conversationUrl: null,
            runtimeRoot: process.env.GBB_RUNTIME_ROOT,
            session: process.env.GBB_SESSION,
            allowBackgroundTab: true
          });
          console.log(JSON.stringify({
            job_id: r.job.job_id,
            prompt_hash: r.job.prompt_hash,
            conversation_url: r.job.conversation_url
          }));
          '@
            $sendPath = Join-Path $env:RUNNER_TEMP "g10-g11-create-$env:GITHUB_RUN_ID.mjs"
            Set-Content -LiteralPath $sendPath -Value $sendScript -Encoding utf8
            try {
              $sendOut = (& node $sendPath 2>&1 | Out-String).Trim()
              if ($LASTEXITCODE -ne 0) { throw $sendOut }
              $line = ($sendOut -split "`n" | Where-Object { $_.Trim().StartsWith('{') } | Select-Object -Last 1)
              if (-not $line) { throw 'canonical sender returned no JSON' }
              $sent = $line | ConvertFrom-Json
            } finally {
              Remove-Item -LiteralPath $sendPath -Force -ErrorAction SilentlyContinue
            }

            $finalUrl = [string]$sent.conversation_url
            $cm = [regex]::Match($finalUrl, '(?i)/c/([0-9a-f-]+)')
            if (-not $cm.Success) { throw "sender returned non-conversation URL $finalUrl" }
            $candidateId = $cm.Groups[1].Value
            if ($candidateId -ceq $oldId) { throw 'candidate011 id equals generation010 id' }

            @{ status='SENT'; workflow_run_id=$env:GITHUB_RUN_ID; source_event_comment_id=$sourceEvent; candidate_id=$candidateId; candidate_url=$finalUrl; sender_job_id=[string]$sent.job_id; sent_at=(Get-Date).ToString('o') } | ConvertTo-Json | Set-Content -LiteralPath $statePath -Encoding utf8

            $receipt = @(
              'CONTROL_GENERATION_011_CANDIDATE_BINDING_V1',
              'state: BOUND_NEW_MECHANICALLY_CAPTURED_WAIT_ACK',
              'recorded_by_role: BROWSER_TRANSPORT_SENDER',
              'candidate_generation: 011',
              'required_display_name: 控制塔-011',
              "source_transport_authority: $transportAuthority",
              "source_rotation_required: $rotationRequired",
              "source_current_switch: $currentSwitch",
              "source_create_event_comment_id: $sourceEvent",
              "candidate_conversation_id: $candidateId",
              "candidate_conversation_url: $finalUrl",
              'identity_source: MECHANICAL_GPT_SEND_WAIT_CONVERSATION_URL',
              "project_root: $projectRoot",
              "project_root_presend_href: $projectPreHref",
              'project_root_presend_conversation_id: NONE',
              'new_conversation_created_count: 1',
              "sender_module_blob: $expectedSenderBlob",
              "sender_session: $session",
              "sender_job_id: $($sent.job_id)",
              "sender_prompt_hash: $($sent.prompt_hash)",
              "herdr_version: $herdrVersion",
              "herdr_agent_count: $agentCount",
              "workflow_run_id: $env:GITHUB_RUN_ID",
              "runner_name: $env:RUNNER_NAME",
              'physical_send_count: 1',
              'second_physical_send: false',
              'owner_locator_relay_count: 0',
              'user_relay_count: 0',
              'candidate011_ack_required: true',
              'routing_switch_authorized_now: false',
              'readback_required: true'
            ) -join "`n"
            $rid = Publish $receipt
            Write-Output "PASS candidate_binding=$rid candidate_id=$candidateId"
          } catch {
            $detail = ($_.Exception.Message -replace '[\r\n]+',' ')
            if ($detail.Length -gt 600) { $detail = $detail.Substring(0,600) }
            if ($sendBoundaryEntered) {
              $receipt = @(
                'CONTROL_G10_G11_CANDIDATE_CREATE_RESULT_V1',
                'state: UNCERTAIN_SEND',
                'decision: UNCERTAIN_SEND_NO_BLIND_RETRY',
                "source_event_comment_id: $sourceEvent",
                "source_transport_authority: $transportAuthority",
                "source_rotation_required: $rotationRequired",
                "workflow_run_id: $env:GITHUB_RUN_ID",
                "diagnostic: $detail",
                'second_physical_send: false',
                'user_relay_count: 0',
                'readback_required: true'
              ) -join "`n"
              $rid = Publish $receipt
              throw "UNCERTAIN_SEND receipt=$rid"
            } else {
              $receipt = @(
                'CONTROL_G10_G11_CANDIDATE_CREATE_RESULT_V1',
                'state: BLOCKED_PRESEND',
                'decision: BLOCKED_PRESEND_NO_BROWSER_SEND',
                "source_event_comment_id: $sourceEvent",
                "source_transport_authority: $transportAuthority",
                "source_rotation_required: $rotationRequired",
                "workflow_run_id: $env:GITHUB_RUN_ID",
                "diagnostic: $detail",
                'physical_send_count: 0',
                'user_relay_count: 0',
                'readback_required: true'
              ) -join "`n"
              $rid = Publish $receipt
              throw "BLOCKED_PRESEND receipt=$rid"
            }
          }
