name: G11 Issue142 Repair03 Codex Trust Recovery Once

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: g11-issue142-r03-trust-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  recover:
    if: >-
      github.event.issue.number == 142 &&
      github.event.comment.user.login == 'D22977' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, 'CONTINUATION_REPAIR03_TRUST_RECOVERY_WAKE_V1')
    runs-on: [self-hosted, Windows, GBB-REVIEWER]
    timeout-minutes: 150
    defaults:
      run:
        shell: pwsh -NoProfile -File {0}
    steps:
      - name: Apply ephemeral project trust and launch one fresh Repair03 Worker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $repo='D22977/gpt-browser-bridge'
          $issue=142
          $authority='5600723602'
          $sourceBlocker='5600652097'
          $sourceWake='5600646926'
          $card='5576331984'
          $switch='5559192452'
          $expectedBase='01849a03227587335d7c503774fe4379bd8ca672'
          $requiredBranch='worker/g11-control-continuation-repair-03'
          $sourceRepo='D:\AIWORK_RUNTIME\GPT_BROWSER_BRIDGE\issue142-repair03-selfhosted-v3\5600646926\repo'
          $herdr='C:\Users\Lupun\AppData\Local\Programs\Herdr\bin\herdr.exe'
          $headers=@{Authorization="Bearer $env:GH_TOKEN";'User-Agent'='g11-r03-trust-recovery';Accept='application/vnd.github+json'}

          function Need([string]$b,[string]$p,[string]$n){
            $m=[regex]::Match($b,$p)
            if(-not $m.Success){throw "Malformed $n"}
            return $m.Groups[1].Value
          }
          function Safe([string]$x){
            if($null -eq $x){return ''}
            $x=($x -replace '[\r\n]+',' ').Trim()
            if($x.Length -gt 1200){$x=$x.Substring(0,1200)}
            return $x
          }
          function Publish([string]$text){
            $payload=@{body=$text}|ConvertTo-Json -Compress
            $r=Invoke-RestMethod "https://api.github.com/repos/$repo/issues/$issue/comments" -Headers $headers -Method Post -Body $payload -ContentType 'application/json' -TimeoutSec 30
            $rb=Invoke-RestMethod "https://api.github.com/repos/$repo/issues/comments/$($r.id)" -Headers $headers -Method Get -TimeoutSec 30
            if([string]$rb.body -cne $text){throw 'readback mismatch'}
            return [string]$r.id
          }
          function FindReceipt([string]$proto,[string]$wake,[string]$since){
            for($p=1;$p-le 12;$p++){
              $a=@(Invoke-RestMethod "https://api.github.com/repos/$repo/issues/$issue/comments?since=$since&per_page=100&page=$p" -Headers $headers -Method Get -TimeoutSec 30)
              foreach($i in $a){
                $b=[string]$i.body
                if($b.StartsWith($proto) -and $b -match "(?m)^source_bootstrap_wake:\s*$wake\s*$"){return $i}
              }
              if($a.Count -lt 100){break}
            }
            return $null
          }
          function RemoveProfile([string]$path){
            if(Test-Path -LiteralPath $path){Remove-Item -LiteralPath $path -Force -ErrorAction Stop}
            if(Test-Path -LiteralPath $path){throw 'ephemeral Codex profile cleanup failed'}
          }

          $ev=Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw|ConvertFrom-Json
          $body=[string]$ev.comment.body
          $wake=[string]$ev.comment.id
          $since=[uri]::EscapeDataString([string]$ev.comment.created_at)
          $wakeAuthority=Need $body '(?m)^trust_recovery_authority:\s*(\d+)\s*$' trust_recovery_authority
          $wakeBlocker=Need $body '(?m)^source_blocker:\s*(\d+)\s*$' source_blocker
          $wakeBase=Need $body '(?m)^worker_base_sha:\s*([0-9a-f]{40})\s*$' worker_base_sha
          $wakeIntegrated=Need $body '(?m)^launcher_integration_head:\s*([0-9a-f]{40})\s*$' launcher_integration_head
          $idem=Need $body '(?m)^idempotency_key:\s*([A-Za-z0-9._:-]+)\s*$' idempotency_key
          if($wakeAuthority -cne $authority -or $wakeBlocker -cne $sourceBlocker -or $wakeBase -cne $expectedBase){throw 'wake authority mismatch'}

          $runtimeRoot="D:\AIWORK_RUNTIME\GPT_BROWSER_BRIDGE\issue142-repair03-trust-recovery\$wake"
          $state=Join-Path $runtimeRoot 'transport.json'
          New-Item -Force -ItemType Directory -Path $runtimeRoot|Out-Null
          if(Test-Path -LiteralPath $state){
            $old=Get-Content -LiteralPath $state -Raw|ConvertFrom-Json
            $text=@(
              'CONTINUATION_REPAIR03_TRUST_RECOVERY_RESULT_V1',
              'state: NO_OP_DUPLICATE',
              "source_bootstrap_wake: $wake",
              "trust_recovery_authority: $authority",
              "prior_state: $([string]$old.status)",
              'second_physical_prompt: false',
              'user_task_result_relay_count: 0',
              'readback_verified: true',
              "idempotency_key: $idem"
            ) -join "`n"
            [void](Publish $text)
            exit 0
          }
          @{status='PREPARING';wake=$wake;prompt_count=0}|ConvertTo-Json|Set-Content -LiteralPath $state -Encoding utf8

          foreach($rid in @($authority,$sourceBlocker,$card,$switch)){
            $r=Invoke-RestMethod "https://api.github.com/repos/$repo/issues/comments/$rid" -Headers $headers -Method Get -TimeoutSec 30
            if([string]::IsNullOrWhiteSpace([string]$r.body)){throw "unreadable authority $rid"}
          }
          $auth=Invoke-RestMethod "https://api.github.com/repos/$repo/issues/comments/$authority" -Headers $headers -Method Get -TimeoutSec 30
          if(-not ([string]$auth.body).StartsWith('CONTROL_G11_CODEX_WORKSPACE_TRUST_RECOVERY_V1')){throw 'wrong recovery authority'}
          $block=Invoke-RestMethod "https://api.github.com/repos/$repo/issues/comments/$sourceBlocker" -Headers $headers -Method Get -TimeoutSec 30
          $bb=[string]$block.body
          if($bb -notmatch '(?m)^state:\s*CONTROL_REQUIRED_PREPROMPT_AGENT_NOT_READY\s*$' -or $bb -notmatch '(?m)^source_bootstrap_wake:\s*5600646926\s*$' -or $bb -notmatch '(?m)^physical_prompt_count:\s*0\s*$'){throw 'source blocker mismatch'}

          $sw=Invoke-RestMethod "https://api.github.com/repos/$repo/issues/comments/$switch" -Headers $headers -Method Get -TimeoutSec 30
          $sb=[string]$sw.body
          if($sb -notmatch '(?m)^state:\s*SWITCH_COMMITTED\s*$' -or $sb -notmatch '(?m)^new_generation:\s*011\s*$' -or $sb -notmatch '(?m)^new_generation_status:\s*ACTIVE\s*$'){throw 'generation011 not ACTIVE'}
          $newSwitch=@(Invoke-RestMethod "https://api.github.com/repos/$repo/issues/88/comments?since=$([uri]::EscapeDataString([string]$sw.created_at))&per_page=100" -Headers $headers -Method Get -TimeoutSec 30 | Where-Object{
            [string]$_.body -match '(?m)^CONTROL_GENERATION_SWITCH_V1\s*$' -and [string]$_.body -match '(?m)^state:\s*SWITCH_COMMITTED\s*$' -and [string]$_.id -ne $switch
          })
          if($newSwitch.Count -gt 0){throw 'newer Control switch exists'}

          $ref=Invoke-RestMethod "https://api.github.com/repos/$repo/git/ref/heads/review-base/gbb-gh-01" -Headers $headers -Method Get -TimeoutSec 30
          if([string]$ref.object.sha -cne $wakeIntegrated){throw "launcher/default drift $([string]$ref.object.sha)"}
          try{
            $null=Invoke-RestMethod "https://api.github.com/repos/$repo/git/ref/heads/worker/g11-control-continuation-repair-03" -Headers $headers -Method Get -TimeoutSec 30
            throw 'Worker branch exists before recovery'
          }catch{
            $code=0
            try{$code=[int]$_.Exception.Response.StatusCode}catch{}
            if($code -ne 404 -and $_.Exception.Message -notmatch '404'){throw}
          }

          if($env:RUNNER_NAME -cne 'gbb-reviewer-win-01' -or -not [Environment]::UserInteractive -or [Diagnostics.Process]::GetCurrentProcess().SessionId -eq 0){throw 'runner admission failed'}
          if(-not(Test-Path -LiteralPath $herdr -PathType Leaf)){throw 'Herdr missing'}
          if(-not(Test-Path -LiteralPath $sourceRepo -PathType Container)){throw 'source runtime repo missing'}
          $origin=((& git -C $sourceRepo remote get-url origin 2>&1)|Out-String).Trim()
          $head=((& git -C $sourceRepo rev-parse HEAD 2>&1)|Out-String).Trim()
          $status=((& git -C $sourceRepo status --porcelain=v1 --untracked-files=all 2>&1)|Out-String)
          $branch=((& git -C $sourceRepo symbolic-ref -q --short HEAD 2>&1)|Out-String).Trim()
          if($origin -notmatch 'D22977/gpt-browser-bridge(\.git)?$' -or $head -cne $expectedBase -or -not [string]::IsNullOrWhiteSpace($status) -or -not [string]::IsNullOrWhiteSpace($branch)){throw 'source runtime repo not pristine exact base'}

          $hv=((& $herdr --version 2>&1)|Out-String).Trim()
          if($LASTEXITCODE -ne 0 -or $hv -notmatch '0\.8\.2'){throw "Herdr version $hv"}
          $cv=((& codex --version 2>&1)|Out-String).Trim()
          if($LASTEXITCODE -ne 0){throw "Codex version failed $(Safe $cv)"}
          $ch=((& codex --help 2>&1)|Out-String)
          if($LASTEXITCODE -ne 0 -or $ch -notmatch '(?m)--profile'){throw 'Codex --profile unsupported'}

          $suffix=$wake.Substring([Math]::Max(0,$wake.Length-8))
          $profile="g142r03trust$suffix"
          $named="g142-r03-w4-$suffix"
          $agent="g142r03w4$suffix"
          if($agent.Length -gt 32){$agent=$agent.Substring(0,32)}
          $codexHome=if(-not [string]::IsNullOrWhiteSpace($env:CODEX_HOME)){$env:CODEX_HOME}else{Join-Path $HOME '.codex'}
          if(-not(Test-Path -LiteralPath $codexHome -PathType Container)){throw 'CODEX_HOME missing'}
          $profilePath=Join-Path $codexHome "$profile.config.toml"
          if(Test-Path -LiteralPath $profilePath){throw 'task Codex profile path already exists'}
          if($sourceRepo.Contains("'")){throw 'source repo path cannot be represented as TOML literal key'}
          $profileText="[projects.'$sourceRepo']`ntrust_level = `"trusted`"`n"
          Set-Content -LiteralPath $profilePath -Value $profileText -Encoding utf8 -NoNewline
          if(-not(Test-Path -LiteralPath $profilePath -PathType Leaf)){throw 'task Codex profile creation failed'}

          $out=Join-Path $runtimeRoot 'herdr.out'
          $err=Join-Path $runtimeRoot 'herdr.err'
          $p=Start-Process $herdr -ArgumentList @('--session',$named,'server') -PassThru -WindowStyle Hidden -RedirectStandardOutput $out -RedirectStandardError $err
          $ready=$false
          for($i=0;$i-lt 40;$i++){
            Start-Sleep -Milliseconds 500
            try{
              $sr=((& $herdr --session $named status server 2>&1)|Out-String).Trim()
              if($LASTEXITCODE -eq 0 -and $sr -notmatch 'protocol_mismatch|protocol 19'){$ready=$true;break}
            }catch{}
            if($p.HasExited){break}
          }
          if(-not $ready){RemoveProfile $profilePath; throw 'fresh Herdr server unavailable'}

          $cr=((& $herdr --session $named workspace create --cwd $sourceRepo --label "g142-r03-trust-$wake" --no-focus 2>&1)|Out-String).Trim()
          if($LASTEXITCODE -ne 0){RemoveProfile $profilePath; throw "workspace failed $(Safe $cr)"}
          $wo=$cr|ConvertFrom-Json
          $ws=[string]$wo.result.workspace.workspace_id
          $pane=[string]$wo.result.root_pane.pane_id

          $cmd="codex --profile $profile --approve-for-me"
          $run=((& $herdr --session $named pane run $pane $cmd 2>&1)|Out-String).Trim()
          if($LASTEXITCODE -ne 0){RemoveProfile $profilePath; throw "codex launch failed $(Safe $run)"}

          $agentObj=$null
          for($i=0;$i-lt 75;$i++){
            Start-Sleep -Seconds 1
            $gr=((& $herdr --session $named agent get $pane 2>&1)|Out-String).Trim()
            if($LASTEXITCODE -eq 0){
              try{$go=$gr|ConvertFrom-Json;if([string]$go.result.agent.pane_id -ceq $pane){$agentObj=$go;break}}catch{}
            }
          }
          if($null -eq $agentObj){RemoveProfile $profilePath; throw 'Codex agent detection timeout'}

          $settled=$false
          $agentStatus=''
          $lastRead=''
          for($i=0;$i-lt 45;$i++){
            $gr=((& $herdr --session $named agent get $pane 2>&1)|Out-String).Trim()
            if($LASTEXITCODE -eq 0){
              $go=$gr|ConvertFrom-Json
              $agentStatus=[string]$go.result.agent.agent_status
              if($agentStatus -in @('idle','done','blocked')){$settled=$true;break}
            }
            Start-Sleep -Seconds 1
          }
          if(-not $settled -or $agentStatus -eq 'blocked'){
            $lastRead=((& $herdr --session $named agent read $pane --source recent-unwrapped --lines 120 2>&1)|Out-String).Trim()
            RemoveProfile $profilePath
            $text=@(
              'CONTINUATION_REPAIR03_TRUST_RECOVERY_RESULT_V1',
              'state: CONTROL_REQUIRED_PROFILE_TRUST_NOT_ACCEPTED',
              "source_bootstrap_wake: $wake",
              "trust_recovery_authority: $authority",
              "source_blocker: $sourceBlocker",
              "codex_version: $(Safe $cv)",
              "task_profile: $profile",
              'task_profile_removed: true',
              "named_session: $named",
              "fresh_workspace: $ws",
              "fresh_pane: $pane",
              "agent_status: $agentStatus",
              "preprompt_readback: $(Safe $lastRead)",
              'physical_prompt_count: 0',
              'owner_enter_count: 0',
              'send_keys_used: false',
              'orca_used: false',
              'user_task_result_relay_count: 0',
              'readback_verified: true',
              "idempotency_key: $idem"
            ) -join "`n"
            @{status='CONTROL_REQUIRED_PREPROMPT';wake=$wake;prompt_count=0}|ConvertTo-Json|Set-Content -LiteralPath $state -Encoding utf8
            [void](Publish $text)
            exit 0
          }

          $rn=((& $herdr --session $named agent rename $pane $agent 2>&1)|Out-String).Trim()
          if($LASTEXITCODE -ne 0){RemoveProfile $profilePath; throw "agent rename failed $(Safe $rn)"}
          $gr=((& $herdr --session $named agent get $agent 2>&1)|Out-String).Trim()
          if($LASTEXITCODE -ne 0){RemoveProfile $profilePath; throw 'renamed agent lookup failed'}
          $go=$gr|ConvertFrom-Json
          if([string]$go.result.agent.name -cne $agent -or [string]$go.result.agent.pane_id -cne $pane){RemoveProfile $profilePath; throw 'renamed agent identity mismatch'}
          $native=[string]$go.result.agent.agent_session.value
          if([string]::IsNullOrWhiteSpace($native)){$native='UNREPORTED_NATIVE_SESSION'}

          RemoveProfile $profilePath

          $ref2=Invoke-RestMethod "https://api.github.com/repos/$repo/git/ref/heads/review-base/gbb-gh-01" -Headers $headers -Method Get -TimeoutSec 30
          if([string]$ref2.object.sha -cne $wakeIntegrated){throw 'launcher/default drift before send'}
          $status2=((& git -C $sourceRepo status --porcelain=v1 --untracked-files=all 2>&1)|Out-String)
          $head2=((& git -C $sourceRepo rev-parse HEAD 2>&1)|Out-String).Trim()
          if($head2 -cne $expectedBase -or -not [string]::IsNullOrWhiteSpace($status2)){throw 'source repo changed before send'}
          try{
            $null=Invoke-RestMethod "https://api.github.com/repos/$repo/git/ref/heads/worker/g11-control-continuation-repair-03" -Headers $headers -Method Get -TimeoutSec 30
            throw 'Worker branch appeared before send'
          }catch{
            $code=0
            try{$code=[int]$_.Exception.Response.StatusCode}catch{}
            if($code -ne 404 -and $_.Exception.Message -notmatch '404'){throw}
          }

          @{status='SENDING';wake=$wake;named=$named;workspace=$ws;pane=$pane;agent=$agent;prompt_count=0}|ConvertTo-Json|Set-Content -LiteralPath $state -Encoding utf8
          $prompt="Read GitHub directly. Rehydrate D22977/gpt-browser-bridge Issue #142 card 5576331984, trust-recovery authority 5600723602, source blocker 5600652097, and source_bootstrap_wake $wake. Execute only GBB-G11-CONTROL-CONTINUATION-REPAIR-03-W1 from exact clean base 01849a03227587335d7c503774fe4379bd8ca672. Before creating worker/g11-control-continuation-repair-03 or any tracked mutation, publish and read back GBB_CONTROL_CONTINUATION_REPAIR_CONSUMED_STARTED_V1 with source_bootstrap_wake: $wake and exact fresh identity/cwd/base/branch. Then implement only the three allowed paths and T01-T09 in card 5576331984, run required verification, push exact branch, and publish/read back GBB_CONTROL_CONTINUATION_REPAIR_RESULT_V1. Never retry any historical wake. Stop at that terminal."
          $raw=((& $herdr --session $named agent prompt $agent $prompt 2>&1)|Out-String).Trim()
          $pe=$LASTEXITCODE
          @{status='SENT';wake=$wake;named=$named;workspace=$ws;pane=$pane;agent=$agent;prompt_count=1;prompt_exit=$pe}|ConvertTo-Json|Set-Content -LiteralPath $state -Encoding utf8

          $delivery=@(
            'CONTINUATION_REPAIR03_TRUST_RECOVERY_DELIVERY_V1',
            'state: PROMPT_SUBMITTED_WAIT_WORKER',
            "source_bootstrap_wake: $wake",
            "trust_recovery_authority: $authority",
            "source_blocker: $sourceBlocker",
            "worker_base_sha: $expectedBase",
            "launcher_integration_head: $wakeIntegrated",
            "runtime_repo: $sourceRepo",
            "codex_version: $(Safe $cv)",
            "ephemeral_profile: $profile",
            'ephemeral_profile_removed_before_prompt: true',
            "named_session: $named",
            "fresh_workspace: $ws",
            "fresh_pane: $pane",
            "fresh_agent: $agent",
            "fresh_agent_session: $native",
            'physical_prompt_count: 1',
            "prompt_exit: $pe",
            'owner_enter_count: 0',
            'manual_enter_used: false',
            'send_keys_used: false',
            'orca_used: false',
            "workflow_run_id: $env:GITHUB_RUN_ID",
            'user_task_result_relay_count: 0',
            'readback_verified: true',
            "idempotency_key: $idem"
          ) -join "`n"
          [void](Publish $delivery)
          if($pe -ne 0){throw "Herdr prompt exit $pe"}

          $consumed=$null
          $terminal=$null
          for($i=0;$i-lt 1200;$i++){
            if($null -eq $consumed){$consumed=FindReceipt 'GBB_CONTROL_CONTINUATION_REPAIR_CONSUMED_STARTED_V1' $wake $since}
            $terminal=FindReceipt 'GBB_CONTROL_CONTINUATION_REPAIR_RESULT_V1' $wake $since
            if($null -ne $terminal){break}
            $graw=((& $herdr --session $named agent get $agent 2>&1)|Out-String).Trim()
            if($LASTEXITCODE -ne 0){
              $text=@('CONTINUATION_REPAIR03_TRUST_RECOVERY_RESULT_V1','state: CONTROL_REQUIRED_AGENT_LOST_WITHOUT_TERMINAL',"source_bootstrap_wake: $wake","trust_recovery_authority: $authority","consumed_receipt: $(if($consumed){$consumed.id}else{'NONE'})","last_agent_readback: $(Safe $graw)",'physical_prompt_count: 1','user_task_result_relay_count: 0','readback_verified: true',"idempotency_key: $idem") -join "`n"
              [void](Publish $text); exit 0
            }
            $g=$graw|ConvertFrom-Json
            $as=[string]$g.result.agent.agent_status
            if($as -eq 'blocked'){
              $rr=((& $herdr --session $named agent read $agent --source recent-unwrapped --lines 120 2>&1)|Out-String).Trim()
              $text=@('CONTINUATION_REPAIR03_TRUST_RECOVERY_RESULT_V1','state: CONTROL_REQUIRED_TOOL_APPROVAL_OR_INPUT_BLOCK',"source_bootstrap_wake: $wake","trust_recovery_authority: $authority","consumed_receipt: $(if($consumed){$consumed.id}else{'NONE'})","agent_status: $as","agent_readback: $(Safe $rr)",'physical_prompt_count: 1','owner_enter_count: 0','send_keys_used: false','orca_used: false','user_task_result_relay_count: 0','readback_verified: true',"idempotency_key: $idem") -join "`n"
              [void](Publish $text); exit 0
            }
            Start-Sleep -Seconds 5
          }

          if($null -eq $terminal){
            $rr=((& $herdr --session $named agent read $agent --source recent-unwrapped --lines 120 2>&1)|Out-String).Trim()
            $text=@('CONTINUATION_REPAIR03_TRUST_RECOVERY_RESULT_V1','state: CONTROL_REQUIRED_GUARD_TIMEOUT',"source_bootstrap_wake: $wake","trust_recovery_authority: $authority","consumed_receipt: $(if($consumed){$consumed.id}else{'NONE'})","agent_readback: $(Safe $rr)",'physical_prompt_count: 1','user_task_result_relay_count: 0','readback_verified: true',"idempotency_key: $idem") -join "`n"
            [void](Publish $text); exit 0
          }

          $tb=[string]$terminal.body
          $decision='UNPARSED'
          $dm=[regex]::Match($tb,'(?m)^(?:state|decision):\s*([A-Z0-9_]+)\s*$')
          if($dm.Success){$decision=$dm.Groups[1].Value}
          $result=@(
            'CONTINUATION_REPAIR03_TRUST_RECOVERY_RESULT_V1',
            "state: WORKER_TERMINAL_OBSERVED_$decision",
            "source_bootstrap_wake: $wake",
            "trust_recovery_authority: $authority",
            "worker_terminal_receipt: $($terminal.id)",
            "consumed_receipt: $(if($consumed){$consumed.id}else{'NONE'})",
            "named_session: $named",
            "fresh_workspace: $ws",
            "fresh_pane: $pane",
            "fresh_agent: $agent",
            "fresh_agent_session: $native",
            'physical_prompt_count: 1',
            'worker_left_parked: true',
            'ephemeral_profile_removed: true',
            'user_task_result_relay_count: 0',
            'readback_verified: true',
            "idempotency_key: $idem"
          ) -join "`n"
          [void](Publish $result)
