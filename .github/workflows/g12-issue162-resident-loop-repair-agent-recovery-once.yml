name: G12 Issue162 Existing Workspace Agent Recovery Once

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: g12-issue162-existing-workspace-agent-recovery-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  recover:
    if: >-
      github.event.issue.number == 162 &&
      github.event.comment.user.login == 'D22977' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, 'ISSUE162_EXISTING_WORKSPACE_AGENT_START_RECOVERY_WAKE_V1')
    runs-on: [self-hosted, Windows, GBB-REVIEWER]
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh -NoProfile -File {0}
    steps:
      - name: Start exact named Worker on existing workspace and prompt once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $repo='D22977/gpt-browser-bridge'
          $issue=162
          $authority='5645435324'
          $controlAdoption='5645738398'
          $repairCard='5645354508'
          $probeResult='5645421800'
          $workspaceId='w4'
          $agentName='g12-i162-resident-repair-02'
          $worktree='D:\AIWORK_WT\GPT_BROWSER_BRIDGE\g12-i162-resident-repair-02'
          $workerBranch='worker/g12-issue162-resident-consumer-herdr-loop-repair-02'
          $workerBase='20c540da6036926dbb1be687868e0a55e03bfcde'
          $h='C:\Users\Lupun\AppData\Local\Programs\Herdr\bin\herdr.exe'
          $headers=@{Authorization="Bearer $env:GH_TOKEN";'User-Agent'='g12-issue162-existing-workspace-agent-recovery';Accept='application/vnd.github+json'}
          $phase='PREFLIGHT'
          $pane=''
          $session=''
          $promptCount=0
          $startCount=0
          $consumedReceipt=''
          $observeSince=[Uri]::EscapeDataString((Get-Date).ToUniversalTime().AddMinutes(-1).ToString('o'))

          function Safe([string]$s,[int]$max=1200){
            if($null -eq $s){return ''}
            $v=(($s -replace '[\r\n]+',' | ') -replace '[\x00-\x1F]',' ').Trim()
            if($v.Length -gt $max){return $v.Substring(0,$max)}
            return $v
          }
          function Publish([string]$body){
            $payload=@{body=$body}|ConvertTo-Json -Compress
            $p=Invoke-RestMethod "https://api.github.com/repos/$repo/issues/$issue/comments" -Headers $headers -Method Post -Body $payload -ContentType 'application/json' -TimeoutSec 30
            $rb=Invoke-RestMethod "https://api.github.com/repos/$repo/issues/comments/$($p.id)" -Headers $headers -Method Get -TimeoutSec 30
            if([string]$rb.body -cne $body){throw 'RESULT_READBACK_MISMATCH'}
            return [string]$p.id
          }
          function Need([string]$body,[string]$pattern,[string]$name){
            $m=[regex]::Match($body,$pattern)
            if(-not $m.Success){throw "MALFORMED_WAKE_$name"}
            return $m.Groups[1].Value
          }
          function PublishResult([string]$state,[string]$classification,[string]$detail){
            $event=Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw|ConvertFrom-Json
            $result=@(
              'GBB_ISSUE162_EXISTING_WORKSPACE_AGENT_START_RECOVERY_RESULT_V1'
              "state: $state"
              "classification: $classification"
              "source_authority: $authority"
              "source_control_adoption: $controlAdoption"
              "source_repair_card: $repairCard"
              "source_probe_result: $probeResult"
              "source_recovery_wake: $([string]$event.comment.id)"
              "launcher_head_sha: $env:GITHUB_SHA"
              "phase: $phase"
              "workspace_id: $workspaceId"
              "worktree: $worktree"
              "worker_base_sha: $workerBase"
              "required_worker_branch: $workerBranch"
              "herdr_agent_name: $agentName"
              "herdr_pane_id: $pane"
              "herdr_agent_session: $session"
              "herdr_agent_start_count: $startCount"
              "physical_prompt_count: $promptCount"
              "worker_consumed_started_receipt: $consumedReceipt"
              "detail: $(Safe $detail 1800)"
              'normal_loop_uses_actions: false'
              'old_wake_retry: false'
              'second_start_authorized: false'
              'second_prompt_authorized: false'
              'scheduled_task_mutation_count: 0'
              'product_mep_mutation_count: 0'
              'user_relay_count: 0'
              "workflow_run_id: $env:GITHUB_RUN_ID"
              'readback_verified: true'
            ) -join "`n"
            return Publish $result
          }

          try {
            $ev=Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw|ConvertFrom-Json
            $wake=[string]$ev.comment.id
            $wakeBody=[string]$ev.comment.body
            $a=Need $wakeBody '(?m)^source_authority:\s*(\d+)\s*$' 'AUTHORITY'
            $c=Need $wakeBody '(?m)^source_control_adoption:\s*(\d+)\s*$' 'CONTROL_ADOPTION'
            $p=Need $wakeBody '(?m)^source_probe_result:\s*(\d+)\s*$' 'PROBE_RESULT'
            $launcher=Need $wakeBody '(?m)^launcher_head_sha:\s*([0-9a-f]{40})\s*$' 'LAUNCHER_HEAD'
            if($a -cne $authority -or $c -cne $controlAdoption -or $p -cne $probeResult){throw 'WAKE_AUTHORITY_MISMATCH'}
            if($launcher -cne $env:GITHUB_SHA){throw 'LAUNCHER_HEAD_MISMATCH'}

            $auth=Invoke-RestMethod "https://api.github.com/repos/$repo/issues/comments/$authority" -Headers $headers -Method Get -TimeoutSec 30
            if(-not ([string]$auth.body).StartsWith('CONTROL_G12_ISSUE162_EXISTING_WORKSPACE_AGENT_START_RECOVERY_V1')){throw 'WRONG_AUTHORITY_PROTOCOL'}
            $adoption=Invoke-RestMethod "https://api.github.com/repos/$repo/issues/comments/$controlAdoption" -Headers $headers -Method Get -TimeoutSec 30
            if(-not ([string]$adoption.body).StartsWith('CONTROL_G13_ISSUE162_PARSER_REPAIR_AUTHORITY_ADOPTION_V1')){throw 'WRONG_CONTROL_ADOPTION_PROTOCOL'}
            $probe=Invoke-RestMethod "https://api.github.com/repos/$repo/issues/comments/$probeResult" -Headers $headers -Method Get -TimeoutSec 30
            $probeBody=[string]$probe.body
            if($probeBody -notmatch '(?m)^classification:\s*NO_NAMED_AGENT_EXACT_WORKSPACE_PRESENT\s*$'){throw 'PROBE_CLASSIFICATION_CHANGED'}
            if($probeBody -notmatch '(?m)^worktree_head:\s*20c540da6036926dbb1be687868e0a55e03bfcde\s*$'){throw 'PROBE_BASE_MISMATCH'}
            if($probeBody -notmatch '(?m)^worktree_branch:\s*worker/g12-issue162-resident-consumer-herdr-loop-repair-02\s*$'){throw 'PROBE_BRANCH_MISMATCH'}

            $switch=Invoke-RestMethod "https://api.github.com/repos/$repo/issues/comments/5645732538" -Headers $headers -Method Get -TimeoutSec 30
            $sw=[string]$switch.body
            if($sw -notmatch '(?m)^state:\s*SWITCH_COMMITTED\s*$' -or $sw -notmatch '(?m)^new_generation:\s*013\s*$' -or $sw -notmatch '(?m)^new_status:\s*ACTIVE\s*$'){throw 'CONTROL013_NOT_ACTIVE'}
            $since=[Uri]::EscapeDataString([string]$switch.created_at)
            $switchRows=@(Invoke-RestMethod "https://api.github.com/repos/$repo/issues/88/comments?since=$since&per_page=100" -Headers $headers -Method Get -TimeoutSec 30)
            $newer=@($switchRows|Where-Object{[int64]$_.id -gt 5645732538 -and [string]$_.body -match '(?m)^CONTROL_GENERATION_SWITCH_V1\s*$' -and [string]$_.body -match '(?m)^state:\s*SWITCH_COMMITTED\s*$'})
            if($newer.Count -gt 0){throw 'NEWER_CONTROL_SWITCH_EXISTS'}

            $phase='LOCAL_STATE_REVALIDATE'
            if(-not(Test-Path -LiteralPath $worktree -PathType Container)){throw 'WORKTREE_MISSING'}
            $head=((& git -C $worktree rev-parse HEAD 2>&1)|Out-String).Trim()
            $branch=((& git -C $worktree symbolic-ref -q --short HEAD 2>&1)|Out-String).Trim()
            $dirty=((& git -C $worktree status --porcelain=v1 --untracked-files=all 2>&1)|Out-String).Trim()
            if($head -cne $workerBase){throw "WORKTREE_HEAD_DRIFT_$head"}
            if($branch -cne $workerBranch){throw "WORKTREE_BRANCH_DRIFT_$branch"}
            if(-not [string]::IsNullOrWhiteSpace($dirty)){throw "WORKTREE_NOT_CLEAN_$(Safe $dirty 500)"}

            if(-not(Test-Path -LiteralPath $h -PathType Leaf)){throw 'HERDR_EXE_MISSING'}
            $version=((& $h --version 2>&1)|Out-String).Trim()
            if($version -notmatch '0\.8\.2'){throw "HERDR_VERSION_UNEXPECTED_$version"}
            $server=((& $h status server 2>&1)|Out-String).Trim()
            if($LASTEXITCODE -ne 0 -or $server -notmatch '(?m)^status:\s*running\s*$'){throw "HERDR_SERVER_NOT_RUNNING_$(Safe $server 500)"}

            $phase='EXISTING_WORKSPACE_PANE_RESOLVE'
            $wsRaw=((& $h workspace list 2>&1)|Out-String).Trim()
            if($LASTEXITCODE -ne 0){throw 'HERDR_WORKSPACE_LIST_FAILED'}
            $workspaces=@(($wsRaw|ConvertFrom-Json).result.workspaces)
            $ws=@($workspaces|Where-Object{[string]$_.workspace_id -ceq $workspaceId -and [string]$_.label -ceq $agentName})
            if($ws.Count -ne 1){throw "EXACT_WORKSPACE_COUNT_$($ws.Count)"}
            if([int]$ws[0].pane_count -ne 1){throw "EXACT_WORKSPACE_PANE_COUNT_$($ws[0].pane_count)"}

            $paneRaw=((& $h pane list --workspace $workspaceId 2>&1)|Out-String).Trim()
            if($LASTEXITCODE -ne 0){throw "HERDR_PANE_LIST_FAILED_$(Safe $paneRaw 500)"}
            $panes=@(($paneRaw|ConvertFrom-Json).result.panes)
            if($panes.Count -ne 1){throw "EXACT_PANE_COUNT_$($panes.Count)"}
            $pane=[string]$panes[0].pane_id
            if([string]::IsNullOrWhiteSpace($pane)){throw 'EXACT_PANE_ID_MISSING'}
            $paneCwd=[string]$panes[0].cwd
            $paneForegroundCwd=[string]$panes[0].foreground_cwd
            if($paneCwd -cne $worktree -and $paneForegroundCwd -cne $worktree){throw "PANE_CWD_MISMATCH_cwd=$paneCwd;foreground=$paneForegroundCwd"}

            $paneGet=((& $h pane get $pane 2>&1)|Out-String).Trim()
            if($LASTEXITCODE -ne 0){throw "HERDR_PANE_GET_FAILED_$(Safe $paneGet 500)"}
            $proc=((& $h pane process-info --pane $pane 2>&1)|Out-String).Trim()
            if($LASTEXITCODE -ne 0){throw "HERDR_PANE_PROCESS_INFO_FAILED_$(Safe $proc 500)"}

            $agentsRaw=((& $h agent list 2>&1)|Out-String).Trim()
            if($LASTEXITCODE -ne 0){throw 'HERDR_AGENT_LIST_FAILED'}
            $agents=@(($agentsRaw|ConvertFrom-Json).result.agents)
            $sameName=@($agents|Where-Object{[string]$_.name -ceq $agentName})
            $samePane=@($agents|Where-Object{[string]$_.pane_id -ceq $pane})
            if($sameName.Count -ne 0){throw 'NAMED_AGENT_ALREADY_EXISTS_FAIL_CLOSED'}
            if($samePane.Count -ne 0){throw 'TARGET_PANE_ALREADY_HOSTS_AGENT_FAIL_CLOSED'}

            $phase='ONE_AGENT_START_90000'
            $startCount=1
            $startRaw=((& $h agent start $agentName --kind codex --pane $pane --timeout 90000 -- --dangerously-bypass-approvals-and-sandbox 2>&1)|Out-String).Trim()
            if($LASTEXITCODE -ne 0){throw "HERDR_AGENT_START_FAILED_$(Safe $startRaw 1000)"}

            $phase='NAMED_AGENT_REVALIDATE'
            $list2=((& $h agent list 2>&1)|Out-String).Trim()
            if($LASTEXITCODE -ne 0){throw 'HERDR_AGENT_LIST_AFTER_START_FAILED'}
            $agents2=@(($list2|ConvertFrom-Json).result.agents)
            $named=@($agents2|Where-Object{[string]$_.name -ceq $agentName -and [string]$_.agent -ceq 'codex'})
            if($named.Count -ne 1){throw "NAMED_AGENT_COUNT_AFTER_START_$($named.Count)"}
            if([string]$named[0].pane_id -cne $pane){throw 'NAMED_AGENT_PANE_MISMATCH'}
            if([string]$named[0].cwd -cne $worktree){throw "NAMED_AGENT_CWD_MISMATCH_$([string]$named[0].cwd)"}
            $session=[string]$named[0].agent_session.value
            if([string]::IsNullOrWhiteSpace($session)){throw 'NAMED_AGENT_SESSION_MISSING'}
            if([string]$named[0].agent_status -notin @('idle','done')){throw "NAMED_AGENT_NOT_READY_$([string]$named[0].agent_status)"}

            $getRaw=((& $h agent get $agentName 2>&1)|Out-String).Trim()
            if($LASTEXITCODE -ne 0){throw 'NAMED_AGENT_GET_FAILED'}
            $getAgent=($getRaw|ConvertFrom-Json).result.agent
            if([string]$getAgent.name -cne $agentName -or [string]$getAgent.pane_id -cne $pane -or [string]$getAgent.agent_session.value -cne $session){throw 'NAMED_AGENT_REVALIDATION_MISMATCH'}

            $phase='ONE_WORKER_PROMPT'
            $prompt="Read GitHub directly. You are the bounded WORKER for D22977/gpt-browser-bridge Issue #162 repair card receipt $repairCard (GBB-G12-ISSUE162-RESIDENT-CONSUMER-HERDR-LOOP-REPAIR-02). Exact base $workerBase; required branch $workerBranch; worktree $worktree. Your exact Herdr identity is name=$agentName pane=$pane session=$session. BEFORE any tracked mutation publish and read back exactly one GBB_ISSUE162_RESIDENT_LOOP_REPAIR_WORKER_CONSUMED_STARTED_V1 with state: CONSUMED_STARTED, source_card_receipt: $repairCard, worker_base_sha: $workerBase, required_worker_branch: $workerBranch, herdr_agent_name: $agentName, herdr_pane_id: $pane, herdr_agent_session: $session, user_relay_count: 0, and a fresh idempotency_key. Then execute only card ${repairCard}: port the minimum #103 herdr_resume seam, restore #62 resident/restart-safe GitHub consumer semantics, use named Herdr target resolution/revalidation at send time, keep Actions out of the normal poller, no semantic Control, no Reviewer substitution, and no permanent Scheduled Task deployment. Run focused and relevant regression tests, push/read-back the exact candidate, publish/read-back GBB_ISSUE162_RESIDENT_LOOP_REPAIR_WORKER_RESULT_V1 as READY_FOR_FRESH_REVIEW, BLOCKED, or CONTROL_REQUIRED, then park. No merge/release/MEP/product mutation."
            $promptCount=1
            $sent=((& $h agent prompt $agentName $prompt 2>&1)|Out-String).Trim()
            if($LASTEXITCODE -ne 0){throw "HERDR_WORKER_PROMPT_FAILED_$(Safe $sent 1000)"}

            $phase='WAIT_WORKER_CONSUMED_STARTED'
            for($i=0;$i-lt 120;$i++){
              Start-Sleep -Seconds 3
              $recent=@(Invoke-RestMethod "https://api.github.com/repos/$repo/issues/$issue/comments?per_page=100&since=$observeSince" -Headers $headers -Method Get -TimeoutSec 30)
              $matches=@($recent|Where-Object{
                [string]$_.body -match '(?m)^GBB_ISSUE162_RESIDENT_LOOP_REPAIR_WORKER_CONSUMED_STARTED_V1\s*$' -and
                [string]$_.body -match "(?m)^state:\s*CONSUMED_STARTED\s*$" -and
                [string]$_.body -match "(?m)^source_card_receipt:\s*$repairCard\s*$" -and
                [string]$_.body -match "(?m)^worker_base_sha:\s*$workerBase\s*$" -and
                [string]$_.body -match "(?m)^required_worker_branch:\s*$([regex]::Escape($workerBranch))\s*$" -and
                [string]$_.body -match "(?m)^herdr_agent_name:\s*$agentName\s*$" -and
                [string]$_.body -match "(?m)^herdr_pane_id:\s*$([regex]::Escape($pane))\s*$" -and
                [string]$_.body -match "(?m)^herdr_agent_session:\s*$([regex]::Escape($session))\s*$"
              })
              if($matches.Count -gt 1){throw 'MULTIPLE_WORKER_CONSUMED_STARTED_RECEIPTS'}
              if($matches.Count -eq 1){$consumedReceipt=[string]$matches[0].id; break}
            }
            if([string]::IsNullOrWhiteSpace($consumedReceipt)){throw 'WORKER_CONSUMPTION_NOT_OBSERVED_UNCERTAIN_SEND_NO_BLIND_RETRY'}

            $phase='TERMINAL'
            [void](PublishResult 'WORKER_CONSUMED_STARTED_OBSERVED' 'PASS_TRANSPORT_TO_WORKER_CONSUMED_STARTED' "Worker-owned consumption receipt=$consumedReceipt")
          } catch {
            $detail=$_.Exception.Message
            $class=if($promptCount -eq 1){'UNCERTAIN_SEND_NO_BLIND_RETRY'}elseif($startCount -eq 1){'AGENT_START_OR_REVALIDATION_FAILED_NO_SECOND_START'}else{'PRE_START_FAIL_CLOSED'}
            try{[void](PublishResult 'BLOCKED' $class $detail)}catch{}
            throw
          }
