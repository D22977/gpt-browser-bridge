name: G10 G11 Unattended Runtime Artifact Coordinator V37

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: gbb-g11-handoff-continuity-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  coordinator:
    if: github.event.issue.number == 124 && startsWith(github.event.comment.body, 'GBB_HANDOFF_CONTINUITY_REPAIR_RESULT_V1')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Bind one child run and publish a typed durable result
        shell: node {0}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import { writeFile } from 'node:fs/promises';
          const repo = 'D22977/gpt-browser-bridge';
          const issue = 124;
          const token = process.env.GH_TOKEN;
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          const event = JSON.parse(await (await import('node:fs/promises')).readFile(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const source = String(event.comment?.body ?? '');
          const sourceReceipt = String(event.comment?.id ?? '');
          const first = body => String(body ?? '').split(/\r?\n/, 1)[0].trim();
          const line = (body, key) => { const m = String(body ?? '').match(new RegExp(`^${key}:\\s*(.*?)\\s*$`, 'm')); return m?.[1] ?? null; };
          const api = async (route, init = {}) => {
            const response = await fetch(`https://api.github.com/repos/${repo}${route}`, { ...init, headers: { authorization: `Bearer ${token}`, accept: 'application/vnd.github+json', 'user-agent': 'gbb-g11-handoff-continuity-coordinator', ...(init.headers ?? {}) } });
            const text = await response.text();
            if (!response.ok) throw new Error(`GitHub ${response.status} ${route}: ${text.slice(0, 500)}`);
            if (!text) return null;
            try { return JSON.parse(text); } catch { return text; }
          };
          const comment = async id => {
            const value = await api(`/issues/comments/${id}`);
            if (!Number.isSafeInteger(Number(value?.id)) || typeof value?.body !== 'string' || !String(value.issue_url ?? '').endsWith(`/issues/${issue}`)) throw new Error(`comment ${id} malformed`);
            return value;
          };
          const comments = async number => {
            const all = [];
            for (let page = 1; page <= 50; page += 1) {
              const batch = await api(`/issues/${number}/comments?per_page=100&page=${page}`);
              if (!Array.isArray(batch)) throw new Error(`Issue #${number} comments not array`);
              all.push(...batch);
              if (batch.length < 100) break;
            }
            return all;
          };
          const publish = async body => {
            const posted = await api(`/issues/${issue}/comments`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ body }) });
            const rb = await comment(posted.id);
            if (rb.body !== body) throw new Error(`DURABLE_READBACK_MISMATCH_${posted.id}`);
            return String(posted.id);
          };
          const persistUnresolved = async evidence => {
            const path = `${process.env.RUNNER_TEMP}/gbb-g11-unresolved-${sourceReceipt}.json`;
            await writeFile(path, JSON.stringify({ protocol: 'GBB_HANDOFF_CONTINUITY_STATE_V1', phase: 'UNRESOLVED_PUBLICATION', PERSISTED_UNRESOLVED: true, ...evidence }, null, 2));
            return path;
          };
          const durable = async (phase, fields) => {
            const body = ['GBB_HANDOFF_CONTINUITY_STATE_V1', `phase: ${phase}`, `source_terminal_receipt: ${sourceReceipt}`, ...Object.entries(fields).map(([key, value]) => `${key}: ${value}`), 'readback_verified: true', 'user_relay_count: 0'].join('\n');
            try { return await publish(body); } catch (error) { await persistUnresolved({ phase, publication_error: String(error.message ?? error), ...fields }); throw error; }
          };
          const terminalResult = (state, fields) => ['GBB_HANDOFF_CONTINUITY_CHILD_RESULT_V1', `state: ${state}`, `source_terminal_receipt: ${sourceReceipt}`, 'card_id: GBB-HANDOFF-CONTINUITY-REPAIR-01-G11', ...Object.entries(fields).map(([key, value]) => `${key}: ${value}`), 'user_relay_count: 0', 'readback_verified: true', 'no_blind_retry: true'].join('\n');
          const publishResult = async (state, fields) => {
            try { return await publish(terminalResult(state, fields)); } catch (error) { await persistUnresolved({ state, publication_error: String(error.message ?? error), ...fields }); throw error; }
          };
          const parseSwitch = body => {
            const generation = line(body, 'new_generation');
            const conversationId = line(body, 'new_conversation_id');
            const conversationUrl = line(body, 'new_conversation_url');
            const status = line(body, 'new_status') ?? line(body, 'new_generation_status');
            if (!/^\d{3}$/.test(String(generation)) || !/^[0-9a-f-]+$/.test(String(conversationId)) || !/^https:\/\/chatgpt\.com\/(?:g\/[A-Za-z0-9._-]+\/)?c\/[0-9a-f-]+$/.test(String(conversationUrl)) || status !== 'ACTIVE') throw new Error('ACTIVE_CONTROL_SWITCH_MALFORMED');
            return { generation, conversationId, conversationUrl };
          };
          const currentSwitch = async () => {
            const active = (await comments(88)).filter(value => first(value.body) === 'CONTROL_GENERATION_SWITCH_V1' && line(value.body, 'state') === 'SWITCH_COMMITTED' && (line(value.body, 'new_status') ?? line(value.body, 'new_generation_status')) === 'ACTIVE').sort((a, b) => BigInt(a.id) < BigInt(b.id) ? -1 : 1);
            if (!active.length) throw new Error('NO_ACTIVE_CONTROL_SWITCH');
            return { receipt: String(active.at(-1).id), ...parseSwitch(active.at(-1).body) };
          };

          if (first(source) !== 'GBB_HANDOFF_CONTINUITY_REPAIR_RESULT_V1') throw new Error('wrong terminal marker');
          const cardId = line(source, 'card_id');
          const state = line(source, 'state');
          const candidateHead = line(source, 'candidate_head');
          const workerBranch = line(source, 'worker_branch');
          const idempotencyKey = line(source, 'idempotency_key');
          const liveCanaryAuthority = line(source, 'live_canary_authority') ?? 'NONE';
          if (cardId !== 'GBB-HANDOFF-CONTINUITY-REPAIR-01-G11' || state !== 'READY_FOR_FRESH_REVIEW' || !/^[0-9a-f]{40}$/.test(String(candidateHead)) || workerBranch !== 'worker/gbb-handoff-continuity-repair-01-g11' || line(source, 'readback_verified') !== 'true' || line(source, 'physical_live_canary_send_count') !== '0' || line(source, 'user_relay_count') !== '0' || /generation012/i.test(source)) throw new Error('worker terminal binding invalid');
          const existing = (await comments(issue)).filter(value => first(value.body) === 'GBB_HANDOFF_CONTINUITY_CHILD_RESULT_V1' && line(value.body, 'idempotency_key') === idempotencyKey);
          if (existing.length) { await comment(existing[0].id); console.log(`NO_OP_DUPLICATE existing_child_result=${existing[0].id}`); process.exit(0); }
          const base = await currentSwitch();
          await durable('SEND_NOT_STARTED', { idempotency_key: idempotencyKey, active_control_switch_receipt: base.receipt, control_generation: base.generation, historical_uncertain: '5559355993,5559359770; NO_BLIND_RETRY' });
          if (liveCanaryAuthority !== 'EXPLICIT_LIVE_CANARY_AUTHORITY') {
            const id = await publishResult('CONTROL_REQUIRED', { idempotency_key: idempotencyKey, phase: 'SEND_NOT_STARTED', child_workflow_run_id: 'NONE', child_job_id: 'NONE', child_conclusion: 'NOT_DISPATCHED', child_error: 'EXPLICIT_LIVE_CANARY_AUTHORITY_MISSING', physical_live_canary_send_count: '0', active_control_switch_receipt: base.receipt });
            console.log(`CONTROL_REQUIRED receipt=${id}`); process.exit(0);
          }

          const dispatchStartedAt = new Date().toISOString();
          await durable('CHILD_RUNNING', { idempotency_key: idempotencyKey, active_control_switch_receipt: base.receipt, dispatch_started_at: dispatchStartedAt, child_workflow: 'g10-g11-ready-return-control-doorbell-v2.yml' });
          await api('/actions/workflows/g10-g11-ready-return-control-doorbell-v2.yml/dispatches', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ ref: workerBranch, inputs: { source_issue: String(issue), source_terminal_receipt: sourceReceipt, source_card_id: cardId, candidate_head: candidateHead, idempotency_key: idempotencyKey, live_canary_authority: liveCanaryAuthority } }) });
          let run = null;
          for (let attempt = 0; attempt < 12 && !run; attempt += 1) {
            const runs = await api(`/actions/workflows/g10-g11-ready-return-control-doorbell-v2.yml/runs?event=workflow_dispatch&branch=${encodeURIComponent(workerBranch)}&per_page=20`);
            run = (runs.workflow_runs ?? []).filter(value => String(value.created_at) >= dispatchStartedAt).sort((a, b) => BigInt(a.id) < BigInt(b.id) ? 1 : -1)[0] ?? null;
            if (!run) await sleep(5000);
          }
          if (!run) {
            const id = await publishResult('CONTROL_REQUIRED', { idempotency_key: idempotencyKey, phase: 'CHILD_NO_JOB', child_workflow_run_id: 'NONE', child_job_id: 'NONE', child_conclusion: 'NO_RUN', child_error: 'CHILD_NO_JOB_WITHIN_BOUNDED_INTERVAL', physical_live_canary_send_count: '0', active_control_switch_receipt: base.receipt });
            console.log(`CHILD_NO_JOB receipt=${id}`); process.exit(0);
          }
          let jobs = [];
          let status = String(run.status ?? '');
          let conclusion = run.conclusion ?? 'NONE';
          for (let attempt = 0; attempt < 12 && status !== 'completed'; attempt += 1) {
            const snapshot = await api(`/actions/runs/${run.id}`); status = String(snapshot.status ?? status); conclusion = snapshot.conclusion ?? conclusion;
            const jobPayload = await api(`/actions/runs/${run.id}/jobs?per_page=100`); jobs = Array.isArray(jobPayload.jobs) ? jobPayload.jobs : [];
            if (status !== 'completed') await sleep(5000);
          }
          const job = jobs.at(0) ?? null;
          const jobId = job ? String(job.id) : 'NONE';
          const finalState = status !== 'completed' ? 'CONTROL_REQUIRED' : conclusion === 'success' ? 'CHILD_SUCCEEDED' : 'CONTROL_REQUIRED';
          const phase = status !== 'completed' ? 'CHILD_RUNNING' : !job ? 'CHILD_NO_JOB' : conclusion === 'cancelled' ? 'CHILD_CANCELLED' : conclusion === 'skipped' ? 'CHILD_SKIPPED' : conclusion === 'success' ? 'CHILD_SUCCEEDED' : 'CHILD_FAILED';
          const error = status !== 'completed' ? 'CHILD_RUNNING_AFTER_BOUNDED_INTERVAL' : !job ? 'CHILD_NO_JOB' : conclusion === 'success' ? 'NONE' : `CHILD_${String(conclusion).toUpperCase()}`;
          const id = await publishResult(finalState, { idempotency_key: idempotencyKey, phase, child_workflow_run_id: String(run.id), child_job_id: jobId, child_conclusion: String(conclusion), child_status: status, child_error: error, child_head_sha: String(run.head_sha ?? 'NONE'), physical_live_canary_send_count: '0', active_control_switch_receipt: base.receipt });
          console.log(`${finalState} receipt=${id} run_id=${run.id} job_id=${jobId}`);
