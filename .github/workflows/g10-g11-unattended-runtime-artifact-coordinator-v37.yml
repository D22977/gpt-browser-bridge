name: G10 G11 Unattended Runtime Artifact Coordinator V37

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  coordinator:
    if: github.event.issue.number == 88 && github.event.comment.user.login == 'D22977' && startsWith(github.event.comment.body, 'GBB_UNATTENDED_RUNTIME_ARTIFACT_REPAIR06_READY_V1')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Validate Repair06, dispatch candidate once, guard exact 010 canary
        shell: node {0}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          const repo='D22977/gpt-browser-bridge',issue=88;
          const currentSwitch='5555495204',generation='010',conversation='6a9c2234-f4b4-83ee-ba4b-82c3ee3a2562';
          const adjudication='5558852537',cardReceipt='5558856316',authority='5558864124';
          const cardId='GBB-UNATTENDED-RUNTIME-ARTIFACT-MATERIALIZATION-REPAIR-06',terminalMarker='GBB_UNATTENDED_RUNTIME_ARTIFACT_REPAIR06_READY_V1';
          const base='fa1b0fa7c8ab8add8e1f24eed7e4ab76637b6b99',branch='worker/g10-g11-unattended-runtime-artifact-repair-06';
          const expectedBlobs=['42e55aa194fee1243f8cf32e3c1a63e7ad86f78a','9b0822388d7bd3ecc0c51e98836846ae9b192ce3','ec3a14825ed13681e4a3d0d29ec2612ba3eb2fbf'];
          const allowed=new Set(['.github/workflows/g10-g11-ready-return-control-doorbell-v2.yml','tests/baseline.test.mjs']);
          const token=process.env.GH_TOKEN,sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function api(route,init={}){const r=await fetch(`https://api.github.com/repos/${repo}${route}`,{...init,headers:{Authorization:`Bearer ${token}`,Accept:'application/vnd.github+json','User-Agent':'g10-g11-v37-coordinator',...(init.headers||{})}});const t=await r.text();if(!r.ok)throw new Error(`GitHub ${r.status} ${route}: ${t}`);if(!t)return null;try{return JSON.parse(t)}catch{return t}}
          const first=b=>String(b||'').split(/\r?\n/,1)[0].trim();const line=(b,k)=>{const m=String(b||'').match(new RegExp(`^${k}:\\s*(.*?)\\s*$`,'m'));return m?m[1]:null};
          async function comment(id){const c=await api(`/issues/comments/${id}`);if(!Number.isSafeInteger(c?.id)||!String(c.issue_url||'').endsWith('/issues/88')||typeof c.body!=='string')throw new Error(`comment ${id} malformed`);return c}
          async function recent(since){const out=[];for(let p=1;p<=50;p++){const xs=await api(`/issues/88/comments?since=${encodeURIComponent(since)}&per_page=100&page=${p}`);if(!Array.isArray(xs))throw new Error('comments not array');for(const c of xs){if(!Number.isSafeInteger(c?.id)||typeof c.body!=='string')throw new Error('comment shape malformed');out.push(c)}if(xs.length<100)break}return out}
          async function publish(body){const x=await api(`/issues/${issue}/comments`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({body})});const rb=await comment(String(x.id));if(rb.body!==body)throw new Error('receipt readback mismatch');return String(x.id)}
          async function verifyAuthority(){const [sw,card,adj,auth]=await Promise.all([comment(currentSwitch),comment(cardReceipt),comment(adjudication),comment(authority)]);if(first(sw.body)!=='CONTROL_GENERATION_SWITCH_V1'||line(sw.body,'state')!=='SWITCH_COMMITTED'||line(sw.body,'new_generation')!==generation||line(sw.body,'new_conversation_id')!==conversation||line(sw.body,'new_status')!=='ACTIVE')throw new Error('current switch mismatch');if(first(card.body)!=='DISPATCH_CARD_V1'||line(card.body,'card_id')!==cardId)throw new Error('card mismatch');if(first(adj.body)!=='CONTROL_G10_G11_UNATTENDED_E2E_V36_RUNTIME_ARTIFACT_ADJUDICATION_V1')throw new Error('adjudication mismatch');if(first(auth.body)!=='CONTROL_G10_G11_UNATTENDED_RUNTIME_ARTIFACT_SPLIT_TRANSPORT_AUTHORITY_V37'||line(auth.body,'state')!=='AUTHORIZED')throw new Error('transport authority mismatch');for(const c of await recent(sw.created_at)){if(String(c.id)===currentSwitch||first(c.body)!=='CONTROL_GENERATION_SWITCH_V1')continue;if(BigInt(c.id)>BigInt(currentSwitch))throw new Error(`newer switch evidence ${c.id}`)}return sw}
          async function finalResult(state,terminalId,head,canary='NONE',detail=''){const existing=(await recent(new Date(Date.now()-7200000).toISOString())).filter(c=>first(c.body)==='CONTROL_G10_G11_UNATTENDED_E2E_RESULT_V1'&&line(c.body,'source_worker_terminal_receipt')===terminalId&&line(c.body,'source_card_id')===cardId&&line(c.body,'candidate_head')===head);if(existing.length)return String(existing[0].id);return publish(['CONTROL_G10_G11_UNATTENDED_E2E_RESULT_V1',`state: ${state}`,`source_adjudication: ${adjudication}`,`source_worker_terminal_receipt: ${terminalId}`,`source_card_id: ${cardId}`,`candidate_head: ${head||'NONE'}`,`downstream_canary_receipt: ${canary}`,`active_switch_receipt: ${currentSwitch}`,`target_control_generation: ${generation}`,`target_control_conversation_id: ${conversation}`,`physical_control_send_count: ${state==='PASS'?'1':'NOT_PASS'}`,'second_physical_control_send: false','user_relay_count: 0',`exact_control_wake: ${state==='PASS'?'PASS':'NOT_PASS'}`,`unattended_e2e: ${state==='PASS'?'PASS':'NOT_PASS'}`,detail?`detail: ${detail.replace(/[\r\n]+/g,' ').slice(0,500)}`:'',`workflow_run_id: ${process.env.GITHUB_RUN_ID}`,'readback_required: true'].filter(Boolean).join('\n'))}
          const event=JSON.parse(await (await import('node:fs/promises')).readFile(process.env.GITHUB_EVENT_PATH,'utf8'));const terminalId=String(event?.comment?.id||''),body=String(event?.comment?.body||''),head=line(body,'candidate_head')||'NONE';
          try{
            await verifyAuthority();if(first(body)!==terminalMarker||line(body,'state')!=='READY_FOR_CONTROL_CANARY'||line(body,'card_id')!==cardId||line(body,'candidate_parent')!==base||line(body,'worker_branch')!==branch||line(body,'selected_return_mechanism')!=='WORKFLOW_DISPATCH'||!/^[0-9a-f]{40}$/.test(head))throw new Error('Repair06 terminal binding invalid');
            const terminal=await comment(terminalId);if(terminal.body!==body)throw new Error('terminal readback mismatch');
            let stage=null;for(let n=0;n<40;n++){await verifyAuthority();const ms=(await recent(terminal.created_at)).filter(c=>first(c.body)==='CONTROL_G10_G11_UNATTENDED_RUNTIME_ARTIFACT_REPAIR06_V37_WORKER_STAGE_V1'&&line(c.body,'source_terminal_receipt')===terminalId&&line(c.body,'candidate_head')===head);if(ms.length>1)throw new Error('multiple Worker-stage receipts');if(ms.length===1){stage=ms[0];break}await sleep(3000)}if(!stage)throw new Error('Worker-stage receipt timeout');
            const ref=await api(`/git/ref/heads/${branch}`);if(String(ref?.object?.sha)!==head)throw new Error('remote branch/head mismatch');const commit=await api(`/commits/${head}`);if(String(commit?.parents?.[0]?.sha)!==base)throw new Error('remote parent mismatch');const cmp=await api(`/compare/${base}...${head}`);const files=Array.isArray(cmp?.files)?cmp.files.map(f=>String(f.filename)):[];if(!files.length||files.some(f=>!allowed.has(f))||!files.includes('.github/workflows/g10-g11-ready-return-control-doorbell-v2.yml'))throw new Error(`scope invalid ${files.join(',')}`);
            const wf=await api(`/contents/.github/workflows/g10-g11-ready-return-control-doorbell-v2.yml?ref=${head}`);if(!wf?.content)throw new Error('workflow content missing');const txt=Buffer.from(String(wf.content).replace(/\n/g,''),'base64').toString('utf8');for(const marker of [...expectedBlobs,cardId,terminalMarker,'GBB-UNATTENDED-DOORBELL-BINDING-REPAIR-05','GBB_UNATTENDED_DOORBELL_BINDING_REPAIR05_READY_V1'])if(!txt.includes(marker))throw new Error(`workflow binding missing ${marker}`);
            await verifyAuthority();const logical=`${cardId}:${terminalId}:${head}`;const searchSince=terminal.created_at;let comments=await recent(searchSince);const priorDispatch=comments.filter(c=>first(c.body)==='CONTROL_G10_G11_UNATTENDED_RUNTIME_ARTIFACT_V37_CANARY_DISPATCH_V1'&&line(c.body,'source_worker_terminal_receipt')===terminalId&&line(c.body,'candidate_head')===head);if(priorDispatch.length>1)throw new Error('multiple durable dispatch receipts');
            if(priorDispatch.length===0){await api('/actions/workflows/g10-g11-ready-return-control-doorbell-v2.yml/dispatches',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ref:branch,inputs:{source_terminal_receipt:terminalId,source_card_id:cardId,candidate_head:head,idempotency_key:logical}})});await publish(['CONTROL_G10_G11_UNATTENDED_RUNTIME_ARTIFACT_V37_CANARY_DISPATCH_V1','state: DISPATCHED',`source_worker_terminal_receipt: ${terminalId}`,`source_card_id: ${cardId}`,`candidate_head: ${head}`,`candidate_branch: ${branch}`,'post_dispatch_terminal_guard: ACTIVE','physical_control_send_before_candidate: 0','user_relay_count: 0',`workflow_run_id: ${process.env.GITHUB_RUN_ID}`,'readback_required: true'].join('\n'))}
            let canary=null;for(let n=0;n<120;n++){await verifyAuthority();const ms=(await recent(searchSince)).filter(c=>first(c.body)==='CONTROL_UNATTENDED_RETURN_DOORBELL_CANARY_V1'&&line(c.body,'source_terminal_receipt')===terminalId&&line(c.body,'source_card_id')===cardId&&line(c.body,'candidate_head')===head);if(ms.length>1)throw new Error('multiple downstream canaries');if(ms.length===1){canary=ms[0];break}await sleep(15000)}if(!canary)throw new Error('downstream canary timeout');
            const ok=line(canary.body,'state')==='DELIVERED'&&line(canary.body,'active_switch_receipt')===currentSwitch&&line(canary.body,'target_control_generation')===generation&&line(canary.body,'target_control_conversation_id')===conversation&&line(canary.body,'physical_send_count')==='1'&&line(canary.body,'second_physical_send')==='false'&&line(canary.body,'user_relay_count')==='0';if(!ok){await finalResult('CONTROL_REQUIRED',terminalId,head,String(canary.id),`downstream ${line(canary.body,'state')||'MALFORMED'} did not satisfy PASS boundary`);throw new Error('downstream canary NOT_PASS')}
            await finalResult('PASS',terminalId,head,String(canary.id),'exact Control wake and unattended E2E PASS');
          }catch(e){const reason=String(e?.message||e);try{await finalResult('CONTROL_REQUIRED',terminalId,head,'NONE',reason)}catch{}throw e}
