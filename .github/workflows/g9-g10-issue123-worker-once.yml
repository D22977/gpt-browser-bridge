name: G9 G10 Issue123 Worker Observe V2 Once

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: g9-g10-issue123-observe-v2-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  observe-worker-v2:
    if: >-
      github.event.issue.number == 123 &&
      github.event.comment.user.login == 'D22977' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, 'G9_G10_WORKER_OBSERVE_V2')
    runs-on: [self-hosted, Windows, GBB-REVIEWER]
    timeout-minutes: 5
    defaults:
      run:
        shell: pwsh -NoProfile -File {0}
    steps:
      - name: Observe exact delivered Worker read-only V2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $event=Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw|ConvertFrom-Json
          if($event.repository.full_name -cne 'D22977/gpt-browser-bridge' -or [int]$event.issue.number -ne 123){throw 'Wrong event target'}
          if($event.comment.user.login -cne 'D22977' -or $event.comment.author_association -cne 'OWNER'){throw 'Wrong actor'}
          $body=[string]$event.comment.body
          if($body -notmatch '(?m)^control_generation:\s*009\s*$'){throw 'Wrong generation'}
          if($body -notmatch '(?m)^source_observation_authority:\s*5555284744\s*$'){throw 'Wrong observation authority'}
          if($body -notmatch '(?m)^source_worker_delivery:\s*5555248342\s*$'){throw 'Wrong source delivery'}

          $headers=@{Authorization="Bearer $env:GH_TOKEN";'User-Agent'='g9-g10-issue123-observe-v2';Accept='application/vnd.github+json'}
          $delivery=Invoke-RestMethod -Uri 'https://api.github.com/repos/D22977/gpt-browser-bridge/issues/comments/5555248342' -Headers $headers -Method Get -TimeoutSec 30
          if([string]$delivery.body -notmatch '(?m)^G9_G10_ISSUE123_WORKER_DELIVERY_V1\s*$' -or [string]$delivery.body -notmatch '(?m)^state:\s*CONSUMED_STARTED\s*$'){throw 'Source delivery mismatch'}

          $all=[System.Collections.Generic.List[object]]::new()
          function AddFlat([object]$v){if($null -eq $v){return};if($v -is [System.Array]){foreach($x in $v){AddFlat $x};return};[void]$all.Add($v)}
          for($page=1;$page -le 20;$page++){$before=$all.Count;AddFlat(Invoke-RestMethod -Uri "https://api.github.com/repos/D22977/gpt-browser-bridge/issues/88/comments?per_page=100&page=$page" -Headers $headers -Method Get -TimeoutSec 30);if(($all.Count-$before)-lt 100){break}}
          $switches=@($all|Where-Object{$_.body -match '(?m)^CONTROL_GENERATION_SWITCH_V1\s*$' -and $_.body -match '(?m)^state:\s*SWITCH_COMMITTED\s*$' -and $_.body -match '(?m)^new_generation_status:\s*ACTIVE\s*$'}|Sort-Object{[int64]$_.id})
          if($switches.Count -eq 0){throw 'No ACTIVE switch'}
          $latest=$switches[-1]
          if([string]$latest.body -notmatch '(?m)^new_generation:\s*009\s*$'){throw "G009 no longer ACTIVE latest=$($latest.id)"}

          $herdr='C:\Users\Lupun\AppData\Local\Programs\Herdr\bin\herdr.exe'
          if(-not(Test-Path -LiteralPath $herdr)){throw 'Herdr CLI missing'}
          $raw=& $herdr agent list
          if($LASTEXITCODE -ne 0){throw 'herdr agent list failed'}
          $list=$raw|ConvertFrom-Json
          $matches=@($list.result.agents|Where-Object{[string]$_.pane_id -eq 'w2:p1' -and [string]$_.agent_session.value -eq '01a0513f-4e68-7573-bf38-72e2120ebe1d' -and [string]$_.agent -eq 'codex'})
          $targetPresent=($matches.Count -eq 1)
          $status=if($targetPresent){[string]$matches[0].agent_status}else{'TARGET_MISSING'}
          $readPerformed=$false;$readExit='';$readSha='';$resultMarker=$false;$stateSeen='';$decisionSeen='';$firstMissing='';$firstFailedGate='';$candidateId='';$candidateUrl='';$trackedChangeMarker=$false;$publicationError=$false
          if($targetPresent -and $status -in @('idle','done')){
            $readPerformed=$true
            $recent=(& $herdr agent read 'w2:p1' --source recent-unwrapped --lines 200 2>&1|Out-String)
            $readExit=[string]$LASTEXITCODE
            $bytes=[Text.Encoding]::UTF8.GetBytes($recent)
            $readSha=[Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($bytes)).ToLowerInvariant()
            if($LASTEXITCODE -eq 0){
              $resultMarker=$recent -match '(?i)CONTROL_G9_G10_AUTO_CAPTURE_REBOOT_RESULT_V1|READY_FOR_FRESH_REVIEW|READY_FOR_REVIEW'
              $m=[regex]::Match($recent,'(?im)^state:\s*([^\r\n]+)');if($m.Success){$stateSeen=$m.Groups[1].Value.Trim()}
              $m=[regex]::Match($recent,'(?im)^decision:\s*([^\r\n]+)');if($m.Success){$decisionSeen=$m.Groups[1].Value.Trim()}
              $m=[regex]::Match($recent,'(?im)^first_missing_capability:\s*([^\r\n]+)');if($m.Success){$firstMissing=$m.Groups[1].Value.Trim()}
              $m=[regex]::Match($recent,'(?im)^first_failed_gate:\s*([^\r\n]+)');if($m.Success){$firstFailedGate=$m.Groups[1].Value.Trim()}
              $m=[regex]::Match($recent,'(?i)\b(6a9c2234-f4b4-83ee-ba4b-82c3ee3a2562)\b');if($m.Success){$candidateId=$m.Groups[1].Value}
              $m=[regex]::Match($recent,'https://chatgpt\.com/(?:g/[A-Za-z0-9._-]+/)?c/6a9c2234-f4b4-83ee-ba4b-82c3ee3a2562');if($m.Success){$candidateUrl=$m.Value}
              $trackedChangeMarker=$recent -match '(?i)(changed_paths|git commit|head_sha|branch:)'
              $publicationError=$recent -match '(?i)(publish|comment).*(fail|error|403|401|denied|forbidden)|(?i)(fail|error).*(publish|comment)'
            }
          }

          $receipt=@(
            'G9_G10_ISSUE123_WORKER_OBSERVATION_V2',
            'state: PASS_READ_ONLY',
            'control_generation: 009',
            'source_observation_authority: 5555284744',
            'source_worker_delivery: 5555248342',
            'target_pane: w2:p1',
            'target_agent_session: 01a0513f-4e68-7573-bf38-72e2120ebe1d',
            "target_present: $($targetPresent.ToString().ToLowerInvariant())",
            "target_status: $status",
            "terminal_read_performed: $($readPerformed.ToString().ToLowerInvariant())",
            "terminal_read_exit: $readExit",
            "terminal_output_sha256: $readSha",
            "terminal_or_result_marker_seen: $($resultMarker.ToString().ToLowerInvariant())",
            "explicit_state_seen: $stateSeen",
            "explicit_decision_seen: $decisionSeen",
            "first_missing_capability_seen: $firstMissing",
            "first_failed_gate_seen: $firstFailedGate",
            "candidate010_id_seen: $candidateId",
            "candidate010_url_seen: $candidateUrl",
            "tracked_change_marker_seen: $($trackedChangeMarker.ToString().ToLowerInvariant())",
            "publication_error_pattern_seen: $($publicationError.ToString().ToLowerInvariant())",
            'raw_terminal_output_published: false',
            'agent_prompt_performed: false',
            'browser_action_performed_by_observer: false',
            "workflow_run_id: $env:GITHUB_RUN_ID",
            'user_relay_count: 0',
            'readback_required: true'
          ) -join "`n"
          $payload=@{body=$receipt}|ConvertTo-Json -Compress
          $posted=Invoke-RestMethod -Uri 'https://api.github.com/repos/D22977/gpt-browser-bridge/issues/123/comments' -Headers $headers -Method Post -Body $payload -ContentType 'application/json' -TimeoutSec 30
          $rb=Invoke-RestMethod -Uri "https://api.github.com/repos/D22977/gpt-browser-bridge/issues/comments/$($posted.id)" -Headers $headers -Method Get -TimeoutSec 30
          if([string]$rb.body -cne $receipt){throw 'Observation read-back mismatch'}
          Write-Output "Observed Issue123 Worker V2 status=$status receipt=$($posted.id)"
