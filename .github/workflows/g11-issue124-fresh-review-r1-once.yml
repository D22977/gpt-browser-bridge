name: G11 Issue124 Fresh Review R1 Once

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: g11-issue124-fresh-review-r1-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  launch-reviewer:
    name: Launch exact fresh WebGPT reviewer
    if: >-
      github.event.issue.number == 124 &&
      github.event.comment.user.login == 'D22977' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, 'HERDR_FRESH_REVIEW_WAKE_V1')
    runs-on: [self-hosted, Windows, GBB-REVIEWER]
    timeout-minutes: 8
    outputs:
      wake_id: ${{ steps.launch.outputs.wake_id }}
      delivery_receipt: ${{ steps.launch.outputs.delivery_receipt }}
    defaults:
      run:
        shell: pwsh -NoProfile -File {0}
    steps:
      - id: launch
        name: Validate, deliver once, publish delivery
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = 'D22977/gpt-browser-bridge'
          $requiredRequest = 'GBB124-G11-R1-38DA7377-20260906'
          $requiredSource = '5560026863'
          $requiredHead = '38da7377f9b9d1610dd44aa869b861bb8500ccc9'
          $requiredIdem = 'HERDR-FRESH-REVIEW-G11-124-R1-38DA7377-V1'
          $herdr = 'C:\Users\Lupun\AppData\Local\Programs\Herdr\bin\herdr.exe'
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; 'User-Agent' = 'g11-issue124-fresh-review-r1'; Accept = 'application/vnd.github+json' }
          function Need([string]$body,[string]$pattern,[string]$name){$m=[regex]::Match($body,$pattern);if(-not $m.Success){throw "Malformed wake field: $name"};$m.Groups[1].Value}
          function GetComments([int]$n){$all=[System.Collections.Generic.List[object]]::new();for($page=1;$page -le 100;$page++){ $xs=@(Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/issues/$n/comments?per_page=100&page=$page" -Headers $headers -Method Get -TimeoutSec 30);foreach($x in $xs){if($null-ne$x){[void]$all.Add($x)}};if($xs.Count-lt100){break}};$all.ToArray()}
          function Publish124([string]$text){$payload=@{body=$text}|ConvertTo-Json -Compress;$p=Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/issues/124/comments" -Headers $headers -Method Post -Body $payload -ContentType 'application/json' -TimeoutSec 30;$rb=Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/issues/comments/$($p.id)" -Headers $headers -Method Get -TimeoutSec 30;if([string]$rb.body-cne$text){throw "readback mismatch receipt=$($p.id)"};[string]$p.id}
          function ResolveSwitch{$sw=@(GetComments 88|Where-Object{[string]$_.body-match'(?m)^CONTROL_GENERATION_SWITCH_V1\s*$'-and[string]$_.body-match'(?m)^state:\s*SWITCH_COMMITTED\s*$'-and[string]$_.body-match'(?m)^new_generation_status:\s*ACTIVE\s*$'}|Sort-Object{[int64]$_.id});if($sw.Count-eq0){throw'No ACTIVE switch'};$latest=$sw[-1];$g=[regex]::Match([string]$latest.body,'(?m)^new_generation:\s*(\d{3})\s*$');if(-not$g.Success){throw'Malformed ACTIVE switch'};[pscustomobject]@{Receipt=[string]$latest.id;Generation=$g.Groups[1].Value}}
          $event=Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw|ConvertFrom-Json
          if($event.repository.full_name-cne$repo-or[int]$event.issue.number-ne124){throw'Wrong event target'}
          if($event.comment.user.login-cne'D22977'-or$event.comment.author_association-cne'OWNER'){throw'Wrong actor'}
          $body=[string]$event.comment.body
          if($body-notmatch'(?m)^HERDR_FRESH_REVIEW_WAKE_V1\s*$'){throw'Missing protocol header'}
          $gen=Need $body '(?m)^control_generation:\s*(\d{3})\s*$' 'control_generation';$source=Need $body '(?m)^source_review_request:\s*(\d+)\s*$' 'source_review_request';$request=Need $body '(?m)^review_request_id:\s*([A-Za-z0-9._:-]+)\s*$' 'review_request_id';$head=Need $body '(?m)^candidate_head:\s*([0-9a-f]{40})\s*$' 'candidate_head';$idem=Need $body '(?m)^idempotency_key:\s*([A-Za-z0-9._:-]+)\s*$' 'idempotency_key'
          if($source-cne$requiredSource-or$request-cne$requiredRequest-or$head-cne$requiredHead-or$idem-cne$requiredIdem){throw'Exact review binding mismatch'}
          $sw=ResolveSwitch;if($gen-cne$sw.Generation-or$sw.Generation-cne'011'){throw"Stale/wrong generation requested=$gen active=$($sw.Generation)"}
          if(-not(Test-Path -LiteralPath $herdr)){throw'Herdr CLI missing'};if($env:RUNNER_NAME-cne'gbb-reviewer-win-01'){throw"Unexpected runner=$env:RUNNER_NAME"};if(-not[Environment]::UserInteractive-or[System.Diagnostics.Process]::GetCurrentProcess().SessionId-eq0){throw'Runner not interactive'}
          $wakeId=[string]$event.comment.id;$stateRoot='D:\AIWORK_RUNTIME\GPT_BROWSER_BRIDGE\fresh-review-r1-once';New-Item -ItemType Directory -Force -Path $stateRoot|Out-Null;$statePath=Join-Path $stateRoot "$wakeId.json"
          if(Test-Path -LiteralPath $statePath){$prior=Get-Content -LiteralPath $statePath -Raw|ConvertFrom-Json;if([string]$prior.status-eq'SENT'){$noop=@('GBB_HANDOFF_CONTINUITY_FRESH_REVIEW_LAUNCH_V1','state: NO_OP_DUPLICATE',"source_wake_comment_id: $wakeId",'second_prompt_sent: false','user_relay_count: 0',"workflow_run_id: $env:GITHUB_RUN_ID",'readback_required: true')-join"`n";[void](Publish124 $noop);exit 0};if([string]$prior.status-eq'SENDING'){$u=@('GBB_HANDOFF_CONTINUITY_FRESH_REVIEW_LAUNCH_V1','state: UNCERTAIN_SEND_NO_BLIND_RETRY',"source_wake_comment_id: $wakeId",'second_prompt_sent: false','user_relay_count: 0',"workflow_run_id: $env:GITHUB_RUN_ID",'readback_required: true')-join"`n";[void](Publish124 $u);throw'Existing SENDING state'};throw"Unknown prior state=$($prior.status)"}
          $listRaw=&$herdr agent list;if($LASTEXITCODE-ne0){throw'herdr agent list failed'};$list=$listRaw|ConvertFrom-Json;$eligible=@($list.result.agents|Where-Object{$_.agent-eq'codex'-and$_.agent_status-in@('idle','done')-and$_.cwd-match'(?i)^C:\\WINDOWS\\system32$'-and([string]::IsNullOrWhiteSpace([string]$_.name)-or$_.name-notmatch'(?i)(review|mep|pr\d+)')-and$_.pane_id-and$_.agent_session.value})
          if($eligible.Count-ne1){$b=@('GBB_HANDOFF_CONTINUITY_FRESH_REVIEW_LAUNCH_V1','state: BLOCKED_PRESEND',"reason: GENERIC_CODEX_COORDINATOR_COUNT_$($eligible.Count)","source_wake_comment_id: $wakeId",'physical_prompt_count: 0','user_relay_count: 0',"workflow_run_id: $env:GITHUB_RUN_ID",'readback_required: true')-join"`n";[void](Publish124 $b);throw"Expected exactly one coordinator count=$($eligible.Count)"}
          $target=$eligible[0];$pane=[string]$target.pane_id;$session=[string]$target.agent_session.value;$sw2=ResolveSwitch;if($sw2.Receipt-cne$sw.Receipt-or$sw2.Generation-cne$sw.Generation){throw'ACTIVE Control changed before prompt boundary'}
          @{status='SENDING';pane_id=$pane;agent_session=$session;workflow_run_id=$env:GITHUB_RUN_ID;observed_at=(Get-Date).ToString('o')}|ConvertTo-Json|Set-Content -LiteralPath $statePath -Encoding utf8
          $prompt="Read GitHub directly. You are transport/coordinator only, not Reviewer. Rehydrate D22977/gpt-browser-bridge Issue #124 review request 5560026863 (GBB124-G11-R1-38DA7377-20260906). Perform ACCESS_CAPABILITY_CHECK_V1 for a currently admitted fresh ChatGPT Web route, create exactly one NEW/fresh independent ChatGPT Web PRIMARY Reviewer, and send only this wake pointer: 'Read GitHub directly. You are the NEW fresh independent WebGPT Reviewer for D22977/gpt-browser-bridge Issue #124 review request 5560026863. Review exact candidate head 38da7377f9b9d1610dd44aa869b861bb8500ccc9 and publish/read back GBB_HANDOFF_CONTINUITY_FRESH_REVIEW_RESULT_V1 exactly as authorized. Do not mutate files, merge, release, run live acceptance, or act as Control.' Publish/read back exactly one GBB_HANDOFF_CONTINUITY_FRESH_REVIEW_LAUNCH_RESULT_V1 on #124 binding source_wake_comment_id $wakeId, review_request_id $requiredRequest, coordinator pane/session, fresh reviewer conversation id/url, selected transport, user_relay_count: 0, and state DELIVERED. If no admitted fresh-WebGPT route is live, publish/read back the same protocol with state BLOCKED and first_missing_capability. Do not repair transport or blind retry. GitHub is authority."
          $promptHash=[Convert]::ToHexString([System.Security.Cryptography.SHA256]::HashData([System.Text.Encoding]::UTF8.GetBytes($prompt))).ToLowerInvariant()
          try{$raw=&$herdr agent prompt $pane $prompt;if($LASTEXITCODE-ne0){throw"herdr prompt exit=$LASTEXITCODE"};$r=$raw|ConvertFrom-Json;if([string]$r.result.type-cne'agent_prompted'){throw'Unexpected prompt result'};if([string]$r.result.agent.pane_id-cne$pane-or[string]$r.result.agent.agent_session.value-cne$session){throw'Prompt identity mismatch'}}catch{$u=@('GBB_HANDOFF_CONTINUITY_FRESH_REVIEW_LAUNCH_V1','state: UNCERTAIN_SEND_NO_BLIND_RETRY',"source_wake_comment_id: $wakeId","target_pane: $pane","target_agent_session: $session","prompt_sha256: $promptHash",'second_prompt_sent: false','user_relay_count: 0',"diagnostic: $($_.Exception.Message-replace'[\r\n]+',' ')","workflow_run_id: $env:GITHUB_RUN_ID",'readback_required: true')-join"`n";[void](Publish124 $u);throw}
          @{status='SENT';pane_id=$pane;agent_session=$session;workflow_run_id=$env:GITHUB_RUN_ID;sent_at=(Get-Date).ToString('o')}|ConvertTo-Json|Set-Content -LiteralPath $statePath -Encoding utf8
          $delivery=@('GBB_HANDOFF_CONTINUITY_FRESH_REVIEW_LAUNCH_V1','state: SENT_WAIT_COORDINATOR_LAUNCH_RESULT',"control_generation: $($sw.Generation)","active_switch_receipt: $($sw.Receipt)","source_wake_comment_id: $wakeId","source_review_request: $requiredSource","review_request_id: $requiredRequest","candidate_head: $requiredHead","target_pane: $pane","target_agent_session: $session","prompt_sha256: $promptHash",'physical_prompt_count: 1','second_prompt_sent: false','user_relay_count: 0',"workflow_run_id: $env:GITHUB_RUN_ID",'readback_required: true')-join"`n";$receipt=Publish124 $delivery;"wake_id=$wakeId"|Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8;"delivery_receipt=$receipt"|Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

  guard-review-result:
    name: Guard exact reviewer launch/result
    needs: launch-reviewer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Observe exact launch/result and publish typed terminal
        env:
          GH_TOKEN: ${{ github.token }}
          WAKE_ID: ${{ needs.launch-reviewer.outputs.wake_id }}
          DELIVERY_RECEIPT: ${{ needs.launch-reviewer.outputs.delivery_receipt }}
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$repo='D22977/gpt-browser-bridge';$headers=@{Authorization="Bearer $env:GH_TOKEN";'User-Agent'='g11-review-guard';Accept='application/vnd.github+json'}
          function GetComments{$all=[System.Collections.Generic.List[object]]::new();for($page=1;$page-le100;$page++){ $xs=@(Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/issues/124/comments?per_page=100&page=$page" -Headers $headers -Method Get -TimeoutSec 30);foreach($x in $xs){if($null-ne$x){[void]$all.Add($x)}};if($xs.Count-lt100){break}};$all.ToArray()}
          function Publish([string]$text){$payload=@{body=$text}|ConvertTo-Json -Compress;$p=Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/issues/124/comments" -Headers $headers -Method Post -Body $payload -ContentType 'application/json' -TimeoutSec 30;$rb=Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/issues/comments/$($p.id)" -Headers $headers -Method Get -TimeoutSec 30;if([string]$rb.body-cne$text){throw'guard readback mismatch'}}
          $launch=$null;$result=$null;for($i=0;$i-lt60;$i++){Start-Sleep -Seconds 15;$comments=@(GetComments);$boundLaunch=@($comments|Where-Object{[string]$_.body-match'(?m)^GBB_HANDOFF_CONTINUITY_FRESH_REVIEW_LAUNCH_RESULT_V1\s*$'-and[string]$_.body-match"(?m)^source_wake_comment_id:\s*$([regex]::Escape($env:WAKE_ID))\s*$"}|Sort-Object{[int64]$_.id});if($boundLaunch.Count-gt1){throw'Multiple launch results for one wake'};if($boundLaunch.Count-eq1){$launch=$boundLaunch[0]};$boundResult=@($comments|Where-Object{[string]$_.body-match'(?m)^GBB_HANDOFF_CONTINUITY_FRESH_REVIEW_RESULT_V1\s*$'-and[string]$_.body-match'(?m)^review_request_id:\s*GBB124-G11-R1-38DA7377-20260906\s*$'-and[string]$_.body-match'(?m)^candidate_head:\s*38da7377f9b9d1610dd44aa869b861bb8500ccc9\s*$'}|Sort-Object{[int64]$_.id});if($boundResult.Count-gt1){throw'Multiple formal review results'};if($boundResult.Count-eq1){$result=$boundResult[0];break};if($null-ne$launch-and[string]$launch.body-match'(?m)^state:\s*BLOCKED\s*$'){break}}
          if($null-ne$result){Publish (@('GBB_HANDOFF_CONTINUITY_FRESH_REVIEW_GUARD_V1','state: PASS_RESULT_OBSERVED',"source_wake_comment_id: $env:WAKE_ID","source_delivery_receipt: $env:DELIVERY_RECEIPT","review_result_receipt: $($result.id)",'user_relay_count: 0',"workflow_run_id: $env:GITHUB_RUN_ID",'readback_required: true')-join"`n");exit 0}
          if($null-ne$launch){$state=[regex]::Match([string]$launch.body,'(?m)^state:\s*([^\r\n]+)').Groups[1].Value.Trim();Publish (@('GBB_HANDOFF_CONTINUITY_FRESH_REVIEW_GUARD_V1',"state: COORDINATOR_LAUNCH_$state","source_wake_comment_id: $env:WAKE_ID","source_delivery_receipt: $env:DELIVERY_RECEIPT","launch_result_receipt: $($launch.id)",'user_relay_count: 0',"workflow_run_id: $env:GITHUB_RUN_ID",'readback_required: true')-join"`n");throw"No reviewer result; coordinator launch state=$state"}
          Publish (@('GBB_HANDOFF_CONTINUITY_FRESH_REVIEW_GUARD_V1','state: BLOCKED_TIMEOUT_NO_LAUNCH_OR_RESULT',"source_wake_comment_id: $env:WAKE_ID","source_delivery_receipt: $env:DELIVERY_RECEIPT",'user_relay_count: 0',"workflow_run_id: $env:GITHUB_RUN_ID",'readback_required: true')-join"`n");throw'Fresh reviewer launch/result timeout'
