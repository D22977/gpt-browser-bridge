name: G11 Issue124 Fresh Review R1 One Shot

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

env:
  REVIEW_REQUEST_ID: GBB124-G11-R1-38DA7377-20260906
  REVIEW_REQUEST_RECEIPT: "5560026863"
  SOURCE_WORKER_READY: "5560002300"
  CANDIDATE_HEAD: 38da7377f9b9d1610dd44aa869b861bb8500ccc9
  SOURCE_CARD_ID: GBB-HANDOFF-CONTINUITY-REPAIR-01-G11

concurrency:
  group: g11-issue124-fresh-review-r1-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  launch-fresh-reviewer:
    name: Launch exactly one fresh WebGPT Reviewer
    if: >-
      github.event.issue.number == 124 &&
      github.event.comment.user.login == 'D22977' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, 'HERDR_FRESH_REVIEW_WAKE_V1')
    runs-on: [self-hosted, Windows, GBB-REVIEWER]
    timeout-minutes: 8
    defaults:
      run:
        shell: pwsh -NoProfile -File {0}
    steps:
      - name: Validate and prompt transport coordinator once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = 'D22977/gpt-browser-bridge'
          $herdr = 'C:\Users\Lupun\AppData\Local\Programs\Herdr\bin\herdr.exe'
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; 'User-Agent' = 'gbb-g11-fresh-review-r1'; Accept = 'application/vnd.github+json' }

          function Need([string]$body,[string]$pattern,[string]$name) {
            $m=[regex]::Match($body,$pattern)
            if(-not $m.Success){ throw "Malformed wake field: $name" }
            return $m.Groups[1].Value
          }
          function Comments([int]$n) {
            $all=[System.Collections.Generic.List[object]]::new()
            for($p=1;$p-le 100;$p++){
              $xs=Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/issues/$n/comments?per_page=100&page=$p" -Headers $headers -Method Get -TimeoutSec 30
              $arr=@($xs); foreach($x in $arr){ if($null-ne$x){[void]$all.Add($x)} }
              if($arr.Count-lt100){break}
            }
            return $all.ToArray()
          }
          function Publish([string]$text) {
            $payload=@{body=$text}|ConvertTo-Json -Compress
            $p=Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/issues/124/comments" -Headers $headers -Method Post -Body $payload -ContentType 'application/json' -TimeoutSec 30
            $rb=Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/issues/comments/$($p.id)" -Headers $headers -Method Get -TimeoutSec 30
            if([string]$rb.body-cne$text){throw "Readback mismatch $($p.id)"}
            return [string]$p.id
          }
          function Active {
            $sw=@(Comments 88|Where-Object{[string]$_.body-match'(?m)^CONTROL_GENERATION_SWITCH_V1\s*$'-and[string]$_.body-match'(?m)^state:\s*SWITCH_COMMITTED\s*$'-and[string]$_.body-match'(?m)^new_generation_status:\s*ACTIVE\s*$'}|Sort-Object{[int64]$_.id})[-1]
            if($null-eq$sw){throw 'No ACTIVE switch'}
            $g=[regex]::Match([string]$sw.body,'(?m)^new_generation:\s*(\d{3})\s*$')
            if(-not$g.Success){throw 'ACTIVE switch malformed'}
            return [pscustomobject]@{Receipt=[string]$sw.id;Generation=$g.Groups[1].Value}
          }

          $event=Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw|ConvertFrom-Json
          if($event.repository.full_name-cne$repo-or[int]$event.issue.number-ne124){throw 'Wrong repository/issue'}
          if($event.comment.user.login-cne'D22977'-or$event.comment.author_association-cne'OWNER'){throw 'Wrong actor'}
          $body=[string]$event.comment.body
          if($body-notmatch'(?m)^HERDR_FRESH_REVIEW_WAKE_V1\s*$'){throw 'Missing wake header'}
          $gen=Need $body '(?m)^control_generation:\s*(\d{3})\s*$' 'control_generation'
          $rr=Need $body '(?m)^review_request_id:\s*([A-Za-z0-9._:-]+)\s*$' 'review_request_id'
          $src=Need $body '(?m)^source_review_request_receipt:\s*(\d+)\s*$' 'source_review_request_receipt'
          $head=Need $body '(?m)^candidate_head:\s*([0-9a-f]{40})\s*$' 'candidate_head'
          $idem=Need $body '(?m)^idempotency_key:\s*([A-Za-z0-9._:-]+)\s*$' 'idempotency_key'
          if($rr-cne$env:REVIEW_REQUEST_ID-or$src-cne$env:REVIEW_REQUEST_RECEIPT-or$head-cne$env:CANDIDATE_HEAD){throw 'Exact review binding mismatch'}
          if($idem-cne'GBB124-HERDR-FRESH-REVIEW-R1-38DA7377-V1'){throw 'Wrong idempotency key'}
          $request=Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/issues/comments/$src" -Headers $headers -Method Get -TimeoutSec 30
          if([string]$request.issue_url-notmatch'/issues/124$'-or[string]$request.body-notmatch[regex]::Escape($rr)-or[string]$request.body-notmatch[regex]::Escape($head)){throw 'Review request receipt mismatch'}
          $sw=Active; if($gen-cne$sw.Generation){throw "Stale generation requested=$gen active=$($sw.Generation)"}
          $who=(&whoami).Trim();$sid=[System.Diagnostics.Process]::GetCurrentProcess().SessionId
          if($who-notmatch'(?i)^d22977\\lupun$'-or-not[Environment]::UserInteractive-or$sid-eq0-or$env:RUNNER_NAME-cne'gbb-reviewer-win-01'){throw 'Interactive runner admission failed'}
          if(-not(Test-Path -LiteralPath $herdr)){throw 'Herdr CLI missing'}

          $wake=[string]$event.comment.id
          $root='D:\AIWORK_RUNTIME\GPT_BROWSER_BRIDGE\github-event-herdr-bridge\state-g11-fresh-review-r1'
          New-Item -ItemType Directory -Force -Path $root|Out-Null
          $state=Join-Path $root "$wake.json"
          if(Test-Path -LiteralPath $state){
            $prior=Get-Content -LiteralPath $state -Raw|ConvertFrom-Json
            if([string]$prior.status-eq'SENT'){
              [void](Publish (@('HERDR_FRESH_REVIEW_COORDINATOR_TERMINAL_V1','state: NO_OP_DUPLICATE',"source_wake_comment_id: $wake","review_request_id: $rr","candidate_head: $head",'second_prompt_sent: false','user_relay_count: 0',"workflow_run_id: $env:GITHUB_RUN_ID",'readback_verified: true')-join"`n"));exit 0
            }
            if([string]$prior.status-eq'SENDING'){
              [void](Publish (@('HERDR_FRESH_REVIEW_COORDINATOR_TERMINAL_V1','state: UNCERTAIN_SEND_NO_BLIND_RETRY',"source_wake_comment_id: $wake","review_request_id: $rr","candidate_head: $head",'second_prompt_sent: false','user_relay_count: 0',"workflow_run_id: $env:GITHUB_RUN_ID",'readback_verified: true')-join"`n"));throw 'Existing SENDING; no blind retry'
            }
          }

          $listRaw=&$herdr agent list
          if($LASTEXITCODE-ne0){[void](Publish (@('HERDR_FRESH_REVIEW_COORDINATOR_TERMINAL_V1','state: BLOCKED_PRESEND','reason: HERDR_AGENT_LIST_FAILED',"source_wake_comment_id: $wake","review_request_id: $rr","candidate_head: $head",'physical_prompt_count: 0','user_relay_count: 0',"workflow_run_id: $env:GITHUB_RUN_ID",'readback_verified: true')-join"`n"));throw 'herdr agent list failed'}
          $agents=@(($listRaw|ConvertFrom-Json).result.agents)
          $eligible=@($agents|Where-Object{$_.agent-eq'codex'-and$_.agent_status-in@('idle','done')-and$_.cwd-match'(?i)^C:\\WINDOWS\\system32$'-and([string]::IsNullOrWhiteSpace([string]$_.name)-or$_.name-notmatch'(?i)(review|mep|pr\d+)')-and$_.pane_id-and$_.agent_session.value})
          if($eligible.Count-ne1){[void](Publish (@('HERDR_FRESH_REVIEW_COORDINATOR_TERMINAL_V1','state: BLOCKED_PRESEND',"reason: GENERIC_CODEX_COORDINATOR_COUNT_$($eligible.Count)","source_wake_comment_id: $wake","review_request_id: $rr","candidate_head: $head",'physical_prompt_count: 0','user_relay_count: 0',"workflow_run_id: $env:GITHUB_RUN_ID",'readback_verified: true')-join"`n"));throw "Coordinator count=$($eligible.Count)"}
          $pane=[string]$eligible[0].pane_id;$session=[string]$eligible[0].agent_session.value
          $sw2=Active;if($sw2.Receipt-cne$sw.Receipt-or$sw2.Generation-cne$sw.Generation){throw 'ACTIVE Control changed before send'}
          @{status='SENDING';pane_id=$pane;agent_session=$session;workflow_run_id=$env:GITHUB_RUN_ID;active_switch=$sw.Receipt}|ConvertTo-Json|Set-Content -LiteralPath $state -Encoding utf8

          $wakeText="Read GitHub directly. You are the ONE NEW fresh independent ChatGPT Web formal Reviewer for D22977/gpt-browser-bridge Issue #124 review request $rr. Review exact head $head and publish/read back exactly one GBB_HANDOFF_CONTINUITY_FRESH_REVIEW_RESULT_V1 on #124. Do not mutate files, merge, release, run live acceptance, create generation012, or act as Control/Worker/Herdr."
          $prompt="Read GitHub directly. Rehydrate D22977/gpt-browser-bridge Issue #124 review request receipt $src and completion authority 5559953075. You are transport/coordinator only, not Reviewer. Perform ACCESS_CAPABILITY_CHECK_V1 for a currently admitted fresh ChatGPT Web route. Prefer the historically proven Codex in-app Browser / automation-owned isolated fresh-tab route only if current. Never use Control011, this coordinator/Worker context, a prior Reviewer, DB01 repair, or the human/default browser as Reviewer context. Create exactly one NEW/fresh independent ChatGPT Web conversation and send only: '$wakeText' Publish/read-back exactly one GBB_HANDOFF_CONTINUITY_FRESH_REVIEW_LAUNCH_RESULT_V1 on #124 with source_wake_comment_id: $wake; source_review_request_receipt: $src; review_request_id: $rr; candidate_head: $head; herdr_pane: $pane; herdr_agent_session: $session; state: DELIVERED; fresh reviewer conversation id/url or equivalent exact binding; transport_selected; user_relay_count: 0; readback_verified: true. If no current admitted fresh-WebGPT route exists, publish the same protocol with state: BLOCKED, first_missing_capability, fresh_reviewer_created: false, user_relay_count: 0, readback_verified: true. Do not review yourself and do not blind retry ambiguity."
          $hash=[Convert]::ToHexString([System.Security.Cryptography.SHA256]::HashData([System.Text.Encoding]::UTF8.GetBytes($prompt))).ToLowerInvariant()
          try{$raw=&$herdr agent prompt $pane $prompt;if($LASTEXITCODE-ne0){throw "herdr prompt exit=$LASTEXITCODE"};$r=$raw|ConvertFrom-Json;if([string]$r.result.type-cne'agent_prompted'-or[string]$r.result.agent.pane_id-cne$pane-or[string]$r.result.agent.agent_session.value-cne$session){throw 'Prompt identity mismatch'}}catch{[void](Publish (@('HERDR_FRESH_REVIEW_COORDINATOR_TERMINAL_V1','state: UNCERTAIN_SEND_NO_BLIND_RETRY',"source_wake_comment_id: $wake","review_request_id: $rr","candidate_head: $head","target_pane: $pane","target_agent_session: $session","prompt_sha256: $hash",'physical_prompt_count: UNKNOWN_AFTER_SEND_BOUNDARY','second_prompt_sent: false','user_relay_count: 0',"workflow_run_id: $env:GITHUB_RUN_ID",'readback_verified: true')-join"`n"));throw}
          @{status='SENT';pane_id=$pane;agent_session=$session;workflow_run_id=$env:GITHUB_RUN_ID;active_switch=$sw.Receipt}|ConvertTo-Json|Set-Content -LiteralPath $state -Encoding utf8
          [void](Publish (@('HERDR_FRESH_REVIEW_COORDINATOR_DELIVERY_V1','state: SENT_WAIT_LAUNCH_RESULT',"source_wake_comment_id: $wake","source_review_request_receipt: $src","review_request_id: $rr","candidate_head: $head","target_pane: $pane","target_agent_session: $session","prompt_sha256: $hash",'physical_prompt_count: 1','second_prompt_sent: false','user_relay_count: 0',"workflow_run_id: $env:GITHUB_RUN_ID",'readback_verified: true')-join"`n"))

  guard-review-result:
    name: Guard launch/result and return Control
    needs: launch-fresh-reviewer
    if: ${{ always() && needs.launch-fresh-reviewer.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Observe exact terminal and publish Control return request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';
          const repo='D22977/gpt-browser-bridge', issue=124;
          const rr=process.env.REVIEW_REQUEST_ID, rrReceipt=process.env.REVIEW_REQUEST_RECEIPT, ready=process.env.SOURCE_WORKER_READY, head=process.env.CANDIDATE_HEAD;
          const event=JSON.parse(await readFile(process.env.GITHUB_EVENT_PATH,'utf8')), wake=String(event.comment.id), token=process.env.GH_TOKEN;
          const headers={Authorization:`Bearer ${token}`,'User-Agent':'gbb-g11-review-guard',Accept:'application/vnd.github+json'};
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function api(path,o={}){const r=await fetch(`https://api.github.com/repos/${repo}${path}`,{...o,headers:{...headers,...(o.headers||{})}});if(!r.ok)throw new Error(`${o.method||'GET'} ${path} ${r.status} ${await r.text()}`);return r.status===204?null:r.json()}
          async function comments(n){const out=[];for(let p=1;p<=100;p++){const xs=await api(`/issues/${n}/comments?per_page=100&page=${p}`);out.push(...xs);if(xs.length<100)break}return out}
          const first=b=>String(b||'').split(/\r?\n/).find(x=>x.trim())?.trim()||'';
          const line=(b,k)=>String(b||'').match(new RegExp(`^${k}:\\s*(.+?)\\s*$`,'m'))?.[1]?.trim()||'';
          async function publish(body){const p=await api(`/issues/${issue}/comments`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({body})});const rb=await api(`/issues/comments/${p.id}`);if(rb.body!==body)throw new Error(`readback mismatch ${p.id}`);return p}
          async function active(){const cs=await comments(88),sw=cs.filter(c=>first(c.body)==='CONTROL_GENERATION_SWITCH_V1'&&line(c.body,'state')==='SWITCH_COMMITTED'&&line(c.body,'new_generation_status')==='ACTIVE').sort((a,b)=>Number(a.id)-Number(b.id)).at(-1);if(!sw)throw new Error('No ACTIVE switch');const gen=line(sw.body,'new_generation'),cid=line(sw.body,'new_conversation_id'),url=line(sw.body,'new_conversation_url');if(!gen||!cid||!url)throw new Error('ACTIVE route missing');return{receipt:String(sw.id),gen,cid,url}}

          let terminal=null,launch=null;
          for(let i=0;i<60;i++){
            const cs=await comments(issue);
            const ts=cs.filter(c=>first(c.body)==='HERDR_FRESH_REVIEW_COORDINATOR_TERMINAL_V1'&&line(c.body,'source_wake_comment_id')===wake&&line(c.body,'review_request_id')===rr&&line(c.body,'candidate_head')===head);
            if(ts.length>1)throw new Error('Multiple coordinator terminals');if(ts.length===1){terminal=ts[0];break}
            const ls=cs.filter(c=>first(c.body)==='GBB_HANDOFF_CONTINUITY_FRESH_REVIEW_LAUNCH_RESULT_V1'&&line(c.body,'source_wake_comment_id')===wake&&line(c.body,'review_request_id')===rr&&line(c.body,'candidate_head')===head);
            if(ls.length>1)throw new Error('Multiple launch results');if(ls.length===1){launch=ls[0];break}
            await sleep(5000);
          }
          if(!terminal&&!launch)terminal=await publish(['GBB_HANDOFF_CONTINUITY_FRESH_REVIEW_GUARD_V1','state: BLOCKED_LAUNCH_RESULT_TIMEOUT',`source_wake_comment_id: ${wake}`,`source_review_request_receipt: ${rrReceipt}`,`review_request_id: ${rr}`,`candidate_head: ${head}`,'user_relay_count: 0',`workflow_run_id: ${process.env.GITHUB_RUN_ID}`,'readback_verified: true'].join('\n'));
          if(!terminal&&launch&&line(launch.body,'state')!=='DELIVERED')terminal=await publish(['GBB_HANDOFF_CONTINUITY_FRESH_REVIEW_GUARD_V1',`state: ${line(launch.body,'state')==='BLOCKED'?'REVIEW_LAUNCH_BLOCKED':'CONTROL_REQUIRED_UNKNOWN_LAUNCH_STATE'}`,`source_wake_comment_id: ${wake}`,`source_launch_result_receipt: ${launch.id}`,`review_request_id: ${rr}`,`candidate_head: ${head}`,`first_missing_capability: ${line(launch.body,'first_missing_capability')||'UNKNOWN'}`,'user_relay_count: 0',`workflow_run_id: ${process.env.GITHUB_RUN_ID}`,'readback_verified: true'].join('\n'));
          if(!terminal&&launch){
            let result=null;
            for(let i=0;i<180;i++){const cs=await comments(issue),rs=cs.filter(c=>first(c.body)==='GBB_HANDOFF_CONTINUITY_FRESH_REVIEW_RESULT_V1'&&line(c.body,'review_request_id')===rr&&line(c.body,'source_worker_ready')===ready&&line(c.body,'candidate_head')===head);if(rs.length>1)throw new Error('Multiple formal review results');if(rs.length===1){result=rs[0];break}await sleep(5000)}
            if(result){terminal=result;await publish(['GBB_HANDOFF_CONTINUITY_FRESH_REVIEW_GUARD_V1','state: PASS_REVIEW_RESULT_OBSERVED',`source_wake_comment_id: ${wake}`,`source_launch_result_receipt: ${launch.id}`,`source_review_result_receipt: ${result.id}`,`review_request_id: ${rr}`,`candidate_head: ${head}`,'user_relay_count: 0',`workflow_run_id: ${process.env.GITHUB_RUN_ID}`,'readback_verified: true'].join('\n'))}
            else terminal=await publish(['GBB_HANDOFF_CONTINUITY_FRESH_REVIEW_GUARD_V1','state: BLOCKED_REVIEW_RESULT_TIMEOUT',`source_wake_comment_id: ${wake}`,`source_launch_result_receipt: ${launch.id}`,`review_request_id: ${rr}`,`candidate_head: ${head}`,'user_relay_count: 0',`workflow_run_id: ${process.env.GITHUB_RUN_ID}`,'readback_verified: true'].join('\n'));
          }
          const sw=await active();
          const body=['CONTROL_RETURN_REQUEST_V1',`source_issue: ${issue}`,`source_card_id: ${process.env.SOURCE_CARD_ID}`,`source_terminal_receipt: ${terminal.id}`,`source_head: ${head}`,`target_control_generation: ${sw.gen}`,'target_control_status: ACTIVE',`target_control_conversation_id: ${sw.cid}`,`target_control_conversation_url: ${sw.url}`,`idempotency_key: GBB124-R1-RETURN-${terminal.id}-${head.slice(0,8)}`].join('\n');
          const ret=await publish(body);console.log(`return=${ret.id} terminal=${terminal.id}`);
          NODE
