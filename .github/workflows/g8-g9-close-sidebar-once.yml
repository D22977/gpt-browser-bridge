name: G8 G9 Exact 009 Close Sidebar Recovery

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  recover:
    name: G8 G9 Exact 009 Close Sidebar Recovery
    if: >-
      github.event.issue.number == 88 &&
      github.event.comment.user.login == 'D22977' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, 'CONTROL_G8_G9_009_CLOSE_SIDEBAR_RECOVERY_EVENT_V1')
    runs-on: [self-hosted, Windows, GBB-REVIEWER]
    timeout-minutes: 6
    defaults:
      run:
        shell: pwsh -NoProfile -File {0}
    steps:
      - name: Close exact 009 sidebar once and verify composer readiness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $event=Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw|ConvertFrom-Json
          $body=[string]$event.comment.body
          if($event.repository.full_name -cne 'D22977/gpt-browser-bridge' -or [int]$event.issue.number -ne 88){throw 'Wrong repo/issue'}
          if($event.comment.user.login -cne 'D22977' -or $event.comment.author_association -cne 'OWNER'){throw 'Wrong actor'}
          if($body -notmatch '(?m)^source_recovery_authority:\s*5501315144\s*$'){throw 'Wrong recovery authority'}
          if($body -notmatch '(?m)^source_candidate_binding:\s*5495537900\s*$'){throw 'Wrong binding'}
          $targetId='6a957d5b-19e8-83e8-9925-3343facccaf3'
          $targetUrl='https://chatgpt.com/g/g-p-6a7b34dba7448191ac48d7789054813b-kong-zhi-ta-zhuan-an/c/6a957d5b-19e8-83e8-9925-3343facccaf3'
          $pw='C:\Users\Lupun\AppData\Roaming\npm\node_modules\@playwright\cli\node_modules\.bin\playwright.cmd'
          $root='D:\AIWORK_RUNTIME\GPT_BROWSER_BRIDGE\control-doorbell'
          $profile='D:\AIWORK_RUNTIME\GPT_BROWSER_BRIDGE\control-doorbell\db01-profile'
          $session='HERDR-DOORBELL-DB01-G1-20260816'
          if($env:RUNNER_NAME -cne 'gbb-reviewer-win-01' -or -not [Environment]::UserInteractive){throw 'Runner mismatch'}
          Push-Location $root
          try{
            $sessions=(& $pw cli list 2>&1|Out-String);if($LASTEXITCODE -ne 0){throw 'session-list failed'}
            $tabs=(& $pw cli "-s=$session" tab-list 2>&1|Out-String);$te=$LASTEXITCODE
            if($te -eq 1 -and $sessions -notmatch [regex]::Escape($session)){$null=(& $pw cli "-s=$session" open --persistent "--profile=$profile" --headed 2>&1|Out-String);if($LASTEXITCODE -ne 0){throw 'restart failed'}}elseif($te -ne 0){throw 'session ambiguous'}
            $tabs=(& $pw cli "-s=$session" tab-list 2>&1|Out-String);if($LASTEXITCODE -ne 0){throw 'tab-list failed'}
            if($tabs -notmatch [regex]::Escape($targetId)){$null=(& $pw cli "-s=$session" goto $targetUrl 2>&1|Out-String);if($LASTEXITCODE -ne 0){throw 'goto failed'};$tabs=(& $pw cli "-s=$session" tab-list 2>&1|Out-String)}
            $lines=@($tabs -split "`r?`n"|Where-Object{$_ -match [regex]::Escape($targetId)});if($lines.Count -ne 1){throw "tab count=$($lines.Count)"}
            $ix=[regex]::Match($lines[0],'^\s*-\s*(\d+):');if(-not $ix.Success){throw 'tab index missing'}
            $null=(& $pw cli "-s=$session" tab-select $ix.Groups[1].Value 2>&1|Out-String);if($LASTEXITCODE -ne 0){throw 'tab-select failed'}
          }finally{Pop-Location}

          $env:GBB_PW=$pw;$env:GBB_SESSION=$session;$env:GBB_TARGET=$targetId
          $nodePath=Join-Path $env:RUNNER_TEMP "g8-g9-close-sidebar-$env:GITHUB_RUN_ID.mjs";$outPath=Join-Path $env:RUNNER_TEMP "g8-g9-close-sidebar-$env:GITHUB_RUN_ID.json";$env:GBB_OUT=$outPath
          $node=@'
          import {spawnSync} from 'node:child_process';import fs from 'node:fs';import path from 'node:path';
          const entry=path.join(path.dirname(process.env.GBB_PW),'..','playwright','cli.js');
          const session=process.env.GBB_SESSION,target=process.env.GBB_TARGET;
          function cli(sub,args=[]){const r=spawnSync(process.execPath,[entry,'cli',`-s=${session}`,sub,...args,'--json'],{encoding:'utf8',windowsHide:true,maxBuffer:32*1024*1024});if(r.error)throw r.error;if(r.status!==0)throw new Error(`CLI_EXIT_${sub}_${r.status}`);let e;try{e=JSON.parse(String(r.stdout||''))}catch{throw new Error(`CLI_INVALID_JSON:${sub}`)}if(e?.isError===true)throw new Error(`CLI_ERROR_RESPONSE:${sub}`);let x=e?.result;if(typeof x==='string'){try{x=JSON.parse(x)}catch{}}return x;}
          const script=`() => {const id=(location.pathname.match(/\\/c\\/([0-9a-f-]+)/i)||[])[1]||'';const f=document.querySelector('textarea')?.form||null;const b=Array.from(document.querySelectorAll('button[data-testid="close-sidebar-button"]')).filter(e=>{const r=e.getBoundingClientRect(),s=getComputedStyle(e);return !e.hidden&&s.display!=='none'&&s.visibility!=='hidden'&&s.pointerEvents!=='none'&&r.width>0&&r.height>0;});const side=document.querySelector('#stage-slideover-sidebar');const ta=document.querySelector('textarea');return {conversationId:id,closeCount:b.length,sideOpen:Boolean(side&&side.getAttribute('data-state')==='open'),formInert:Boolean(f?.inert),textareaDisabled:Boolean(ta?.disabled),textareaPointer:ta?getComputedStyle(ta).pointerEvents:'',textareaWidth:ta?Math.round(ta.getBoundingClientRect().width):0,textareaHeight:ta?Math.round(ta.getBoundingClientRect().height):0};}`;
          const pre=cli('eval',[script]);if(String(pre?.conversationId)!==target)throw new Error('CONVERSATION_MISMATCH');if(pre.closeCount!==1||!pre.sideOpen||!pre.formInert)throw new Error(`PRECONDITION_MISMATCH:${JSON.stringify(pre)}`);
          cli('click',['button[data-testid="close-sidebar-button"]']);
          let post=null;const end=Date.now()+30000;while(Date.now()<end){post=cli('eval',[script]);if(String(post?.conversationId)!==target)throw new Error('CONVERSATION_DRIFT');if(!post.sideOpen&&!post.formInert&&!post.textareaDisabled&&post.textareaPointer!=='none'&&post.textareaWidth>250&&post.textareaHeight>20)break;Atomics.wait(new Int32Array(new SharedArrayBuffer(4)),0,0,500);}
          fs.writeFileSync(process.env.GBB_OUT,JSON.stringify({pre,post}),'utf8');
          if(!post||post.sideOpen||post.formInert||post.textareaDisabled||post.textareaPointer==='none')throw new Error(`COMPOSER_NOT_READY:${JSON.stringify(post)}`);
          '@
          Set-Content -LiteralPath $nodePath -Value $node -Encoding utf8
          $decision='PASS_COMPOSER_READY';$state='PASS';$detail=''
          try{& node $nodePath 2>&1|Out-String|Write-Output;if($LASTEXITCODE -ne 0){throw "node exit=$LASTEXITCODE"};$meta=Get-Content $outPath -Raw|ConvertFrom-Json;$detail=$meta|ConvertTo-Json -Compress -Depth 6}catch{$state='BLOCKED';$decision='BLOCKED_RECOVERY_OR_READINESS';$detail=($_.Exception.Message -replace '[\r\n]+',' ');if($detail.Length -gt 1000){$detail=$detail.Substring(0,1000)}}finally{Remove-Item $nodePath,$outPath -Force -ErrorAction SilentlyContinue}
          $headers=@{Authorization="Bearer $env:GH_TOKEN";'User-Agent'='g8-g9-close-sidebar';Accept='application/vnd.github+json'}
          $text=@('CONTROL_G8_G9_009_CLOSE_SIDEBAR_RECOVERY_RESULT_V1',"state: $state","decision: $decision",'source_recovery_authority: 5501315144',"source_event_comment_id: $($event.comment.id)",'source_candidate_binding: 5495537900',"target_conversation_id: $targetId","text_free_state_evidence: $detail",'conversation_text_captured: false','fill_type_send_performed: false','close_sidebar_click_count: 1','user_relay_count: 0','readback_required: true') -join "`n"
          $payload=@{body=$text}|ConvertTo-Json -Compress;$r=Invoke-RestMethod -Uri 'https://api.github.com/repos/D22977/gpt-browser-bridge/issues/88/comments' -Headers $headers -Method Post -Body $payload -ContentType 'application/json' -TimeoutSec 30;$rb=Invoke-RestMethod -Uri "https://api.github.com/repos/D22977/gpt-browser-bridge/issues/comments/$($r.id)" -Headers $headers -Method Get -TimeoutSec 30;if([string]$rb.body -cne $text){throw 'readback mismatch'};if($state -ne 'PASS'){throw "Recovery blocked receipt=$($r.id)"};Write-Output "PASS receipt=$($r.id)"
