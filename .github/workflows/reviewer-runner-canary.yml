name: GBB Reviewer Runner Canary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reviewer-runner-canary:
    name: GBB Reviewer Runner Canary
    runs-on: [self-hosted, Windows, GBB-REVIEWER]
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh -NoProfile -File {0}
    steps:
      - name: Verify interactive Reviewer identity and session
        run: |
          $ErrorActionPreference = 'Stop'
          $expectedUserPattern = '(?i)^d22977\\lupun$'
          $whoami = (& whoami).Trim()
          $identity = [System.Security.Principal.WindowsIdentity]::GetCurrent().Name
          $sessionId = [System.Diagnostics.Process]::GetCurrentProcess().SessionId

          if ($whoami -notmatch $expectedUserPattern) {
            throw "Unexpected whoami identity: $whoami"
          }
          if ($identity -notmatch $expectedUserPattern) {
            throw "Unexpected Windows identity: $identity"
          }
          if (-not [Environment]::UserInteractive) {
            throw 'Reviewer canary is not running in an interactive user session'
          }
          if ($sessionId -eq 0) {
            throw 'Reviewer canary is running in Session 0'
          }
          if ($env:RUNNER_NAME -cne 'gbb-reviewer-win-01') {
            throw "Unexpected runner name: $env:RUNNER_NAME"
          }
          if ($env:RUNNER_OS -cne 'Windows') {
            throw "Unexpected runner OS: $env:RUNNER_OS"
          }

          Write-Output "reviewer_canary_identity: whoami=$whoami windows_identity=$identity session_id=$sessionId interactive=$([Environment]::UserInteractive) runner_name=$env:RUNNER_NAME runner_os=$env:RUNNER_OS"

      - name: Fail closed on Worker identity or forbidden process ancestry
        run: |
          $ErrorActionPreference = 'Stop'
          $processes = @(Get-CimInstance Win32_Process)
          $currentProcess = $processes | Where-Object ProcessId -eq $PID
          if (-not $currentProcess) {
            throw 'Unable to resolve the current canary process'
          }
          if ($currentProcess.CommandLine -match '(?i)GBBWorker') {
            throw 'Current canary process command line indicates GBBWorker'
          }

          $processById = @{}
          foreach ($process in $processes) {
            $processById[[int]$process.ProcessId] = $process
          }

          $ancestorIds = [System.Collections.Generic.HashSet[int]]::new()
          $cycleGuard = [System.Collections.Generic.HashSet[int]]::new()
          [void]$ancestorIds.Add([int]$PID)
          $parentId = [int]$currentProcess.ParentProcessId
          while ($parentId -ne 0) {
            if (-not $cycleGuard.Add($parentId)) {
              break
            }
            $parentProcess = $processById[$parentId]
            if (-not $parentProcess) {
              break
            }
            if (-not $ancestorIds.Add($parentId)) {
              break
            }
            $parentId = [int]$parentProcess.ParentProcessId
          }

          $ancestorProcesses = @($processes | Where-Object { $ancestorIds.Contains([int]$_.ProcessId) })
          $forbiddenAncestorProcesses = @($ancestorProcesses | Where-Object {
            $_.Name -match '(?i)^(opencode|chrome|msedge|playwright)' -or
            $_.CommandLine -match '(?i)(opencode|deepseek|gpt_browser_bridge|gpt_send|supervisor|chatgpt|webgpt|playwright|orca|GBBWorker)'
          })
          if ($forbiddenAncestorProcesses.Count -gt 0) {
            $details = $forbiddenAncestorProcesses | ForEach-Object { "$($_.Name):$($_.ProcessId)" }
            throw "Forbidden Worker/browser/GBB/ORCA ancestor process: $($details -join ', ')"
          }

          $ancestorServices = @(Get-CimInstance Win32_Service | Where-Object { $_.ProcessId -in @($ancestorProcesses.ProcessId) })
          $workerAncestorServices = @($ancestorServices | Where-Object {
            $_.StartName -match '(?i)GBBWorker' -or $_.PathName -match '(?i)gbb-worker|GBBWorker'
          })
          if ($workerAncestorServices.Count -gt 0) {
            $details = $workerAncestorServices | ForEach-Object { $_.Name }
            throw "Canary process has a Worker ancestor service: $($details -join ', ')"
          }

          Write-Output "reviewer_canary_ancestry: ancestor_count=$($ancestorProcesses.Count) worker_ancestor_service_count=$($workerAncestorServices.Count) forbidden_ancestor_count=$($forbiddenAncestorProcesses.Count)"
