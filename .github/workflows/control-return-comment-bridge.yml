name: GBB Herdr Outbound Wake Bridge

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: gbb-herdr-outbound-g9-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  herdr-outbound-wake:
    name: GBB Herdr Outbound Wake G009
    if: >-
      github.event.issue.number == 103 &&
      github.event.comment.user.login == 'D22977' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, 'HERDR_CONTROL_WAKE_V1')
    runs-on: [self-hosted, Windows, GBB-REVIEWER]
    timeout-minutes: 8
    defaults:
      run:
        shell: pwsh -NoProfile -File {0}
    steps:
      - name: Validate exact G009 wake and ACTIVE Control
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $event = Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
          if ($event.repository.full_name -cne 'D22977/gpt-browser-bridge') { throw 'Wrong repository' }
          if ([int]$event.issue.number -ne 103) { throw 'Wrong issue' }
          if ($event.comment.user.login -cne 'D22977' -or $event.comment.author_association -cne 'OWNER') { throw 'Wrong actor' }

          $body = [string]$event.comment.body
          $gen = [regex]::Match($body, '(?m)^control_generation:\s*(\d{3})\s*$')
          $card = [regex]::Match($body, '(?m)^card_id:\s*([A-Za-z0-9_-]+)\s*$')
          $source = [regex]::Match($body, '(?m)^source_dispatch_receipt:\s*(\d+)\s*$')
          $action = [regex]::Match($body, '(?m)^action:\s*(MINIMAL_HERDR_ACK)\s*$')
          $idem = [regex]::Match($body, '(?m)^idempotency_key:\s*([A-Za-z0-9._:-]+)\s*$')
          if (-not ($gen.Success -and $card.Success -and $source.Success -and $action.Success -and $idem.Success)) { throw 'Malformed HERDR_CONTROL_WAKE_V1' }
          if ($gen.Groups[1].Value -cne '009') { throw 'Wake is not generation009' }
          if ($card.Groups[1].Value -cne 'HERDR-G9-MINIMAL-DIRECT-WAKE-01') { throw 'Wrong card' }
          if ($source.Groups[1].Value -cne '5525544200') { throw 'Wrong source dispatch receipt' }

          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; 'User-Agent' = 'gbb-herdr-outbound-g9'; Accept = 'application/vnd.github+json' }
          $all = [System.Collections.Generic.List[object]]::new()
          function Add-Flat([object]$v) {
            if ($null -eq $v) { return }
            if ($v -is [System.Array]) { foreach ($x in $v) { Add-Flat $x }; return }
            [void]$all.Add($v)
          }
          for ($page = 1; $page -le 20; $page++) {
            $before = $all.Count
            Add-Flat (Invoke-RestMethod -Uri "https://api.github.com/repos/D22977/gpt-browser-bridge/issues/88/comments?per_page=100&page=$page" -Headers $headers -Method Get -TimeoutSec 30)
            if (($all.Count - $before) -lt 100) { break }
          }
          $switches = @($all | Where-Object {
            $_.body -match '(?m)^CONTROL_GENERATION_SWITCH_V1\s*$' -and
            $_.body -match '(?m)^state:\s*SWITCH_COMMITTED\s*$' -and
            $_.body -match '(?m)^new_generation_status:\s*ACTIVE\s*$'
          } | Sort-Object { [int64]$_.id })
          if ($switches.Count -eq 0) { throw 'No ACTIVE Control switch' }
          $latest = $switches[-1]
          $active = [regex]::Match([string]$latest.body, '(?m)^new_generation:\s*(\d{3})\s*$')
          if (-not $active.Success -or $active.Groups[1].Value -cne '009') { throw "G009 is not ACTIVE; latest switch=$($latest.id)" }

          $whoami = (& whoami).Trim()
          $sessionId = [System.Diagnostics.Process]::GetCurrentProcess().SessionId
          if ($whoami -notmatch '(?i)^d22977\\lupun$') { throw "Unexpected Windows user: $whoami" }
          if (-not [Environment]::UserInteractive -or $sessionId -eq 0) { throw 'Runner is not interactive' }
          if ($env:RUNNER_NAME -cne 'gbb-reviewer-win-01') { throw "Unexpected runner: $env:RUNNER_NAME" }

          "WAKE_COMMENT_ID=$($event.comment.id)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "SOURCE_RECEIPT=$($source.Groups[1].Value)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "ACTIVE_SWITCH=$($latest.id)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "WAKE_IDEMPOTENCY=$($idem.Groups[1].Value)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Resolve one safe Herdr target and prompt exactly once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $herdr = 'C:\Users\Lupun\AppData\Local\Programs\Herdr\bin\herdr.exe'
          if (-not (Test-Path -LiteralPath $herdr)) { throw "Herdr CLI missing: $herdr" }

          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; 'User-Agent' = 'gbb-herdr-outbound-g9'; Accept = 'application/vnd.github+json' }
          function Publish([string]$body) {
            $payload = @{ body = $body } | ConvertTo-Json -Compress
            return Invoke-RestMethod -Uri 'https://api.github.com/repos/D22977/gpt-browser-bridge/issues/103/comments' -Headers $headers -Method Post -Body $payload -ContentType 'application/json' -TimeoutSec 30
          }

          $stateRoot = 'D:\AIWORK_RUNTIME\GPT_BROWSER_BRIDGE\github-event-herdr-bridge\state'
          New-Item -ItemType Directory -Force -Path $stateRoot | Out-Null
          $statePath = Join-Path $stateRoot "g9-$($env:WAKE_COMMENT_ID).json"
          if (Test-Path -LiteralPath $statePath) {
            $prior = Get-Content -LiteralPath $statePath -Raw | ConvertFrom-Json
            if ($prior.status -eq 'SENT') {
              $noop = @('HERDR_GITHUB_EVENT_BRIDGE_DELIVERY_V1','state: NO_OP_DUPLICATE','control_generation: 009',"source_wake_comment_id: $($env:WAKE_COMMENT_ID)","target_pane: $($prior.pane_id)","target_agent_session: $($prior.agent_session)",'second_prompt_sent: false',"workflow_run_id: $env:GITHUB_RUN_ID",'user_relay_count: 0') -join "`n"
              [void](Publish $noop)
              exit 0
            }
            if ($prior.status -eq 'SENDING') { throw 'UNCERTAIN_SEND / NO_BLIND_RETRY' }
          }

          $listRaw = & $herdr agent list
          if ($LASTEXITCODE -ne 0) { throw "herdr agent list failed exit=$LASTEXITCODE" }
          $list = $listRaw | ConvertFrom-Json
          $agents = @($list.result.agents)
          $eligible = @($agents | Where-Object {
            $_.agent -eq 'codex' -and
            $_.agent_status -eq 'idle' -and
            $_.cwd -match '(?i)^C:\\WINDOWS\\system32$' -and
            ([string]::IsNullOrWhiteSpace([string]$_.name) -or $_.name -notmatch '(?i)(review|mep|pr\d+)') -and
            $_.pane_id -and $_.agent_session.value
          })
          if ($eligible.Count -ne 1) {
            $summary = ($agents | ForEach-Object { "$($_.pane_id):$($_.agent):$($_.agent_status):$($_.cwd):$($_.name)" }) -join '; '
            throw "Expected exactly one safe idle generic Codex target; eligible=$($eligible.Count); agents=$summary"
          }
          $target = $eligible[0]
          $pane = [string]$target.pane_id
          $session = [string]$target.agent_session.value

          @{ status='SENDING'; pane_id=$pane; agent_session=$session; workflow_run_id=$env:GITHUB_RUN_ID; observed_at=(Get-Date).ToString('o') } | ConvertTo-Json | Set-Content -LiteralPath $statePath -Encoding utf8

          $prompt = "Read GitHub directly. D22977/gpt-browser-bridge Issue #103 wake comment $($env:WAKE_COMMENT_ID) and source dispatch $($env:SOURCE_RECEIPT). Minimal Herdr liveness only. Publish and read back exactly one HERDR_MINIMAL_ACK_V1 on Issue #103 binding source_wake_comment_id $($env:WAKE_COMMENT_ID), your current pane_id, agent_session, `herdr --version`, and user_relay_count: 0. Do not open/control ChatGPT, DB01, or any browser. Do not mutate files, Control generation, product state, review, merge, release, or infer successor. GitHub is authority."
          $promptRaw = & $herdr agent prompt $pane $prompt
          if ($LASTEXITCODE -ne 0) { throw 'herdr agent prompt failed; state remains SENDING; NO_BLIND_RETRY' }
          $result = $promptRaw | ConvertFrom-Json
          if ($result.result.type -ne 'agent_prompted') { throw "Unexpected prompt result type $($result.result.type)" }
          if ([string]$result.result.agent.pane_id -cne $pane) { throw 'Prompt pane mismatch' }
          if ([string]$result.result.agent.agent_session.value -cne $session) { throw 'Prompt session mismatch' }

          @{ status='SENT'; pane_id=$pane; agent_session=$session; workflow_run_id=$env:GITHUB_RUN_ID; sent_at=(Get-Date).ToString('o') } | ConvertTo-Json | Set-Content -LiteralPath $statePath -Encoding utf8

          $receipt = @('HERDR_GITHUB_EVENT_BRIDGE_DELIVERY_V1','state: CONSUMED_STARTED','decision: PASS','control_generation: 009',"active_switch_receipt: $($env:ACTIVE_SWITCH)","source_wake_comment_id: $($env:WAKE_COMMENT_ID)","source_dispatch_receipt: $($env:SOURCE_RECEIPT)",'card_id: HERDR-G9-MINIMAL-DIRECT-WAKE-01','action: MINIMAL_HERDR_ACK',"target_pane: $pane", "target_agent_session: $session", "runner_name: $env:RUNNER_NAME", "workflow_run_id: $env:GITHUB_RUN_ID", 'user_relay_count: 0', 'duplicate_prompt_count: 0', 'readback_required: true') -join "`n"
          $posted = Publish $receipt
          $readback = Invoke-RestMethod -Uri "https://api.github.com/repos/D22977/gpt-browser-bridge/issues/comments/$($posted.id)" -Headers $headers -Method Get -TimeoutSec 30
          if ([string]$readback.body -cne $receipt) { throw "Durable delivery read-back mismatch receipt=$($posted.id)" }
          Write-Output "Herdr prompted pane=$pane session=$session receipt=$($posted.id)"
