name: G10 G11 Herdr Review Retrieval Once

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: g10-g11-herdr-review-retrieval-CONTROL-G10-G11-EXTERNAL-REVIEW-RETRIEVAL-01-20260906
  cancel-in-progress: false

jobs:
  deliver-herdr-retrieval:
    if: >-
      github.event.issue.number == 88 &&
      github.event.comment.user.login == 'D22977' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, 'CONTROL_G10_G11_HERDR_REVIEW_RETRIEVAL_WAKE_V1')
    runs-on: [self-hosted, Windows, GBB-REVIEWER]
    timeout-minutes: 8
    defaults:
      run:
        shell: pwsh -NoProfile -File {0}

    steps:
      - name: Validate authority and deliver exactly one Herdr wake
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = 'D22977/gpt-browser-bridge'
          $issue = 88
          $dispatchReceipt = '5555812210'
          $transportAuthority = '5555816304'
          $currentSwitch = '5555495204'
          $logicalKey = 'CONTROL-G10-G11-EXTERNAL-REVIEW-RETRIEVAL-01-20260906'
          $herdr = 'C:\Users\Lupun\AppData\Local\Programs\Herdr\bin\herdr.exe'
          $runtimeRoot = 'D:\AIWORK_RUNTIME\GPT_BROWSER_BRIDGE\g10-g11-herdr-review-retrieval-once'
          $stateRoot = Join-Path $runtimeRoot 'state'
          $statePath = Join-Path $stateRoot "$logicalKey.json"
          New-Item -ItemType Directory -Force -Path $stateRoot | Out-Null

          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            'User-Agent' = 'g10-g11-herdr-review-retrieval-once'
            Accept = 'application/vnd.github+json'
          }

          function Publish([string]$text) {
            $payload = @{ body = $text } | ConvertTo-Json -Compress
            $r = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/issues/$issue/comments" -Headers $headers -Method Post -Body $payload -ContentType 'application/json' -TimeoutSec 30
            $rb = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/issues/comments/$($r.id)" -Headers $headers -Method Get -TimeoutSec 30
            if ([string]$rb.body -cne $text) { throw 'Durable delivery receipt readback mismatch' }
            return [string]$r.id
          }

          function GetAll88Comments {
            $all = [System.Collections.Generic.List[object]]::new()
            function AddFlat([object]$v) {
              if ($null -eq $v) { return }
              if ($v -is [System.Array]) { foreach ($x in $v) { AddFlat $x }; return }
              [void]$all.Add($v)
            }
            for ($p = 1; $p -le 40; $p++) {
              $before = $all.Count
              AddFlat (Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/issues/88/comments?per_page=100&page=$p" -Headers $headers -Method Get -TimeoutSec 30)
              if (($all.Count - $before) -lt 100) { break }
            }
            return $all.ToArray()
          }

          function GetEligibleCodex([object]$list) {
            return @($list.result.agents | Where-Object {
              [string]$_.agent -eq 'codex' -and
              -not [string]::IsNullOrWhiteSpace([string]$_.pane_id) -and
              -not [string]::IsNullOrWhiteSpace([string]$_.agent_session.value) -and
              ([string]$_.agent_status -in @('idle','done'))
            })
          }

          $event = Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
          if ($event.repository.full_name -cne $repo -or [int]$event.issue.number -ne $issue) { throw 'Wrong event target' }
          if ($event.comment.user.login -cne 'D22977' -or $event.comment.author_association -cne 'OWNER') { throw 'Wrong event actor' }
          $body = [string]$event.comment.body
          if ($body -notmatch '(?m)^CONTROL_G10_G11_HERDR_REVIEW_RETRIEVAL_WAKE_V1\s*$') { throw 'Missing wake protocol header' }
          if ($body -notmatch '(?m)^control_generation:\s*010\s*$') { throw 'Wrong control generation' }
          if ($body -notmatch '(?m)^card_id:\s*CONTROL-G10-G11-EXTERNAL-REVIEW-RETRIEVAL-01\s*$') { throw 'Wrong card id' }
          if ($body -notmatch '(?m)^source_dispatch_receipt:\s*5555812210\s*$') { throw 'Wrong source dispatch receipt' }
          if ($body -notmatch '(?m)^source_transport_authority:\s*5555816304\s*$') { throw 'Wrong source transport authority' }
          if ($body -notmatch '(?m)^source_current_switch:\s*5555495204\s*$') { throw 'Wrong source current switch' }
          if ($body -notmatch '(?m)^idempotency_key:\s*CONTROL-G10-G11-EXTERNAL-REVIEW-RETRIEVAL-01-20260906\s*$') { throw 'Wrong idempotency key' }
          $wakeComment = [string]$event.comment.id

          foreach ($cid in @($dispatchReceipt,$transportAuthority,$currentSwitch)) {
            $c = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/issues/comments/$cid" -Headers $headers -Method Get -TimeoutSec 30
            if ([string]$c.issue_url -notmatch '/issues/88$') { throw "Authority $cid is not on Issue #88" }
          }
          $dispatch = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/issues/comments/$dispatchReceipt" -Headers $headers -Method Get -TimeoutSec 30
          if ([string]$dispatch.body -notmatch '(?m)^DISPATCH_CARD_V1\s*$' -or [string]$dispatch.body -notmatch '(?m)^card_id:\s*CONTROL-G10-G11-EXTERNAL-REVIEW-RETRIEVAL-01\s*$' -or [string]$dispatch.body -notmatch '(?m)^state:\s*EXECUTE_NOW\s*$') { throw 'Dispatch card binding mismatch' }
          $active = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/issues/comments/$currentSwitch" -Headers $headers -Method Get -TimeoutSec 30
          if ([string]$active.body -notmatch '(?m)^CONTROL_GENERATION_SWITCH_V1\s*$' -or [string]$active.body -notmatch '(?m)^new_generation:\s*010\s*$') { throw 'Current switch binding mismatch' }

          $all = @(GetAll88Comments)
          $newerSwitch = @($all | Where-Object {
            $_.PSObject.Properties.Name -contains 'id' -and
            [int64]$_.id -gt [int64]$currentSwitch -and
            [string]$_.body -match '(?m)^CONTROL_GENERATION_SWITCH_V1\s*$' -and
            [string]$_.body -match '(?m)^state:\s*SWITCH_COMMITTED\s*$'
          })
          if ($newerSwitch.Count -gt 0) { throw 'STALE: newer Control switch exists' }

          $terminal = @($all | Where-Object {
            [string]$_.body -match '(?m)^CONTROL_G10_G11_EXTERNAL_REVIEW_RETRIEVAL_RESULT_V1\s*$' -and
            [string]$_.body -match '(?m)^source_dispatch_receipt:\s*5555812210\s*$'
          })
          if ($terminal.Count -gt 0) {
            $receipt = @(
              'CONTROL_G10_G11_HERDR_REVIEW_RETRIEVAL_DELIVERY_V1',
              'state: NO_OP_EXISTING_TERMINAL',
              "source_wake_comment_id: $wakeComment",
              "source_dispatch_receipt: $dispatchReceipt",
              'second_physical_prompt: false',
              'user_relay_count: 0',
              'readback_required: true'
            ) -join "`n"
            $rid = Publish $receipt
            Write-Output "NO_OP existing terminal receipt=$rid"
            exit 0
          }

          if (Test-Path -LiteralPath $statePath) {
            $s = Get-Content -LiteralPath $statePath -Raw | ConvertFrom-Json
            if ([string]$s.status -eq 'SENT') {
              $receipt = @(
                'CONTROL_G10_G11_HERDR_REVIEW_RETRIEVAL_DELIVERY_V1',
                'state: NO_OP_DUPLICATE',
                "source_wake_comment_id: $wakeComment",
                "source_dispatch_receipt: $dispatchReceipt",
                'second_physical_prompt: false',
                'user_relay_count: 0',
                'readback_required: true'
              ) -join "`n"
              $rid = Publish $receipt
              Write-Output "NO_OP duplicate receipt=$rid"
              exit 0
            }
            if ([string]$s.status -eq 'SENDING') {
              $receipt = @(
                'CONTROL_G10_G11_HERDR_REVIEW_RETRIEVAL_DELIVERY_V1',
                'state: UNCERTAIN_SEND_NO_BLIND_RETRY',
                "source_wake_comment_id: $wakeComment",
                "source_dispatch_receipt: $dispatchReceipt",
                'second_physical_prompt: false',
                'user_relay_count: 0',
                'readback_required: true'
              ) -join "`n"
              $rid = Publish $receipt
              throw "UNCERTAIN_SEND receipt=$rid"
            }
          }

          if (-not (Test-Path -LiteralPath $herdr)) {
            $receipt = @(
              'CONTROL_G10_G11_HERDR_REVIEW_RETRIEVAL_DELIVERY_V1',
              'state: BLOCKED_PRESEND',
              "source_wake_comment_id: $wakeComment",
              "source_dispatch_receipt: $dispatchReceipt",
              'first_missing_capability: HERDR_CLI_MISSING',
              'physical_prompt_count: 0',
              'user_relay_count: 0',
              'readback_required: true'
            ) -join "`n"
            $rid = Publish $receipt
            throw "BLOCKED_PRESEND receipt=$rid"
          }

          $raw1 = (& $herdr agent list 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { throw 'BLOCKED_PRESEND: herdr agent list failed' }
          try { $list1 = $raw1 | ConvertFrom-Json } catch { throw 'BLOCKED_PRESEND: invalid herdr agent list JSON' }
          $eligible1 = @(GetEligibleCodex $list1)
          if ($eligible1.Count -ne 1) {
            $receipt = @(
              'CONTROL_G10_G11_HERDR_REVIEW_RETRIEVAL_DELIVERY_V1',
              'state: BLOCKED_PRESEND',
              "source_wake_comment_id: $wakeComment",
              "source_dispatch_receipt: $dispatchReceipt",
              "eligible_codex_count: $($eligible1.Count)",
              'first_failed_gate: FRESH_HERDR_UNIQUE_IDLE_DONE_TARGET',
              'physical_prompt_count: 0',
              'user_relay_count: 0',
              'readback_required: true'
            ) -join "`n"
            $rid = Publish $receipt
            throw "BLOCKED_PRESEND receipt=$rid"
          }
          $target = $eligible1[0]
          $pane = [string]$target.pane_id
          $session = [string]$target.agent_session.value

          $prompt = 'Read GitHub directly. Execute only D22977/gpt-browser-bridge Issue #88 dispatch receipt 5555812210 / card CONTROL-G10-G11-EXTERNAL-REVIEW-RETRIEVAL-01. GitHub is durable authority. Retrieve and durably publish only the external-review result exactly as that card authorizes. Do not execute the V2 candidate-creation workflow, do not act as Control or Reviewer, do not mutate product state, and do not use the owner human/default browser profile.'
          $promptBytes = [System.Text.Encoding]::UTF8.GetBytes($prompt)
          $promptHash = [Convert]::ToHexString([System.Security.Cryptography.SHA256]::HashData($promptBytes)).ToLowerInvariant()

          $raw2 = (& $herdr agent list 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { throw 'BLOCKED_PRESEND: second herdr agent list failed' }
          try { $list2 = $raw2 | ConvertFrom-Json } catch { throw 'BLOCKED_PRESEND: invalid second herdr agent list JSON' }
          $eligible2 = @(GetEligibleCodex $list2)
          $same = @($eligible2 | Where-Object { [string]$_.pane_id -ceq $pane -and [string]$_.agent_session.value -ceq $session })
          if ($eligible2.Count -ne 1 -or $same.Count -ne 1) {
            $receipt = @(
              'CONTROL_G10_G11_HERDR_REVIEW_RETRIEVAL_DELIVERY_V1',
              'state: BLOCKED_PRESEND',
              "source_wake_comment_id: $wakeComment",
              "source_dispatch_receipt: $dispatchReceipt",
              'first_failed_gate: SECOND_FRESH_HERDR_BINDING_MISMATCH',
              'physical_prompt_count: 0',
              'user_relay_count: 0',
              'readback_required: true'
            ) -join "`n"
            $rid = Publish $receipt
            throw "BLOCKED_PRESEND receipt=$rid"
          }

          @{ status='SENDING'; pane_id=$pane; agent_session=$session; source_wake_comment_id=$wakeComment; prompt_sha256=$promptHash; workflow_run_id=$env:GITHUB_RUN_ID; started_at=(Get-Date).ToString('o') } | ConvertTo-Json | Set-Content -LiteralPath $statePath -Encoding utf8

          $promptRaw = (& $herdr agent prompt $pane $prompt 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) {
            $receipt = @(
              'CONTROL_G10_G11_HERDR_REVIEW_RETRIEVAL_DELIVERY_V1',
              'state: UNCERTAIN_SEND_NO_BLIND_RETRY',
              "source_wake_comment_id: $wakeComment",
              "source_dispatch_receipt: $dispatchReceipt",
              "target_pane: $pane",
              "target_agent_session: $session",
              "prompt_sha256: $promptHash",
              'physical_prompt_count: UNKNOWN_AFTER_SEND_BOUNDARY',
              'user_relay_count: 0',
              "workflow_run_id: $env:GITHUB_RUN_ID",
              'readback_required: true'
            ) -join "`n"
            $rid = Publish $receipt
            throw "UNCERTAIN_SEND receipt=$rid"
          }
          try { $result = $promptRaw | ConvertFrom-Json } catch {
            $receipt = @(
              'CONTROL_G10_G11_HERDR_REVIEW_RETRIEVAL_DELIVERY_V1',
              'state: UNCERTAIN_SEND_NO_BLIND_RETRY',
              "source_wake_comment_id: $wakeComment",
              "source_dispatch_receipt: $dispatchReceipt",
              "target_pane: $pane",
              "target_agent_session: $session",
              "prompt_sha256: $promptHash",
              'first_failed_gate: POST_PROMPT_RESPONSE_NOT_JSON',
              'physical_prompt_count: UNKNOWN_AFTER_SEND_BOUNDARY',
              'user_relay_count: 0',
              "workflow_run_id: $env:GITHUB_RUN_ID",
              'readback_required: true'
            ) -join "`n"
            $rid = Publish $receipt
            throw "UNCERTAIN_SEND receipt=$rid"
          }
          if ([string]$result.result.type -cne 'agent_prompted' -or [string]$result.result.agent.pane_id -cne $pane -or [string]$result.result.agent.agent_session.value -cne $session) {
            $receipt = @(
              'CONTROL_G10_G11_HERDR_REVIEW_RETRIEVAL_DELIVERY_V1',
              'state: UNCERTAIN_SEND_NO_BLIND_RETRY',
              "source_wake_comment_id: $wakeComment",
              "source_dispatch_receipt: $dispatchReceipt",
              "target_pane: $pane",
              "target_agent_session: $session",
              "prompt_sha256: $promptHash",
              'first_failed_gate: POST_PROMPT_BINDING_MISMATCH',
              'physical_prompt_count: UNKNOWN_AFTER_SEND_BOUNDARY',
              'user_relay_count: 0',
              "workflow_run_id: $env:GITHUB_RUN_ID",
              'readback_required: true'
            ) -join "`n"
            $rid = Publish $receipt
            throw "UNCERTAIN_SEND receipt=$rid"
          }

          @{ status='SENT'; pane_id=$pane; agent_session=$session; source_wake_comment_id=$wakeComment; prompt_sha256=$promptHash; workflow_run_id=$env:GITHUB_RUN_ID; sent_at=(Get-Date).ToString('o') } | ConvertTo-Json | Set-Content -LiteralPath $statePath -Encoding utf8

          $receipt = @(
            'CONTROL_G10_G11_HERDR_REVIEW_RETRIEVAL_DELIVERY_V1',
            'state: DELIVERED',
            'decision: PASS_TRANSPORT_ONLY',
            "source_wake_comment_id: $wakeComment",
            "source_dispatch_receipt: $dispatchReceipt",
            "source_transport_authority: $transportAuthority",
            "source_current_switch: $currentSwitch",
            "target_pane: $pane",
            "target_agent_session: $session",
            "prompt_sha256: $promptHash",
            'physical_prompt_count: 1',
            'second_physical_prompt: false',
            'user_relay_count: 0',
            "workflow_run_id: $env:GITHUB_RUN_ID",
            'readback_required: true'
          ) -join "`n"
          $rid = Publish $receipt
          Write-Output "DELIVERED receipt=$rid pane=$pane session=$session"
