name: G12 Issue162 Resident Loop Repair Worker Once

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: g12-issue162-resident-loop-repair-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.event.issue.number == 162 &&
      github.event.comment.user.login == 'D22977' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, 'ISSUE162_RESIDENT_LOOP_REPAIR_WORKER_WAKE_V1')
    runs-on: [self-hosted, Windows, GBB-REVIEWER]
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh -NoProfile -File {0}
    steps:
      - name: Checkout launcher repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create one fresh named visible Herdr Codex Worker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $h='C:\Users\Lupun\AppData\Local\Programs\Herdr\bin\herdr.exe'
          $repo='D22977/gpt-browser-bridge'
          $issue=162
          $card='5645354508'
          $workerBase='20c540da6036926dbb1be687868e0a55e03bfcde'
          $workerBranch='worker/g12-issue162-resident-consumer-herdr-loop-repair-02'
          $agentName='g12-i162-resident-repair-02'
          $worktree='D:\AIWORK_WT\GPT_BROWSER_BRIDGE\g12-i162-resident-repair-02'

          $ev=Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
          $wake=[string]$ev.comment.id
          $wakeBody=[string]$ev.comment.body

          $bm=[regex]::Match($wakeBody,'(?m)^worker_base_sha:\s*([0-9a-f]{40})\s*$')
          if(-not $bm.Success){throw 'WORKER_BASE_MISSING'}
          if($bm.Groups[1].Value -cne $workerBase){throw 'WORKER_BASE_MISMATCH'}
          $lm=[regex]::Match($wakeBody,'(?m)^launcher_head_sha:\s*([0-9a-f]{40})\s*$')
          if(-not $lm.Success){throw 'LAUNCHER_HEAD_MISSING'}
          $launcherHead=$lm.Groups[1].Value
          if($launcherHead -cne $env:GITHUB_SHA){throw 'LAUNCHER_HEAD_MISMATCH'}
          $cm=[regex]::Match($wakeBody,'(?m)^source_card_receipt:\s*(\d+)\s*$')
          if(-not $cm.Success -or $cm.Groups[1].Value -ne $card){throw 'CARD_BINDING_MISMATCH'}

          if(-not(Test-Path -LiteralPath $h -PathType Leaf)){throw 'HERDR_EXE_MISSING'}
          $version=(& $h --version 2>&1 | Out-String).Trim()
          $status=(& $h status server 2>&1 | Out-String)
          if($LASTEXITCODE -ne 0 -or $status -notmatch '(?m)^status:\s*running\s*$'){throw "HERDR_SERVER_NOT_RUNNING $status"}

          if(Test-Path -LiteralPath $worktree){throw 'WORKTREE_ALREADY_EXISTS_FAIL_CLOSED'}
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $worktree) | Out-Null
          git fetch --all --prune
          if($LASTEXITCODE -ne 0){throw 'GIT_FETCH_FAILED'}
          git worktree add -b $workerBranch $worktree $workerBase
          if($LASTEXITCODE -ne 0){throw 'WORKTREE_CREATE_FAILED'}
          $actual=(git -C $worktree rev-parse HEAD).Trim()
          if($actual -cne $workerBase){throw 'WORKTREE_BASE_MISMATCH'}

          $preRaw=(& $h agent list 2>&1 | Out-String)
          if($LASTEXITCODE -ne 0){throw "HERDR_AGENT_LIST_FAILED $preRaw"}
          $pre=($preRaw | ConvertFrom-Json).result.agents
          $sameName=@($pre | Where-Object {[string]$_.name -eq $agentName})
          if($sameName.Count -ne 0){throw 'HERDR_AGENT_NAME_ALREADY_EXISTS_FAIL_CLOSED'}

          $wsRaw=(& $h workspace create --cwd $worktree --label $agentName 2>&1 | Out-String)
          if($LASTEXITCODE -ne 0){throw "HERDR_WORKSPACE_CREATE_FAILED $wsRaw"}
          $ws=$wsRaw | ConvertFrom-Json
          $pane=[string]$ws.result.root_pane.pane_id
          $workspace=[string]$ws.result.workspace.workspace_id
          if(!$workspace){$workspace=[string]$ws.result.root_pane.workspace_id}
          if(!$pane){throw 'HERDR_WORKSPACE_PANE_MISSING'}

          $startRaw=(& $h agent start $agentName --kind codex --pane $pane -- --dangerously-bypass-approvals-and-sandbox 2>&1 | Out-String)
          if($LASTEXITCODE -ne 0){throw "HERDR_AGENT_START_FAILED $startRaw"}

          $eligible=$null
          for($i=0;$i-lt 90;$i++){
            Start-Sleep -Seconds 1
            $nowRaw=(& $h agent list 2>&1 | Out-String)
            if($LASTEXITCODE -ne 0){continue}
            $now=($nowRaw | ConvertFrom-Json).result.agents
            $matches=@($now | Where-Object {
              $_.agent -eq 'codex' -and
              [string]$_.name -eq $agentName -and
              [string]$_.cwd -eq $worktree -and
              $_.agent_status -in @('idle','done')
            })
            if($matches.Count -eq 1){$eligible=$matches[0]; break}
            if($matches.Count -gt 1){throw 'HERDR_NAMED_TARGET_AMBIGUOUS'}
          }
          if($null -eq $eligible){throw 'HERDR_NAMED_TARGET_NOT_READY'}
          $pane=[string]$eligible.pane_id
          $session=[string]$eligible.agent_session.value
          if(!$pane -or !$session){throw 'HERDR_NAMED_TARGET_BINDING_MISSING'}

          $reRaw=(& $h agent list 2>&1 | Out-String)
          if($LASTEXITCODE -ne 0){throw 'HERDR_REVALIDATE_LIST_FAILED'}
          $re=($reRaw | ConvertFrom-Json).result.agents
          $again=@($re | Where-Object {
            $_.agent -eq 'codex' -and
            [string]$_.name -eq $agentName -and
            [string]$_.cwd -eq $worktree -and
            [string]$_.pane_id -eq $pane -and
            [string]$_.agent_session.value -eq $session -and
            $_.agent_status -in @('idle','done')
          })
          if($again.Count -ne 1){throw 'HERDR_NAMED_TARGET_STALE'}

          $prompt="Read GitHub directly. You are the bounded WORKER for D22977/gpt-browser-bridge Issue #162 card receipt $card (GBB-G12-ISSUE162-RESIDENT-CONSUMER-HERDR-LOOP-REPAIR-02). Rehydrate #43, #81, #88 and #162, but execute only that current card. Exact base $workerBase; required branch $workerBranch; your current worktree is $worktree. BEFORE any tracked mutation publish and read back exactly one GBB_ISSUE162_RESIDENT_LOOP_REPAIR_WORKER_CONSUMED_STARTED_V1 bound to card $card, exact base/branch and your current Herdr name/pane/session. Then implement only the allowed paths and requirements: port minimum #103 herdr_resume seam, restore #62 resident/restart-safe consumer semantics, named Herdr target resolution at send time with revalidation, Actions not normal poller, no semantic Control, no formal review, no permanent Scheduled Task deployment. Run focused + relevant regression tests, push/read-back exact candidate, publish/read-back GBB_ISSUE162_RESIDENT_LOOP_REPAIR_WORKER_RESULT_V1 as READY_FOR_FRESH_REVIEW, BLOCKED or CONTROL_REQUIRED, then park. No merge/release/MEP/product mutation."
          $sent=(& $h agent prompt $agentName $prompt 2>&1 | Out-String)
          if($LASTEXITCODE -ne 0){throw "HERDR_WORKER_PROMPT_FAILED $sent"}

          $headers=@{Authorization="Bearer $env:GH_TOKEN";'User-Agent'='g12-issue162-resident-loop-repair';Accept='application/vnd.github+json'}
          $started=$null
          for($i=0;$i-lt 120;$i++){
            Start-Sleep -Seconds 3
            $comments=Invoke-RestMethod "https://api.github.com/repos/$repo/issues/$issue/comments?per_page=100&page=1" -Headers $headers -Method Get -TimeoutSec 30
            $started=@($comments | Where-Object {
              [string]$_.body -match '(?m)^GBB_ISSUE162_RESIDENT_LOOP_REPAIR_WORKER_CONSUMED_STARTED_V1\s*$' -and
              [string]$_.body -match "(?m)^source_card_receipt:\s*$card\s*$" -and
              [string]$_.body -match "(?m)^worker_base_sha:\s*$workerBase\s*$" -and
              [string]$_.body -match "(?m)^required_worker_branch:\s*$([regex]::Escape($workerBranch))\s*$"
            } | Select-Object -Last 1)
            if($started.Count -eq 1){break}
          }

          $state=if($started.Count -eq 1){'WORKER_CONSUMED_STARTED_OBSERVED'}else{'UNCERTAIN_SEND_NO_BLIND_RETRY'}
          $startedId=if($started.Count -eq 1){[string]$started[0].id}else{''}
          $body="GBB_ISSUE162_RESIDENT_LOOP_REPAIR_TRANSPORT_RESULT_V1`nstate: $state`nsource_card_receipt: $card`nsource_wake: $wake`nworker_base_sha: $workerBase`nlauncher_head_sha: $launcherHead`nrequired_worker_branch: $workerBranch`nherdr_version: $version`nherdr_agent_name: $agentName`nherdr_workspace_id: $workspace`nherdr_pane_id: $pane`nherdr_agent_session: $session`nworktree: $worktree`nphysical_prompt_count: 1`nworker_consumed_started_receipt: $startedId`nnormal_loop_uses_actions: false`nold_wake_retry: false`nuser_relay_count: 0`nworkflow_run_id: $env:GITHUB_RUN_ID`nreadback_required: true"
          $payload=@{body=$body}|ConvertTo-Json -Compress
          $r=Invoke-RestMethod "https://api.github.com/repos/$repo/issues/$issue/comments" -Headers $headers -Method Post -Body $payload -ContentType 'application/json' -TimeoutSec 30
          $rb=Invoke-RestMethod "https://api.github.com/repos/$repo/issues/comments/$($r.id)" -Headers $headers -Method Get -TimeoutSec 30
          if([string]$rb.body -cne $body){throw 'TRANSPORT_RESULT_READBACK_MISMATCH'}
          if($state -ne 'WORKER_CONSUMED_STARTED_OBSERVED'){throw 'WORKER_CONSUMPTION_NOT_OBSERVED_NO_RETRY'}
