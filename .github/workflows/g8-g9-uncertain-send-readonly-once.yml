name: G8 G9 Uncertain Send Readonly Resolver

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: g8-g9-uncertain-readonly-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  resolve:
    if: >-
      github.event.issue.number == 88 &&
      github.event.comment.user.login == 'D22977' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, 'CONTROL_G8_G9_UNCERTAIN_SEND_READONLY_EVENT_V1')
    runs-on: [self-hosted, Windows, GBB-REVIEWER]
    timeout-minutes: 8
    defaults:
      run:
        shell: pwsh -NoProfile -File {0}
    steps:
      - name: Read exact 009 with existing Watcher only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $event=Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw|ConvertFrom-Json
          $body=[string]$event.comment.body
          if($event.repository.full_name -cne 'D22977/gpt-browser-bridge' -or [int]$event.issue.number -ne 88){throw 'Wrong repo/issue'}
          if($event.comment.user.login -cne 'D22977' -or $event.comment.author_association -cne 'OWNER'){throw 'Wrong actor'}
          if($body -notmatch '(?m)^source_readonly_authority:\s*5509885912\s*$'){throw 'Wrong readonly authority'}
          if($body -notmatch '(?m)^source_uncertain_send_receipt:\s*5509819987\s*$'){throw 'Wrong uncertain receipt'}
          if($body -notmatch '(?m)^source_candidate_binding:\s*5495537900\s*$'){throw 'Wrong candidate binding'}
          $targetId='6a957d5b-19e8-83e8-9925-3343facccaf3'
          $repoRoot='D:\AIWORK\GPT_BROWSER_BRIDGE'
          $watcher=Join-Path $repoRoot 'src\gpt_watch.mjs'
          $expectedWatcherBlob='329acccdc2f50980fcca6d70f2950e4cd72e7354'
          $session='HERDR-DOORBELL-DB01-G1-20260816'
          if($env:RUNNER_NAME -cne 'gbb-reviewer-win-01' -or -not [Environment]::UserInteractive){throw 'Runner identity/interactivity mismatch'}
          if(-not(Test-Path -LiteralPath $watcher)){throw 'Watcher missing'}
          $actual=(& git -C $repoRoot hash-object -- 'src/gpt_watch.mjs').Trim();if($actual -cne $expectedWatcherBlob){throw "Watcher blob mismatch $actual"}
          $env:GBB_WATCHER=$watcher;$env:GBB_SESSION=$session;$env:GBB_TARGET_ID=$targetId
          $outPath=Join-Path $env:RUNNER_TEMP "g8-g9-uncertain-readonly-$env:GITHUB_RUN_ID.json";$env:GBB_OUT=$outPath
          $nodePath=Join-Path $env:RUNNER_TEMP "g8-g9-uncertain-readonly-$env:GITHUB_RUN_ID.mjs"
          $node=@'
          import {pathToFileURL} from 'node:url';
          import {createHash} from 'node:crypto';
          import fs from 'node:fs';
          const w=await import(pathToFileURL(process.env.GBB_WATCHER).href);
          const session=process.env.GBB_SESSION,target=process.env.GBB_TARGET_ID;
          const rawTabs=await w.runCliCommand('tab-list',[],{session});
          const tabs=w.parseTabList(rawTabs);
          const matches=tabs.filter(t=>String(t?.url||'').toLowerCase().includes(`/c/${target.toLowerCase()}`));
          if(matches.length!==1) throw new Error(`EXACT_009_TAB_COUNT_${matches.length}`);
          await w.runCliCommand('tab-select',[String(matches[0].index)],{session});
          const data=await w.runCliCommand('eval',[w.READONLY_SNAPSHOT_SCRIPT],{session});
          if(!String(data?.url||'').toLowerCase().includes(`/c/${target.toLowerCase()}`)) throw new Error('VERIFY_URL_MISMATCH');
          const ax=await w.runCliCommand('snapshot',[],{session});
          const axText=typeof ax==='string'?ax:JSON.stringify(ax);
          const markers=['5509780443','5501107432','5495537900'];
          const assistants=Array.isArray(data?.assistantMessages)?data.assistantMessages:[];
          const assistantText=assistants.join('\n');
          const assistantMarker=markers.some(m=>assistantText.includes(m));
          const markerLines=[];
          const lines=axText.split(/\r?\n/);
          for(let i=0;i<lines.length;i++) if(markers.some(m=>lines[i].includes(m))){markerLines.push(lines.slice(Math.max(0,i-3),Math.min(lines.length,i+4)).join('\n'));}
          const ctx=markerLines.join('\n---\n');
          const editorMarker=/textbox|multiline|prompt-textarea|message chatgpt/i.test(ctx) && markers.some(m=>ctx.includes(m));
          const submittedMarker=markers.some(m=>axText.includes(m)) && !editorMarker;
          const last=assistants.length?assistants[assistants.length-1]:'';
          const lastHash=createHash('sha256').update(last,'utf8').digest('hex');
          let decision='INDETERMINATE';
          if(assistantMarker||submittedMarker) decision='DELIVERY_OBSERVED';
          else if(editorMarker&&!assistantMarker) decision='UNSENT_EDITOR_ONLY';
          fs.writeFileSync(process.env.GBB_OUT,JSON.stringify({decision,assistant_count:assistants.length,last_assistant_hash:lastHash,stopVisible:Boolean(data?.stopVisible),continueVisible:Boolean(data?.continueVisible),loginWall:Boolean(data?.loginWall),networkError:Boolean(data?.networkError),assistant_marker:assistantMarker,editor_marker:editorMarker,submitted_marker:submittedMarker,marker_occurrence_count:markerLines.length,url:String(data?.url||'')}),'utf8');
          '@
          Set-Content -LiteralPath $nodePath -Value $node -Encoding utf8
          try{& node $nodePath;if($LASTEXITCODE -ne 0){throw "Readonly watcher exit=$LASTEXITCODE"};$r=Get-Content -LiteralPath $outPath -Raw|ConvertFrom-Json}finally{Remove-Item $nodePath,$outPath -Force -ErrorAction SilentlyContinue}
          $headers=@{Authorization="Bearer $env:GH_TOKEN";'User-Agent'='g8-g9-uncertain-readonly';Accept='application/vnd.github+json'}
          $text=@('CONTROL_G8_G9_UNCERTAIN_SEND_READONLY_RESULT_V1','state: PASS_READONLY_OBSERVATION',"decision: $($r.decision)",'source_readonly_authority: 5509885912','source_uncertain_send_receipt: 5509819987','source_candidate_binding: 5495537900',"source_event_comment_id: $($event.comment.id)","target_conversation_id: $targetId","assistant_count: $($r.assistant_count)","last_assistant_hash: $($r.last_assistant_hash)","stop_visible: $([string]$r.stopVisible).ToLower()","continue_visible: $([string]$r.continueVisible).ToLower()","login_wall: $([string]$r.loginWall).ToLower()","network_error: $([string]$r.networkError).ToLower()","assistant_marker: $([string]$r.assistant_marker).ToLower()","editor_marker: $([string]$r.editor_marker).ToLower()","submitted_marker: $([string]$r.submitted_marker).ToLower()","marker_occurrence_count: $($r.marker_occurrence_count)",'browser_content_write_performed: false','second_send_performed: false','raw_conversation_text_published: false','user_relay_count: 0','readback_required: true') -join "`n"
          $payload=@{body=$text}|ConvertTo-Json -Compress
          $pub=Invoke-RestMethod -Uri 'https://api.github.com/repos/D22977/gpt-browser-bridge/issues/88/comments' -Headers $headers -Method Post -Body $payload -ContentType 'application/json' -TimeoutSec 30
          $rb=Invoke-RestMethod -Uri "https://api.github.com/repos/D22977/gpt-browser-bridge/issues/comments/$($pub.id)" -Headers $headers -Method Get -TimeoutSec 30
          if([string]$rb.body -cne $text){throw 'Result readback mismatch'}
          Write-Output "readonly resolution PASS receipt=$($pub.id) decision=$($r.decision)"
