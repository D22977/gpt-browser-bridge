name: G10 G11 Unattended Composer Repair V35

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: g10-g11-unattended-composer-repair-v35
  cancel-in-progress: false

jobs:
  worker-repair:
    if: >-
      github.event.issue.number == 88 &&
      github.event.comment.user.login == 'D22977' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, 'CONTROL_G10_G11_UNATTENDED_COMPOSER_REPAIR_WAKE_V35')
    runs-on: [self-hosted, Windows, GBB-REVIEWER]
    timeout-minutes: 90
    outputs:
      terminal_id: ${{ steps.worker.outputs.terminal_id }}
      candidate_head: ${{ steps.worker.outputs.candidate_head }}
      worker_branch: ${{ steps.worker.outputs.worker_branch }}
    defaults:
      run:
        shell: node {0}
    steps:
      - id: worker
        name: Deliver one Repair04 Worker and guard exact READY
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import {spawnSync} from 'node:child_process';
          const repo='D22977/gpt-browser-bridge', issue=88;
          const authority='5557917724', cardReceipt='5557911737', adjudication='5557909024';
          const cardId='GBB-UNATTENDED-COMPOSER-SENDER-REPAIR-04';
          const base='43245ea7eb090f1769d3694b6695e59d9352408d';
          const branch='worker/g10-g11-unattended-composer-sender-repair-04';
          const expectedSwitch='5555495204', expectedGeneration='010', expectedConversation='6a9c2234-f4b4-83ee-ba4b-82c3ee3a2562';
          const allowed=new Set(['src/gpt_send.mjs','.github/workflows/g10-g11-ready-return-control-doorbell-v2.yml','tests/baseline.test.mjs']);
          const herdr='C:\\Users\\Lupun\\AppData\\Local\\Programs\\Herdr\\bin\\herdr.exe';
          const stateDir='D:\\AIWORK_RUNTIME\\GPT_BROWSER_BRIDGE\\g10-g11-unattended-composer-v35';
          const stateFile=path.join(stateDir,'repair04-send.json');
          fs.mkdirSync(stateDir,{recursive:true});
          const token=process.env.GH_TOKEN, sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function api(route,init={}){const r=await fetch(`https://api.github.com/repos/${repo}${route}`,{...init,headers:{Authorization:`Bearer ${token}`,Accept:'application/vnd.github+json','User-Agent':'g10-g11-v35-worker',...(init.headers||{})}});const t=await r.text();if(!r.ok)throw new Error(`GitHub ${r.status} ${route}: ${t}`);if(!t)return null;try{return JSON.parse(t)}catch{return t}}
          const first=b=>String(b||'').split(/\r?\n/,1)[0].trim();
          const line=(b,k)=>{const m=String(b||'').match(new RegExp(`^${k}:\\s*(.*?)\\s*$`,'m'));return m?m[1]:null};
          async function comment(id){const c=await api(`/issues/comments/${id}`);if(!Number.isSafeInteger(c?.id)||!String(c.issue_url||'').endsWith('/issues/88')||typeof c.body!=='string')throw new Error(`comment ${id} malformed`);return c}
          async function recent(since){const out=[];for(let p=1;p<=50;p++){const xs=await api(`/issues/88/comments?since=${encodeURIComponent(since)}&per_page=100&page=${p}`);if(!Array.isArray(xs))throw new Error('comments not array');for(const c of xs){if(!Number.isSafeInteger(c?.id)||typeof c.body!=='string')throw new Error('comment shape malformed');out.push(c)}if(xs.length<100)break}return out}
          async function verifyAuthority(){const [sw,card,adj,auth]=await Promise.all([comment(expectedSwitch),comment(cardReceipt),comment(adjudication),comment(authority)]);if(first(sw.body)!=='CONTROL_GENERATION_SWITCH_V1'||line(sw.body,'state')!=='SWITCH_COMMITTED'||line(sw.body,'new_generation')!==expectedGeneration||line(sw.body,'new_conversation_id')!==expectedConversation||line(sw.body,'new_status')!=='ACTIVE')throw new Error('current switch mismatch');if(first(card.body)!=='DISPATCH_CARD_V1'||line(card.body,'card_id')!==cardId)throw new Error('card mismatch');if(first(adj.body)!=='CONTROL_G10_G11_UNATTENDED_E2E_COMPOSER_ADJUDICATION_V1')throw new Error('adjudication mismatch');if(first(auth.body)!=='CONTROL_G10_G11_UNATTENDED_COMPOSER_SPLIT_TRANSPORT_AUTHORITY_V35'||line(auth.body,'state')!=='AUTHORIZED')throw new Error('transport authority mismatch');for(const c of await recent(sw.created_at)){if(String(c.id)===expectedSwitch||first(c.body)!=='CONTROL_GENERATION_SWITCH_V1')continue;if(BigInt(c.id)>BigInt(expectedSwitch))throw new Error(`newer switch evidence ${c.id}`)}return sw}
          async function publish(body){const x=await api(`/issues/${issue}/comments`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({body})});const rb=await comment(String(x.id));if(rb.body!==body)throw new Error('receipt readback mismatch');return String(x.id)}
          function herdrJson(args){const r=spawnSync(herdr,args,{encoding:'utf8',windowsHide:true,maxBuffer:8*1024*1024});if(r.error||r.status!==0)throw new Error(`Herdr failed: ${r.error?.message||r.stderr||r.stdout}`);return JSON.parse(String(r.stdout||'').trim())}
          function genericWorkers(list){const a=Array.isArray(list?.result?.agents)?list.result.agents:[];return a.filter(x=>x&&x.agent==='codex'&&['idle','done'].includes(String(x.agent_status))&&!String(x.name||'').trim()&&String(x.cwd)==='C:\\WINDOWS\\system32')}
          function exactAgent(list,pane,session){const a=Array.isArray(list?.result?.agents)?list.result.agents:[];return a.filter(x=>x&&String(x.pane_id)===pane&&String(x?.agent_session?.value)===session)}
          function normalizeParent(body){const vals=[line(body,'candidate_parent'),line(body,'parent_head'),line(body,'base_exact')].filter(Boolean);if(!vals.length)throw new Error('candidate parent missing');if(vals.some(v=>v!==base))throw new Error(`candidate parent mismatch ${vals.join(',')}`);return base}
          const event=JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH,'utf8')), wake=String(event?.comment?.body||'');
          if(first(wake)!=='CONTROL_G10_G11_UNATTENDED_COMPOSER_REPAIR_WAKE_V35'||line(wake,'source_transport_authority')!==authority||line(wake,'source_repair_card')!==cardReceipt||line(wake,'source_adjudication')!==adjudication||line(wake,'source_current_switch')!==expectedSwitch)throw new Error('wake binding mismatch');
          await verifyAuthority();
          if(fs.existsSync(stateFile)){const s=JSON.parse(fs.readFileSync(stateFile,'utf8'));if(s.status==='SENDING')throw new Error('UNCERTAIN_WORKER_SEND_NO_BLIND_RETRY');if(s.status==='SENT')throw new Error('NO_OP_DUPLICATE_WORKER_SEND')}
          const inv=herdrJson(['agent','list']), eligible=genericWorkers(inv);if(eligible.length!==1)throw new Error(`GENERIC_WORKER_COUNT_${eligible.length}`);const pane=String(eligible[0].pane_id||''), session=String(eligible[0]?.agent_session?.value||'');if(!pane||!session)throw new Error('worker binding missing');
          await verifyAuthority();
          const prompt='Read GitHub directly. Execute only D22977/gpt-browser-bridge Issue #88 card 5557911737 / GBB-UNATTENDED-COMPOSER-SENDER-REPAIR-04 as WORKER. Base exact 43245ea7eb090f1769d3694b6695e59d9352408d. Modify only the three allowed paths, perform only the card-authorized no-send live composer diagnostic, push worker/g10-g11-unattended-composer-sender-repair-04, publish/read-back GBB_UNATTENDED_COMPOSER_SENDER_REPAIR04_READY_V1, then stop. Never click/press/submit a Control message during diagnostic. Do not act as Control/Reviewer and do not create/send generation011.';
          const promptHash=crypto.createHash('sha256').update(prompt).digest('hex');fs.writeFileSync(stateFile,JSON.stringify({status:'SENDING',pane,session,prompt_hash:promptHash}));
          let sent;try{sent=herdrJson(['agent','prompt',pane,prompt])}catch{throw new Error('UNCERTAIN_WORKER_SEND_NO_BLIND_RETRY')}if(String(sent?.result?.type)!=='agent_prompted'||String(sent?.result?.agent?.pane_id)!==pane||String(sent?.result?.agent?.agent_session?.value)!==session)throw new Error('UNCERTAIN_WORKER_SEND_NO_BLIND_RETRY');
          const delivery=await publish(['CONTROL_G10_G11_UNATTENDED_COMPOSER_REPAIR04_V35_DELIVERY_V1','state: DELIVERED',`source_repair_card: ${cardReceipt}`,`target_pane: ${pane}`,`target_agent_session: ${session}`,`prompt_sha256: ${promptHash}`,'physical_worker_prompt_count: 1','second_physical_prompt: false','post_dispatch_terminal_guard: ACTIVE','user_relay_count: 0',`workflow_run_id: ${process.env.GITHUB_RUN_ID}`,'readback_required: true'].join('\n'));fs.writeFileSync(stateFile,JSON.stringify({status:'SENT',delivery,pane,session}));
          let terminal=null,idle=0;const guardSince=String(event?.comment?.created_at||new Date().toISOString());
          for(let n=0;n<320;n++){await verifyAuthority();const matches=(await recent(guardSince)).filter(c=>first(c.body)==='GBB_UNATTENDED_COMPOSER_SENDER_REPAIR04_READY_V1'&&line(c.body,'card_id')===cardId);if(matches.length>1)throw new Error('multiple Repair04 terminals');if(matches.length===1){terminal=matches[0];break}const now=herdrJson(['agent','list']), ex=exactAgent(now,pane,session);if(ex.length!==1)throw new Error('bound Worker disappeared');idle=['idle','done'].includes(String(ex[0].agent_status))?idle+1:0;if(idle>=6)throw new Error('Repair04 terminal missing after Worker idle/done');await sleep(15000)}
          if(!terminal)throw new Error('Repair04 terminal timeout');if(line(terminal.body,'state')!=='READY_FOR_CONTROL_CANARY')throw new Error(`Repair04 terminal=${line(terminal.body,'state')}`);normalizeParent(terminal.body);const head=line(terminal.body,'candidate_head');const wb=line(terminal.body,'worker_branch')||line(terminal.body,'branch');if(!/^[0-9a-f]{40}$/.test(head||'')||wb!==branch||line(terminal.body,'selected_return_mechanism')!=='WORKFLOW_DISPATCH')throw new Error('Repair04 READY binding invalid');
          const ref=await api(`/git/ref/heads/${branch}`);if(String(ref?.object?.sha)!==head)throw new Error('remote branch/head mismatch');const commit=await api(`/commits/${head}`);if(String(commit?.parents?.[0]?.sha)!==base)throw new Error('remote parent mismatch');const cmp=await api(`/compare/${base}...${head}`);const files=Array.isArray(cmp?.files)?cmp.files.map(f=>String(f.filename)):[];if(!files.length||files.some(f=>!allowed.has(f)))throw new Error(`changed paths invalid: ${files.join(',')}`);
          const sender=await api(`/contents/src/gpt_send.mjs?ref=${head}`), wf=await api(`/contents/.github/workflows/g10-g11-ready-return-control-doorbell-v2.yml?ref=${head}`);if(!/^[0-9a-f]{40}$/.test(String(sender?.sha||''))||!wf?.content)throw new Error('remote blob readback missing');const wfText=Buffer.from(String(wf.content).replace(/\n/g,''),'base64').toString('utf8');if(!wfText.includes(String(sender.sha))||!wfText.includes(cardId)||!wfText.includes('GBB_UNATTENDED_COMPOSER_SENDER_REPAIR04_READY_V1'))throw new Error('workflow sender/card/terminal binding missing');
          await publish(['CONTROL_G10_G11_UNATTENDED_COMPOSER_REPAIR04_V35_WORKER_STAGE_V1','state: READY_AND_LOCAL_RUNNER_RELEASE_PENDING',`source_terminal_receipt: ${terminal.id}`,`candidate_head: ${head}`,`candidate_parent: ${base}`,`worker_branch: ${branch}`,`sender_blob_sha: ${sender.sha}`,`changed_paths_exact: ${files.join(',')}`,'physical_worker_prompt_count: 1','user_relay_count: 0',`workflow_run_id: ${process.env.GITHUB_RUN_ID}`,'readback_required: true'].join('\n'));
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`terminal_id=${terminal.id}\ncandidate_head=${head}\nworker_branch=${branch}\n`);

  doorbell-guard:
    needs: worker-repair
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: node {0}
    steps:
      - name: Dispatch repaired candidate and guard exact downstream terminal
        env:
          GH_TOKEN: ${{ github.token }}
          TERMINAL_ID: ${{ needs.worker-repair.outputs.terminal_id }}
          CANDIDATE_HEAD: ${{ needs.worker-repair.outputs.candidate_head }}
          WORKER_BRANCH: ${{ needs.worker-repair.outputs.worker_branch }}
        run: |
          const repo='D22977/gpt-browser-bridge', issue=88, cardId='GBB-UNATTENDED-COMPOSER-SENDER-REPAIR-04';
          const expectedSwitch='5555495204', expectedGeneration='010', expectedConversation='6a9c2234-f4b4-83ee-ba4b-82c3ee3a2562', expectedUrl='https://chatgpt.com/c/6a9c2234-f4b4-83ee-ba4b-82c3ee3a2562';
          const base='43245ea7eb090f1769d3694b6695e59d9352408d', terminal=String(process.env.TERMINAL_ID||''), head=String(process.env.CANDIDATE_HEAD||''), branch=String(process.env.WORKER_BRANCH||'');
          const token=process.env.GH_TOKEN, sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function api(route,init={}){const r=await fetch(`https://api.github.com/repos/${repo}${route}`,{...init,headers:{Authorization:`Bearer ${token}`,Accept:'application/vnd.github+json','User-Agent':'g10-g11-v35-guard',...(init.headers||{})}});const t=await r.text();if(!r.ok)throw new Error(`GitHub ${r.status} ${route}: ${t}`);if(!t)return null;try{return JSON.parse(t)}catch{return t}}
          const first=b=>String(b||'').split(/\r?\n/,1)[0].trim();const line=(b,k)=>{const m=String(b||'').match(new RegExp(`^${k}:\\s*(.*?)\\s*$`,'m'));return m?m[1]:null};
          async function comment(id){const c=await api(`/issues/comments/${id}`);if(!Number.isSafeInteger(c?.id)||!String(c.issue_url||'').endsWith('/issues/88')||typeof c.body!=='string')throw new Error(`comment ${id} malformed`);return c}
          async function recent(since){const out=[];for(let p=1;p<=50;p++){const xs=await api(`/issues/88/comments?since=${encodeURIComponent(since)}&per_page=100&page=${p}`);if(!Array.isArray(xs))throw new Error('comments not array');for(const c of xs){if(!Number.isSafeInteger(c?.id)||typeof c.body!=='string')throw new Error('comment shape malformed');out.push(c)}if(xs.length<100)break}return out}
          async function verifyAuthority(){const sw=await comment(expectedSwitch);if(first(sw.body)!=='CONTROL_GENERATION_SWITCH_V1'||line(sw.body,'state')!=='SWITCH_COMMITTED'||line(sw.body,'new_generation')!==expectedGeneration||line(sw.body,'new_conversation_id')!==expectedConversation||line(sw.body,'new_conversation_url')!==expectedUrl||line(sw.body,'new_status')!=='ACTIVE')throw new Error('current switch mismatch');for(const c of await recent(sw.created_at)){if(String(c.id)===expectedSwitch||first(c.body)!=='CONTROL_GENERATION_SWITCH_V1')continue;if(BigInt(c.id)>BigInt(expectedSwitch))throw new Error(`newer switch evidence ${c.id}`)}return sw}
          async function publish(body){const x=await api(`/issues/${issue}/comments`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({body})});const rb=await comment(String(x.id));if(rb.body!==body)throw new Error('receipt readback mismatch');return String(x.id)}
          await verifyAuthority();const tc=await comment(terminal);if(first(tc.body)!=='GBB_UNATTENDED_COMPOSER_SENDER_REPAIR04_READY_V1'||line(tc.body,'state')!=='READY_FOR_CONTROL_CANARY'||line(tc.body,'card_id')!==cardId||line(tc.body,'candidate_head')!==head||line(tc.body,'selected_return_mechanism')!=='WORKFLOW_DISPATCH')throw new Error('terminal binding mismatch');const ref=await api(`/git/ref/heads/${branch}`);if(String(ref?.object?.sha)!==head)throw new Error('branch/head mismatch');const commit=await api(`/commits/${head}`);if(String(commit?.parents?.[0]?.sha)!==base)throw new Error('candidate parent mismatch');
          await verifyAuthority();const dispatchBody={ref:branch,inputs:{source_terminal_receipt:terminal,source_card_id:cardId,candidate_head:head,idempotency_key:`${cardId}:${terminal}:${head}`}};await api('/actions/workflows/g10-g11-ready-return-control-doorbell-v2.yml/dispatches',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(dispatchBody)});const dispatchedAt=new Date().toISOString();
          await publish(['CONTROL_G10_G11_UNATTENDED_COMPOSER_V35_CANARY_DISPATCH_V1','state: DISPATCHED',`source_terminal_receipt: ${terminal}`,`source_card_id: ${cardId}`,`candidate_head: ${head}`,`candidate_branch: ${branch}`,'post_dispatch_terminal_guard: ACTIVE','physical_control_send_before_candidate: 0','user_relay_count: 0',`workflow_run_id: ${process.env.GITHUB_RUN_ID}`,'readback_required: true'].join('\n'));
          let canary=null;for(let n=0;n<300;n++){await verifyAuthority();const matches=(await recent(dispatchedAt)).filter(c=>first(c.body)==='CONTROL_UNATTENDED_RETURN_DOORBELL_CANARY_V1'&&line(c.body,'source_terminal_receipt')===terminal&&line(c.body,'source_card_id')===cardId&&line(c.body,'candidate_head')===head);if(matches.length>1)throw new Error('multiple downstream canary terminals');if(matches.length===1){canary=matches[0];break}await sleep(3000)}if(!canary)throw new Error('downstream canary timeout');const state=line(canary.body,'state'), physical=line(canary.body,'physical_send_count')||'UNKNOWN', second=line(canary.body,'second_physical_send')||'UNKNOWN', relay=line(canary.body,'user_relay_count')||'UNKNOWN', sw=line(canary.body,'active_switch_receipt'), gen=line(canary.body,'target_control_generation'), conv=line(canary.body,'target_control_conversation_id'), url=line(canary.body,'target_control_conversation_url');
          const pass=state==='DELIVERED'&&physical==='1'&&second==='false'&&relay==='0'&&sw===expectedSwitch&&gen===expectedGeneration&&conv===expectedConversation&&url===expectedUrl;const result=['CONTROL_G10_G11_UNATTENDED_E2E_RESULT_V1',`state: ${pass?'PASS':'CONTROL_REQUIRED'}`,`source_terminal_receipt: ${terminal}`,`source_card_id: ${cardId}`,`candidate_head: ${head}`,`downstream_canary_receipt: ${canary.id}`,`downstream_state: ${state}`,`active_switch_receipt: ${sw||'NONE'}`,`target_control_generation: ${gen||'NONE'}`,`target_control_conversation_id: ${conv||'NONE'}`,`physical_control_send_count: ${physical}`,`second_physical_control_send: ${second}`,`user_relay_count: ${relay}`,`exact_control_wake: ${pass?'PASS':'NOT_PASS'}`,`unattended_e2e: ${pass?'PASS':'NOT_PASS'}`,`workflow_run_id: ${process.env.GITHUB_RUN_ID}`,'readback_required: true'].join('\n');await publish(result);if(!pass)throw new Error(`downstream ${state} did not satisfy PASS boundary`);
