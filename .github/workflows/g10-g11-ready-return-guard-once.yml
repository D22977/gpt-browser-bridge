name: G10 G11 Ready Return Guard Once

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: g10-g11-ready-return-guard-20260906
  cancel-in-progress: false

jobs:
  guarded-worker:
    if: >-
      github.event.issue.number == 88 &&
      github.event.comment.user.login == 'D22977' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, 'CONTROL_G10_G11_READY_RETURN_GUARD_WAKE_V1')
    runs-on: [self-hosted, Windows, GBB-REVIEWER]
    timeout-minutes: 330
    defaults:
      run:
        shell: pwsh -NoProfile -File {0}
    steps:
      - name: Deliver Worker once and retain terminal guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = 'D22977/gpt-browser-bridge'
          $issue = 88
          $cardReceipt = '5556156612'
          $cardId = 'GBB-READY-RETURN-CLOSURE-01'
          $transportAuthority = '5556161960'
          $expectedSwitch = '5555495204'
          $expectedBase = '0be95a2e58b150df043a0e4eb07765475d284834'
          $baseBranch = 'review-base/gbb-gh-01'
          $expectedSenderBlob = '6b7a523f98a9655ba2ca28f42696b80da365c92b'
          $herdr = 'C:\Users\Lupun\AppData\Local\Programs\Herdr\bin\herdr.exe'
          $stateRoot = 'D:\AIWORK_RUNTIME\GPT_BROWSER_BRIDGE\g10-g11-ready-return-guard\state'
          $workerStatePath = Join-Path $stateRoot 'GBB-READY-RETURN-CLOSURE-01-20260906.json'
          New-Item -ItemType Directory -Force -Path $stateRoot | Out-Null
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; 'User-Agent' = 'g10-g11-ready-return-guard'; Accept = 'application/vnd.github+json' }

          function Publish([string]$text) {
            $payload = @{ body = $text } | ConvertTo-Json -Compress
            $r = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/issues/$issue/comments" -Headers $headers -Method Post -Body $payload -ContentType 'application/json' -TimeoutSec 30
            $rb = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/issues/comments/$($r.id)" -Headers $headers -Method Get -TimeoutSec 30
            if ([string]$rb.body -cne $text) { throw 'durable readback mismatch' }
            return [string]$r.id
          }

          function Get-All88 {
            $all = [System.Collections.Generic.List[object]]::new()
            function Add-Flat([object]$v) {
              if ($null -eq $v) { return }
              if ($v -is [System.Array]) { foreach ($x in $v) { Add-Flat $x }; return }
              [void]$all.Add($v)
            }
            for ($p=1; $p -le 40; $p++) {
              $before = $all.Count
              Add-Flat (Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/issues/88/comments?per_page=100&page=$p" -Headers $headers -Method Get -TimeoutSec 30)
              if (($all.Count - $before) -lt 100) { break }
            }
            return $all.ToArray()
          }

          function Get-CurrentSwitch {
            $all = @(Get-All88)
            $switches = @($all | Where-Object {
              [string]$_.body -match '(?m)^CONTROL_GENERATION_SWITCH_V1\s*$' -and
              [string]$_.body -match '(?m)^state:\s*SWITCH_COMMITTED\s*$'
            } | Sort-Object { [int64]$_.id })
            if ($switches.Count -eq 0) { throw 'No committed Control switch found' }
            $latest = $switches[-1]
            $b = [string]$latest.body
            $g = [regex]::Match($b, '(?m)^new_generation:\s*(\d{3})\s*$')
            $id = [regex]::Match($b, '(?m)^new_conversation_id:\s*([0-9a-f-]+)\s*$')
            $url = [regex]::Match($b, '(?m)^new_conversation_url:\s*(https://chatgpt\.com/(?:g/[A-Za-z0-9._-]+/)?c/[0-9a-f-]+)\s*$')
            $s1 = [regex]::Match($b, '(?m)^new_status:\s*([A-Z_]+)\s*$')
            $s2 = [regex]::Match($b, '(?m)^new_generation_status:\s*([A-Z_]+)\s*$')
            if (-not ($g.Success -and $id.Success -and $url.Success)) { throw "Latest switch malformed id=$($latest.id)" }
            if (-not $s1.Success -and -not $s2.Success) { throw "Latest switch missing status id=$($latest.id)" }
            if ($s1.Success -and $s2.Success -and $s1.Groups[1].Value -cne $s2.Groups[1].Value) { throw "Latest switch conflicting status id=$($latest.id)" }
            $status = if ($s1.Success) { $s1.Groups[1].Value } else { $s2.Groups[1].Value }
            if ($status -cne 'ACTIVE') { throw "Latest switch not ACTIVE id=$($latest.id) status=$status" }
            return [pscustomobject]@{ Receipt=[string]$latest.id; Generation=$g.Groups[1].Value; ConversationId=$id.Groups[1].Value; ConversationUrl=$url.Groups[1].Value }
          }

          function Verify-Base-And-Authority {
            foreach ($cid in @($cardReceipt,$transportAuthority,$expectedSwitch)) {
              $c = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/issues/comments/$cid" -Headers $headers -Method Get -TimeoutSec 30
              if ([string]$c.issue_url -notmatch '/issues/88$') { throw "authority issue mismatch $cid" }
            }
            $encoded = [uri]::EscapeDataString($baseBranch)
            $branch = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/branches/$encoded" -Headers $headers -Method Get -TimeoutSec 30
            if ([string]$branch.commit.sha -cne $expectedBase) { throw "base head changed expected=$expectedBase actual=$($branch.commit.sha)" }
            $sw = Get-CurrentSwitch
            if ($sw.Receipt -cne $expectedSwitch -or $sw.Generation -cne '010') { throw "current switch superseded receipt=$($sw.Receipt) gen=$($sw.Generation)" }
            return $sw
          }

          function Publish-PresendBlocked([string]$gate,[string]$detail='') {
            $safe = ($detail -replace '[\r\n]+',' ')
            if ($safe.Length -gt 500) { $safe=$safe.Substring(0,500) }
            $rid = Publish (@('CONTROL_G10_G11_READY_RETURN_GUARD_DELIVERY_V1','state: BLOCKED_PRESEND',"source_dispatch_card: $cardReceipt","source_transport_authority: $transportAuthority","first_failed_gate: $gate","diagnostic: $safe",'physical_prompt_count: 0','user_relay_count: 0',"workflow_run_id: $env:GITHUB_RUN_ID",'readback_required: true') -join "`n")
            throw "BLOCKED_PRESEND receipt=$rid"
          }

          $event = Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
          $body = [string]$event.comment.body
          if ($body -notmatch '(?m)^CONTROL_G10_G11_READY_RETURN_GUARD_WAKE_V1\s*$') { throw 'bad wake protocol' }
          if ($body -notmatch '(?m)^source_dispatch_card:\s*5556156612\s*$' -or $body -notmatch '(?m)^source_transport_authority:\s*5556161960\s*$' -or $body -notmatch '(?m)^source_current_switch:\s*5555495204\s*$') { throw 'wake binding mismatch' }

          try { $current = Verify-Base-And-Authority } catch { Publish-PresendBlocked 'AUTHORITY_OR_BASE_PRECHECK' $_.Exception.Message }

          $all = @(Get-All88)
          $existingTerminal = @($all | Where-Object { [string]$_.body -match '(?m)^GBB_READY_RETURN_CLOSURE_READY_V1\s*$' -and [string]$_.body -match '(?m)^card_id:\s*GBB-READY-RETURN-CLOSURE-01\s*$' })

          $pane = $null
          $session = $null
          $promptHash = $null
          $alreadySent = $false
          if (Test-Path -LiteralPath $workerStatePath) {
            $st = Get-Content -LiteralPath $workerStatePath -Raw | ConvertFrom-Json
            if ([string]$st.status -eq 'SENDING') {
              $rid = Publish (@('CONTROL_G10_G11_READY_RETURN_GUARD_DELIVERY_V1','state: UNCERTAIN_SEND_NO_BLIND_RETRY',"source_dispatch_card: $cardReceipt","source_transport_authority: $transportAuthority",'physical_prompt_count: UNKNOWN_AFTER_SEND_BOUNDARY','user_relay_count: 0',"workflow_run_id: $env:GITHUB_RUN_ID",'readback_required: true') -join "`n")
              throw "UNCERTAIN existing SENDING receipt=$rid"
            }
            if ([string]$st.status -eq 'SENT') {
              $pane=[string]$st.pane_id; $session=[string]$st.agent_session; $promptHash=[string]$st.prompt_sha256; $alreadySent=$true
            }
          }

          if (-not $alreadySent -and $existingTerminal.Count -eq 0) {
            if (-not (Test-Path -LiteralPath $herdr)) { Publish-PresendBlocked 'HERDR_CLI_MISSING' $herdr }
            $raw = & $herdr agent list 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0) { Publish-PresendBlocked 'HERDR_AGENT_LIST_FAILED' $raw }
            try { $list = $raw | ConvertFrom-Json } catch { Publish-PresendBlocked 'HERDR_AGENT_LIST_NOT_JSON' $raw }
            $eligible = @($list.result.agents | Where-Object {
              [string]$_.agent -eq 'codex' -and
              [string]$_.agent_status -in @('idle','done') -and
              [string]::IsNullOrWhiteSpace([string]$_.name) -and
              [string]$_.cwd -ceq 'C:\WINDOWS\system32'
            })
            if ($eligible.Count -ne 1) { Publish-PresendBlocked 'GENERIC_WORKER_COUNT_NOT_ONE' "eligible_count=$($eligible.Count)" }
            $pane=[string]$eligible[0].pane_id; $session=[string]$eligible[0].agent_session.value
            if ([string]::IsNullOrWhiteSpace($pane) -or [string]::IsNullOrWhiteSpace($session)) { Publish-PresendBlocked 'GENERIC_WORKER_BINDING_MISSING' '' }

            try { $null = Verify-Base-And-Authority } catch { Publish-PresendBlocked 'FINAL_PRESEND_AUTHORITY_OR_BASE' $_.Exception.Message }
            $prompt = 'Read GitHub directly. Execute only D22977/gpt-browser-bridge Issue #88 dispatch receipt 5556156612 / card GBB-READY-RETURN-CLOSURE-01 as WORKER. GitHub is durable authority. Perform only the bounded allowed-path repair and remote publication/read-back required by the card. Do not create/send generation011, do not act as Reviewer or Control, and stop after publishing/read-back GBB_READY_RETURN_CLOSURE_READY_V1.'
            $promptHash=[Convert]::ToHexString([System.Security.Cryptography.SHA256]::HashData([System.Text.Encoding]::UTF8.GetBytes($prompt))).ToLowerInvariant()
            @{status='SENDING';pane_id=$pane;agent_session=$session;prompt_sha256=$promptHash;workflow_run_id=$env:GITHUB_RUN_ID;started_at=(Get-Date).ToString('o')} | ConvertTo-Json | Set-Content -LiteralPath $workerStatePath -Encoding utf8
            $out = & $herdr agent prompt $pane $prompt 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0) {
              $rid=Publish (@('CONTROL_G10_G11_READY_RETURN_GUARD_DELIVERY_V1','state: UNCERTAIN_SEND_NO_BLIND_RETRY',"source_dispatch_card: $cardReceipt","source_transport_authority: $transportAuthority","target_pane: $pane","target_agent_session: $session","prompt_sha256: $promptHash",'physical_prompt_count: UNKNOWN_AFTER_SEND_BOUNDARY','user_relay_count: 0',"workflow_run_id: $env:GITHUB_RUN_ID",'readback_required: true') -join "`n")
              throw "UNCERTAIN prompt receipt=$rid"
            }
            try { $r=$out | ConvertFrom-Json } catch {
              $rid=Publish (@('CONTROL_G10_G11_READY_RETURN_GUARD_DELIVERY_V1','state: UNCERTAIN_SEND_NO_BLIND_RETRY',"source_dispatch_card: $cardReceipt","target_pane: $pane","target_agent_session: $session",'first_failed_gate: POST_PROMPT_RESPONSE_NOT_JSON','physical_prompt_count: UNKNOWN_AFTER_SEND_BOUNDARY','user_relay_count: 0',"workflow_run_id: $env:GITHUB_RUN_ID",'readback_required: true') -join "`n")
              throw "UNCERTAIN response receipt=$rid"
            }
            if ([string]$r.result.type -ne 'agent_prompted' -or [string]$r.result.agent.pane_id -cne $pane -or [string]$r.result.agent.agent_session.value -cne $session) {
              $rid=Publish (@('CONTROL_G10_G11_READY_RETURN_GUARD_DELIVERY_V1','state: UNCERTAIN_SEND_NO_BLIND_RETRY',"source_dispatch_card: $cardReceipt",'first_failed_gate: POST_PROMPT_BINDING_MISMATCH','physical_prompt_count: UNKNOWN_AFTER_SEND_BOUNDARY','user_relay_count: 0',"workflow_run_id: $env:GITHUB_RUN_ID",'readback_required: true') -join "`n")
              throw "UNCERTAIN binding receipt=$rid"
            }
            @{status='SENT';pane_id=$pane;agent_session=$session;prompt_sha256=$promptHash;workflow_run_id=$env:GITHUB_RUN_ID;sent_at=(Get-Date).ToString('o')} | ConvertTo-Json | Set-Content -LiteralPath $workerStatePath -Encoding utf8
            $rid=Publish (@('CONTROL_G10_G11_READY_RETURN_GUARD_DELIVERY_V1','state: DELIVERED','decision: PASS_TRANSPORT_ONLY',"source_dispatch_card: $cardReceipt","source_transport_authority: $transportAuthority","source_current_switch: $expectedSwitch","target_pane: $pane","target_agent_session: $session","prompt_sha256: $promptHash",'physical_prompt_count: 1','second_physical_prompt: false','post_dispatch_terminal_guard: ACTIVE','user_relay_count: 0',"workflow_run_id: $env:GITHUB_RUN_ID",'readback_required: true') -join "`n")
            Write-Output "Worker DELIVERED receipt=$rid; entering WAIT_CHILD_TERMINAL_GUARD"
          } elseif ($alreadySent) {
            Write-Output "Existing SENT worker state found; reattaching guard without second prompt pane=$pane session=$session"
          } else {
            Write-Output 'Terminal already exists; no Worker prompt required.'
          }

          $terminalReceipt = $null
          $terminalState = $null
          $idleCount = 0
          for ($i=0; $i -lt 600; $i++) {
            $all = @(Get-All88)
            $matches = @($all | Where-Object { [string]$_.body -match '(?m)^GBB_READY_RETURN_CLOSURE_READY_V1\s*$' -and [string]$_.body -match '(?m)^card_id:\s*GBB-READY-RETURN-CLOSURE-01\s*$' } | Sort-Object { [int64]$_.id })
            if ($matches.Count -gt 1) {
              $terminalReceipt = Publish (@('CONTROL_G10_G11_READY_RETURN_GUARD_RESULT_V1','state: CONTROL_REQUIRED',"source_dispatch_card: $cardReceipt",'reason: MULTIPLE_WORKER_TERMINALS','user_relay_count: 0',"workflow_run_id: $env:GITHUB_RUN_ID",'readback_required: true') -join "`n")
              $terminalState='CONTROL_REQUIRED'; break
            }
            if ($matches.Count -eq 1) {
              $tb=[string]$matches[0].body
              $sm=[regex]::Match($tb,'(?m)^state:\s*(READY_FOR_FRESH_REVIEW|BLOCKED|CONTROL_REQUIRED)\s*$')
              if (-not $sm.Success) {
                $terminalReceipt = Publish (@('CONTROL_G10_G11_READY_RETURN_GUARD_RESULT_V1','state: CONTROL_REQUIRED',"source_dispatch_card: $cardReceipt",'reason: MALFORMED_WORKER_TERMINAL_STATE',"source_worker_terminal_receipt: $($matches[0].id)",'user_relay_count: 0',"workflow_run_id: $env:GITHUB_RUN_ID",'readback_required: true') -join "`n")
                $terminalState='CONTROL_REQUIRED'; break
              }
              $terminalReceipt=[string]$matches[0].id; $terminalState=$sm.Groups[1].Value; break
            }

            if (-not [string]::IsNullOrWhiteSpace($pane) -and -not [string]::IsNullOrWhiteSpace($session)) {
              $raw2 = & $herdr agent list 2>&1 | Out-String
              if ($LASTEXITCODE -ne 0) {
                $terminalReceipt = Publish (@('CONTROL_G10_G11_READY_RETURN_GUARD_RESULT_V1','state: CONTROL_REQUIRED',"source_dispatch_card: $cardReceipt",'reason: HERDR_GUARD_AGENT_LIST_FAILED','user_relay_count: 0',"workflow_run_id: $env:GITHUB_RUN_ID",'readback_required: true') -join "`n")
                $terminalState='CONTROL_REQUIRED'; break
              }
              try { $l2=$raw2 | ConvertFrom-Json } catch {
                $terminalReceipt = Publish (@('CONTROL_G10_G11_READY_RETURN_GUARD_RESULT_V1','state: CONTROL_REQUIRED',"source_dispatch_card: $cardReceipt",'reason: HERDR_GUARD_AGENT_LIST_NOT_JSON','user_relay_count: 0',"workflow_run_id: $env:GITHUB_RUN_ID",'readback_required: true') -join "`n")
                $terminalState='CONTROL_REQUIRED'; break
              }
              $exact=@($l2.result.agents | Where-Object { [string]$_.pane_id -ceq $pane -and [string]$_.agent_session.value -ceq $session })
              if ($exact.Count -ne 1) {
                $terminalReceipt = Publish (@('HERDR_BOUND_EXECUTOR_ABNORMAL_EXIT_V1','state: CONTROL_REQUIRED',"source_dispatch_card: $cardReceipt","target_pane: $pane","target_agent_session: $session",'reason: EXACT_BOUND_SESSION_MISSING','user_relay_count: 0',"workflow_run_id: $env:GITHUB_RUN_ID",'readback_required: true') -join "`n")
                $terminalState='CONTROL_REQUIRED'; break
              }
              $st2=[string]$exact[0].agent_status
              if ($st2 -in @('idle','done')) { $idleCount++ } else { $idleCount=0 }
              if ($idleCount -ge 2) {
                $terminalReceipt = Publish (@('HERDR_BOUND_EXECUTOR_ABNORMAL_EXIT_V1','state: CONTROL_REQUIRED',"source_dispatch_card: $cardReceipt","target_pane: $pane","target_agent_session: $session",'reason: TERMINAL_MISSING_AFTER_BOUND_SESSION_IDLE_OR_DONE','user_relay_count: 0',"workflow_run_id: $env:GITHUB_RUN_ID",'readback_required: true') -join "`n")
                $terminalState='CONTROL_REQUIRED'; break
              }
            }
            Start-Sleep -Seconds 30
          }

          if ([string]::IsNullOrWhiteSpace($terminalReceipt)) {
            $terminalReceipt = Publish (@('CONTROL_G10_G11_READY_RETURN_GUARD_RESULT_V1','state: CONTROL_REQUIRED',"source_dispatch_card: $cardReceipt",'reason: GUARD_LIVENESS_BUDGET_EXHAUSTED_WHILE_NO_TERMINAL','no_worker_retry: true','user_relay_count: 0',"workflow_run_id: $env:GITHUB_RUN_ID",'readback_required: true') -join "`n")
            $terminalState='CONTROL_REQUIRED'
          }

          Write-Output "Guard terminal boundary receipt=$terminalReceipt state=$terminalState; preparing exact-Control return wake"

          $all = @(Get-All88)
          $priorReturn = @($all | Where-Object {
            [string]$_.body -match '(?m)^CONTROL_G10_G11_READY_RETURN_GUARD_RETURN_V1\s*$' -and
            [string]$_.body -match '(?m)^state:\s*DELIVERED\s*$' -and
            [string]$_.body -match "(?m)^source_terminal_receipt:\s*$([regex]::Escape($terminalReceipt))\s*$"
          })
          if ($priorReturn.Count -gt 1) { throw 'Conflicting duplicate durable return deliveries' }
          if ($priorReturn.Count -eq 1) {
            $rid=Publish (@('CONTROL_G10_G11_READY_RETURN_GUARD_RETURN_V1','state: NO_OP_DUPLICATE',"source_terminal_receipt: $terminalReceipt",'second_physical_send: false','user_relay_count: 0',"workflow_run_id: $env:GITHUB_RUN_ID",'readback_required: true') -join "`n")
            Write-Output "Return already delivered; NO_OP receipt=$rid"; exit 0
          }

          try { $sw = Get-CurrentSwitch } catch {
            $rid=Publish (@('CONTROL_G10_G11_READY_RETURN_GUARD_RETURN_V1','state: CONTROL_REQUIRED_NO_SEND',"source_terminal_receipt: $terminalReceipt",'reason: CURRENT_SWITCH_PARSE_FAILED_OR_CONFLICT','physical_send_count: 0','user_relay_count: 0',"workflow_run_id: $env:GITHUB_RUN_ID",'readback_required: true') -join "`n")
            throw "Cannot resolve current Control receipt=$rid"
          }
          if ($sw.Receipt -cne $expectedSwitch -or $sw.Generation -cne '010') {
            $rid=Publish (@('CONTROL_G10_G11_READY_RETURN_GUARD_RETURN_V1','state: CONTROL_REQUIRED_NO_SEND',"source_terminal_receipt: $terminalReceipt","observed_switch_receipt: $($sw.Receipt)","observed_generation: $($sw.Generation)",'reason: CONTROL_BINDING_SUPERSEDED','physical_send_count: 0','user_relay_count: 0',"workflow_run_id: $env:GITHUB_RUN_ID",'readback_required: true') -join "`n")
            throw "Control binding superseded receipt=$rid"
          }

          $repoRoot='D:\AIWORK\GPT_BROWSER_BRIDGE'
          $senderRel='src/gpt_send.mjs'
          $senderPath=Join-Path $repoRoot $senderRel
          if (-not (Test-Path -LiteralPath $senderPath)) { throw 'return sender missing' }
          $actualBlob=(& git -C $repoRoot hash-object -- $senderRel).Trim()
          if ($actualBlob -cne $expectedSenderBlob) {
            $rid=Publish (@('CONTROL_G10_G11_READY_RETURN_GUARD_RETURN_V1','state: CONTROL_REQUIRED_NO_SEND',"source_terminal_receipt: $terminalReceipt","reason: LOCAL_SENDER_BLOB_MISMATCH_$actualBlob",'physical_send_count: 0','user_relay_count: 0',"workflow_run_id: $env:GITHUB_RUN_ID",'readback_required: true') -join "`n")
            throw "sender blob mismatch receipt=$rid"
          }

          $returnStatePath=Join-Path $stateRoot ("return-$terminalReceipt.json")
          if (Test-Path -LiteralPath $returnStatePath) {
            $rs=Get-Content -LiteralPath $returnStatePath -Raw | ConvertFrom-Json
            if ([string]$rs.status -eq 'SENDING') { throw 'RETURN_UNCERTAIN_SEND_NO_BLIND_RETRY' }
            if ([string]$rs.status -eq 'SENT') {
              $rid=Publish (@('CONTROL_G10_G11_READY_RETURN_GUARD_RETURN_V1','state: NO_OP_DUPLICATE',"source_terminal_receipt: $terminalReceipt",'second_physical_send: false','user_relay_count: 0',"workflow_run_id: $env:GITHUB_RUN_ID",'readback_required: true') -join "`n")
              Write-Output "Local return SENT; NO_OP receipt=$rid"; exit 0
            }
          }

          $playwright='C:\Users\Lupun\AppData\Roaming\npm\node_modules\@playwright\cli\node_modules\.bin\playwright.cmd'
          $senderSession='HERDR-DOORBELL-DB01-G1-20260816'
          $db01RuntimeRoot='D:\AIWORK_RUNTIME\GPT_BROWSER_BRIDGE\control-doorbell'
          $db01Profile='D:\AIWORK_RUNTIME\GPT_BROWSER_BRIDGE\control-doorbell\db01-profile'
          $runtimeRoot='D:\AIWORK_RUNTIME\GPT_BROWSER_BRIDGE\g10-g11-ready-return-control-doorbell'
          if (-not (Test-Path -LiteralPath $playwright)) { throw 'Playwright CLI missing' }
          if (-not (Test-Path -LiteralPath $db01RuntimeRoot -PathType Container)) { throw 'DB01 runtime root missing' }
          if (-not (Test-Path -LiteralPath $db01Profile -PathType Container)) { throw 'DB01 profile missing' }

          Push-Location $db01RuntimeRoot
          try {
            $sessions=(& $playwright cli list 2>&1 | Out-String); if ($LASTEXITCODE -ne 0) { throw 'DB01 session list failed' }
            $tabs=(& $playwright cli "-s=$senderSession" tab-list 2>&1 | Out-String)
            if ($LASTEXITCODE -eq 1 -and $sessions -notmatch [regex]::Escape($senderSession)) {
              $open=(& $playwright cli "-s=$senderSession" open --persistent "--profile=$db01Profile" --headed 2>&1 | Out-String); if ($LASTEXITCODE -ne 0) { throw "DB01 restart failed $open" }
            } elseif ($LASTEXITCODE -ne 0) { throw 'DB01 session ambiguous' }
            $tabs=(& $playwright cli "-s=$senderSession" tab-list 2>&1 | Out-String); if ($LASTEXITCODE -ne 0) { throw 'DB01 tab list failed' }
            if ($tabs -notmatch [regex]::Escape($sw.ConversationId)) {
              $go=(& $playwright cli "-s=$senderSession" goto $sw.ConversationUrl 2>&1 | Out-String); if ($LASTEXITCODE -ne 0) { throw "DB01 goto exact Control failed $go" }
            }
            $finalTabs=(& $playwright cli "-s=$senderSession" tab-list 2>&1 | Out-String); if ($LASTEXITCODE -ne 0 -or $finalTabs -notmatch [regex]::Escape($sw.ConversationId)) { throw 'DB01 exact Control tab not found' }
          } finally { Pop-Location }

          $sw2=Get-CurrentSwitch
          if ($sw2.Receipt -cne $sw.Receipt -or $sw2.Generation -cne $sw.Generation -or $sw2.ConversationId -cne $sw.ConversationId -or $sw2.ConversationUrl -cne $sw.ConversationUrl) {
            $rid=Publish (@('CONTROL_G10_G11_READY_RETURN_GUARD_RETURN_V1','state: CONTROL_REQUIRED_NO_SEND',"source_terminal_receipt: $terminalReceipt",'reason: CONTROL_BINDING_CHANGED_AT_SEND_BOUNDARY','physical_send_count: 0','user_relay_count: 0',"workflow_run_id: $env:GITHUB_RUN_ID",'readback_required: true') -join "`n")
            throw "Control changed at send boundary receipt=$rid"
          }

          $env:GBB_SENDER_PATH=$senderPath
          $env:GBB_SENDER_SESSION=$senderSession
          $env:GBB_RUNTIME_ROOT=$runtimeRoot
          $env:GBB_TARGET_URL=$sw.ConversationUrl
          $env:GBB_DOORBELL_PROMPT="Read GitHub directly. Rehydrate D22977/gpt-browser-bridge #43/#81/#88. Handle terminal receipt $terminalReceipt for card GBB-READY-RETURN-CLOSURE-01 and continue only as the current ACTIVE Control. GitHub is durable authority."
          $sendScript=@'
          import { pathToFileURL } from 'node:url';
          const mod = await import(pathToFileURL(process.env.GBB_SENDER_PATH).href);
          await mod.readBaseline(process.env.GBB_TARGET_URL, { session: process.env.GBB_SENDER_SESSION, allowBackgroundTab: true });
          const result = await mod.sendJob({ prompt: process.env.GBB_DOORBELL_PROMPT, attempt: 1, conversationUrl: process.env.GBB_TARGET_URL, runtimeRoot: process.env.GBB_RUNTIME_ROOT, session: process.env.GBB_SENDER_SESSION, allowBackgroundTab: true });
          console.log(JSON.stringify({job_id: result.job.job_id, prompt_hash: result.job.prompt_hash}));
          '@
          $sendPath=Join-Path $env:RUNNER_TEMP "g10-g11-ready-return-$env:GITHUB_RUN_ID.mjs"
          Set-Content -LiteralPath $sendPath -Value $sendScript -Encoding utf8
          @{status='SENDING';source_terminal_receipt=$terminalReceipt;target_generation=$sw.Generation;target_conversation_id=$sw.ConversationId;workflow_run_id=$env:GITHUB_RUN_ID;started_at=(Get-Date).ToString('o')} | ConvertTo-Json | Set-Content -LiteralPath $returnStatePath -Encoding utf8
          try {
            $sendOut=(& node $sendPath 2>&1 | Out-String).Trim()
            if ($LASTEXITCODE -ne 0) { throw $sendOut }
            $jsonLine=($sendOut -split "`n" | Where-Object { $_.Trim().StartsWith('{') } | Select-Object -Last 1)
            if (-not $jsonLine) { throw 'sender returned no JSON result' }
            $sent=$jsonLine | ConvertFrom-Json
          } catch {
            $detail=($_.Exception.Message -replace '[\r\n]+',' '); if ($detail.Length -gt 500) { $detail=$detail.Substring(0,500) }
            $rid=Publish (@('CONTROL_G10_G11_READY_RETURN_GUARD_RETURN_V1','state: UNCERTAIN_SEND_NO_BLIND_RETRY',"source_terminal_receipt: $terminalReceipt","diagnostic: $detail",'physical_send_count: UNKNOWN_AFTER_SEND_BOUNDARY','user_relay_count: 0',"workflow_run_id: $env:GITHUB_RUN_ID",'readback_required: true') -join "`n")
            throw "return uncertain receipt=$rid"
          } finally { Remove-Item -LiteralPath $sendPath -Force -ErrorAction SilentlyContinue }

          $rs=Get-Content -LiteralPath $returnStatePath -Raw | ConvertFrom-Json; $rs.status='SENT'; $rs.sent_at=(Get-Date).ToString('o'); $rs.sender_job_id=[string]$sent.job_id; $rs | ConvertTo-Json | Set-Content -LiteralPath $returnStatePath -Encoding utf8
          $rid=Publish (@('CONTROL_G10_G11_READY_RETURN_GUARD_RETURN_V1','state: DELIVERED','decision: PASS_TRANSPORT_ONLY',"source_dispatch_card: $cardReceipt","source_terminal_receipt: $terminalReceipt","source_terminal_state: $terminalState","active_switch_receipt: $($sw.Receipt)","target_control_generation: $($sw.Generation)","target_control_conversation_id: $($sw.ConversationId)","target_control_conversation_url: $($sw.ConversationUrl)","sender_module_blob: $expectedSenderBlob","sender_job_id: $($sent.job_id)","sender_prompt_hash: $($sent.prompt_hash)",'physical_send_count: 1','second_physical_send: false','user_relay_count: 0',"workflow_run_id: $env:GITHUB_RUN_ID",'readback_required: true') -join "`n")
          Write-Output "Control return DELIVERED receipt=$rid"
