name: G12 Issue149 Idle-Gated R2 And Control Return

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: g12-issue149-idle-r2-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  release-r1-guard:
    if: >-
      github.event.issue.number == 149 &&
      github.event.comment.user.login == 'D22977' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, 'G12_ISSUE149_IDLE_RECOVERY_WAKE_V1')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Release exact R1 terminal guard after durable terminal
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo='D22977/gpt-browser-bridge'
          issue='149'
          source_terminal='5609874879'
          source_wake='5609810233'
          recovery_wake='${{ github.event.comment.id }}'
          stale_run='34414168202'
          authority='5609958835'

          term_body="$(gh api "repos/$repo/issues/comments/$source_terminal" --jq .body)"
          printf '%s\n' "$term_body" | grep -q '^GBB_G12_CONTROL_DOORBELL_PHYSICAL_SUBMIT_REPAIR_RESULT_V1$'
          printf '%s\n' "$term_body" | grep -q '^decision: CONTROL_REQUIRED$'
          printf '%s\n' "$term_body" | grep -q "^source_bootstrap_wake: $source_wake$"
          auth_body="$(gh api "repos/$repo/issues/comments/$authority" --jq .body)"
          printf '%s\n' "$auth_body" | grep -q '^CONTROL_G12_ISSUE149_R1_GUARD_RELEASE_AMENDMENT_V1$'

          initial="$(gh api "repos/$repo/actions/runs/$stale_run" --jq .status)"
          cancel_invoked='false'
          if [[ "$initial" == 'queued' || "$initial" == 'in_progress' || "$initial" == 'waiting' || "$initial" == 'pending' || "$initial" == 'requested' ]]; then
            if gh api --method POST "repos/$repo/actions/runs/$stale_run/cancel" >/dev/null 2>&1; then
              cancel_invoked='true'
            else
              reread="$(gh api "repos/$repo/actions/runs/$stale_run" --jq .status)"
              if [[ "$reread" == 'queued' || "$reread" == 'in_progress' || "$reread" == 'waiting' || "$reread" == 'pending' || "$reread" == 'requested' ]]; then
                echo "exact stale run remained active after cancel failure: $reread" >&2
                exit 1
              fi
            fi
          fi

          final=''
          for _ in $(seq 1 60); do
            final="$(gh api "repos/$repo/actions/runs/$stale_run" --jq .status)"
            if [[ "$final" != 'queued' && "$final" != 'in_progress' && "$final" != 'waiting' && "$final" != 'pending' && "$final" != 'requested' ]]; then
              break
            fi
            sleep 2
          done
          if [[ "$final" == 'queued' || "$final" == 'in_progress' || "$final" == 'waiting' || "$final" == 'pending' || "$final" == 'requested' ]]; then
            echo "stale R1 guard did not release: $final" >&2
            exit 1
          fi

          body=$(cat <<EOF
          G12_ISSUE149_R1_GUARD_RELEASE_V1
          state: PASS
          source_authority: $authority
          source_recovery_wake: $recovery_wake
          source_worker_terminal: $source_terminal
          source_worker_wake: $source_wake
          stale_guard_run: $stale_run
          initial_status: $initial
          cancel_invoked: $cancel_invoked
          final_status: $final
          worker_prompt_retried: false
          readback_verified: true
          idempotency_key: G12-ISSUE149-R1-GUARD-RELEASE-$stale_run-$recovery_wake
          EOF
          )
          posted="$(gh api --method POST "repos/$repo/issues/$issue/comments" -f body="$body" --jq .id)"
          readback="$(gh api "repos/$repo/issues/comments/$posted" --jq .body)"
          test "$readback" = "$body"

  idle-gated-r2-and-return:
    needs: release-r1-guard
    if: >-
      needs.release-r1-guard.result == 'success' &&
      github.event.issue.number == 149 &&
      github.event.comment.user.login == 'D22977' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, 'G12_ISSUE149_IDLE_RECOVERY_WAKE_V1')
    runs-on: [self-hosted, Windows, GBB-REVIEWER]
    timeout-minutes: 175
    defaults:
      run:
        shell: pwsh -NoProfile -File {0}
    steps:
      - name: Idle-gated fresh Worker then canonical same-Control return
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = 'D22977/gpt-browser-bridge'
          $issue = 149
          $authority = '5609909884'
          $guardReleaseAuthority = '5609958835'
          $sourceR1Terminal = '5609874879'
          $switchReceipt = '5601634172'
          $requiredBranch = 'worker/g12-control-doorbell-physical-submit-repair-01-r2'
          $baseRepo = 'D:\AIWORK\GPT_BROWSER_BRIDGE'
          $herdr = 'C:\Users\Lupun\AppData\Local\Programs\Herdr\bin\herdr.exe'
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            'User-Agent' = 'g12-issue149-idle-r2-return'
            Accept = 'application/vnd.github+json'
          }

          function Need([string]$body,[string]$pattern,[string]$name) {
            $m = [regex]::Match($body,$pattern)
            if (-not $m.Success) { throw "Malformed field: $name" }
            return $m.Groups[1].Value
          }
          function Safe([string]$text) {
            if ($null -eq $text) { return '' }
            $v = ($text -replace '[\r\n]+',' ' -replace '[\x00-\x1F]',' ').Trim()
            if ($v.Length -gt 1400) { return $v.Substring(0,1400) }
            return $v
          }
          function Publish([string]$text) {
            $payload = @{ body = $text } | ConvertTo-Json -Compress
            $posted = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/issues/$issue/comments" -Headers $headers -Method Post -Body $payload -ContentType 'application/json' -TimeoutSec 30
            $readback = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/issues/comments/$($posted.id)" -Headers $headers -Method Get -TimeoutSec 30
            if ([string]$readback.body -cne $text) { throw "readback mismatch receipt=$($posted.id)" }
            return [string]$posted.id
          }
          function FindBoundReceipt([string]$protocol,[string]$wake,[string]$since) {
            for ($page=1; $page -le 15; $page++) {
              $rows = @(Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/issues/$issue/comments?since=$since&per_page=100&page=$page" -Headers $headers -Method Get -TimeoutSec 30)
              foreach ($row in $rows) {
                $b = [string]$row.body
                if ($b.StartsWith($protocol) -and $b -match "(?m)^source_bootstrap_wake:\s*$wake\s*$") { return $row }
              }
              if ($rows.Count -lt 100) { break }
            }
            return $null
          }
          function FindRecoveryReceipt([string]$protocol,[string]$wake,[string]$since) {
            for ($page=1; $page -le 15; $page++) {
              $rows = @(Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/issues/$issue/comments?since=$since&per_page=100&page=$page" -Headers $headers -Method Get -TimeoutSec 30)
              foreach ($row in $rows) {
                $b = [string]$row.body
                if ($b.StartsWith($protocol) -and $b -match "(?m)^source_recovery_wake:\s*$wake\s*$") { return $row }
              }
              if ($rows.Count -lt 100) { break }
            }
            return $null
          }
          function AssertCurrent012 {
            $sw = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/issues/comments/$switchReceipt" -Headers $headers -Method Get -TimeoutSec 30
            $b = [string]$sw.body
            if (-not $b.StartsWith('CONTROL_GENERATION_SWITCH_V1') -or $b -notmatch '(?m)^state:\s*SWITCH_COMMITTED\s*$' -or $b -notmatch '(?m)^new_generation:\s*012\s*$' -or $b -notmatch '(?m)^new_generation_status:\s*ACTIVE\s*$') { throw 'generation012 exact ACTIVE switch mismatch' }
            $sinceSwitch = [uri]::EscapeDataString([string]$sw.created_at)
            for ($page=1; $page -le 10; $page++) {
              $rows = @(Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/issues/88/comments?since=$sinceSwitch&per_page=100&page=$page" -Headers $headers -Method Get -TimeoutSec 30)
              foreach ($row in $rows) {
                if ([string]$row.id -eq $switchReceipt) { continue }
                $rb = [string]$row.body
                if ($rb -match '(?m)^CONTROL_GENERATION_SWITCH_V1\s*$' -and $rb -match '(?m)^state:\s*SWITCH_COMMITTED\s*$') { throw "newer committed Control switch exists receipt=$($row.id)" }
              }
              if ($rows.Count -lt 100) { break }
            }
            return $sw
          }
          function RemoteBranchExists([string]$branch) {
            try {
              $escaped = $branch -replace '/', '%2F'
              $null = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/git/ref/heads/$escaped" -Headers $headers -Method Get -TimeoutSec 30
              return $true
            } catch {
              $code = 0
              try { $code = [int]$_.Exception.Response.StatusCode } catch {}
              if ($code -eq 404 -or $_.Exception.Message -match '404') { return $false }
              throw
            }
          }
          function WaitAgentReady([string]$session,[string]$target,[int]$loops=90) {
            for ($i=0; $i -lt $loops; $i++) {
              Start-Sleep -Seconds 1
              $raw = ((& $herdr --session $session agent get $target 2>&1) | Out-String).Trim()
              if ($LASTEXITCODE -eq 0) {
                try {
                  $obj = $raw | ConvertFrom-Json
                  $status = [string]$obj.result.agent.agent_status
                  if ($status -in @('idle','done')) { return $obj }
                  if ($status -eq 'blocked') { throw "agent blocked before prompt: $(Safe $raw)" }
                } catch {
                  if ($_.Exception.Message -like 'agent blocked*') { throw }
                }
              }
            }
            throw "agent did not become prompt-ready target=$target"
          }

          $phase = 'PREFLIGHT'
          $workerPromptCount = 0
          $returnPromptCount = 0
          $workerTerminalReceipt = ''
          $workerConsumedReceipt = ''
          $profilePath = ''
          $event = Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
          $body = [string]$event.comment.body
          $wake = [string]$event.comment.id
          $since = [uri]::EscapeDataString([string]$event.comment.created_at)
          $stateRoot = "D:\AIWORK_RUNTIME\GPT_BROWSER_BRIDGE\issue149-idle-r2\$wake"
          $statePath = Join-Path $stateRoot 'transport.json'
          New-Item -ItemType Directory -Force -Path $stateRoot | Out-Null

          try {
            $wakeAuthority = Need $body '(?m)^authority_receipt:\s*(\d+)\s*$' 'authority_receipt'
            $wakeGeneration = Need $body '(?m)^control_generation:\s*(\d+)\s*$' 'control_generation'
            $sourceTerminal = Need $body '(?m)^source_r1_terminal:\s*(\d+)\s*$' 'source_r1_terminal'
            $integrationHead = Need $body '(?m)^launcher_integration_head:\s*([0-9a-f]{40})\s*$' 'launcher_integration_head'
            $workerBase = Need $body '(?m)^worker_base_sha:\s*([0-9a-f]{40})\s*$' 'worker_base_sha'
            $idem = Need $body '(?m)^idempotency_key:\s*([A-Za-z0-9._:-]+)\s*$' 'idempotency_key'
            if ($wakeAuthority -cne $authority -or $wakeGeneration -cne '012' -or $sourceTerminal -cne $sourceR1Terminal) { throw 'recovery wake authority mismatch' }
            if ($integrationHead -cne $workerBase) { throw 'worker base must equal launcher integration head' }

            if (Test-Path -LiteralPath $statePath) {
              $old = Get-Content -LiteralPath $statePath -Raw | ConvertFrom-Json
              $dup = @(
                'G12_ISSUE149_IDLE_R2_LAUNCH_RESULT_V1'
                'state: NO_OP_DUPLICATE'
                "source_recovery_wake: $wake"
                "authority_receipt: $authority"
                "prior_state: $([string]$old.status)"
                'worker_prompt_count: 0'
                'return_transport_prompt_count: 0'
                'user_task_result_relay_count: 0'
                'readback_verified: true'
                "idempotency_key: $idem"
              ) -join "`n"
              [void](Publish $dup)
              exit 0
            }
            @{status='PREPARING';phase=$phase;wake=$wake;worker_prompt_count=0;return_prompt_count=0}|ConvertTo-Json|Set-Content -LiteralPath $statePath -Encoding utf8

            foreach ($rid in @($authority,$guardReleaseAuthority,$sourceR1Terminal)) {
              $r = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/issues/comments/$rid" -Headers $headers -Method Get -TimeoutSec 30
              if ([string]::IsNullOrWhiteSpace([string]$r.body)) { throw "unreadable authority receipt=$rid" }
            }
            $auth = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/issues/comments/$authority" -Headers $headers -Method Get -TimeoutSec 30
            if (-not ([string]$auth.body).StartsWith('CONTROL_G12_ISSUE149_IDLE_GATED_RECOVERY_AND_RETURN_AUTHORITY_V1')) { throw 'wrong R2 recovery authority receipt' }
            $r1 = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/issues/comments/$sourceR1Terminal" -Headers $headers -Method Get -TimeoutSec 30
            if (-not ([string]$r1.body).StartsWith('GBB_G12_CONTROL_DOORBELL_PHYSICAL_SUBMIT_REPAIR_RESULT_V1') -or [string]$r1.body -notmatch '(?m)^decision:\s*CONTROL_REQUIRED\s*$') { throw 'R1 source terminal mismatch' }
            $release = FindRecoveryReceipt 'G12_ISSUE149_R1_GUARD_RELEASE_V1' $wake $since
            if ($null -eq $release) { throw 'exact R1 guard release receipt missing for recovery wake' }
            $card = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/issues/$issue" -Headers $headers -Method Get -TimeoutSec 30
            if (-not ([string]$card.body).StartsWith('DISPATCH_CARD_V1') -or [string]$card.body -notmatch '(?m)^card_id:\s*GBB-G12-CONTROL-DOORBELL-PHYSICAL-SUBMIT-REPAIR-01\s*$') { throw 'Issue149 card mismatch' }
            [void](AssertCurrent012)

            $ref = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/git/ref/heads/review-base/gbb-gh-01" -Headers $headers -Method Get -TimeoutSec 30
            if ([string]$ref.object.sha -cne $workerBase) { throw "default head drift expected=$workerBase actual=$([string]$ref.object.sha)" }
            if (RemoteBranchExists $requiredBranch) { throw 'R2 Worker branch already exists before send' }
            if ($env:RUNNER_NAME -cne 'gbb-reviewer-win-01') { throw "unexpected runner=$env:RUNNER_NAME" }
            if (-not [Environment]::UserInteractive -or [Diagnostics.Process]::GetCurrentProcess().SessionId -eq 0) { throw 'runner is not interactive user session' }
            if (-not (Test-Path -LiteralPath $herdr -PathType Leaf)) { throw 'Herdr CLI missing' }
            $hv = ((& $herdr --version 2>&1) | Out-String).Trim()
            if ($LASTEXITCODE -ne 0 -or $hv -notmatch '0\.8\.2') { throw "Herdr version mismatch: $(Safe $hv)" }
            $cv = ((& codex --version 2>&1) | Out-String).Trim()
            if ($LASTEXITCODE -ne 0) { throw "Codex version failed: $(Safe $cv)" }
            $ch = ((& codex --help 2>&1) | Out-String)
            if ($LASTEXITCODE -ne 0 -or $ch -notmatch '(?m)--profile') { throw 'Codex --profile unsupported' }
            if (-not (Test-Path -LiteralPath $baseRepo -PathType Container)) { throw 'local base repo missing' }
            $origin = ((& git -C $baseRepo remote get-url origin 2>&1) | Out-String).Trim()
            if ($LASTEXITCODE -ne 0 -or $origin -notmatch 'D22977/gpt-browser-bridge(\.git)?$') { throw "local repo origin mismatch: $(Safe $origin)" }

            $phase = 'CREATE_CLEAN_R2_WORKTREE'
            & git -C $baseRepo fetch origin $workerBase --quiet
            if ($LASTEXITCODE -ne 0) { throw 'git fetch exact R2 base failed' }
            $runtimeRepo = Join-Path $stateRoot 'repo'
            $wt = ((& git -C $baseRepo worktree add --detach $runtimeRepo $workerBase 2>&1) | Out-String).Trim()
            if ($LASTEXITCODE -ne 0) { throw "worktree add failed: $(Safe $wt)" }
            $head = ((& git -C $runtimeRepo rev-parse HEAD 2>&1) | Out-String).Trim()
            $dirty = ((& git -C $runtimeRepo status --porcelain=v1 --untracked-files=all 2>&1) | Out-String)
            if ($head -cne $workerBase -or -not [string]::IsNullOrWhiteSpace($dirty)) { throw 'R2 worktree is not clean exact base' }

            $suffix = $wake.Substring([Math]::Max(0,$wake.Length-8))
            $profile = "g149r2$suffix"
            $named = "g149-r2-$suffix"
            $workerAgent = "g149r2w$suffix"
            if ($workerAgent.Length -gt 32) { $workerAgent = $workerAgent.Substring(0,32) }
            $codexHome = if (-not [string]::IsNullOrWhiteSpace($env:CODEX_HOME)) { $env:CODEX_HOME } else { Join-Path $HOME '.codex' }
            $profilePath = Join-Path $codexHome "$profile.config.toml"
            if (Test-Path -LiteralPath $profilePath) { throw 'R2 Codex profile already exists' }
            Set-Content -LiteralPath $profilePath -Value "[projects.'$runtimeRepo']`ntrust_level = `"trusted`"`n" -Encoding utf8 -NoNewline

            $phase = 'START_FRESH_R2_HERDR'
            $hout = Join-Path $stateRoot 'herdr.out'
            $herr = Join-Path $stateRoot 'herdr.err'
            $server = Start-Process $herdr -ArgumentList @('--session',$named,'server') -PassThru -WindowStyle Hidden -RedirectStandardOutput $hout -RedirectStandardError $herr
            $ready = $false
            for ($i=0; $i -lt 40; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $sr = ((& $herdr --session $named status server 2>&1) | Out-String).Trim()
                if ($LASTEXITCODE -eq 0 -and $sr -notmatch 'protocol_mismatch|protocol 19') { $ready=$true; break }
              } catch {}
              if ($server.HasExited) { break }
            }
            if (-not $ready) { throw 'fresh R2 named Herdr server unavailable' }

            $phase = 'START_FRESH_R2_WORKER'
            $cr = ((& $herdr --session $named workspace create --cwd $runtimeRepo --label "g149-r2-$wake" --no-focus 2>&1) | Out-String).Trim()
            if ($LASTEXITCODE -ne 0) { throw "R2 workspace create failed: $(Safe $cr)" }
            $wo = $cr | ConvertFrom-Json
            $workerWorkspace = [string]$wo.result.workspace.workspace_id
            $workerPane = [string]$wo.result.root_pane.pane_id
            $cmd = "codex --profile $profile --approve-for-me"
            $run = ((& $herdr --session $named pane run $workerPane $cmd 2>&1) | Out-String).Trim()
            if ($LASTEXITCODE -ne 0) { throw "R2 Codex launch failed: $(Safe $run)" }
            [void](WaitAgentReady $named $workerPane 100)
            $rn = ((& $herdr --session $named agent rename $workerPane $workerAgent 2>&1) | Out-String).Trim()
            if ($LASTEXITCODE -ne 0) { throw "R2 agent rename failed: $(Safe $rn)" }
            $workerObj = WaitAgentReady $named $workerAgent 30
            $workerNative = [string]$workerObj.result.agent.agent_session.value
            if ([string]::IsNullOrWhiteSpace($workerNative)) { $workerNative='UNREPORTED_NATIVE_SESSION' }
            Remove-Item -LiteralPath $profilePath -Force
            $profilePath = ''

            $phase = 'FINAL_R2_PRESEND_ADMISSION'
            [void](AssertCurrent012)
            $ref2 = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/git/ref/heads/review-base/gbb-gh-01" -Headers $headers -Method Get -TimeoutSec 30
            if ([string]$ref2.object.sha -cne $workerBase) { throw 'default drift before R2 prompt' }
            if (RemoteBranchExists $requiredBranch) { throw 'R2 Worker branch appeared before prompt' }
            $head2 = ((& git -C $runtimeRepo rev-parse HEAD 2>&1) | Out-String).Trim()
            $dirty2 = ((& git -C $runtimeRepo status --porcelain=v1 --untracked-files=all 2>&1) | Out-String)
            if ($head2 -cne $workerBase -or -not [string]::IsNullOrWhiteSpace($dirty2)) { throw 'R2 worktree changed before prompt' }

            $phase = 'R2_WORKER_SENDING'
            @{status='R2_WORKER_SENDING';wake=$wake;worker_prompt_count=0;return_prompt_count=0;worker_base=$workerBase}|ConvertTo-Json|Set-Content -LiteralPath $statePath -Encoding utf8
            $prompt = "Read GitHub directly. You are the ONE fresh WORKER for D22977/gpt-browser-bridge Issue #149 recovery generation R2. Rehydrate authority $authority, source R1 terminal $sourceR1Terminal, source_bootstrap_wake $wake, and card GBB-G12-CONTROL-DOORBELL-PHYSICAL-SUBMIT-REPAIR-01. Work from exact clean base $workerBase and create only branch $requiredBranch. Before tracked mutation publish/read-back GBB_G12_CONTROL_DOORBELL_PHYSICAL_SUBMIT_REPAIR_CONSUMED_STARTED_V1 with source_bootstrap_wake: $wake, fresh identity/cwd/base/branch. CRITICAL IDLE GATE: R1 stopped only because Control-012 was generating and exposed stop-button. Before R1, repeatedly inspect the exact ACTIVE Control conversation read-only. While Stop/停止回應 is present or no deterministic actionable Send target exists, WAIT and poll read-only. During this gate do not fill, clear, click, press, stop, send, restart any browser, or mutate tracked files. Do not return CONTROL_REQUIRED merely because the current Control turn is still generating; wait until it becomes idle. If Control generation changes, return STALE. Once exact Control is idle and deterministic actionable Send is proven, perform the card's live NO-SEND R1 and continue R2-R9. Mutate only src/gpt_send.mjs, .github/workflows/herdr-control-comment-bridge.yml, tests/baseline.test.mjs. Run all required tests/checks, push exact branch, publish/read-back GBB_G12_CONTROL_DOORBELL_PHYSICAL_SUBMIT_REPAIR_RESULT_V1 with source_bootstrap_wake: $wake. Do not run live Control canary, merge, release, retry 5602620127, or reuse R1 Worker. Stop at terminal."
            $workerPromptCount = 1
            $raw = ((& $herdr --session $named agent prompt $workerAgent $prompt 2>&1) | Out-String).Trim()
            $workerPromptExit = $LASTEXITCODE
            @{status='R2_WORKER_SENT';wake=$wake;worker_prompt_count=1;return_prompt_count=0;worker_base=$workerBase}|ConvertTo-Json|Set-Content -LiteralPath $statePath -Encoding utf8
            $workerDelivery = @(
              'G12_ISSUE149_IDLE_R2_WORKER_DELIVERY_V1'
              'state: PROMPT_SUBMITTED_WAIT_WORKER'
              "source_recovery_wake: $wake"
              "authority_receipt: $authority"
              "source_r1_terminal: $sourceR1Terminal"
              "worker_base_sha: $workerBase"
              "required_worker_branch: $requiredBranch"
              "named_session: $named"
              "fresh_workspace: $workerWorkspace"
              "fresh_pane: $workerPane"
              "fresh_agent: $workerAgent"
              "fresh_agent_session: $workerNative"
              'worker_prompt_count: 1'
              "prompt_exit: $workerPromptExit"
              'second_worker_prompt: false'
              'owner_enter_count: 0'
              'user_task_result_relay_count: 0'
              "workflow_run_id: $env:GITHUB_RUN_ID"
              'readback_verified: true'
              "idempotency_key: $idem"
            ) -join "`n"
            $workerDeliveryReceipt = Publish $workerDelivery
            if ($workerPromptExit -ne 0) { throw "R2 Worker prompt exit=$workerPromptExit after send boundary" }

            $phase = 'WAIT_R2_WORKER_TERMINAL'
            $workerTerminal = $null
            $workerConsumed = $null
            for ($i=0; $i -lt 1500; $i++) {
              if ($null -eq $workerConsumed) { $workerConsumed = FindBoundReceipt 'GBB_G12_CONTROL_DOORBELL_PHYSICAL_SUBMIT_REPAIR_CONSUMED_STARTED_V1' $wake $since }
              $workerTerminal = FindBoundReceipt 'GBB_G12_CONTROL_DOORBELL_PHYSICAL_SUBMIT_REPAIR_RESULT_V1' $wake $since
              if ($null -ne $workerTerminal) { break }
              $gr = ((& $herdr --session $named agent get $workerAgent 2>&1) | Out-String).Trim()
              if ($LASTEXITCODE -ne 0) { throw "R2 Worker agent lost without terminal: $(Safe $gr)" }
              $go = $gr | ConvertFrom-Json
              $st = [string]$go.result.agent.agent_status
              if ($st -eq 'blocked') {
                $rr = ((& $herdr --session $named agent read $workerAgent --source recent-unwrapped --lines 120 2>&1) | Out-String).Trim()
                $synthetic = @(
                  'G12_ISSUE149_IDLE_R2_LAUNCH_RESULT_V1'
                  'state: CONTROL_REQUIRED_WORKER_BLOCKED_NO_SECOND_PROMPT'
                  "source_recovery_wake: $wake"
                  "authority_receipt: $authority"
                  "worker_delivery_receipt: $workerDeliveryReceipt"
                  "worker_consumed_receipt: $(if($workerConsumed){$workerConsumed.id}else{'NONE'})"
                  "agent_readback: $(Safe $rr)"
                  'worker_prompt_count: 1'
                  'second_worker_prompt: false'
                  'user_task_result_relay_count: 0'
                  'readback_verified: true'
                  "idempotency_key: $idem"
                ) -join "`n"
                $workerTerminalReceipt = Publish $synthetic
                break
              }
              Start-Sleep -Seconds 5
            }
            if ($null -ne $workerTerminal) {
              $workerTerminalReceipt = [string]$workerTerminal.id
              if ($null -ne $workerConsumed) { $workerConsumedReceipt = [string]$workerConsumed.id }
              $tb = [string]$workerTerminal.body
              $decision = 'UNPARSED'
              $dm = [regex]::Match($tb,'(?m)^(?:state|decision):\s*([A-Z0-9_]+)\s*$')
              if ($dm.Success) { $decision=$dm.Groups[1].Value }
              $observed = @(
                'G12_ISSUE149_IDLE_R2_LAUNCH_RESULT_V1'
                "state: WORKER_TERMINAL_OBSERVED_$decision"
                "source_recovery_wake: $wake"
                "authority_receipt: $authority"
                "worker_delivery_receipt: $workerDeliveryReceipt"
                "worker_consumed_receipt: $(if([string]::IsNullOrWhiteSpace($workerConsumedReceipt)){'NONE'}else{$workerConsumedReceipt})"
                "worker_terminal_receipt: $workerTerminalReceipt"
                "worker_base_sha: $workerBase"
                "required_worker_branch: $requiredBranch"
                'worker_prompt_count: 1'
                'second_worker_prompt: false'
                'user_task_result_relay_count: 0'
                'readback_verified: true'
                "idempotency_key: $idem"
              ) -join "`n"
              [void](Publish $observed)
            }
            if ([string]::IsNullOrWhiteSpace($workerTerminalReceipt)) { throw 'R2 Worker terminal guard timeout without durable terminal' }

            $phase = 'START_FRESH_CONTROL_RETURN_TRANSPORT'
            [void](AssertCurrent012)
            $retCreate = ((& $herdr --session $named workspace create --cwd 'C:\WINDOWS\system32' --label "g149-return-$wake" --no-focus 2>&1) | Out-String).Trim()
            if ($LASTEXITCODE -ne 0) { throw "return workspace create failed: $(Safe $retCreate)" }
            $retObj = $retCreate | ConvertFrom-Json
            $returnWorkspace = [string]$retObj.result.workspace.workspace_id
            $returnPane = [string]$retObj.result.root_pane.pane_id
            $returnAgent = "g149ret$suffix"
            if ($returnAgent.Length -gt 32) { $returnAgent=$returnAgent.Substring(0,32) }
            $startRaw = ((& $herdr --session $named agent start $returnAgent --kind codex --pane $returnPane --timeout 90000 2>&1) | Out-String).Trim()
            if ($LASTEXITCODE -ne 0) { throw "return transport agent start failed: $(Safe $startRaw)" }
            $returnObj = WaitAgentReady $named $returnAgent 100
            $returnNative = [string]$returnObj.result.agent.agent_session.value
            if ([string]::IsNullOrWhiteSpace($returnNative)) { $returnNative='UNREPORTED_NATIVE_SESSION' }

            $phase = 'CONTROL_RETURN_TRANSPORT_SENDING'
            $returnPrompt = "Read GitHub directly. You are a NEW/fresh TRANSPORT-ONLY agent, not Control, Worker, or Reviewer. Rehydrate D22977/gpt-browser-bridge Issue #87 canonical terminal-to-same-Control PASS 5254417022, Issue #88 newest legal ACTIVE Control switch, Issue #149 recovery authority $authority, source_recovery_wake $wake, and source terminal receipt $workerTerminalReceipt. Do not make semantic project decisions and do not mutate repository files. First publish/read-back G12_ISSUE149_CONTROL_RETURN_EVENT_V1 on Issue #149 with source_recovery_wake: $wake, source_terminal_receipt: $workerTerminalReceipt, exact target generation/conversation id/url resolved from newest ACTIVE switch, required_ack_protocol: CONTROL_G12_ISSUE149_RETURN_ACK_V1, and an exactly-once wake_id. Then wait read-only until that exact existing Control conversation is idle. Deliver exactly ONE minimal wake to that exact existing Control conversation using the proven #87 browser automation route, not src/gpt_send.mjs and not the old DB01 sender: `Read GitHub directly. Rehydrate D22977/gpt-browser-bridge Issue #149 latest durable return event and terminal, then execute only the current legal Control action.` Do not create a fresh conversation. Do not press Stop. No second send. If the physical send boundary is ambiguous, publish UNCERTAIN_SEND_NO_BLIND_RETRY and do not retry. After confirmed single delivery, wait for exactly one durable CONTROL_G12_ISSUE149_RETURN_ACK_V1 matching the return event/wake_id. Publish/read-back exactly one G12_ISSUE149_CONTROL_RETURN_TRANSPORT_RESULT_V1 with source_recovery_wake: $wake, source_terminal_receipt: $workerTerminalReceipt, event receipt, target identity, physical_send_count, second_physical_send=false, ack receipt/count, user_relay_count=0, and final state ACK_CONFIRMED or typed failure."
            $returnPromptCount = 1
            $retPromptRaw = ((& $herdr --session $named agent prompt $returnAgent $returnPrompt 2>&1) | Out-String).Trim()
            $returnPromptExit = $LASTEXITCODE
            @{status='RETURN_TRANSPORT_SENT';wake=$wake;worker_prompt_count=1;return_prompt_count=1;worker_terminal_receipt=$workerTerminalReceipt}|ConvertTo-Json|Set-Content -LiteralPath $statePath -Encoding utf8
            $retDelivery = @(
              'G12_ISSUE149_CONTROL_RETURN_AGENT_DELIVERY_V1'
              'state: TRANSPORT_PROMPT_SUBMITTED'
              "source_recovery_wake: $wake"
              "authority_receipt: $authority"
              "source_terminal_receipt: $workerTerminalReceipt"
              "named_session: $named"
              "fresh_transport_workspace: $returnWorkspace"
              "fresh_transport_pane: $returnPane"
              "fresh_transport_agent: $returnAgent"
              "fresh_transport_agent_session: $returnNative"
              'return_transport_prompt_count: 1'
              "prompt_exit: $returnPromptExit"
              'second_return_transport_prompt: false'
              'user_task_result_relay_count: 0'
              'readback_verified: true'
              "idempotency_key: $idem"
            ) -join "`n"
            [void](Publish $retDelivery)
            if ($returnPromptExit -ne 0) { throw "return transport prompt exit=$returnPromptExit after boundary" }

            $phase = 'WAIT_CONTROL_RETURN_RESULT'
            $returnResult = $null
            for ($i=0; $i -lt 900; $i++) {
              $returnResult = FindRecoveryReceipt 'G12_ISSUE149_CONTROL_RETURN_TRANSPORT_RESULT_V1' $wake $since
              if ($null -ne $returnResult) { break }
              $rr = ((& $herdr --session $named agent get $returnAgent 2>&1) | Out-String).Trim()
              if ($LASTEXITCODE -ne 0) { throw "return transport agent lost without result: $(Safe $rr)" }
              $ro = $rr | ConvertFrom-Json
              if ([string]$ro.result.agent.agent_status -eq 'blocked') { throw 'return transport agent blocked after one prompt; no second prompt authorized' }
              Start-Sleep -Seconds 5
            }
            if ($null -eq $returnResult) { throw 'Control return result timeout after one transport prompt' }
            $final = @(
              'G12_ISSUE149_IDLE_R2_AND_RETURN_RESULT_V1'
              'state: TERMINAL_RETURN_RESULT_OBSERVED'
              "source_recovery_wake: $wake"
              "authority_receipt: $authority"
              "worker_terminal_receipt: $workerTerminalReceipt"
              "control_return_result_receipt: $($returnResult.id)"
              'worker_prompt_count: 1'
              'return_transport_prompt_count: 1'
              'second_worker_prompt: false'
              'second_return_transport_prompt: false'
              'user_task_result_relay_count: 0'
              'readback_verified: true'
              "idempotency_key: $idem"
            ) -join "`n"
            [void](Publish $final)
          }
          catch {
            if (-not [string]::IsNullOrWhiteSpace($profilePath) -and (Test-Path -LiteralPath $profilePath)) {
              try { Remove-Item -LiteralPath $profilePath -Force -ErrorAction Stop } catch {}
            }
            $diag = Safe $_.Exception.Message
            $state = if ($returnPromptCount -gt 0) { 'CONTROL_REQUIRED_RETURN_TRANSPORT_NO_BLIND_RETRY' } elseif ($workerPromptCount -gt 0) { 'CONTROL_REQUIRED_AFTER_WORKER_PROMPT_NO_BLIND_RETRY' } else { 'CONTROL_REQUIRED_PRE_WORKER_NO_SEND' }
            try {
              $fail = @(
                'G12_ISSUE149_IDLE_R2_AND_RETURN_RESULT_V1'
                "state: $state"
                "source_recovery_wake: $wake"
                "authority_receipt: $authority"
                "phase: $phase"
                "diagnostic: $diag"
                "worker_terminal_receipt: $(if([string]::IsNullOrWhiteSpace($workerTerminalReceipt)){'NONE'}else{$workerTerminalReceipt})"
                "worker_prompt_count: $workerPromptCount"
                "return_transport_prompt_count: $returnPromptCount"
                'second_worker_prompt: false'
                'second_return_transport_prompt: false'
                'owner_enter_count: 0'
                'manual_enter_used: false'
                'send_keys_used: false'
                'orca_used: false'
                'user_task_result_relay_count: 0'
                'readback_verified: true'
              ) -join "`n"
              [void](Publish $fail)
            } catch {}
            exit 1
          }
