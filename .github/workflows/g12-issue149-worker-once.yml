name: G12 Issue149 Fresh Herdr Worker Once

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: g12-issue149-worker-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  launch-worker:
    if: >-
      github.event.issue.number == 149 &&
      github.event.comment.user.login == 'D22977' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, 'G12_ISSUE149_WORKER_WAKE_V1')
    runs-on: [self-hosted, Windows, GBB-REVIEWER]
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh -NoProfile -File {0}
    steps:
      - name: Fresh exact-bound Issue149 Worker via proven Actions Herdr route
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = 'D22977/gpt-browser-bridge'
          $issue = 149
          $authority = '5609772647'
          $switchReceipt = '5601634172'
          $requiredBranch = 'worker/g12-control-doorbell-physical-submit-repair-01'
          $baseRepo = 'D:\AIWORK\GPT_BROWSER_BRIDGE'
          $herdr = 'C:\Users\Lupun\AppData\Local\Programs\Herdr\bin\herdr.exe'
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            'User-Agent' = 'g12-issue149-worker-once'
            Accept = 'application/vnd.github+json'
          }

          function Need([string]$body,[string]$pattern,[string]$name) {
            $m = [regex]::Match($body,$pattern)
            if (-not $m.Success) { throw "Malformed field: $name" }
            return $m.Groups[1].Value
          }
          function Safe([string]$text) {
            if ($null -eq $text) { return '' }
            $v = ($text -replace '[\r\n]+',' ' -replace '[\x00-\x1F]',' ').Trim()
            if ($v.Length -gt 1200) { return $v.Substring(0,1200) }
            return $v
          }
          function Publish([string]$text) {
            $payload = @{ body = $text } | ConvertTo-Json -Compress
            $posted = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/issues/$issue/comments" -Headers $headers -Method Post -Body $payload -ContentType 'application/json' -TimeoutSec 30
            $readback = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/issues/comments/$($posted.id)" -Headers $headers -Method Get -TimeoutSec 30
            if ([string]$readback.body -cne $text) { throw "readback mismatch receipt=$($posted.id)" }
            return [string]$posted.id
          }
          function FindReceipt([string]$protocol,[string]$wake,[string]$since) {
            for ($page=1; $page -le 12; $page++) {
              $rows = @(Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/issues/$issue/comments?since=$since&per_page=100&page=$page" -Headers $headers -Method Get -TimeoutSec 30)
              foreach ($row in $rows) {
                $b = [string]$row.body
                if ($b.StartsWith($protocol) -and $b -match "(?m)^source_bootstrap_wake:\s*$wake\s*$") { return $row }
              }
              if ($rows.Count -lt 100) { break }
            }
            return $null
          }
          function AssertNoNewerSwitch([string]$createdAt) {
            $sinceSwitch = [uri]::EscapeDataString($createdAt)
            for ($page=1; $page -le 10; $page++) {
              $rows = @(Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/issues/88/comments?since=$sinceSwitch&per_page=100&page=$page" -Headers $headers -Method Get -TimeoutSec 30)
              foreach ($row in $rows) {
                if ([string]$row.id -eq $switchReceipt) { continue }
                $b = [string]$row.body
                if ($b -match '(?m)^CONTROL_GENERATION_SWITCH_V1\s*$' -and $b -match '(?m)^state:\s*SWITCH_COMMITTED\s*$') { throw "newer committed Control switch exists receipt=$($row.id)" }
              }
              if ($rows.Count -lt 100) { break }
            }
          }
          function RemoteBranchExists([string]$branch) {
            try {
              $escaped = $branch -replace '/', '%2F'
              $null = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/git/ref/heads/$escaped" -Headers $headers -Method Get -TimeoutSec 30
              return $true
            } catch {
              $code = 0
              try { $code = [int]$_.Exception.Response.StatusCode } catch {}
              if ($code -eq 404 -or $_.Exception.Message -match '404') { return $false }
              throw
            }
          }

          $phase = 'PREFLIGHT'
          $promptCount = 0
          $named = ''
          $workspace = ''
          $pane = ''
          $agent = ''
          $native = ''
          $runtimeRepo = ''
          $deliveryReceipt = ''
          $event = Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
          $body = [string]$event.comment.body
          $wake = [string]$event.comment.id
          $since = [uri]::EscapeDataString([string]$event.comment.created_at)
          $stateRoot = "D:\AIWORK_RUNTIME\GPT_BROWSER_BRIDGE\issue149-worker\$wake"
          $statePath = Join-Path $stateRoot 'transport.json'
          New-Item -ItemType Directory -Force -Path $stateRoot | Out-Null

          try {
            $wakeAuthority = Need $body '(?m)^authority_receipt:\s*(\d+)\s*$' 'authority_receipt'
            $wakeGeneration = Need $body '(?m)^control_generation:\s*(\d+)\s*$' 'control_generation'
            $integrationHead = Need $body '(?m)^launcher_integration_head:\s*([0-9a-f]{40})\s*$' 'launcher_integration_head'
            $workerBase = Need $body '(?m)^worker_base_sha:\s*([0-9a-f]{40})\s*$' 'worker_base_sha'
            $idem = Need $body '(?m)^idempotency_key:\s*([A-Za-z0-9._:-]+)\s*$' 'idempotency_key'
            if ($wakeAuthority -cne $authority -or $wakeGeneration -cne '012') { throw 'wake authority/generation mismatch' }
            if ($integrationHead -cne $workerBase) { throw 'worker base must equal launcher integration head' }

            if (Test-Path -LiteralPath $statePath) {
              $old = Get-Content -LiteralPath $statePath -Raw | ConvertFrom-Json
              $dup = @(
                'G12_ISSUE149_WORKER_LAUNCH_RESULT_V1'
                'state: NO_OP_DUPLICATE'
                "source_bootstrap_wake: $wake"
                "authority_receipt: $authority"
                "prior_state: $([string]$old.status)"
                'physical_prompt_count: 0'
                'second_physical_prompt: false'
                'user_task_result_relay_count: 0'
                'readback_verified: true'
                "idempotency_key: $idem"
              ) -join "`n"
              [void](Publish $dup)
              exit 0
            }
            @{status='PREPARING';phase=$phase;wake=$wake;prompt_count=0}|ConvertTo-Json|Set-Content -LiteralPath $statePath -Encoding utf8

            $auth = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/issues/comments/$authority" -Headers $headers -Method Get -TimeoutSec 30
            if (-not ([string]$auth.body).StartsWith('CONTROL_G12_ISSUE149_TRANSIENT_WORKER_LAUNCHER_AUTHORITY_V1')) { throw 'wrong launcher authority receipt' }
            $card = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/issues/$issue" -Headers $headers -Method Get -TimeoutSec 30
            $cardBody = [string]$card.body
            if (-not $cardBody.StartsWith('DISPATCH_CARD_V1') -or $cardBody -notmatch '(?m)^card_id:\s*GBB-G12-CONTROL-DOORBELL-PHYSICAL-SUBMIT-REPAIR-01\s*$') { throw 'Issue149 card mismatch' }

            $sw = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/issues/comments/$switchReceipt" -Headers $headers -Method Get -TimeoutSec 30
            $swBody = [string]$sw.body
            if (-not $swBody.StartsWith('CONTROL_GENERATION_SWITCH_V1') -or $swBody -notmatch '(?m)^state:\s*SWITCH_COMMITTED\s*$' -or $swBody -notmatch '(?m)^new_generation:\s*012\s*$' -or $swBody -notmatch '(?m)^new_generation_status:\s*ACTIVE\s*$') { throw 'generation012 is not exact ACTIVE switch' }
            AssertNoNewerSwitch ([string]$sw.created_at)

            $ref = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/git/ref/heads/review-base/gbb-gh-01" -Headers $headers -Method Get -TimeoutSec 30
            if ([string]$ref.object.sha -cne $workerBase) { throw "default head drift expected=$workerBase actual=$([string]$ref.object.sha)" }
            if (RemoteBranchExists $requiredBranch) { throw 'required Worker branch already exists before send' }

            if ($env:RUNNER_NAME -cne 'gbb-reviewer-win-01') { throw "unexpected runner=$env:RUNNER_NAME" }
            if (-not [Environment]::UserInteractive -or [Diagnostics.Process]::GetCurrentProcess().SessionId -eq 0) { throw 'runner is not interactive user session' }
            if (-not (Test-Path -LiteralPath $herdr -PathType Leaf)) { throw 'Herdr CLI missing' }
            $hv = ((& $herdr --version 2>&1) | Out-String).Trim()
            if ($LASTEXITCODE -ne 0 -or $hv -notmatch '0\.8\.2') { throw "Herdr version mismatch: $(Safe $hv)" }
            $cv = ((& codex --version 2>&1) | Out-String).Trim()
            if ($LASTEXITCODE -ne 0) { throw "Codex version failed: $(Safe $cv)" }
            $ch = ((& codex --help 2>&1) | Out-String)
            if ($LASTEXITCODE -ne 0 -or $ch -notmatch '(?m)--profile') { throw 'Codex --profile unsupported' }
            if (-not (Test-Path -LiteralPath $baseRepo -PathType Container)) { throw 'local base repo missing' }
            $origin = ((& git -C $baseRepo remote get-url origin 2>&1) | Out-String).Trim()
            if ($LASTEXITCODE -ne 0 -or $origin -notmatch 'D22977/gpt-browser-bridge(\.git)?$') { throw "local repo origin mismatch: $(Safe $origin)" }

            $phase = 'CREATE_CLEAN_WORKTREE'
            & git -C $baseRepo fetch origin $workerBase --quiet
            if ($LASTEXITCODE -ne 0) { throw 'git fetch exact worker base failed' }
            $runtimeRepo = Join-Path $stateRoot 'repo'
            if (Test-Path -LiteralPath $runtimeRepo) { throw 'runtime worktree already exists' }
            $wt = ((& git -C $baseRepo worktree add --detach $runtimeRepo $workerBase 2>&1) | Out-String).Trim()
            if ($LASTEXITCODE -ne 0) { throw "worktree add failed: $(Safe $wt)" }
            $head = ((& git -C $runtimeRepo rev-parse HEAD 2>&1) | Out-String).Trim()
            $dirty = ((& git -C $runtimeRepo status --porcelain=v1 --untracked-files=all 2>&1) | Out-String)
            if ($head -cne $workerBase -or -not [string]::IsNullOrWhiteSpace($dirty)) { throw 'runtime worktree is not clean exact base' }

            $suffix = $wake.Substring([Math]::Max(0,$wake.Length-8))
            $profile = "g149worker$suffix"
            $named = "g149-worker-$suffix"
            $agent = "g149w$suffix"
            if ($agent.Length -gt 32) { $agent = $agent.Substring(0,32) }
            $codexHome = if (-not [string]::IsNullOrWhiteSpace($env:CODEX_HOME)) { $env:CODEX_HOME } else { Join-Path $HOME '.codex' }
            if (-not (Test-Path -LiteralPath $codexHome -PathType Container)) { throw 'CODEX_HOME missing' }
            $profilePath = Join-Path $codexHome "$profile.config.toml"
            if (Test-Path -LiteralPath $profilePath) { throw 'task Codex profile already exists' }
            if ($runtimeRepo.Contains("'")) { throw 'runtime repo path cannot be represented as TOML literal key' }
            Set-Content -LiteralPath $profilePath -Value "[projects.'$runtimeRepo']`ntrust_level = `"trusted`"`n" -Encoding utf8 -NoNewline

            $phase = 'START_FRESH_NAMED_HERDR'
            $hout = Join-Path $stateRoot 'herdr.out'
            $herr = Join-Path $stateRoot 'herdr.err'
            $server = Start-Process $herdr -ArgumentList @('--session',$named,'server') -PassThru -WindowStyle Hidden -RedirectStandardOutput $hout -RedirectStandardError $herr
            $ready = $false
            for ($i=0; $i -lt 40; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $sr = ((& $herdr --session $named status server 2>&1) | Out-String).Trim()
                if ($LASTEXITCODE -eq 0 -and $sr -notmatch 'protocol_mismatch|protocol 19') { $ready=$true; break }
              } catch {}
              if ($server.HasExited) { break }
            }
            if (-not $ready) { throw 'fresh named Herdr server unavailable' }

            $phase = 'START_FRESH_CODEX_AGENT'
            $cr = ((& $herdr --session $named workspace create --cwd $runtimeRepo --label "g149-$wake" --no-focus 2>&1) | Out-String).Trim()
            if ($LASTEXITCODE -ne 0) { throw "workspace create failed: $(Safe $cr)" }
            $wo = $cr | ConvertFrom-Json
            $workspace = [string]$wo.result.workspace.workspace_id
            $pane = [string]$wo.result.root_pane.pane_id
            if ([string]::IsNullOrWhiteSpace($workspace) -or [string]::IsNullOrWhiteSpace($pane)) { throw 'fresh workspace identity missing' }
            $cmd = "codex --profile $profile --approve-for-me"
            $run = ((& $herdr --session $named pane run $pane $cmd 2>&1) | Out-String).Trim()
            if ($LASTEXITCODE -ne 0) { throw "Codex launch failed: $(Safe $run)" }

            $agentObj = $null
            for ($i=0; $i -lt 75; $i++) {
              Start-Sleep -Seconds 1
              $gr = ((& $herdr --session $named agent get $pane 2>&1) | Out-String).Trim()
              if ($LASTEXITCODE -eq 0) {
                try { $go=$gr|ConvertFrom-Json; if ([string]$go.result.agent.pane_id -ceq $pane) { $agentObj=$go; break } } catch {}
              }
            }
            if ($null -eq $agentObj) { throw 'Codex agent detection timeout' }
            $settled = $false
            $agentStatus = ''
            for ($i=0; $i -lt 45; $i++) {
              $gr = ((& $herdr --session $named agent get $pane 2>&1) | Out-String).Trim()
              if ($LASTEXITCODE -eq 0) {
                $go = $gr | ConvertFrom-Json
                $agentStatus = [string]$go.result.agent.agent_status
                if ($agentStatus -in @('idle','done','blocked')) { $settled=$true; break }
              }
              Start-Sleep -Seconds 1
            }
            if (-not $settled -or $agentStatus -eq 'blocked') {
              $rr = ((& $herdr --session $named agent read $pane --source recent-unwrapped --lines 120 2>&1) | Out-String).Trim()
              throw "fresh Codex not prompt-ready status=$agentStatus readback=$(Safe $rr)"
            }
            $rn = ((& $herdr --session $named agent rename $pane $agent 2>&1) | Out-String).Trim()
            if ($LASTEXITCODE -ne 0) { throw "agent rename failed: $(Safe $rn)" }
            $gr = ((& $herdr --session $named agent get $agent 2>&1) | Out-String).Trim()
            if ($LASTEXITCODE -ne 0) { throw 'renamed agent lookup failed' }
            $go = $gr | ConvertFrom-Json
            if ([string]$go.result.agent.name -cne $agent -or [string]$go.result.agent.pane_id -cne $pane) { throw 'renamed agent identity mismatch' }
            $native = [string]$go.result.agent.agent_session.value
            if ([string]::IsNullOrWhiteSpace($native)) { $native='UNREPORTED_NATIVE_SESSION' }
            Remove-Item -LiteralPath $profilePath -Force

            $phase = 'FINAL_PRESEND_ADMISSION'
            $ref2 = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/git/ref/heads/review-base/gbb-gh-01" -Headers $headers -Method Get -TimeoutSec 30
            if ([string]$ref2.object.sha -cne $workerBase) { throw 'default drift before Worker prompt' }
            AssertNoNewerSwitch ([string]$sw.created_at)
            if (RemoteBranchExists $requiredBranch) { throw 'Worker branch appeared before Worker prompt' }
            $head2 = ((& git -C $runtimeRepo rev-parse HEAD 2>&1) | Out-String).Trim()
            $dirty2 = ((& git -C $runtimeRepo status --porcelain=v1 --untracked-files=all 2>&1) | Out-String)
            if ($head2 -cne $workerBase -or -not [string]::IsNullOrWhiteSpace($dirty2)) { throw 'runtime worktree changed before Worker prompt' }

            $phase = 'SENDING'
            @{status='SENDING';phase=$phase;wake=$wake;named=$named;workspace=$workspace;pane=$pane;agent=$agent;prompt_count=0;worker_base=$workerBase}|ConvertTo-Json|Set-Content -LiteralPath $statePath -Encoding utf8
            $prompt = "Read GitHub directly. Rehydrate D22977/gpt-browser-bridge Issue #149, exact transport authority 5609772647, and source_bootstrap_wake $wake. Execute only card GBB-G12-CONTROL-DOORBELL-PHYSICAL-SUBMIT-REPAIR-01 from exact clean base $workerBase. Create only branch worker/g12-control-doorbell-physical-submit-repair-01. Before any tracked mutation, publish/read-back GBB_G12_CONTROL_DOORBELL_PHYSICAL_SUBMIT_REPAIR_CONSUMED_STARTED_V1 including source_bootstrap_wake: $wake, fresh identity, cwd, base and branch. Then implement only src/gpt_send.mjs, .github/workflows/herdr-control-comment-bridge.yml, and tests/baseline.test.mjs; perform the card's live NO-SEND diagnostic and all required verification; push the exact branch; publish/read-back GBB_G12_CONTROL_DOORBELL_PHYSICAL_SUBMIT_REPAIR_RESULT_V1 including source_bootstrap_wake: $wake. Do not run a live Control canary, do not merge/release, do not retry return request 5602620127 or any historical wake. Stop at terminal."
            $promptCount = 1
            $raw = ((& $herdr --session $named agent prompt $agent $prompt 2>&1) | Out-String).Trim()
            $promptExit = $LASTEXITCODE
            @{status='SENT';phase='WAIT_WORKER_TERMINAL';wake=$wake;named=$named;workspace=$workspace;pane=$pane;agent=$agent;prompt_count=1;prompt_exit=$promptExit;worker_base=$workerBase}|ConvertTo-Json|Set-Content -LiteralPath $statePath -Encoding utf8

            $delivery = @(
              'G12_ISSUE149_WORKER_DELIVERY_V1'
              'state: PROMPT_SUBMITTED_WAIT_WORKER'
              "source_bootstrap_wake: $wake"
              "authority_receipt: $authority"
              "worker_base_sha: $workerBase"
              "required_worker_branch: $requiredBranch"
              "runtime_worktree: $runtimeRepo"
              "herdr_version: $(Safe $hv)"
              "codex_version: $(Safe $cv)"
              "named_session: $named"
              "fresh_workspace: $workspace"
              "fresh_pane: $pane"
              "fresh_agent: $agent"
              "fresh_agent_session: $native"
              'physical_prompt_count: 1'
              "prompt_exit: $promptExit"
              'owner_enter_count: 0'
              'manual_enter_used: false'
              'send_keys_used: false'
              'orca_used: false'
              "workflow_run_id: $env:GITHUB_RUN_ID"
              'user_task_result_relay_count: 0'
              'readback_verified: true'
              "idempotency_key: $idem"
            ) -join "`n"
            $deliveryReceipt = Publish $delivery
            if ($promptExit -ne 0) { throw "Herdr prompt returned exit=$promptExit after submit boundary" }

            $phase = 'WAIT_WORKER_TERMINAL_GUARD'
            $consumed = $null
            $terminal = $null
            for ($i=0; $i -lt 1200; $i++) {
              if ($null -eq $consumed) { $consumed = FindReceipt 'GBB_G12_CONTROL_DOORBELL_PHYSICAL_SUBMIT_REPAIR_CONSUMED_STARTED_V1' $wake $since }
              $terminal = FindReceipt 'GBB_G12_CONTROL_DOORBELL_PHYSICAL_SUBMIT_REPAIR_RESULT_V1' $wake $since
              if ($null -ne $terminal) { break }
              $graw = ((& $herdr --session $named agent get $agent 2>&1) | Out-String).Trim()
              if ($LASTEXITCODE -ne 0) { throw "fresh Worker agent lost without terminal: $(Safe $graw)" }
              $g = $graw | ConvertFrom-Json
              $as = [string]$g.result.agent.agent_status
              if ($as -eq 'blocked') {
                $rr = ((& $herdr --session $named agent read $agent --source recent-unwrapped --lines 120 2>&1) | Out-String).Trim()
                $blocked = @(
                  'G12_ISSUE149_WORKER_LAUNCH_RESULT_V1'
                  'state: CONTROL_REQUIRED_TOOL_APPROVAL_OR_INPUT_BLOCK'
                  "source_bootstrap_wake: $wake"
                  "authority_receipt: $authority"
                  "delivery_receipt: $deliveryReceipt"
                  "consumed_receipt: $(if($consumed){$consumed.id}else{'NONE'})"
                  "agent_status: $as"
                  "agent_readback: $(Safe $rr)"
                  'physical_prompt_count: 1'
                  'second_physical_prompt: false'
                  'owner_enter_count: 0'
                  'user_task_result_relay_count: 0'
                  'readback_verified: true'
                  "idempotency_key: $idem"
                ) -join "`n"
                [void](Publish $blocked)
                exit 0
              }
              Start-Sleep -Seconds 5
            }
            if ($null -eq $terminal) { throw 'Worker terminal guard timeout after one physical prompt' }

            $tb = [string]$terminal.body
            $decision = 'UNPARSED'
            $dm = [regex]::Match($tb,'(?m)^(?:state|decision):\s*([A-Z0-9_]+)\s*$')
            if ($dm.Success) { $decision=$dm.Groups[1].Value }
            $result = @(
              'G12_ISSUE149_WORKER_LAUNCH_RESULT_V1'
              "state: WORKER_TERMINAL_OBSERVED_$decision"
              "source_bootstrap_wake: $wake"
              "authority_receipt: $authority"
              "delivery_receipt: $deliveryReceipt"
              "worker_terminal_receipt: $($terminal.id)"
              "consumed_receipt: $(if($consumed){$consumed.id}else{'NONE'})"
              "worker_base_sha: $workerBase"
              "required_worker_branch: $requiredBranch"
              "runtime_worktree: $runtimeRepo"
              "named_session: $named"
              "fresh_workspace: $workspace"
              "fresh_pane: $pane"
              "fresh_agent: $agent"
              "fresh_agent_session: $native"
              'physical_prompt_count: 1'
              'second_physical_prompt: false'
              'worker_left_parked: true'
              'user_task_result_relay_count: 0'
              'readback_verified: true'
              "idempotency_key: $idem"
            ) -join "`n"
            [void](Publish $result)
          }
          catch {
            $diag = Safe $_.Exception.Message
            $state = if ($promptCount -gt 0) { 'UNCERTAIN_SEND_NO_BLIND_RETRY' } else { 'CONTROL_REQUIRED_PREPROMPT_NO_SEND' }
            try {
              $terminal = @(
                'G12_ISSUE149_WORKER_LAUNCH_RESULT_V1'
                "state: $state"
                "source_bootstrap_wake: $wake"
                "authority_receipt: $authority"
                "phase: $phase"
                "diagnostic: $diag"
                "delivery_receipt: $(if([string]::IsNullOrWhiteSpace($deliveryReceipt)){'NONE'}else{$deliveryReceipt})"
                "worker_base_sha: $(if($null -eq $workerBase){'UNKNOWN'}else{$workerBase})"
                "runtime_worktree: $runtimeRepo"
                "named_session: $named"
                "fresh_workspace: $workspace"
                "fresh_pane: $pane"
                "fresh_agent: $agent"
                "fresh_agent_session: $native"
                "physical_prompt_count: $promptCount"
                'second_physical_prompt: false'
                'owner_enter_count: 0'
                'manual_enter_used: false'
                'send_keys_used: false'
                'orca_used: false'
                'user_task_result_relay_count: 0'
                'readback_verified: true'
              ) -join "`n"
              [void](Publish $terminal)
            } catch {}
            exit 1
          }
