            $r = @('CONTROL_DOORBELL_V1','state: CONTROL_REQUIRED_RUNTIME_UNAVAILABLE',"source_return_request_receipt: $($env:RETURN_COMMENT_ID)","active_switch_receipt: $($env:ACTIVE_SWITCH_RECEIPT)","target_control_generation: $($env:TARGET_GENERATION)","target_control_conversation_id: $($env:TARGET_CONVERSATION_ID)","sender_session: $senderSession",'first_missing_capability: CURRENT_PLAYWRIGHT_CONTROL_SESSION_OR_EXACT_CHATGPT_TAB',"diagnostic: $detail", "workflow_run_id: $env:GITHUB_RUN_ID",'user_relay_count: 0') -join "`n"
            $id = Publish-Receipt $r
            throw "sender preflight failed; receipt=$id"
          } finally {
            Remove-Item -LiteralPath $probePath -Force -ErrorAction SilentlyContinue
          }

          $state = @{ status='SENDING'; source_return_request_receipt=$env:RETURN_COMMENT_ID; active_switch_receipt=$env:ACTIVE_SWITCH_RECEIPT; target_generation=$env:TARGET_GENERATION; target_conversation_id=$env:TARGET_CONVERSATION_ID; workflow_run_id=$env:GITHUB_RUN_ID; started_at=(Get-Date).ToString('o') }
          $state | ConvertTo-Json | Set-Content -LiteralPath $statePath -Encoding utf8

          $prompt = "Read GitHub directly. D22977/gpt-browser-bridge Issue #103 CONTROL_RETURN_REQUEST_V1 receipt $($env:RETURN_COMMENT_ID). Rehydrate current #88/#43/#81 and execute only the current bounded Control-return action. GitHub is authority."
          $env:GBB_DOORBELL_PROMPT = $prompt
          $sendScript = @'
          import { pathToFileURL } from 'node:url';
          const mod = await import(pathToFileURL(process.env.GBB_SENDER_PATH).href);
          const result = await mod.sendJob({
            prompt: process.env.GBB_DOORBELL_PROMPT,
            attempt: 1,
            conversationUrl: process.env.GBB_TARGET_URL,
            runtimeRoot: process.env.GBB_RUNTIME_ROOT,
            session: process.env.GBB_SENDER_SESSION,
            allowBackgroundTab: true,
          });
          console.log(JSON.stringify({job_id: result.job.job_id, job_path: result.jobPath, conversation_url: result.job.conversation_url, prompt_hash: result.job.prompt_hash}));
          '@
          $sendPath = Join-Path $env:RUNNER_TEMP "gbb-control-return-send-$env:GITHUB_RUN_ID.mjs"
          Set-Content -LiteralPath $sendPath -Value $sendScript -Encoding utf8
          try {
            $sendOut = (& node $sendPath 2>&1 | Out-String).Trim()
            if ($LASTEXITCODE -ne 0) { throw $sendOut }
            $sendJsonLine = ($sendOut -split "`n" | Where-Object { $_.Trim().StartsWith('{') } | Select-Object -Last 1)
            if (-not $sendJsonLine) { throw "Sender returned no JSON result: $sendOut" }
            $sent = $sendJsonLine | ConvertFrom-Json
          } catch {
            $detail = ($_.Exception.Message -replace '[\r\n]+',' ')
            if ($detail.Length -gt 500) { $detail = $detail.Substring(0,500) }
            $r = @('CONTROL_DOORBELL_V1','state: UNCERTAIN_SEND',"source_return_request_receipt: $($env:RETURN_COMMENT_ID)","active_switch_receipt: $($env:ACTIVE_SWITCH_RECEIPT)","target_control_generation: $($env:TARGET_GENERATION)","target_control_conversation_id: $($env:TARGET_CONVERSATION_ID)","sender_session: $senderSession",'no_blind_retry: true',"diagnostic: $detail", "workflow_run_id: $env:GITHUB_RUN_ID",'user_relay_count: 0') -join "`n"
            $id = Publish-Receipt $r
            throw "physical send uncertain; receipt=$id"
          } finally {
            Remove-Item -LiteralPath $sendPath -Force -ErrorAction SilentlyContinue
          }

          $state.status = 'SENT'
          $state.sent_at = (Get-Date).ToString('o')
          $state.sender_job_id = [string]$sent.job_id
          $state | ConvertTo-Json | Set-Content -LiteralPath $statePath -Encoding utf8

          $receipt = @(
            'CONTROL_DOORBELL_V1'
            'state: DELIVERED'
            'decision: PASS'
            "source_return_request_receipt: $($env:RETURN_COMMENT_ID)"
            "active_switch_receipt: $($env:ACTIVE_SWITCH_RECEIPT)"
            "target_control_generation: $($env:TARGET_GENERATION)"
            "target_control_conversation_id: $($env:TARGET_CONVERSATION_ID)"
            "target_control_conversation_url: $($env:TARGET_CONVERSATION_URL)"
            "sender_module_blob: $expectedBlob"
            "sender_session: $senderSession"
            "sender_job_id: $($sent.job_id)"
            "sender_prompt_hash: $($sent.prompt_hash)"
            "workflow_run_id: $env:GITHUB_RUN_ID"
            "runner_name: $env:RUNNER_NAME"
            'physical_send_count: 1'
            'user_relay_count: 0'
            'semantic_control_authority: false'
            'readback_required: true'
          ) -join "`n"
          $id = Publish-Receipt $receipt
          Write-Output "Control doorbell delivered receipt=$id sender_job=$($sent.job_id)"
          "DOORBELL_RECEIPT_ID=$id" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify durable doorbell receipt read-back
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:DOORBELL_RECEIPT_ID)) {
            Write-Output 'No success/no-op receipt id exported; prior step already failed with durable typed receipt when possible.'
            exit 0
          }
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; 'User-Agent' = 'gbb-control-return-bridge'; Accept = 'application/vnd.github+json' }
          $uri = "https://api.github.com/repos/D22977/gpt-browser-bridge/issues/comments/$($env:DOORBELL_RECEIPT_ID)"
          $r = Invoke-RestMethod -Uri $uri -Headers $headers -Method Get -TimeoutSec 30
          if ([string]$r.body -notmatch '(?m)^CONTROL_DOORBELL_V1\s*$') { throw 'Doorbell receipt read-back header mismatch' }
          if ([string]$r.body -notmatch "(?m)^source_return_request_receipt:\s*$([regex]::Escape($env:RETURN_COMMENT_ID))\s*$") { throw 'Doorbell receipt read-back source mismatch' }
          Write-Output "doorbell receipt read-back PASS id=$($env:DOORBELL_RECEIPT_ID)"
