name: G8 DB01 Editor Read-Only Diagnostic

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: g8-db01-editor-readonly-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  diagnose:
    name: G8 DB01 Editor Read-Only Diagnostic
    if: >-
      github.event.issue.number == 114 &&
      github.event.comment.user.login == 'D22977' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, 'CONTROL_G8_DB01_EDITOR_READONLY_DIAGNOSTIC_V1')
    runs-on: [self-hosted, Windows, GBB-REVIEWER]
    timeout-minutes: 8
    defaults:
      run:
        shell: pwsh -NoProfile -File {0}
    steps:
      - name: Inspect exact generation008 editor without content write
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $event = Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
          if ($event.repository.full_name -cne 'D22977/gpt-browser-bridge' -or [int]$event.issue.number -ne 114) { throw 'Wrong repository/issue' }
          if ($event.comment.user.login -cne 'D22977' -or $event.comment.author_association -cne 'OWNER') { throw 'Wrong actor' }
          $body = [string]$event.comment.body
          if ($body -notmatch '(?m)^CONTROL_G8_DB01_EDITOR_READONLY_DIAGNOSTIC_V1\s*$') { throw 'Missing diagnostic header' }

          function Need([string]$pattern,[string]$name) {
            $m=[regex]::Match($body,$pattern)
            if(-not $m.Success){throw "Malformed diagnostic field: $name"}
            return $m.Groups[1].Value
          }
          $null=Need '(?m)^control_generation:\s*(008)\s*$' 'control_generation'
          $sourceAuthority=Need '(?m)^source_authority:\s*(5494633840)\s*$' 'source_authority'
          $expectedHead=Need '(?m)^expected_instrumentation_head:\s*([0-9a-f]{40})\s*$' 'expected_instrumentation_head'
          $null=Need '(?m)^target_control_generation:\s*(008)\s*$' 'target_control_generation'
          $null=Need '(?m)^idempotency_key:\s*([A-Za-z0-9._:-]+)\s*$' 'idempotency_key'
          if($expectedHead -cne $env:GITHUB_SHA){throw "Workflow head mismatch expected=$expectedHead actual=$env:GITHUB_SHA"}

          $whoami=(& whoami).Trim()
          $identity=[System.Security.Principal.WindowsIdentity]::GetCurrent().Name
          $sid=[System.Diagnostics.Process]::GetCurrentProcess().SessionId
          if($whoami -notmatch '(?i)^d22977\\lupun$' -or $identity -notmatch '(?i)^d22977\\lupun$' -or -not [Environment]::UserInteractive -or $sid -eq 0 -or $env:RUNNER_NAME -cne 'gbb-reviewer-win-01'){throw 'Runner identity/interactivity mismatch'}

          $headers=@{Authorization="Bearer $env:GH_TOKEN";'User-Agent'='gbb-db01-editor-diagnostic';Accept='application/vnd.github+json'}
          function Add-Flat([object]$v,$list){if($null -eq $v){return};if($v -is [System.Array]){foreach($n in $v){Add-Flat $n $list};return};[void]$list.Add($v)}
          function Get-Comments([int]$issue){
            $list=[System.Collections.Generic.List[object]]::new()
            for($p=1;$p -le 30;$p++){
              $before=$list.Count
              Add-Flat (Invoke-RestMethod -Uri "https://api.github.com/repos/D22977/gpt-browser-bridge/issues/$issue/comments?per_page=100&page=$p" -Headers $headers -Method Get -TimeoutSec 30) $list
              if(($list.Count-$before)-lt 100){break}
            }
            return $list.ToArray()
          }
          function Publish([string]$text){
            $payload=@{body=$text}|ConvertTo-Json -Compress
            $r=Invoke-RestMethod -Uri 'https://api.github.com/repos/D22977/gpt-browser-bridge/issues/114/comments' -Headers $headers -Method Post -Body $payload -ContentType 'application/json' -TimeoutSec 30
            $rb=Invoke-RestMethod -Uri "https://api.github.com/repos/D22977/gpt-browser-bridge/issues/comments/$($r.id)" -Headers $headers -Method Get -TimeoutSec 30
            if([string]$rb.body -cne $text){throw 'Diagnostic readback mismatch'}
            return [string]$r.id
          }

          $prior=@(Get-Comments 114 | Where-Object {
            $_.body -match '(?m)^CONTROL_G8_DB01_EDITOR_READONLY_DIAGNOSTIC_RESULT_V1\s*$' -and
            $_.body -match "(?m)^source_diagnostic_event:\s*$([regex]::Escape([string]$event.comment.id))\s*$"
          })
          if($prior.Count -gt 1){throw 'Conflicting duplicate diagnostic results'}
          if($prior.Count -eq 1){Write-Output "NO_OP_DUPLICATE result=$($prior[0].id)";exit 0}

          $switches=@(Get-Comments 88 | Where-Object {
            $_.body -match '(?m)^CONTROL_GENERATION_SWITCH_V1\s*$' -and
            $_.body -match '(?m)^state:\s*SWITCH_COMMITTED\s*$' -and
            $_.body -match '(?m)^new_generation_status:\s*ACTIVE\s*$'
          } | Sort-Object {[int64]$_.id})
          if($switches.Count -eq 0){throw 'No ACTIVE Control switch'}
          $latest=$switches[-1];$sb=[string]$latest.body
          $gm=[regex]::Match($sb,'(?m)^new_generation:\s*(\d{3})\s*$')
          $im=[regex]::Match($sb,'(?m)^new_conversation_id:\s*([0-9a-f-]+)\s*$')
          $um=[regex]::Match($sb,'(?m)^new_conversation_url:\s*(https://chatgpt\.com/(?:g/[A-Za-z0-9._-]+/)?c/[0-9a-f-]+)\s*$')
          if(-not($gm.Success -and $im.Success -and $um.Success) -or $gm.Groups[1].Value -cne '008'){throw 'Generation008 is not exact ACTIVE target'}

          $playwright='C:\Users\Lupun\AppData\Roaming\npm\node_modules\@playwright\cli\node_modules\.bin\playwright.cmd'
          $session='HERDR-DOORBELL-DB01-G1-20260816'
          $root='D:\AIWORK_RUNTIME\GPT_BROWSER_BRIDGE\control-doorbell'
          $profile='D:\AIWORK_RUNTIME\GPT_BROWSER_BRIDGE\control-doorbell\db01-profile'
          if(-not(Test-Path -LiteralPath $playwright) -or -not(Test-Path -LiteralPath $root -PathType Container) -or -not(Test-Path -LiteralPath $profile -PathType Container)){throw 'Required DB01 runtime path missing'}

          $restart=$false;$navigation=$false
          Push-Location $root
          try{
            $version=(& $playwright --version 2>&1|Out-String).Trim()
            $sessions=(& $playwright cli list 2>&1|Out-String);if($LASTEXITCODE -ne 0){throw 'Session list failed'}
            $tabs=(& $playwright cli "-s=$session" tab-list 2>&1|Out-String);$tabExit=$LASTEXITCODE
            if($tabExit -eq 1 -and $sessions -notmatch [regex]::Escape($session)){
              $null=(& $playwright cli "-s=$session" open --persistent "--profile=$profile" --headed 2>&1|Out-String)
              if($LASTEXITCODE -ne 0){throw 'Same-profile restart failed'};$restart=$true
            }elseif($tabExit -ne 0){throw 'DB01 session state ambiguous'}

            $tabs=(& $playwright cli "-s=$session" tab-list 2>&1|Out-String);if($LASTEXITCODE -ne 0){throw 'Tab list failed'}
            $targetLines=@($tabs -split "`r?`n" | Where-Object {$_ -match [regex]::Escape($im.Groups[1].Value)})
            if($targetLines.Count -eq 0){
              $null=(& $playwright cli "-s=$session" goto $um.Groups[1].Value 2>&1|Out-String)
              if($LASTEXITCODE -ne 0){throw 'Exact Control navigation failed'};$navigation=$true
              $tabs=(& $playwright cli "-s=$session" tab-list 2>&1|Out-String);if($LASTEXITCODE -ne 0){throw 'Post-navigation tab list failed'}
              $targetLines=@($tabs -split "`r?`n" | Where-Object {$_ -match [regex]::Escape($im.Groups[1].Value)})
            }
            if($targetLines.Count -ne 1){throw "Exact Control tab match count=$($targetLines.Count)"}
            $idx=[regex]::Match($targetLines[0],'^\s*-\s*(\d+):')
            if(-not $idx.Success){throw 'Exact Control tab index parse failed'}
            $null=(& $playwright cli "-s=$session" tab-select $idx.Groups[1].Value 2>&1|Out-String)
            if($LASTEXITCODE -ne 0){throw 'Exact Control tab select failed'}

            $script=@'
          () => {
            const nodes=Array.from(document.querySelectorAll('#prompt-textarea,[contenteditable="true"],textarea,[role="textbox"]')).slice(0,20);
            const meta=(el)=>{
              if(!el)return null;
              const r=el.getBoundingClientRect(),s=getComputedStyle(el);
              return {tag:(el.tagName||'').toLowerCase(),id:el.id||'',role:el.getAttribute('role')||'',contenteditable:el.getAttribute('contenteditable')||'',ariaLabel:el.getAttribute('aria-label')||'',placeholder:el.getAttribute('placeholder')||'',ariaDisabled:el.getAttribute('aria-disabled')||'',disabled:('disabled' in el)?Boolean(el.disabled):null,readOnly:('readOnly' in el)?Boolean(el.readOnly):null,hidden:Boolean(el.hidden),display:s.display,visibility:s.visibility,pointerEvents:s.pointerEvents,width:Math.round(r.width),height:Math.round(r.height)};
            };
            const m=location.pathname.match(/\/c\/([0-9a-f-]+)/i);
            const out={conversationId:m?m[1]:'',promptTextareaCount:document.querySelectorAll('#prompt-textarea').length,candidateCount:nodes.length,candidates:nodes.map(meta),activeElement:meta(document.activeElement)};
            const bytes=new TextEncoder().encode(JSON.stringify(out));
            let binary='';
            for(const b of bytes)binary+=String.fromCharCode(b);
            return 'GBB_META_B64:'+btoa(binary);
          }
          '@
            $raw=(& $playwright cli "-s=$session" eval $script 2>&1|Out-String);if($LASTEXITCODE -ne 0){throw 'Editor metadata eval failed'}
            $sentinels=[regex]::Matches($raw,'GBB_META_B64:([A-Za-z0-9+/=]+)')
            if($sentinels.Count -ne 1){throw "Editor metadata sentinel count=$($sentinels.Count)"}
            $json=[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($sentinels[0].Groups[1].Value))
            $meta=$json|ConvertFrom-Json
            if([string]$meta.conversationId -cne $im.Groups[1].Value){throw 'Editor metadata conversation mismatch'}

            $snapStatus='SKIPPED_NOT_UNIQUE';$refs=@()
            if([int]$meta.promptTextareaCount -eq 1){
              $snap=(& $playwright cli "-s=$session" snapshot '#prompt-textarea' 2>&1|Out-String)
              if($LASTEXITCODE -eq 0){$snapStatus='SCOPED_PASS';$refs=@([regex]::Matches($snap,'\be\d+\b')|ForEach-Object{$_.Value}|Select-Object -Unique -First 10)}else{$snapStatus="SCOPED_FAILED_EXIT_$LASTEXITCODE"}
            }

            $result=@(
              'CONTROL_G8_DB01_EDITOR_READONLY_DIAGNOSTIC_RESULT_V1',
              'state: PASS',
              'decision: PASS_READ_ONLY_DIAGNOSTIC',
              "source_authority: $sourceAuthority",
              "source_diagnostic_event: $($event.comment.id)",
              "instrumentation_head: $env:GITHUB_SHA",
              "active_switch_receipt: $($latest.id)",
              "target_control_generation: $($gm.Groups[1].Value)",
              "target_control_conversation_id: $($im.Groups[1].Value)",
              "playwright_version: $version",
              "db01_restart_performed: $($restart.ToString().ToLowerInvariant())",
              "exact_target_navigation_performed: $($navigation.ToString().ToLowerInvariant())",
              "snapshot_status: $snapStatus",
              "snapshot_refs_json: $(@($refs)|ConvertTo-Json -Compress)",
              "editor_metadata_json: $($meta|ConvertTo-Json -Compress -Depth 6)",
              'conversation_text_captured: false',
              'secret_storage_read: false',
              'prompt_browser_content_write_performed: false',
              'user_relay_count: 0',
              'readback_required: true'
            ) -join "`n"
            $rid=Publish $result
            Write-Output "diagnostic PASS receipt=$rid"
          }finally{Pop-Location}
