name: G8 Playwright Nested CLI Contract Probe

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: g8-pw-cli-contract-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  probe:
    name: G8 Playwright Nested CLI Contract Probe
    if: >-
      github.event.issue.number == 114 &&
      github.event.comment.user.login == 'D22977' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, 'CONTROL_G8_PLAYWRIGHT_NESTED_CLI_CONTRACT_PROBE_V1')
    runs-on: [self-hosted, Windows, GBB-REVIEWER]
    timeout-minutes: 8
    defaults:
      run:
        shell: pwsh -NoProfile -File {0}
    steps:
      - name: Probe constant eval output contract only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $event=Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
          if($event.repository.full_name -cne 'D22977/gpt-browser-bridge' -or [int]$event.issue.number -ne 114){throw 'Wrong repository/issue'}
          if($event.comment.user.login -cne 'D22977' -or $event.comment.author_association -cne 'OWNER'){throw 'Wrong actor'}
          $body=[string]$event.comment.body
          function Need([string]$p,[string]$n){$m=[regex]::Match($body,$p);if(-not $m.Success){throw "Malformed field: $n"};$m.Groups[1].Value}
          $null=Need '(?m)^CONTROL_G8_PLAYWRIGHT_NESTED_CLI_CONTRACT_PROBE_V1\s*$' 'header'
          $null=Need '(?m)^control_generation:\s*(008)\s*$' 'generation'
          $null=Need '(?m)^source_authority:\s*(5495112821)\s*$' 'source_authority'
          $expectedHead=Need '(?m)^expected_probe_head:\s*([0-9a-f]{40})\s*$' 'expected_probe_head'
          if($expectedHead -cne $env:GITHUB_SHA){throw "Head mismatch expected=$expectedHead actual=$env:GITHUB_SHA"}

          $whoami=(& whoami).Trim();$identity=[System.Security.Principal.WindowsIdentity]::GetCurrent().Name;$sid=[System.Diagnostics.Process]::GetCurrentProcess().SessionId
          if($whoami -notmatch '(?i)^d22977\\lupun$' -or $identity -notmatch '(?i)^d22977\\lupun$' -or -not [Environment]::UserInteractive -or $sid -eq 0 -or $env:RUNNER_NAME -cne 'gbb-reviewer-win-01'){throw 'Runner identity/interactivity mismatch'}
          $headers=@{Authorization="Bearer $env:GH_TOKEN";'User-Agent'='gbb-pw-cli-contract-probe';Accept='application/vnd.github+json'}

          $all=[System.Collections.Generic.List[object]]::new()
          function AddF([object]$v){if($null -eq $v){return};if($v -is [System.Array]){foreach($n in $v){AddF $n};return};[void]$all.Add($v)}
          for($p=1;$p -le 30;$p++){$before=$all.Count;AddF (Invoke-RestMethod -Uri "https://api.github.com/repos/D22977/gpt-browser-bridge/issues/88/comments?per_page=100&page=$p" -Headers $headers -Method Get -TimeoutSec 30);if(($all.Count-$before)-lt 100){break}}
          $switches=@($all|Where-Object{$_.body -match '(?m)^CONTROL_GENERATION_SWITCH_V1\s*$' -and $_.body -match '(?m)^state:\s*SWITCH_COMMITTED\s*$' -and $_.body -match '(?m)^new_generation_status:\s*ACTIVE\s*$'}|Sort-Object{[int64]$_.id})
          if($switches.Count -eq 0){throw 'No ACTIVE switch'}
          $latest=$switches[-1];$sb=[string]$latest.body
          $gm=[regex]::Match($sb,'(?m)^new_generation:\s*(\d{3})\s*$');$im=[regex]::Match($sb,'(?m)^new_conversation_id:\s*([0-9a-f-]+)\s*$');$um=[regex]::Match($sb,'(?m)^new_conversation_url:\s*(https://chatgpt\.com/(?:g/[A-Za-z0-9._-]+/)?c/[0-9a-f-]+)\s*$')
          if(-not($gm.Success -and $im.Success -and $um.Success) -or $gm.Groups[1].Value -cne '008'){throw 'Generation008 not exact ACTIVE target'}

          $playwright='C:\Users\Lupun\AppData\Roaming\npm\node_modules\@playwright\cli\node_modules\.bin\playwright.cmd'
          $session='HERDR-DOORBELL-DB01-G1-20260816';$root='D:\AIWORK_RUNTIME\GPT_BROWSER_BRIDGE\control-doorbell';$profile='D:\AIWORK_RUNTIME\GPT_BROWSER_BRIDGE\control-doorbell\db01-profile'
          if(-not(Test-Path -LiteralPath $playwright) -or -not(Test-Path -LiteralPath $root -PathType Container) -or -not(Test-Path -LiteralPath $profile -PathType Container)){throw 'DB01 runtime path missing'}
          Push-Location $root
          try{
            $sessions=(& $playwright cli list 2>&1|Out-String);if($LASTEXITCODE -ne 0){throw 'Session list failed'}
            $tabs=(& $playwright cli "-s=$session" tab-list 2>&1|Out-String);$te=$LASTEXITCODE
            $restart=$false;$navigation=$false
            if($te -eq 1 -and $sessions -notmatch [regex]::Escape($session)){$null=(& $playwright cli "-s=$session" open --persistent "--profile=$profile" --headed 2>&1|Out-String);if($LASTEXITCODE -ne 0){throw 'Same-profile restart failed'};$restart=$true}elseif($te -ne 0){throw 'Session ambiguous'}
            $tabs=(& $playwright cli "-s=$session" tab-list 2>&1|Out-String);if($LASTEXITCODE -ne 0){throw 'Tab list failed'}
            $lines=@($tabs -split "`r?`n"|Where-Object{$_ -match [regex]::Escape($im.Groups[1].Value)})
            if($lines.Count -eq 0){$null=(& $playwright cli "-s=$session" goto $um.Groups[1].Value 2>&1|Out-String);if($LASTEXITCODE -ne 0){throw 'Exact navigation failed'};$navigation=$true;$tabs=(& $playwright cli "-s=$session" tab-list 2>&1|Out-String);$lines=@($tabs -split "`r?`n"|Where-Object{$_ -match [regex]::Escape($im.Groups[1].Value)})}
            if($lines.Count -ne 1){throw "Exact tab count=$($lines.Count)"};$ix=[regex]::Match($lines[0],'^\s*-\s*(\d+):');if(-not $ix.Success){throw 'Tab index parse failed'};$null=(& $playwright cli "-s=$session" tab-select $ix.Groups[1].Value 2>&1|Out-String);if($LASTEXITCODE -ne 0){throw 'Tab select failed'}

            $script="() => 'GBB_PROBE_008'"
            function Probe([string]$name,[string[]]$argv){$out=(& $playwright @argv 2>&1|Out-String);$exit=$LASTEXITCODE;[pscustomobject]@{name=$name;exit=$exit;contains_probe=$out.Contains('GBB_PROBE_008');stdout_length=$out.Length}}
            $results=@(
              Probe 'JSON_TAIL_CURRENT' @('cli',"-s=$session",'eval',$script,'--json')
              Probe 'JSON_AFTER_CLI' @('cli','--json',"-s=$session",'eval',$script)
              Probe 'RAW_TAIL' @('cli',"-s=$session",'eval',$script,'--raw')
              Probe 'RAW_AFTER_CLI' @('cli','--raw',"-s=$session",'eval',$script)
              Probe 'RAW_AFTER_SESSION' @('cli',"-s=$session",'--raw','eval',$script)
              Probe 'RAW_BEFORE_CLI' @('--raw','cli',"-s=$session",'eval',$script)
            )
            $payloadJson=$results|ConvertTo-Json -Compress
            $text=@('CONTROL_G8_PLAYWRIGHT_NESTED_CLI_CONTRACT_PROBE_RESULT_V1','state: PASS','decision: PASS_READ_ONLY_CONSTANT_PROBE',"source_authority: 5495112821","source_probe_event: $($event.comment.id)","probe_head: $env:GITHUB_SHA","active_switch_receipt: $($latest.id)",'target_control_generation: 008',"db01_restart_performed: $($restart.ToString().ToLowerInvariant())","exact_target_navigation_performed: $($navigation.ToString().ToLowerInvariant())","probe_results_json: $payloadJson",'page_content_read: false','browser_content_write_performed: false','user_relay_count: 0','readback_required: true') -join "`n"
            $json=@{body=$text}|ConvertTo-Json -Compress;$r=Invoke-RestMethod -Uri 'https://api.github.com/repos/D22977/gpt-browser-bridge/issues/114/comments' -Headers $headers -Method Post -Body $json -ContentType 'application/json' -TimeoutSec 30;$rb=Invoke-RestMethod -Uri "https://api.github.com/repos/D22977/gpt-browser-bridge/issues/comments/$($r.id)" -Headers $headers -Method Get -TimeoutSec 30;if([string]$rb.body -cne $text){throw 'Result readback mismatch'};Write-Output "contract probe PASS receipt=$($r.id)"
          }finally{Pop-Location}
