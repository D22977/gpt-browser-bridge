name: GBB G8 Issue102 Reconciled Submit

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: gbb-g8-issue102-reconcile-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  g8-issue102-reconcile:
    name: G8 Issue102 Reconciled Submit
    if: >-
      github.event.issue.number == 102 &&
      github.event.comment.user.login == 'D22977' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, 'HERDR_G8_LOCAL_CONSOLE_RECONCILE_SUBMIT_V2')
    runs-on: [self-hosted, Windows, GBB-REVIEWER]
    timeout-minutes: 12
    defaults:
      run:
        shell: pwsh -NoProfile -File {0}
    steps:
      - name: Validate exact reconciliation event and current authority
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $event=Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
          if ($event.repository.full_name -cne 'D22977/gpt-browser-bridge' -or [int]$event.issue.number -ne 102) { throw 'Wrong repository/issue' }
          if ($event.comment.user.login -cne 'D22977' -or $event.comment.author_association -cne 'OWNER') { throw 'Wrong actor' }
          $body=[string]$event.comment.body
          $checks=@(
            '(?m)^HERDR_G8_LOCAL_CONSOLE_RECONCILE_SUBMIT_V2\s*$',
            '(?m)^control_generation:\s*008\s*$',
            '(?m)^source_first_wake_comment_id:\s*5469111223\s*$',
            '(?m)^source_observation_receipt:\s*5469167165\s*$',
            '(?m)^repair_authorization_receipt:\s*5469181334\s*$',
            '(?m)^source_failed_reconcile_event:\s*5469190313\s*$',
            '(?m)^flatten_repair_receipt:\s*5469195012\s*$',
            '(?m)^target_pane:\s*w2:p1\s*$',
            '(?m)^target_agent_session:\s*01a0513f-4e68-7573-bf38-72e2120ebe1d\s*$',
            '(?m)^idempotency_key:\s*GBB102-G8-RECONCILED-IDLE-SUBMIT-20260830-02\s*$'
          )
          foreach($c in $checks){ if($body -notmatch $c){ throw "Malformed event: $c" } }

          $headers=@{Authorization="Bearer $env:GH_TOKEN";'User-Agent'='gbb-g8-reconcile';Accept='application/vnd.github+json'}
          function Add-Flat([object]$value,$list){
            if($null -eq $value){return}
            if($value -is [System.Array]){foreach($nested in $value){Add-Flat $nested $list};return}
            [void]$list.Add($value)
          }
          function Get-AllComments([int]$issue){
            $list=[System.Collections.Generic.List[object]]::new()
            for($p=1;$p -le 20;$p++){
              $before=$list.Count
              $raw=Invoke-RestMethod -Uri "https://api.github.com/repos/D22977/gpt-browser-bridge/issues/$issue/comments?per_page=100&page=$p" -Headers $headers -Method Get -TimeoutSec 30
              Add-Flat $raw $list
              if(($list.Count-$before) -lt 100){break}
            }
            return $list.ToArray()
          }

          $switchComments=@(Get-AllComments 88)
          $switches=@($switchComments | Where-Object { $_.body -match '(?m)^CONTROL_GENERATION_SWITCH_V1\s*$' -and $_.body -match '(?m)^state:\s*SWITCH_COMMITTED\s*$' -and $_.body -match '(?m)^new_generation_status:\s*ACTIVE\s*$' } | Sort-Object {[int64]$_.id})
          if($switches.Count -eq 0 -or [string]$switches[-1].id -cne '5468566845'){throw 'Current switch mismatch'}
          $gm=[regex]::Match([string]$switches[-1].body,'(?m)^new_generation:\s*(\d{3})\s*$')
          if(-not $gm.Success -or $gm.Groups[1].Value -cne '008'){throw 'Generation008 not ACTIVE'}

          $whoami=(& whoami).Trim(); $identity=[System.Security.Principal.WindowsIdentity]::GetCurrent().Name; $sid=[System.Diagnostics.Process]::GetCurrentProcess().SessionId
          if($whoami -notmatch '(?i)^d22977\\lupun$' -or $identity -notmatch '(?i)^d22977\\lupun$' -or -not [Environment]::UserInteractive -or $sid -eq 0 -or $env:RUNNER_NAME -cne 'gbb-reviewer-win-01'){throw 'Runner identity/interactivity mismatch'}

          $comments=@(Get-AllComments 102)
          $already=@($comments | Where-Object {
            [int64]$_.id -gt 5469111223 -and (
              $_.body -match '(?m)^CONTROL_SKILL_BIDIRECTIONAL_HANDOFF_AMENDMENT_CONSUMED_STARTED_V1\s*$' -or
              $_.body -match '(?m)^CONTROL_SKILL_V4_1_BIDIRECTIONAL_HANDOFF_READY_FOR_FRESH_REVIEW_V1\s*$' -or
              $_.body -match '(?m)^LOCAL_CONTROL_RETURN_V1\s*$'
            )
          })
          if($already.Count -gt 0){throw "Recovery already superseded by durable result $($already[-1].id)"}
          "REC_COMMENT_ID=$($event.comment.id)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Reconcile exact staged-unconsumed prompt and submit on idle only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $herdr='C:\Users\Lupun\AppData\Local\Programs\Herdr\bin\herdr.exe'
          if(-not (Test-Path -LiteralPath $herdr)){throw 'Herdr CLI missing'}
          $listRaw=& $herdr agent list 2>&1 | Out-String
          if($LASTEXITCODE -ne 0){throw 'herdr agent list failed'}
          $list=$listRaw | ConvertFrom-Json
          $target=@($list.result.agents | Where-Object { $_.pane_id -eq 'w2:p1' -and $_.agent_session.value -eq '01a0513f-4e68-7573-bf38-72e2120ebe1d' })
          if($target.Count -ne 1){throw "Exact target missing/ambiguous count=$($target.Count)"}
          if([string]$target[0].agent_status -cne 'idle'){throw "Exact target is not idle: $($target[0].agent_status)"}

          $read=& $herdr agent read 'w2:p1' --source recent-unwrapped --lines 180 2>&1 | Out-String
          if($LASTEXITCODE -ne 0){throw 'herdr agent read failed'}
          $hash=[Convert]::ToHexString([System.Security.Cryptography.SHA256]::HashData([System.Text.Encoding]::UTF8.GetBytes($read))).ToLowerInvariant()
          if($hash -cne '86a63f272f960ab999ed77102438005057960b78ef867bfe0047fec09383aea1'){throw "Transcript drift; expected reconciled hash, got $hash"}
          if($read -notmatch '\[Pasted Content 1451 chars\]'){throw 'Prior staged-unconsumed marker missing'}

          $stateRoot='D:\AIWORK_RUNTIME\GPT_BROWSER_BRIDGE\g8-local-console-rebind\state'
          New-Item -ItemType Directory -Force -Path $stateRoot | Out-Null
          $statePath=Join-Path $stateRoot "$env:REC_COMMENT_ID.json"
          if(Test-Path -LiteralPath $statePath){$s=Get-Content -LiteralPath $statePath -Raw | ConvertFrom-Json;if($s.status -eq 'SENT'){Write-Output 'NO_OP_DUPLICATE';exit 0};if($s.status -eq 'SENDING'){throw 'UNCERTAIN_SEND / NO_BLIND_RETRY'}}
          @{status='SENDING';pane_id='w2:p1';agent_session='01a0513f-4e68-7573-bf38-72e2120ebe1d';prior_hash=$hash;workflow_run_id=$env:GITHUB_RUN_ID} | ConvertTo-Json | Set-Content -LiteralPath $statePath -Encoding utf8

          $prompt="Read GitHub directly. Rehydrate D22977/gpt-browser-bridge Issue #102 latest authority and current #43/#81/#88. Source reconciled local-console event $env:REC_COMMENT_ID, repair authority 5469181334. As transport/coordinator only, perform current ACCESS_CAPABILITY_CHECK_V1 and bind/wake only the exact currently authorized #102 Worker. Publish/read-back CONTROL_SKILL_BIDIRECTIONAL_HANDOFF_AMENDMENT_CONSUMED_STARTED_V1 on Issue #102 with source_local_console_bridge_comment_id: $env:REC_COMMENT_ID before Worker mutation, or publish LOCAL_CONTROL_RETURN_V1 with that same source field and exact blocker. Then follow #102 current contract. GitHub is authority."
          $raw=& $herdr agent prompt 'w2:p1' $prompt 2>&1 | Out-String
          if($LASTEXITCODE -ne 0){throw "herdr agent prompt failed; state remains SENDING; NO_BLIND_RETRY: $raw"}
          $r=$raw | ConvertFrom-Json
          if($r.result.type -ne 'agent_prompted' -or [string]$r.result.agent.pane_id -cne 'w2:p1' -or [string]$r.result.agent.agent_session.value -cne '01a0513f-4e68-7573-bf38-72e2120ebe1d'){throw 'Prompt identity/result mismatch'}
          @{status='SENT';pane_id='w2:p1';agent_session='01a0513f-4e68-7573-bf38-72e2120ebe1d';prior_hash=$hash;workflow_run_id=$env:GITHUB_RUN_ID;sent_at=(Get-Date).ToString('o')} | ConvertTo-Json | Set-Content -LiteralPath $statePath -Encoding utf8

          $headers=@{Authorization="Bearer $env:GH_TOKEN";'User-Agent'='gbb-g8-reconcile';Accept='application/vnd.github+json'}
          $body=@('HERDR_G8_LOCAL_CONSOLE_RECONCILED_DELIVERY_V1','state: CONSUMED_STARTED','decision: PASS_TRANSPORT_ONLY','control_generation: 008',"source_reconcile_comment_id: $env:REC_COMMENT_ID",'source_first_wake_comment_id: 5469111223','source_observation_receipt: 5469167165','repair_authorization_receipt: 5469181334','flatten_repair_receipt: 5469195012','target_pane: w2:p1','target_agent_session: 01a0513f-4e68-7573-bf38-72e2120ebe1d','pre_send_status: idle',"pre_send_output_sha256: $hash",'prior_send_classification: STAGED_UNCONSUMED','blind_retry: false','physical_prompt_count_this_event: 1',"workflow_run_id: $env:GITHUB_RUN_ID",'user_relay_count: 0','readback_required: true') -join "`n"
          $payload=@{body=$body}|ConvertTo-Json -Compress
          $pub=Invoke-RestMethod -Uri 'https://api.github.com/repos/D22977/gpt-browser-bridge/issues/102/comments' -Headers $headers -Method Post -Body $payload -ContentType 'application/json' -TimeoutSec 30
          $rb=Invoke-RestMethod -Uri "https://api.github.com/repos/D22977/gpt-browser-bridge/issues/comments/$($pub.id)" -Headers $headers -Method Get -TimeoutSec 30
          if([string]$rb.body -cne $body){throw 'Delivery receipt readback mismatch'}
          "REC_TRANSPORT_RECEIPT=$($pub.id)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Output "reconciled prompt delivered receipt=$($pub.id)"

      - name: Guard exact durable worker handoff or typed return
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $headers=@{Authorization="Bearer $env:GH_TOKEN";'User-Agent'='gbb-g8-reconcile';Accept='application/vnd.github+json'}
          function Add-Flat([object]$value,$list){if($null -eq $value){return};if($value -is [System.Array]){foreach($nested in $value){Add-Flat $nested $list};return};[void]$list.Add($value)}
          function Get-AllComments([int]$issue){$list=[System.Collections.Generic.List[object]]::new();for($p=1;$p -le 20;$p++){$before=$list.Count;$raw=Invoke-RestMethod -Uri "https://api.github.com/repos/D22977/gpt-browser-bridge/issues/$issue/comments?per_page=100&page=$p" -Headers $headers -Method Get -TimeoutSec 30;Add-Flat $raw $list;if(($list.Count-$before)-lt 100){break}};return $list.ToArray()}
          function Publish([string]$body){$p=@{body=$body}|ConvertTo-Json -Compress;$r=Invoke-RestMethod -Uri 'https://api.github.com/repos/D22977/gpt-browser-bridge/issues/102/comments' -Headers $headers -Method Post -Body $p -ContentType 'application/json' -TimeoutSec 30;return [string]$r.id}
          $start=[DateTimeOffset]::UtcNow
          while(([DateTimeOffset]::UtcNow-$start).TotalSeconds -lt 480){
            $comments=@(Get-AllComments 102)
            $bound=@($comments | Where-Object {[int64]$_.id -gt [int64]$env:REC_COMMENT_ID -and ([string]$_.body).Contains("source_local_console_bridge_comment_id: $env:REC_COMMENT_ID")} | Sort-Object {[int64]$_.id})
            $ok=@($bound | Where-Object {$_.body -match '(?m)^CONTROL_SKILL_BIDIRECTIONAL_HANDOFF_AMENDMENT_CONSUMED_STARTED_V1\s*$'})
            if($ok.Count -eq 1){$body=@('HERDR_G8_LOCAL_CONSOLE_RECONCILE_GUARD_RESULT_V1','state: PASS','decision: PASS','control_generation: 008',"source_reconcile_comment_id: $env:REC_COMMENT_ID","source_transport_receipt: $env:REC_TRANSPORT_RECEIPT","target_consumed_start_receipt: $($ok[0].id)",'user_relay_count: 0','readback_required: true') -join "`n";$id=Publish $body;Write-Output "durable consumed-start observed $($ok[0].id), guard=$id";exit 0}
            if($ok.Count -gt 1){throw 'Conflicting duplicate consumed-start'}
            $ret=@($bound | Where-Object {$_.body -match '(?m)^(LOCAL_CONTROL_RETURN_V1|CONTROL_REQUIRED)\s*$'})
            if($ret.Count -gt 0){$body=@('HERDR_G8_LOCAL_CONSOLE_RECONCILE_GUARD_RESULT_V1','state: CONTROL_REQUIRED','decision: CONTROL_REQUIRED','control_generation: 008',"source_reconcile_comment_id: $env:REC_COMMENT_ID","source_transport_receipt: $env:REC_TRANSPORT_RECEIPT","target_return_receipt: $($ret[-1].id)",'user_relay_count: 0') -join "`n";$id=Publish $body;throw "Coordinator return observed $($ret[-1].id), guard=$id"}
            Start-Sleep -Seconds 5
          }
          $list=((& 'C:\Users\Lupun\AppData\Local\Programs\Herdr\bin\herdr.exe' agent list 2>&1 | Out-String)|ConvertFrom-Json)
          $target=@($list.result.agents | Where-Object {$_.pane_id -eq 'w2:p1' -and $_.agent_session.value -eq '01a0513f-4e68-7573-bf38-72e2120ebe1d'})
          $status=if($target.Count -eq 1){[string]$target[0].agent_status}else{'MISSING'}
          $body=@('HERDR_G8_LOCAL_CONSOLE_RECONCILE_GUARD_RESULT_V1','state: CONTROL_REQUIRED_NO_BOUND_DURABLE_ACK','decision: CONTROL_REQUIRED','control_generation: 008',"source_reconcile_comment_id: $env:REC_COMMENT_ID","source_transport_receipt: $env:REC_TRANSPORT_RECEIPT","target_status: $status",'first_missing_capability: RECONCILED_IDLE_PROMPT_DID_NOT_PRODUCE_DURABLE_HANDOFF_OR_RETURN','user_relay_count: 0','readback_required: true') -join "`n";$id=Publish $body;throw "guard timeout receipt=$id"
