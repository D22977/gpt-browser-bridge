name: GBB G8 Issue102 Local Console Observation

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: gbb-g8-issue102-observe-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  g8-issue102-observe:
    name: G8 Issue102 Local Console Observation
    if: >-
      github.event.issue.number == 102 &&
      github.event.comment.user.login == 'D22977' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, 'HERDR_G8_LOCAL_CONSOLE_OBSERVE_V1')
    runs-on: [self-hosted, Windows, GBB-REVIEWER]
    timeout-minutes: 5
    defaults:
      run:
        shell: pwsh -NoProfile -File {0}
    steps:
      - name: Validate exact observation event
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $event = Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
          if ($event.repository.full_name -cne 'D22977/gpt-browser-bridge') { throw 'Wrong repository' }
          if ([int]$event.issue.number -ne 102) { throw 'Wrong issue' }
          if ($event.comment.user.login -cne 'D22977' -or $event.comment.author_association -cne 'OWNER') { throw 'Wrong actor' }
          $body = [string]$event.comment.body
          if ($body -notmatch '(?m)^HERDR_G8_LOCAL_CONSOLE_OBSERVE_V1\s*$') { throw 'Missing protocol header' }
          $gen = [regex]::Match($body, '(?m)^control_generation:\s*(008)\s*$')
          $wake = [regex]::Match($body, '(?m)^source_wake_comment_id:\s*(5469111223)\s*$')
          $transport = [regex]::Match($body, '(?m)^source_transport_receipt:\s*(5469112144)\s*$')
          $guard = [regex]::Match($body, '(?m)^source_guard_receipt:\s*(5469151426)\s*$')
          $auth = [regex]::Match($body, '(?m)^observation_authorization_receipt:\s*(5469160734)\s*$')
          $pane = [regex]::Match($body, '(?m)^target_pane:\s*(w2:p1)\s*$')
          $session = [regex]::Match($body, '(?m)^target_agent_session:\s*(01a0513f-4e68-7573-bf38-72e2120ebe1d)\s*$')
          if (-not ($gen.Success -and $wake.Success -and $transport.Success -and $guard.Success -and $auth.Success -and $pane.Success -and $session.Success)) { throw 'Malformed or mismatched observation event' }

          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; 'User-Agent' = 'gbb-g8-local-observe'; Accept = 'application/vnd.github+json' }
          $all = [System.Collections.Generic.List[object]]::new()
          function Add-Flat([object]$value) {
            if ($null -eq $value) { return }
            if ($value -is [System.Array]) { foreach ($nested in $value) { Add-Flat $nested }; return }
            [void]$all.Add($value)
          }
          for ($page=1; $page -le 20; $page++) {
            $before=$all.Count
            Add-Flat (Invoke-RestMethod -Uri "https://api.github.com/repos/D22977/gpt-browser-bridge/issues/88/comments?per_page=100&page=$page" -Headers $headers -Method Get -TimeoutSec 30)
            if (($all.Count-$before) -lt 100) { break }
          }
          $switches=@($all | Where-Object { $_.body -match '(?m)^CONTROL_GENERATION_SWITCH_V1\s*$' -and $_.body -match '(?m)^state:\s*SWITCH_COMMITTED\s*$' -and $_.body -match '(?m)^new_generation_status:\s*ACTIVE\s*$' } | Sort-Object { [int64]$_.id })
          if ($switches.Count -eq 0 -or [string]$switches[-1].id -cne '5468566845') { throw 'Current G8 switch mismatch' }
          $active=[regex]::Match([string]$switches[-1].body,'(?m)^new_generation:\s*(\d{3})\s*$')
          if (-not $active.Success -or $active.Groups[1].Value -cne '008') { throw 'Generation008 is not ACTIVE' }

          $whoami=(& whoami).Trim(); $identity=[System.Security.Principal.WindowsIdentity]::GetCurrent().Name; $sid=[System.Diagnostics.Process]::GetCurrentProcess().SessionId
          if ($whoami -notmatch '(?i)^d22977\\lupun$' -or $identity -notmatch '(?i)^d22977\\lupun$' -or -not [Environment]::UserInteractive -or $sid -eq 0 -or $env:RUNNER_NAME -cne 'gbb-reviewer-win-01') { throw 'Runner identity/interactivity mismatch' }
          "OBS_COMMENT_ID=$($event.comment.id)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Read exact pane without prompting
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $herdr='C:\Users\Lupun\AppData\Local\Programs\Herdr\bin\herdr.exe'
          if (-not (Test-Path -LiteralPath $herdr)) { throw 'Herdr CLI missing' }
          $listRaw=& $herdr agent list 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw "herdr agent list failed: $listRaw" }
          $list=$listRaw | ConvertFrom-Json
          $target=@($list.result.agents | Where-Object { $_.pane_id -eq 'w2:p1' -and $_.agent_session.value -eq '01a0513f-4e68-7573-bf38-72e2120ebe1d' })
          if ($target.Count -ne 1) { throw "Exact prior target missing/drifted count=$($target.Count)" }
          $status=[string]$target[0].agent_status
          $read=& $herdr agent read 'w2:p1' --source recent-unwrapped --lines 180 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw 'herdr agent read failed' }
          $bytes=[System.Text.Encoding]::UTF8.GetBytes($read)
          $hash=[Convert]::ToHexString([System.Security.Cryptography.SHA256]::HashData($bytes)).ToLowerInvariant()
          $tail=if ($read.Length -gt 12000) { $read.Substring($read.Length-12000) } else { $read }
          $tail=$tail.Replace("`r",'').Replace('```','~~~')
          $headers=@{Authorization="Bearer $env:GH_TOKEN";'User-Agent'='gbb-g8-local-observe';Accept='application/vnd.github+json'}
          $body=@(
            'HERDR_G8_LOCAL_CONSOLE_OBSERVATION_V1'
            'state: PASS'
            'decision: PASS_READ_ONLY'
            'control_generation: 008'
            "source_observation_comment_id: $env:OBS_COMMENT_ID"
            'source_wake_comment_id: 5469111223'
            'source_transport_receipt: 5469112144'
            'source_guard_receipt: 5469151426'
            'target_pane: w2:p1'
            'target_agent_session: 01a0513f-4e68-7573-bf38-72e2120ebe1d'
            "target_status: $status"
            "recent_output_sha256: $hash"
            "runner_name: $env:RUNNER_NAME"
            "workflow_run_id: $env:GITHUB_RUN_ID"
            'prompt_sent: false'
            'process_mutation: false'
            'user_relay_count: 0'
            'recent_output_tail_begin: true'
            $tail
            'recent_output_tail_end: true'
            'readback_required: true'
          ) -join "`n"
          $payload=@{body=$body}|ConvertTo-Json -Compress
          $r=Invoke-RestMethod -Uri 'https://api.github.com/repos/D22977/gpt-browser-bridge/issues/102/comments' -Headers $headers -Method Post -Body $payload -ContentType 'application/json' -TimeoutSec 30
          $rb=Invoke-RestMethod -Uri "https://api.github.com/repos/D22977/gpt-browser-bridge/issues/comments/$($r.id)" -Headers $headers -Method Get -TimeoutSec 30
          if ([string]$rb.body -cne $body) { throw "Observation read-back mismatch $($r.id)" }
          Write-Output "observation receipt=$($r.id) status=$status hash=$hash"
