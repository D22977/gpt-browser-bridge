name: G9 Desktop IAB Entrypoint Once

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: g9-desktop-iab-entrypoint-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  prepare-main:
    if: >-
      github.event.issue.number == 120 &&
      github.event.comment.user.login == 'D22977' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, 'DESKTOP_IAB_COMPAT_WAKE_V1')
    runs-on: [self-hosted, Windows, GBB-REVIEWER]
    timeout-minutes: 6
    defaults:
      run:
        shell: pwsh -NoProfile -File {0}
    steps:
      - name: Validate exact tail-inspection authority
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $event = Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
          $body = [string]$event.comment.body
          if ($event.repository.full_name -cne 'D22977/gpt-browser-bridge') { throw 'Wrong repository' }
          if ([int]$event.issue.number -ne 120) { throw 'Wrong issue' }
          if ($event.comment.user.login -cne 'D22977' -or $event.comment.author_association -cne 'OWNER') { throw 'Wrong actor' }
          if ($body -notmatch '(?m)^action:\s*PREPARE_MAIN\s*$') { throw 'Wrong action' }
          if ($body -notmatch '(?m)^source_authority:\s*5540370230\s*$') { throw 'Wrong source authority' }
          if ($body -notmatch '(?m)^control_generation:\s*009\s*$') { throw 'Wrong generation' }

          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; 'User-Agent'='g9-desktop-iab-entrypoint'; Accept='application/vnd.github+json' }
          $all = [System.Collections.Generic.List[object]]::new()
          function Add-Flat([object]$v) {
            if ($null -eq $v) { return }
            if ($v -is [System.Array]) { foreach ($x in $v) { Add-Flat $x }; return }
            [void]$all.Add($v)
          }
          for ($page=1; $page -le 20; $page++) {
            $before = $all.Count
            Add-Flat (Invoke-RestMethod -Uri "https://api.github.com/repos/D22977/gpt-browser-bridge/issues/88/comments?per_page=100&page=$page" -Headers $headers -Method Get -TimeoutSec 30)
            if (($all.Count - $before) -lt 100) { break }
          }
          $switches = @($all | Where-Object {
            $_.body -match '(?m)^CONTROL_GENERATION_SWITCH_V1\s*$' -and
            $_.body -match '(?m)^state:\s*SWITCH_COMMITTED\s*$' -and
            $_.body -match '(?m)^new_generation_status:\s*ACTIVE\s*$'
          } | Sort-Object { [int64]$_.id })
          if ($switches.Count -eq 0) { throw 'No ACTIVE switch' }
          $latest = $switches[-1]
          $gen = [regex]::Match([string]$latest.body, '(?m)^new_generation:\s*(\d{3})\s*$')
          if (-not $gen.Success -or $gen.Groups[1].Value -cne '009') { throw "G009 not ACTIVE latest=$($latest.id)" }
          "ACTIVE_SWITCH=$($latest.id)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Read lines 180-310 only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $entry = 'D:\AIWORK_RUNTIME\GPT_BROWSER_BRIDGE\desktop-wake\entrypoint.mjs'
          if (-not (Test-Path -LiteralPath $entry)) { throw 'Entrypoint missing' }
          $entrySha = (Get-FileHash -Algorithm SHA256 -LiteralPath $entry).Hash.ToLowerInvariant()
          if ($entrySha -cne '4a650750162e388801846087f2db090ce67c2bcf24263601ea163b58ec4d3921') { throw "Entrypoint drift: $entrySha" }
          $lines = @(Get-Content -LiteralPath $entry)
          $picked = [System.Collections.Generic.List[string]]::new()
          $start = [Math]::Max(179, 0)
          $end = [Math]::Min(309, $lines.Count - 1)
          for ($i=$start; $i -le $end; $i++) {
            $line = [string]$lines[$i]
            if ($line -match '(?i)token|secret|cookie|password|credential|authorization') { continue }
            $trim = $line.Trim()
            if ($trim.Length -gt 360) { $trim = $trim.Substring(0,360) }
            [void]$picked.Add("L$($i+1):$trim")
          }
          $tail = ($picked -join ' || ')
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; 'User-Agent'='g9-desktop-iab-entrypoint'; Accept='application/vnd.github+json' }
          $result = @(
            'GBB_DESKTOP_WAKE_MAIN_TAIL_V1',
            'state: PASS_READ_ONLY',
            'control_generation: 009',
            'source_authority: 5540370230',
            "active_switch_receipt: $env:ACTIVE_SWITCH",
            "entrypoint_sha256: $entrySha",
            "main_tail_lines_180_310: $tail",
            'entrypoint_invoked: false',
            'runtime_file_mutated: false',
            'desktop_prompt_sent: false',
            'browser_action_performed: false',
            'user_relay_count: 0',
            "workflow_run_id: $env:GITHUB_RUN_ID",
            'readback_required: true'
          ) -join "`n"
          $payload = @{ body=$result } | ConvertTo-Json -Compress
          $posted = Invoke-RestMethod -Uri 'https://api.github.com/repos/D22977/gpt-browser-bridge/issues/120/comments' -Headers $headers -Method Post -Body $payload -ContentType 'application/json' -TimeoutSec 30
          $rb = Invoke-RestMethod -Uri "https://api.github.com/repos/D22977/gpt-browser-bridge/issues/comments/$($posted.id)" -Headers $headers -Method Get -TimeoutSec 30
          if ([string]$rb.body -cne $result) { throw "Read-back mismatch receipt=$($posted.id)" }
          Write-Output "Main tail receipt=$($posted.id)"
