name: G11 Issue124 Herdr Runtime Update Submit Canary Once

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: g11-issue124-herdr-update-submit-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  canary:
    if: >-
      github.event.issue.number == 124 &&
      github.event.comment.user.login == 'D22977' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, 'HERDR_RUNTIME_UPDATE_SUBMIT_CANARY_WAKE_V1')
    runs-on: [self-hosted, Windows, GBB-REVIEWER]
    timeout-minutes: 12
    defaults:
      run:
        shell: pwsh -NoProfile -File {0}
    steps:
      - name: Update Herdr and prove fresh autonomous submit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = 'D22977/gpt-browser-bridge'
          $herdr = 'C:\Users\Lupun\AppData\Local\Programs\Herdr\bin\herdr.exe'
          $expectedAuthority = '5565375438'
          $expectedCard = '5565343447'
          $historicalPane = 'w2:p1'
          $historicalSession = '01a0513f-4e68-7573-bf38-72e2120ebe1d'
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            'User-Agent' = 'g11-herdr-update-submit-canary'
            Accept = 'application/vnd.github+json'
          }

          function Need([string]$body, [string]$pattern, [string]$name) {
            $m = [regex]::Match($body, $pattern)
            if (-not $m.Success) { throw "Malformed field: $name" }
            return $m.Groups[1].Value
          }

          function Publish124([string]$text) {
            $payload = @{ body = $text } | ConvertTo-Json -Compress
            $posted = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/issues/124/comments" -Headers $headers -Method Post -Body $payload -ContentType 'application/json' -TimeoutSec 30
            $readback = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/issues/comments/$($posted.id)" -Headers $headers -Method Get -TimeoutSec 30
            if ([string]$readback.body -cne $text) { throw "readback mismatch receipt=$($posted.id)" }
            return [string]$posted.id
          }

          function CurrentActiveGeneration {
            $comments = [System.Collections.Generic.List[object]]::new()
            for ($page = 1; $page -le 100; $page++) {
              $xs = @(Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/issues/88/comments?per_page=100&page=$page" -Headers $headers -Method Get -TimeoutSec 30)
              foreach ($x in $xs) { if ($null -ne $x) { [void]$comments.Add($x) } }
              if ($xs.Count -lt 100) { break }
            }
            $switches = @($comments.ToArray() | Where-Object {
              [string]$_.body -match '(?m)^CONTROL_GENERATION_SWITCH_V1\s*$' -and
              [string]$_.body -match '(?m)^state:\s*SWITCH_COMMITTED\s*$'
            } | Sort-Object { [int64]$_.id })
            if ($switches.Count -eq 0) { throw 'No committed Control switch' }
            $latest = [string]$switches[-1].body
            $m = [regex]::Match($latest, '(?m)^new_generation:\s*0*(\d+)\s*$')
            if (-not $m.Success) { throw 'Latest switch missing new_generation' }
            return [int]$m.Groups[1].Value
          }

          $event = Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
          $body = [string]$event.comment.body
          $authority = Need $body '(?m)^authority_receipt:\s*(\d+)\s*$' 'authority_receipt'
          $card = Need $body '(?m)^repair_card_receipt:\s*(\d+)\s*$' 'repair_card_receipt'
          $idem = Need $body '(?m)^idempotency_key:\s*([A-Za-z0-9._:-]+)\s*$' 'idempotency_key'
          if ($authority -cne $expectedAuthority -or $card -cne $expectedCard) { throw 'Wake authority mismatch' }
          if ((CurrentActiveGeneration) -ne 11) { throw 'Generation 011 is not current ACTIVE' }
          if (-not (Test-Path -LiteralPath $herdr)) { throw 'Herdr CLI missing' }
          if ($env:RUNNER_NAME -cne 'gbb-reviewer-win-01') { throw "Unexpected runner: $env:RUNNER_NAME" }
          if (-not [Environment]::UserInteractive -or [System.Diagnostics.Process]::GetCurrentProcess().SessionId -eq 0) { throw 'Runner not interactive' }

          $wakeId = [string]$event.comment.id
          $stateRoot = 'D:\AIWORK_RUNTIME\GPT_BROWSER_BRIDGE\herdr-update-submit-canary'
          New-Item -ItemType Directory -Force -Path $stateRoot | Out-Null
          $statePath = Join-Path $stateRoot "$wakeId.json"

          $existing = @()
          for ($page = 1; $page -le 100; $page++) {
            $xs = @(Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/issues/124/comments?per_page=100&page=$page" -Headers $headers -Method Get -TimeoutSec 30)
            $existing += $xs
            if ($xs.Count -lt 100) { break }
          }
          $priorResults = @($existing | Where-Object {
            [string]$_.body -match '(?m)^HERDR_RUNTIME_UPDATE_SUBMIT_CANARY_RESULT_V1\s*$' -and
            [string]$_.body -match "(?m)^source_wake_comment_id:\s*$([regex]::Escape($wakeId))\s*$"
          })
          if ($priorResults.Count -gt 0) { exit 0 }

          if (Test-Path -LiteralPath $statePath) {
            $prior = Get-Content -LiteralPath $statePath -Raw | ConvertFrom-Json
            $uncertain = @(
              'HERDR_RUNTIME_UPDATE_SUBMIT_CANARY_RESULT_V1'
              'state: CONTROL_REQUIRED_UNCERTAIN_PRIOR_ATTEMPT'
              "source_wake_comment_id: $wakeId"
              "prior_local_state: $([string]$prior.status)"
              'owner_enter_count: 0'
              'user_task_result_relay_count: 0'
              'orca_used: false'
              "workflow_run_id: $env:GITHUB_RUN_ID"
              'readback_verified: true'
            ) -join "`n"
            [void](Publish124 $uncertain)
            exit 1
          }

          @{
            status = 'UPDATING'
            wake_id = $wakeId
            workflow_run_id = $env:GITHUB_RUN_ID
            started_at = (Get-Date).ToString('o')
          } | ConvertTo-Json | Set-Content -LiteralPath $statePath -Encoding utf8

          $workspaceId = $null
          $agentName = $null
          $before = ''
          $after = ''
          $pane = ''
          $session = ''
          $marker = "GBB124_SUBMIT_CANARY_${wakeId}_OK"

          try {
            $before = ((& $herdr --version 2>&1) | Out-String).Trim()
            if ($LASTEXITCODE -ne 0) { throw 'herdr --version failed' }

            $updatePreview = ((& $herdr update 2>&1) | Out-String).Trim()
            if ($LASTEXITCODE -ne 0) { throw "herdr preview update failed: $updatePreview" }

            $channel = ((& $herdr channel set stable 2>&1) | Out-String).Trim()
            if ($LASTEXITCODE -ne 0) { throw "herdr channel set stable failed: $channel" }

            $handoff = ((& $herdr update --handoff 2>&1) | Out-String).Trim()
            if ($LASTEXITCODE -ne 0) { throw "herdr live handoff failed: $handoff" }

            $after = ((& $herdr --version 2>&1) | Out-String).Trim()
            if ($LASTEXITCODE -ne 0) { throw 'updated herdr --version failed' }
            $vm = [regex]::Match($after, '(\d+)\.(\d+)\.(\d+)')
            if (-not $vm.Success) { throw "cannot parse updated Herdr version: $after" }
            $version = [version]::new([int]$vm.Groups[1].Value, [int]$vm.Groups[2].Value, [int]$vm.Groups[3].Value)
            if ($version -lt [version]'0.8.2') { throw "updated Herdr below required 0.8.2: $after" }

            $label = "gbb124-submit-$wakeId"
            $createdRaw = ((& $herdr workspace create --cwd 'C:\WINDOWS\system32' --label $label --no-focus 2>&1) | Out-String).Trim()
            if ($LASTEXITCODE -ne 0) { throw "workspace create failed: $createdRaw" }
            $created = $createdRaw | ConvertFrom-Json
            $workspaceId = [string]$created.result.workspace.workspace_id
            $pane = [string]$created.result.root_pane.pane_id
            if ([string]::IsNullOrWhiteSpace($workspaceId) -or [string]::IsNullOrWhiteSpace($pane)) { throw 'workspace create missing identity' }
            if ($pane -ceq $historicalPane) { throw 'fresh workspace reused historical pane' }

            $suffix = $wakeId.Substring([Math]::Max(0, $wakeId.Length - 6))
            $agentName = "gbb124r2c$suffix"
            $startRaw = ((& $herdr agent start $agentName --kind codex --pane $pane 2>&1) | Out-String).Trim()
            if ($LASTEXITCODE -ne 0) { throw "agent start failed or blocked: $startRaw" }

            $listRaw = ((& $herdr agent list 2>&1) | Out-String).Trim()
            if ($LASTEXITCODE -ne 0) { throw 'agent list failed after start' }
            $agents = @(($listRaw | ConvertFrom-Json).result.agents)
            $fresh = @($agents | Where-Object { [string]$_.name -ceq $agentName })
            if ($fresh.Count -ne 1) { throw "fresh agent count=$($fresh.Count)" }
            if ([string]$fresh[0].pane_id -cne $pane) { throw 'fresh agent pane mismatch' }
            $session = [string]$fresh[0].agent_session.value
            if ([string]::IsNullOrWhiteSpace($session)) { throw 'fresh agent session missing' }
            if ($session -ceq $historicalSession) { throw 'fresh agent reused historical session' }
            if ([string]$fresh[0].agent_status -eq 'blocked') { throw 'fresh agent is blocked before prompt' }

            @{
              status = 'PROMPT_SENDING'
              wake_id = $wakeId
              workspace_id = $workspaceId
              pane_id = $pane
              agent_name = $agentName
              agent_session = $session
              marker = $marker
              workflow_run_id = $env:GITHUB_RUN_ID
              updated_at = (Get-Date).ToString('o')
            } | ConvertTo-Json | Set-Content -LiteralPath $statePath -Encoding utf8

            $promptText = "Reply exactly $marker and nothing else."
            $promptRaw = ((& $herdr agent prompt $agentName $promptText --wait --timeout 60000 2>&1) | Out-String).Trim()
            if ($LASTEXITCODE -ne 0) { throw "agent prompt --wait failed after send boundary: $promptRaw" }

            $readRaw = ((& $herdr agent read $agentName --lines 80 2>&1) | Out-String)
            if ($LASTEXITCODE -ne 0) { throw 'agent read failed after prompt' }
            if ($readRaw -notmatch [regex]::Escape($marker)) { throw 'submit marker missing after prompt wait' }

            @{
              status = 'PASS'
              wake_id = $wakeId
              workspace_id = $workspaceId
              pane_id = $pane
              agent_name = $agentName
              agent_session = $session
              marker = $marker
              version_before = $before
              version_after = $after
              workflow_run_id = $env:GITHUB_RUN_ID
              finished_at = (Get-Date).ToString('o')
            } | ConvertTo-Json | Set-Content -LiteralPath $statePath -Encoding utf8

            $result = @(
              'HERDR_RUNTIME_UPDATE_SUBMIT_CANARY_RESULT_V1'
              'state: PASS'
              "source_wake_comment_id: $wakeId"
              "authority_receipt: $authority"
              "repair_card_receipt: $card"
              "herdr_version_before: $before"
              "herdr_version_after: $after"
              'channel_target: stable'
              'live_handoff: PASS'
              "fresh_workspace: $workspaceId"
              "fresh_pane: $pane"
              "fresh_agent: $agentName"
              "fresh_agent_session: $session"
              'historical_pane_reused: false'
              'historical_session_reused: false'
              'agent_prompt_wait: PASS'
              'marker_readback: PASS'
              'herdr_send_keys_fallback_used: false'
              'owner_enter_count: 0'
              'user_task_result_relay_count: 0'
              'orca_used: false'
              "workflow_run_id: $env:GITHUB_RUN_ID"
              'readback_verified: true'
            ) -join "`n"
            [void](Publish124 $result)
          }
          catch {
            $diag = ($_.Exception.Message -replace '[\r\n]+',' ')
            @{
              status = 'BLOCKED'
              wake_id = $wakeId
              workspace_id = $workspaceId
              pane_id = $pane
              agent_name = $agentName
              agent_session = $session
              version_before = $before
              version_after = $after
              diagnostic = $diag
              workflow_run_id = $env:GITHUB_RUN_ID
              failed_at = (Get-Date).ToString('o')
            } | ConvertTo-Json | Set-Content -LiteralPath $statePath -Encoding utf8
            $result = @(
              'HERDR_RUNTIME_UPDATE_SUBMIT_CANARY_RESULT_V1'
              'state: BLOCKED'
              "source_wake_comment_id: $wakeId"
              "authority_receipt: $authority"
              "repair_card_receipt: $card"
              "herdr_version_before: $before"
              "herdr_version_after: $after"
              "fresh_workspace: $workspaceId"
              "fresh_pane: $pane"
              "fresh_agent: $agentName"
              "fresh_agent_session: $session"
              "diagnostic: $diag"
              'prompt_retry_performed: false'
              'herdr_send_keys_fallback_used: false'
              'owner_enter_count: 0'
              'user_task_result_relay_count: 0'
              'orca_used: false'
              "workflow_run_id: $env:GITHUB_RUN_ID"
              'readback_verified: true'
            ) -join "`n"
            [void](Publish124 $result)
            exit 1
          }
          finally {
            if (-not [string]::IsNullOrWhiteSpace($workspaceId)) {
              try { & $herdr workspace close $workspaceId | Out-Null } catch {}
            }
          }
