                $evidence.ownership_classification='CHILD_OWNS_FOREGROUND'; return [pscustomobject]@{state='CORROBORATED';classification='CHILD_OWNS_FOREGROUND';evidence=$evidence}
              }catch{$evidence.mismatch_reason=$_.Exception.Message; return [pscustomobject]@{state='FAIL_CLOSED';classification='PROCESS_IDENTITY_CORROBORATION_FAILED';evidence=$evidence}}
            }
