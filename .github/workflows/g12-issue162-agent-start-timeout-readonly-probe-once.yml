name: G12 Issue162 Agent Start Timeout Readonly Probe Once

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: g12-issue162-agent-timeout-readonly-probe-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  probe:
    if: >-
      github.event.issue.number == 162 &&
      github.event.comment.user.login == 'D22977' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, 'ISSUE162_AGENT_START_TIMEOUT_READONLY_PROBE_WAKE_V1')
    runs-on: [self-hosted, Windows, GBB-REVIEWER]
    timeout-minutes: 8
    defaults:
      run:
        shell: pwsh -NoProfile -File {0}
    steps:
      - name: Probe current partial-start state without local mutation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $repo='D22977/gpt-browser-bridge'
          $issue=162
          $authority='5645797743'
          $controlAdoption='5645738398'
          $sourceBlocker='5645790077'
          $sourceRun='34692826096'
          $sourceJob='103551008845'
          $agentName='g12-i162-resident-repair-02'
          $worktree='D:\AIWORK_WT\GPT_BROWSER_BRIDGE\g12-i162-resident-repair-02'
          $workerBranch='worker/g12-issue162-resident-consumer-herdr-loop-repair-02'
          $workerBase='20c540da6036926dbb1be687868e0a55e03bfcde'
          $h='C:\Users\Lupun\AppData\Local\Programs\Herdr\bin\herdr.exe'
          $headers=@{Authorization="Bearer $env:GH_TOKEN";'User-Agent'='g13-issue162-agent-timeout-readonly-probe';Accept='application/vnd.github+json'}

          function Safe([string]$s,[int]$max=1800){
            if($null -eq $s){return ''}
            $v=(($s -replace '[\r\n]+',' | ') -replace '[\x00-\x1F]',' ').Trim()
            if($v.Length -gt $max){return $v.Substring(0,$max)}
            return $v
          }
          function Publish([string]$body){
            $payload=@{body=$body}|ConvertTo-Json -Compress
            $p=Invoke-RestMethod "https://api.github.com/repos/$repo/issues/$issue/comments" -Headers $headers -Method Post -Body $payload -ContentType 'application/json' -TimeoutSec 30
            $rb=Invoke-RestMethod "https://api.github.com/repos/$repo/issues/comments/$($p.id)" -Headers $headers -Method Get -TimeoutSec 30
            if([string]$rb.body -cne $body){throw 'PROBE_RESULT_READBACK_MISMATCH'}
            return [string]$p.id
          }
          function Need([string]$body,[string]$pattern,[string]$name){
            $m=[regex]::Match($body,$pattern)
            if(-not $m.Success){throw "MALFORMED_WAKE_$name"}
            return $m.Groups[1].Value
          }

          $ev=Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw|ConvertFrom-Json
          $wake=[string]$ev.comment.id
          $body=[string]$ev.comment.body
          $a=Need $body '(?m)^source_authority:\s*(\d+)\s*$' 'AUTHORITY'
          $c=Need $body '(?m)^source_control_adoption:\s*(\d+)\s*$' 'CONTROL_ADOPTION'
          $b=Need $body '(?m)^source_blocker:\s*(\d+)\s*$' 'BLOCKER'
          $launcher=Need $body '(?m)^launcher_head_sha:\s*([0-9a-f]{40})\s*$' 'LAUNCHER'
          $idem=Need $body '(?m)^idempotency_key:\s*([A-Za-z0-9._:-]+)\s*$' 'IDEMPOTENCY'
          if($a -cne $authority -or $c -cne $controlAdoption -or $b -cne $sourceBlocker){throw 'WAKE_AUTHORITY_MISMATCH'}
          if($launcher -cne $env:GITHUB_SHA){throw 'LAUNCHER_HEAD_MISMATCH'}

          $auth=Invoke-RestMethod "https://api.github.com/repos/$repo/issues/comments/$authority" -Headers $headers -Method Get -TimeoutSec 30
          if(-not ([string]$auth.body).StartsWith('CONTROL_G13_ISSUE162_POST_TIMEOUT_READONLY_RECONCILIATION_V1')){throw 'WRONG_AUTHORITY_PROTOCOL'}
          $adoption=Invoke-RestMethod "https://api.github.com/repos/$repo/issues/comments/$controlAdoption" -Headers $headers -Method Get -TimeoutSec 30
          if(-not ([string]$adoption.body).StartsWith('CONTROL_G13_ISSUE162_PARSER_REPAIR_AUTHORITY_ADOPTION_V1')){throw 'WRONG_CONTROL_ADOPTION_PROTOCOL'}
          $blk=Invoke-RestMethod "https://api.github.com/repos/$repo/issues/comments/$sourceBlocker" -Headers $headers -Method Get -TimeoutSec 30
          $blkBody=[string]$blk.body
          if(-not $blkBody.StartsWith('GBB_ISSUE162_EXISTING_WORKSPACE_AGENT_START_RECOVERY_RESULT_V1')){throw 'WRONG_BLOCKER_PROTOCOL'}
          if($blkBody -notmatch '(?m)^state:\s*BLOCKED\s*$' -or $blkBody -notmatch '(?m)^classification:\s*AGENT_START_OR_REVALIDATION_FAILED_NO_SECOND_START\s*$'){throw 'WRONG_BLOCKER_CLASSIFICATION'}

          $switch=Invoke-RestMethod "https://api.github.com/repos/$repo/issues/comments/5645732538" -Headers $headers -Method Get -TimeoutSec 30
          $sw=[string]$switch.body
          if($sw -notmatch '(?m)^state:\s*SWITCH_COMMITTED\s*$' -or $sw -notmatch '(?m)^new_generation:\s*013\s*$' -or $sw -notmatch '(?m)^new_status:\s*ACTIVE\s*$'){throw 'CONTROL013_NOT_ACTIVE'}
          $since=[uri]::EscapeDataString([string]$switch.created_at)
          $switchRows=@(Invoke-RestMethod "https://api.github.com/repos/$repo/issues/88/comments?since=$since&per_page=100" -Headers $headers -Method Get -TimeoutSec 30)
          $newer=@($switchRows|Where-Object{[int64]$_.id -gt 5645732538 -and [string]$_.body -match '(?m)^CONTROL_GENERATION_SWITCH_V1\s*$' -and [string]$_.body -match '(?m)^state:\s*SWITCH_COMMITTED\s*$'})
          if($newer.Count -gt 0){throw 'NEWER_CONTROL_SWITCH_EXISTS'}

          if(-not(Test-Path -LiteralPath $h -PathType Leaf)){throw 'HERDR_EXE_MISSING'}
          $version=((& $h --version 2>&1)|Out-String).Trim()
          $server=((& $h status server 2>&1)|Out-String).Trim()
          $serverExit=$LASTEXITCODE

          $agentRaw=((& $h agent list 2>&1)|Out-String).Trim()
          $agentExit=$LASTEXITCODE
          $agents=@()
          if($agentExit -eq 0){
            try{$agents=@(($agentRaw|ConvertFrom-Json).result.agents)}catch{throw 'HERDR_AGENT_LIST_UNPARSEABLE'}
          }
          $matches=@($agents|Where-Object{[string]$_.name -ceq $agentName})
          $agentCount=$matches.Count
          $agentStatus='ABSENT'; $agentPane=''; $agentSession=''; $agentCwd=''; $agentRead=''; $agentGet=''
          if($agentCount -eq 1){
            $x=$matches[0]
            $agentStatus=[string]$x.agent_status
            $agentPane=[string]$x.pane_id
            $agentSession=[string]$x.agent_session.value
            $agentCwd=[string]$x.cwd
            $agentGet=((& $h agent get $agentName 2>&1)|Out-String).Trim()
            $getExit=$LASTEXITCODE
            if($getExit -ne 0){$agentGet="GET_FAILED:$agentGet"}
            $agentRead=((& $h agent read $agentName --source recent-unwrapped --lines 80 2>&1)|Out-String).Trim()
            $readExit=$LASTEXITCODE
            if($readExit -ne 0){$agentRead="READ_FAILED:$agentRead"}
          }

          $workspaceRaw=((& $h workspace list 2>&1)|Out-String).Trim()
          $workspaceExit=$LASTEXITCODE
          $workspaceMentionsTarget=($workspaceRaw -match [regex]::Escape($agentName) -or $workspaceRaw -match [regex]::Escape($worktree))

          $wtExists=Test-Path -LiteralPath $worktree -PathType Container
          $localHead='ABSENT'; $localBranch='ABSENT'; $localStatus=''; $localDiff=''; $localCached=''
          if($wtExists){
            $localHead=((& git -C $worktree rev-parse HEAD 2>&1)|Out-String).Trim()
            if($LASTEXITCODE -ne 0){$localHead='UNREADABLE'}
            $localBranch=((& git -C $worktree symbolic-ref -q --short HEAD 2>&1)|Out-String).Trim()
            if([string]::IsNullOrWhiteSpace($localBranch)){$localBranch='DETACHED'}
            $localStatus=((& git -C $worktree status --porcelain=v1 --untracked-files=all 2>&1)|Out-String).Trim()
            $localDiff=((& git -C $worktree diff --name-only 2>&1)|Out-String).Trim()
            $localCached=((& git -C $worktree diff --cached --name-only 2>&1)|Out-String).Trim()
          }

          $classification='AMBIGUOUS_FAIL_CLOSED'
          if($agentCount -gt 1){
            $classification='MULTIPLE_NAMED_AGENTS_FAIL_CLOSED'
          }elseif($agentCount -eq 1 -and $agentCwd -ceq $worktree -and $agentPane -and $agentSession){
            if($agentStatus -in @('idle','done')){$classification='EXACT_NAMED_AGENT_PROMPTABLE'}
            elseif($agentStatus -in @('working','blocked')){$classification='EXACT_NAMED_AGENT_LIVE_NOT_PROMPTABLE'}
            else{$classification='EXACT_NAMED_AGENT_UNSUPPORTED_STATE'}
          }elseif($agentCount -eq 0 -and $workspaceMentionsTarget -and $wtExists){
            $classification='NO_NAMED_AGENT_EXACT_WORKSPACE_PRESENT'
          }elseif($agentCount -eq 0 -and -not $workspaceMentionsTarget -and $wtExists){
            $classification='NO_NAMED_AGENT_WORKTREE_ONLY'
          }elseif($agentCount -eq 0 -and -not $wtExists){
            $classification='NO_NAMED_AGENT_NO_WORKTREE'
          }

          $inventory=@($agents|ForEach-Object{"pane=$($_.pane_id);name=$($_.name);agent=$($_.agent);status=$($_.agent_status);cwd=$($_.cwd);session=$($_.agent_session.value)"}) -join ' || '
          $result=@(
            'GBB_ISSUE162_AGENT_START_TIMEOUT_READONLY_PROBE_RESULT_V1'
            "state: READONLY_RECONCILED"
            "classification: $classification"
            "source_authority: $authority"
            "source_control_adoption: $controlAdoption"
            "source_blocker: $sourceBlocker"
            "source_failed_run: $sourceRun"
            "source_failed_job: $sourceJob"
            "source_probe_wake: $wake"
            "launcher_head_sha: $launcher"
            "herdr_version: $(Safe $version 300)"
            "herdr_server_exit: $serverExit"
            "herdr_server: $(Safe $server 700)"
            "target_agent_name: $agentName"
            "target_agent_count: $agentCount"
            "target_agent_status: $agentStatus"
            "target_agent_pane: $agentPane"
            "target_agent_session: $agentSession"
            "target_agent_cwd: $agentCwd"
            "target_agent_get: $(Safe $agentGet 1200)"
            "target_agent_read: $(Safe $agentRead 1800)"
            "agent_inventory: $(Safe $inventory 2500)"
            "workspace_list_exit: $workspaceExit"
            "workspace_mentions_target: $($workspaceMentionsTarget.ToString().ToLowerInvariant())"
            "workspace_inventory: $(Safe $workspaceRaw 2500)"
            "worktree_exists: $($wtExists.ToString().ToLowerInvariant())"
            "worktree_head: $(Safe $localHead 120)"
            "worktree_branch: $(Safe $localBranch 180)"
            "worktree_status: $(Safe $localStatus 1800)"
            "worktree_diff_paths: $(Safe $localDiff 1200)"
            "worktree_cached_paths: $(Safe $localCached 1200)"
            'herdr_agent_start_count: 0'
            'herdr_prompt_count: 0'
            'workspace_create_count: 0'
            'local_git_mutation_count: 0'
            'scheduled_task_mutation_count: 0'
            'worker_product_mutation_count: 0'
            'user_relay_count: 0'
            'readback_verified: true'
            "idempotency_key: $idem"
          ) -join "`n"
          [void](Publish $result)

  g13_w4p1_readonly_transport:
    if: >-
      github.event.issue.number == 162 &&
      github.event.comment.user.login == 'D22977' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, 'ISSUE162_G13_W4P1_PANE_READONLY_TRANSPORT_WAKE_V1')
    runs-on: [self-hosted, Windows, GBB-REVIEWER]
    timeout-minutes: 8
    defaults:
      run:
        shell: pwsh -NoProfile -File {0}
    steps:
      - name: Run exact G13 w4:p1 read-only transport diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $repo='D22977/gpt-browser-bridge'
          $issue=162
          $adapterAuthority='5646011204'
          $controlSwitch='5645732538'
          $currentStart='5645736288'
          $sourceBlocker='5645790077'
          $sourceProbe='5645810295'
          $sourcePaneBlocked='5645865060'
          $sourceExecutorBoundary='5645917362'
          $expectedRunner='gbb-reviewer-win-01'
          $targetPane='w4:p1'
          $h='C:\Users\Lupun\AppData\Local\Programs\Herdr\bin\herdr.exe'
          $headers=@{Authorization="Bearer $env:GH_TOKEN";'User-Agent'='g13-issue162-w4p1-readonly-transport';Accept='application/vnd.github+json'}

          function Safe([string]$s,[int]$max=2600){
            if($null -eq $s){return ''}
            $v=(($s -replace '[\r\n]+',' | ') -replace '[\x00-\x1F]',' ').Trim()
            if($v.Length -gt $max){return $v.Substring(0,$max)}
            return $v
          }
          function Need([string]$body,[string]$pattern,[string]$name){
            $m=[regex]::Match($body,$pattern)
            if(-not $m.Success){throw "MALFORMED_WAKE_$name"}
            return $m.Groups[1].Value
          }
          function GetComment([string]$id){
            return Invoke-RestMethod "https://api.github.com/repos/$repo/issues/comments/$id" -Headers $headers -Method Get -TimeoutSec 30
          }
          function Publish([string]$body){
            $payload=@{body=$body}|ConvertTo-Json -Compress
            $p=Invoke-RestMethod "https://api.github.com/repos/$repo/issues/$issue/comments" -Headers $headers -Method Post -Body $payload -ContentType 'application/json' -TimeoutSec 30
            $rb=Invoke-RestMethod "https://api.github.com/repos/$repo/issues/comments/$($p.id)" -Headers $headers -Method Get -TimeoutSec 30
            if([string]$rb.body -cne $body){throw 'G13_W4P1_RESULT_READBACK_MISMATCH'}
            return [string]$p.id
          }

          $ev=Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw|ConvertFrom-Json
          $wake=[string]$ev.comment.id
          $body=[string]$ev.comment.body
          $adapter=Need $body '(?m)^source_adapter_authority:\s*(\d+)\s*$' 'ADAPTER_AUTHORITY'
          $activation=Need $body '(?m)^source_diagnostic_activation:\s*(\d+)\s*$' 'DIAGNOSTIC_ACTIVATION'
          $swWake=Need $body '(?m)^source_control_switch:\s*(\d+)\s*$' 'CONTROL_SWITCH'
          $csWake=Need $body '(?m)^source_current_start:\s*(\d+)\s*$' 'CURRENT_START'
          $bWake=Need $body '(?m)^source_blocker:\s*(\d+)\s*$' 'BLOCKER'
          $pWake=Need $body '(?m)^source_probe_result:\s*(\d+)\s*$' 'PROBE_RESULT'
          $pdWake=Need $body '(?m)^source_pane_diagnostic_blocked:\s*(\d+)\s*$' 'PANE_DIAGNOSTIC_BLOCKED'
          $ebWake=Need $body '(?m)^source_executor_boundary_blocked:\s*(\d+)\s*$' 'EXECUTOR_BOUNDARY_BLOCKED'
          $launcher=Need $body '(?m)^launcher_head_sha:\s*([0-9a-f]{40})\s*$' 'LAUNCHER_HEAD'
          $pane=Need $body '(?m)^target_pane:\s*([^\s]+)\s*$' 'TARGET_PANE'
          $idem=Need $body '(?m)^idempotency_key:\s*([A-Za-z0-9._:-]+)\s*$' 'IDEMPOTENCY'

          $runnerName=[string]$env:RUNNER_NAME
          $runnerUser=[System.Security.Principal.WindowsIdentity]::GetCurrent().Name
          $runnerSessionId=[string](Get-Process -Id $PID).SessionId
          $paneGetExit=-1; $processInfoExit=-1; $paneReadExit=-1
          $paneGet=''; $processInfo=''; $paneRead=''
          $paneGetCount=0; $processInfoCount=0; $paneReadCount=0
          $state='BLOCKED'; $classification='TRANSPORT_IDENTITY_MISMATCH'
          $foregroundOwnership='UNOBSERVED'; $processIdentity='UNOBSERVED'

            $priorRows=@(Invoke-RestMethod "https://api.github.com/repos/$repo/issues/$issue/comments?per_page=100" -Headers $headers -Method Get -TimeoutSec 30)
            $prior=@($priorRows|Where-Object{[string]$_.body -match '(?m)^GBB_ISSUE162_G13_W4P1_PANE_READONLY_TRANSPORT_RESULT_V1\s*$' -and ([string]$_.body -match "(?m)^wake_comment_id:\s*$wake\s*$" -or [string]$_.body -match "(?m)^idempotency_key:\s*$([regex]::Escape($idem))\s*$")})

            function Normalize-IdentityValue([object]$value){
              if($null -eq $value){return ''}
              return ([string]$value).Trim()
            }
            function Same-IdentityValue([object]$left,[object]$right){
              return ((Normalize-IdentityValue $left) -ieq (Normalize-IdentityValue $right))
            }
            function Classify-ProcessIdentity([string]$PaneJson,[string]$ProcessInfoJson,[int]$RunnerSessionId,[object[]]$NativeRows=@()){
              $evidence=[ordered]@{
                native_query='Get-CimInstance Win32_Process + Get-Process'
                pane_id=''
                foreground_group_id=''
                shell_pid=''
                foreground_pid=''
                foreground_count=0
                native_shell_present=$false
                native_foreground_present=$false
                native_name_match=$false
                native_path_match=$false
                native_cmdline_match=$false
                native_parent_match=$false
                native_session_match=$false
                cwd_match_to_pane=$false
              }
              try{
                $paneObject=$PaneJson|ConvertFrom-Json -ErrorAction Stop
                $infoObject=$ProcessInfoJson|ConvertFrom-Json -ErrorAction Stop
                $paneNode=$paneObject.result.pane
                $infoNode=$infoObject.result.process_info
                if($null -eq $paneNode -or $null -eq $infoNode){throw 'PROCESS_INFO_SCHEMA_INVALID'}
                $paneId=Normalize-IdentityValue $paneNode.pane_id
                $paneCwd=Normalize-IdentityValue $paneNode.cwd
                if($paneId -cne 'w4:p1' -or [string]::IsNullOrWhiteSpace($paneCwd)){throw 'PANE_ID_OR_CWD_INVALID'}
                $evidence.pane_id=$paneId
                $groupPid=[int64]0; $shellPid=[int64]0
                if(-not [int64]::TryParse((Normalize-IdentityValue $infoNode.foreground_process_group_id),[ref]$groupPid)){throw 'FOREGROUND_GROUP_ID_INVALID'}
                if(-not [int64]::TryParse((Normalize-IdentityValue $infoNode.shell_pid),[ref]$shellPid)){throw 'SHELL_PID_INVALID'}
                if($groupPid -ne $shellPid){throw 'CONSOLE_GROUP_SHELL_MISMATCH'}
                $foreground=@($infoNode.foreground_processes)
                $evidence.foreground_group_id=[string]$groupPid
                $evidence.shell_pid=[string]$shellPid
                $evidence.foreground_count=$foreground.Count
                if($foreground.Count -ne 1){throw 'FOREGROUND_PROCESS_COUNT_NOT_ONE'}
                $row=$foreground[0]
                $foregroundPid=[int64]0
                if(-not [int64]::TryParse((Normalize-IdentityValue $row.pid),[ref]$foregroundPid)){throw 'FOREGROUND_PID_INVALID'}
                $rowName=Normalize-IdentityValue $row.name
                $rowPath=Normalize-IdentityValue $row.argv0
                $rowCommandLine=Normalize-IdentityValue $row.cmdline
                $rowCwd=Normalize-IdentityValue $row.cwd
                if([string]::IsNullOrWhiteSpace($rowName) -or [string]::IsNullOrWhiteSpace($rowPath) -or [string]::IsNullOrWhiteSpace($rowCommandLine) -or [string]::IsNullOrWhiteSpace($rowCwd)){throw 'FOREGROUND_IDENTITY_FIELDS_MISSING'}
                if(-not (Same-IdentityValue $rowCwd $paneCwd)){throw 'FOREGROUND_CWD_MISMATCH'}
                $evidence.foreground_pid=[string]$foregroundPid
                $evidence.cwd_match_to_pane=$true
                if($NativeRows.Count -eq 0){
                  $NativeRows=@(Get-CimInstance -ClassName Win32_Process -ErrorAction Stop|Select-Object ProcessId,Name,ExecutablePath,CommandLine,ParentProcessId,SessionId)
                  $shellProcess=Get-Process -Id ([int]$shellPid) -ErrorAction Stop
                  $foregroundProcess=Get-Process -Id ([int]$foregroundPid) -ErrorAction Stop
                  $evidence.get_process_shell_session=[string]$shellProcess.SessionId
                  $evidence.get_process_foreground_session=[string]$foregroundProcess.SessionId
                }
                $nativeForeground=@($NativeRows|Where-Object{[int64]$_.ProcessId -eq $foregroundPid})
                $nativeShell=@($NativeRows|Where-Object{[int64]$_.ProcessId -eq $shellPid})
                if($nativeForeground.Count -ne 1 -or $nativeShell.Count -ne 1){throw 'NATIVE_PROCESS_ROW_MISSING_OR_DUPLICATE'}
                $nativeForegroundRow=$nativeForeground[0]
                $nativeShellRow=$nativeShell[0]
                $evidence.native_foreground_present=$true
                $evidence.native_shell_present=$true
                $evidence.native_name_match=(Same-IdentityValue $rowName $nativeForegroundRow.Name)
                $evidence.native_path_match=(Same-IdentityValue $rowPath $nativeForegroundRow.ExecutablePath)
                $evidence.native_cmdline_match=(Same-IdentityValue $rowCommandLine $nativeForegroundRow.CommandLine)
                $nativeParentPid=[int64]0
                $nativeParentValid=[int64]::TryParse((Normalize-IdentityValue $nativeForegroundRow.ParentProcessId),[ref]$nativeParentPid)
                $nativeSessionId=[int64]0
                $nativeSessionValid=[int64]::TryParse((Normalize-IdentityValue $nativeForegroundRow.SessionId),[ref]$nativeSessionId)
                $evidence.native_parent_pid=if($nativeParentValid){[string]$nativeParentPid}else{''}
                $evidence.native_session_id=if($nativeSessionValid){[string]$nativeSessionId}else{''}
                $evidence.native_parent_match=($nativeParentValid -and (($foregroundPid -eq $shellPid) -or ($nativeParentPid -eq $shellPid)))
                $evidence.native_session_match=($nativeSessionValid -and $nativeSessionId -eq [int64]$RunnerSessionId)
                if(-not $evidence.native_name_match -or -not $evidence.native_path_match -or -not $evidence.native_cmdline_match -or -not $evidence.native_session_match){throw 'NATIVE_PROCESS_IDENTITY_MISMATCH'}
                if($foregroundPid -eq $shellPid){
                  if(-not $evidence.native_parent_match){throw 'SHELL_PARENT_EVIDENCE_MISSING'}
                  return [pscustomobject]@{state='CORROBORATED';classification='SHELL_OWNS_FOREGROUND';evidence=$evidence}
                }
                if(-not $evidence.native_parent_match){throw 'CHILD_PARENT_MISMATCH'}
                return [pscustomobject]@{state='CORROBORATED';classification='CHILD_OWNS_FOREGROUND';evidence=$evidence}
              }catch{
                $evidence.error=$_.Exception.Message
                return [pscustomobject]@{state='FAIL_CLOSED';classification='PROCESS_IDENTITY_CORROBORATION_FAILED';evidence=$evidence}
              }
            }
            function Invoke-OfflineIdentityFixtures{
              $fixturePane=@{result=@{pane=@{pane_id='w4:p1';cwd='D:\fixture'}}}|ConvertTo-Json -Depth 8 -Compress
              $fixtureNative=@(
                [pscustomobject]@{ProcessId=1234;Name='powershell.exe';ExecutablePath='C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe';CommandLine='powershell.exe -NoExit';ParentProcessId=100;SessionId=1}
                [pscustomobject]@{ProcessId=2345;Name='codex.exe';ExecutablePath='D:\fixture\codex.exe';CommandLine='D:\fixture\codex.exe --probe';ParentProcessId=1234;SessionId=1}
              )
              $shellInfo=@{result=@{process_info=@{foreground_process_group_id=1234;shell_pid=1234;foreground_processes=@(@{pid=1234;name='powershell.exe';argv0='C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe';cmdline='powershell.exe -NoExit';cwd='D:\fixture'})}}}|ConvertTo-Json -Depth 10 -Compress
              $childInfo=@{result=@{process_info=@{foreground_process_group_id=1234;shell_pid=1234;foreground_processes=@(@{pid=2345;name='codex.exe';argv0='D:\fixture\codex.exe';cmdline='D:\fixture\codex.exe --probe';cwd='D:\fixture'})}}}|ConvertTo-Json -Depth 10 -Compress
              $shell=Classify-ProcessIdentity $fixturePane $shellInfo 1 $fixtureNative
              $child=Classify-ProcessIdentity $fixturePane $childInfo 1 $fixtureNative
              $malformed=Classify-ProcessIdentity $fixturePane '{"result":{}}' 1 $fixtureNative
              $multipleInfo=@{result=@{process_info=@{foreground_process_group_id=1234;shell_pid=1234;foreground_processes=@(@{pid=1234;name='powershell.exe';argv0='C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe';cmdline='powershell.exe -NoExit';cwd='D:\fixture'},@{pid=2345;name='codex.exe';argv0='D:\fixture\codex.exe';cmdline='D:\fixture\codex.exe --probe';cwd='D:\fixture'})}}}|ConvertTo-Json -Depth 10 -Compress
              $multiple=Classify-ProcessIdentity $fixturePane $multipleInfo 1 $fixtureNative
              if($shell.classification -cne 'SHELL_OWNS_FOREGROUND'){throw 'OFFLINE_FIXTURE_SHELL_FAILED'}
              if($child.classification -cne 'CHILD_OWNS_FOREGROUND'){throw 'OFFLINE_FIXTURE_CHILD_FAILED'}
              if($malformed.classification -cne 'PROCESS_IDENTITY_CORROBORATION_FAILED'){throw 'OFFLINE_FIXTURE_MALFORMED_FAILED'}
              if($multiple.classification -cne 'PROCESS_IDENTITY_CORROBORATION_FAILED'){throw 'OFFLINE_FIXTURE_MULTIPLE_FAILED'}
              return 'PASS:shell,child,malformed,multiple-fail-closed'
            }
            $offlineFixtureResult=Invoke-OfflineIdentityFixtures
            if($prior.Count -gt 0){
              $state='NO_OP_DUPLICATE'; $classification='NO_OP_DUPLICATE';
          }else{
            try{
              if($adapter -cne $adapterAuthority -or $swWake -cne $controlSwitch -or $csWake -cne $currentStart -or $bWake -cne $sourceBlocker -or $pWake -cne $sourceProbe -or $pdWake -cne $sourcePaneBlocked -or $ebWake -cne $sourceExecutorBoundary -or $pane -cne $targetPane){throw 'WAKE_BINDING_MISMATCH'}
              if($launcher -cne $env:GITHUB_SHA){throw 'LAUNCHER_HEAD_MISMATCH'}
              if($runnerName -cne $expectedRunner){throw 'RUNNER_NAME_MISMATCH'}

              $authBody=[string](GetComment $adapterAuthority).body
              if(-not $authBody.StartsWith('CONTROL_G13_ISSUE162_SELF_HOSTED_W4P1_READONLY_TRANSPORT_ADAPTER_AUTHORITY_V1') -or $authBody -notmatch '(?m)^control_generation:\s*013\s*$'){throw 'ADAPTER_AUTHORITY_INVALID'}
              $activationBody=[string](GetComment $activation).body
              if(-not $activationBody.StartsWith('CONTROL_G13_ISSUE162_W4P1_PANE_READONLY_DIAGNOSTIC_ACTIVATION_V1') -or $activationBody -notmatch '(?m)^state:\s*EXECUTE_ONCE\s*$' -or $activationBody -notmatch '(?m)^source_adapter_authority:\s*5646011204\s*$' -or $activationBody -notmatch '(?m)^control_generation:\s*013\s*$' -or $activationBody -notmatch '(?m)^target_pane:\s*w4:p1\s*$' -or $activationBody -notmatch '(?m)^diagnostic_execution_authorized:\s*true\s*$'){throw 'ACTIVATION_AUTHORITY_INVALID'}

              $switchObj=GetComment $controlSwitch; $switchBody=[string]$switchObj.body
              if(-not $switchBody.StartsWith('CONTROL_GENERATION_SWITCH_V1') -or $switchBody -notmatch '(?m)^state:\s*SWITCH_COMMITTED\s*$' -or $switchBody -notmatch '(?m)^new_generation:\s*013\s*$' -or $switchBody -notmatch '(?m)^new_status:\s*ACTIVE\s*$'){throw 'CONTROL013_NOT_ACTIVE'}
              $since=[uri]::EscapeDataString([string]$switchObj.created_at)
              $switchRows=@(Invoke-RestMethod "https://api.github.com/repos/$repo/issues/88/comments?since=$since&per_page=100" -Headers $headers -Method Get -TimeoutSec 30)
              $newerSwitch=@($switchRows|Where-Object{[int64]$_.id -gt [int64]$controlSwitch -and [string]$_.body -match '(?m)^CONTROL_GENERATION_SWITCH_V1\s*$' -and [string]$_.body -match '(?m)^state:\s*SWITCH_COMMITTED\s*$'})
              if($newerSwitch.Count -gt 0){$state='STALE'; throw 'NEWER_CONTROL_SWITCH_EXISTS'}

              $currentBody=[string](GetComment $currentStart).body
              if(-not $currentBody.StartsWith('CURRENT_REHYDRATION_INDEX_V117') -or $currentBody -notmatch '(?m)^state:\s*CURRENT_START_HERE\s*$' -or $currentBody -notmatch '(?m)^control_generation:\s*013\s*$' -or $currentBody -notmatch '(?m)^control_status:\s*ACTIVE\s*$'){throw 'CURRENT_START_INVALID'}
              $blkBody=[string](GetComment $sourceBlocker).body
              if(-not $blkBody.StartsWith('GBB_ISSUE162_EXISTING_WORKSPACE_AGENT_START_RECOVERY_RESULT_V1') -or $blkBody -notmatch '(?m)^state:\s*BLOCKED\s*$'){throw 'SOURCE_BLOCKER_INVALID'}
              $probeBody=[string](GetComment $sourceProbe).body
              if(-not $probeBody.StartsWith('GBB_ISSUE162_AGENT_START_TIMEOUT_READONLY_PROBE_RESULT_V1') -or $probeBody -notmatch '(?m)^classification:\s*NO_NAMED_AGENT_EXACT_WORKSPACE_PRESENT\s*$'){throw 'SOURCE_PROBE_INVALID'}
              $paneBlockedBody=[string](GetComment $sourcePaneBlocked).body
              if(-not $paneBlockedBody.StartsWith('GBB_ISSUE162_PANE_LEVEL_READONLY_DIAGNOSTIC_RESULT_V1') -or $paneBlockedBody -notmatch '(?m)^state:\s*BLOCKED\s*$'){throw 'SOURCE_PANE_BLOCKED_INVALID'}
              $boundaryBody=[string](GetComment $sourceExecutorBoundary).body
              if(-not $boundaryBody.StartsWith('CONTROL_G13_ISSUE162_EXECUTOR_ADMISSION_BOUNDARY_DECISION_V1') -or $boundaryBody -notmatch '(?m)^state:\s*BLOCKED\s*$'){throw 'SOURCE_EXECUTOR_BOUNDARY_INVALID'}

              if(-not(Test-Path -LiteralPath $h -PathType Leaf)){throw 'HERDR_EXE_MISSING'}
              $paneGetCount=1
              $paneGet=((& $h pane get $targetPane 2>&1)|Out-String).Trim(); $paneGetExit=$LASTEXITCODE
              $processInfoCount=1
              $processInfo=((& $h pane process-info --pane $targetPane 2>&1)|Out-String).Trim(); $processInfoExit=$LASTEXITCODE
              $paneReadCount=1
              $paneRead=((& $h pane read $targetPane --source recent-unwrapped 2>&1)|Out-String).Trim(); $paneReadExit=$LASTEXITCODE

               if($paneGetExit -ne 0){$classification='PANE_ABSENT_OR_UNREADABLE'}
               elseif($processInfoExit -ne 0 -or $paneReadExit -ne 0){$classification='HERDR_READONLY_COMMAND_FAILED'}
               else{
                 $identity=Classify-ProcessIdentity $paneGet $processInfo ([int]$runnerSessionId)
                 $classification=[string]$identity.classification
                 $foregroundOwnership=$classification
                 $processIdentity=($identity|ConvertTo-Json -Depth 10 -Compress)
               }
               $state='READONLY_DIAGNOSTIC_COMPLETE'
             }catch{
              if($state -ne 'STALE'){$state='BLOCKED'}
              if($classification -eq 'TRANSPORT_IDENTITY_MISMATCH'){$classification='TRANSPORT_IDENTITY_MISMATCH'}
              if($paneGetCount -gt 0 -and ($paneGetExit -ne 0 -or $processInfoExit -ne 0 -or $paneReadExit -ne 0)){$classification='HERDR_READONLY_COMMAND_FAILED'}
            }
          }

          $result=@(
            'GBB_ISSUE162_G13_W4P1_PANE_READONLY_TRANSPORT_RESULT_V1'
            "state: $state"
            "classification: $classification"
            "authority_receipt: $activation"
            "wake_comment_id: $wake"
            "idempotency_key: $idem"
            'control_generation: 013'
            "source_control_switch: $controlSwitch"
            "source_current_start: $currentStart"
            "source_blocker: $sourceBlocker"
            "source_probe_result: $sourceProbe"
            "source_pane_diagnostic_blocked: $sourcePaneBlocked"
            "source_executor_boundary_blocked: $sourceExecutorBoundary"
            "source_adapter_authority: $adapterAuthority"
            "launcher_head_sha: $launcher"
            "runner_name: $(Safe $runnerName 200)"
            "runner_user: $(Safe $runnerUser 300)"
            "runner_session_id: $(Safe $runnerSessionId 100)"
            'target_pane: w4:p1'
            "pane_get_exit: $paneGetExit"
            "pane_get_output: $(Safe $paneGet 2600)"
            "process_info_exit: $processInfoExit"
            "process_info_output: $(Safe $processInfo 2600)"
            "pane_read_exit: $paneReadExit"
            "recent_output: $(Safe $paneRead 2600)"
            "pane_foreground_interactive_ownership: $(Safe $foregroundOwnership 400)"
            "process_identity: $(Safe $processIdentity 1800)"
            "herdr_pane_get_count: $paneGetCount"
            "herdr_pane_process_info_count: $processInfoCount"
            "herdr_pane_read_count: $paneReadCount"
            'forbidden_herdr_command_count: 0'
            'agent_start_count: 0'
            'agent_prompt_count: 0'
            'workspace_mutation_count: 0'
            'pane_mutation_count: 0'
            'git_mutation_count: 0'
            'file_mutation_count: 0'
            'worker_product_mutation_count: 0'
            'scheduled_task_mutation_count: 0'
            'workflow_dispatch_count: 0'
            'old_wake_retry_count: 0'
            'readback_verified: true'
          ) -join "`n"
          [void](Publish $result)
