            # V2 override: the V1 classifier above is retained only as historical context;
            # this definition is the bounded V2 implementation used by production and fixtures.
            function Get-RawIdentityValue([object]$value){
              if($null -eq $value){return ''}
              return [string]$value
            }
            function Same-CmdlineValue([object]$left,[object]$right){
              return ((Get-RawIdentityValue $left) -ceq (Get-RawIdentityValue $right))
            }
            function Same-ProcessName([object]$left,[object]$right){
              $l=(Normalize-IdentityValue $left) -replace '(?i)\.exe$',''
              $r=(Normalize-IdentityValue $right) -replace '(?i)\.exe$',''
              return ($l -ieq $r)
            }
            function Test-SupportedShellRole([object]$name,[object]$path,[object]$commandLine){
              $normalizedName=(Normalize-IdentityValue $name) -replace '(?i)\.exe$',''
              $pathLeaf=(Split-Path -Leaf (Normalize-IdentityValue $path)) -replace '(?i)\.exe$',''
              $command=(Get-RawIdentityValue $commandLine)
              return (($normalizedName -iin @('powershell','pwsh','cmd')) -and ($pathLeaf -ieq $normalizedName) -and -not [string]::IsNullOrWhiteSpace($command))
            }
            function ConvertTo-StableMismatchReason([string]$rawReason){
              $reason=[string]$rawReason
              $stable=@(
                'PROCESS_INFO_SCHEMA_INVALID','PANE_ID_OR_CWD_INVALID','FOREGROUND_GROUP_ID_INVALID','SHELL_PID_INVALID',
                'CONSOLE_GROUP_SHELL_MISMATCH','FOREGROUND_PROCESS_SCHEMA_NOT_ARRAY','FOREGROUND_PROCESS_COUNT_NOT_ONE',
                'FOREGROUND_PID_INVALID','FOREGROUND_IDENTITY_FIELDS_MISSING','FOREGROUND_CWD_MISMATCH',
                'NATIVE_PROCESS_ROW_MISSING_OR_DUPLICATE','NATIVE_SHELL_PID_INVALID','NATIVE_FOREGROUND_PID_INVALID',
                'NATIVE_SHELL_IDENTITY_FIELDS_MISSING','NATIVE_FOREGROUND_IDENTITY_FIELDS_MISSING','NATIVE_SHELL_PARENT_INVALID',
                'NATIVE_FOREGROUND_PARENT_INVALID','NATIVE_SHELL_SESSION_INVALID','NATIVE_FOREGROUND_SESSION_INVALID',
                'GET_PROCESS_ROW_MISSING_OR_DUPLICATE','GET_PROCESS_SHELL_SESSION_INVALID','GET_PROCESS_FOREGROUND_SESSION_INVALID',
                'GET_PROCESS_IDENTITY_FIELDS_MISSING','NATIVE_PROCESS_IDENTITY_MISMATCH','NATIVE_GET_PROCESS_SESSION_MISMATCH',
                'NATIVE_CWD_UNAVAILABLE','NATIVE_CWD_MISMATCH','SHELL_ROLE_PARENT_EVIDENCE_MISSING','SHELL_ROLE_UNSUPPORTED',
                'CHILD_PARENT_MISMATCH','NATIVE_CWD_FIXTURE_DUPLICATE'
              )
              if($stable -contains $reason){return $reason}
              if($reason -match 'ConvertFrom-Json|JSON|Unexpected character|Invalid JSON'){return 'MALFORMED_JSON'}
              if($reason -match 'schema|Schema|Property|member'){return 'SCHEMA_INVALID'}
              if($reason -match '^NATIVE_CWD_|Add-Type|GbbNativeProcess'){return 'NATIVE_CWD_UNAVAILABLE'}
              return 'RUNTIME_EXCEPTION'
            }
            function Ensure-NativeProcessType{
              if(-not ('GbbNativeProcess' -as [type])){
              Add-Type -TypeDefinition @'
          using System;
          using System.ComponentModel;
          using System.Runtime.InteropServices;
          using System.Text;

          public static class GbbNativeProcess
          {
              [StructLayout(LayoutKind.Sequential)]
              private struct PROCESS_BASIC_INFORMATION
              {
                  public IntPtr Reserved1;
                  public IntPtr PebBaseAddress;
                  public IntPtr Reserved2_0;
                  public IntPtr Reserved2_1;
                  public IntPtr UniqueProcessId;
                  public IntPtr Reserved3;
              }

              private sealed class UNICODE_STRING
              {
                  public ushort Length;
                  public IntPtr Buffer;
              }

              public sealed class CwdResult
              {
                  public int Pid { get; set; }
                  public bool Success { get; set; }
                  public string Value { get; set; }
                  public string Source { get; set; }
                  public string Error { get; set; }
              }

              [DllImport("kernel32.dll", SetLastError = true)]
              private static extern IntPtr OpenProcess(uint access, bool inheritHandle, uint processId);
              [DllImport("kernel32.dll", SetLastError = true)]
              private static extern bool CloseHandle(IntPtr handle);
              [DllImport("kernel32.dll", SetLastError = true)]
              private static extern bool ReadProcessMemory(IntPtr process, IntPtr address, IntPtr buffer, int size, out IntPtr read);
              [DllImport("ntdll.dll")]
              private static extern int NtQueryInformationProcess(IntPtr process, int informationClass, IntPtr information, int informationLength, out int returnLength);

              private static byte[] ReadBytes(IntPtr process, IntPtr address, int size)
              {
                  if (address == IntPtr.Zero || size <= 0 || size > 65536) throw new InvalidOperationException("NATIVE_CWD_READ_RANGE_INVALID");
                  IntPtr buffer = Marshal.AllocHGlobal(size);
                  try
                  {
                      IntPtr read;
                      if (!ReadProcessMemory(process, address, buffer, size, out read) || read.ToInt64() != size)
                          throw new Win32Exception(Marshal.GetLastWin32Error(), "NATIVE_CWD_READ_PROCESS_MEMORY_FAILED");
                      byte[] bytes = new byte[size];
                      Marshal.Copy(buffer, bytes, 0, size);
                      return bytes;
                  }
                  finally { Marshal.FreeHGlobal(buffer); }
              }

              private static IntPtr ReadPointer(byte[] bytes, int offset)
              {
                  return IntPtr.Size == 8 ? new IntPtr(BitConverter.ToInt64(bytes, offset)) : new IntPtr(BitConverter.ToInt32(bytes, offset));
              }

              private static UNICODE_STRING ReadUnicodeString(IntPtr process, IntPtr address)
              {
                  int size = IntPtr.Size == 8 ? 16 : 8;
                  byte[] bytes = ReadBytes(process, address, size);
                  int bufferOffset = IntPtr.Size == 8 ? 8 : 4;
                  return new UNICODE_STRING { Length = BitConverter.ToUInt16(bytes, 0), Buffer = ReadPointer(bytes, bufferOffset) };
              }

              public static CwdResult GetCurrentDirectory(int pid)
              {
                  var result = new CwdResult { Pid = pid, Success = false, Value = "", Source = "NtQueryInformationProcess/PEB/RTL_USER_PROCESS_PARAMETERS.CurrentDirectory", Error = "" };
                  if (pid <= 0) { result.Error = "NATIVE_CWD_PID_NOT_POSITIVE"; return result; }
                  if (!Environment.Is64BitProcess) { result.Error = "NATIVE_CWD_UNSUPPORTED_32BIT_READER"; return result; }
                  IntPtr process = OpenProcess(0x00000410, false, (uint)pid);
                  if (process == IntPtr.Zero) { result.Error = "NATIVE_CWD_OPEN_PROCESS_FAILED:" + Marshal.GetLastWin32Error(); return result; }
                  IntPtr pbiBuffer = Marshal.AllocHGlobal(Marshal.SizeOf(typeof(PROCESS_BASIC_INFORMATION)));
                  try
                  {
                      int returnLength;
                      int status = NtQueryInformationProcess(process, 0, pbiBuffer, Marshal.SizeOf(typeof(PROCESS_BASIC_INFORMATION)), out returnLength);
                      if (status != 0) { result.Error = "NATIVE_CWD_NT_QUERY_FAILED:" + status; return result; }
                      var pbi = (PROCESS_BASIC_INFORMATION)Marshal.PtrToStructure(pbiBuffer, typeof(PROCESS_BASIC_INFORMATION));
                      IntPtr processParametersAddress = ReadPointer(ReadBytes(process, IntPtr.Add(pbi.PebBaseAddress, 0x20), IntPtr.Size), 0);
                      if (processParametersAddress == IntPtr.Zero) { result.Error = "NATIVE_CWD_PROCESS_PARAMETERS_MISSING"; return result; }
                      var unicode = ReadUnicodeString(process, IntPtr.Add(processParametersAddress, IntPtr.Size == 8 ? 0x38 : 0x24));
                      if (unicode.Length == 0 || unicode.Length > 32766 || unicode.Length % 2 != 0 || unicode.Buffer == IntPtr.Zero)
                      { result.Error = "NATIVE_CWD_UNICODE_STRING_INVALID"; return result; }
                      string value = Encoding.Unicode.GetString(ReadBytes(process, unicode.Buffer, unicode.Length)).Trim();
                      if (String.IsNullOrWhiteSpace(value)) { result.Error = "NATIVE_CWD_VALUE_EMPTY"; return result; }
                      result.Value = value;
                      result.Success = true;
                      return result;
                  }
                  catch (Exception ex) { result.Error = "NATIVE_CWD_EXCEPTION:" + ex.GetType().Name + ":" + ex.Message; return result; }
                  finally { Marshal.FreeHGlobal(pbiBuffer); CloseHandle(process); }
              }
          }
          '@
              }
            }
            function Get-NativeCwdEvidence([int64]$ProcessId,[object[]]$NativeCwdRows=@()){
              $provided=@($NativeCwdRows|Where-Object{[int64]$_.Pid -eq $ProcessId})
              if($provided.Count -gt 1){return [pscustomobject]@{pid=$ProcessId;success=$false;value='';source='fixture';error='NATIVE_CWD_FIXTURE_DUPLICATE'}}
              if($provided.Count -eq 1){return [pscustomobject]@{pid=$ProcessId;success=([bool]$provided[0].Success);value=(Normalize-IdentityValue $provided[0].Value);source=(Normalize-IdentityValue $provided[0].Source);error=(Normalize-IdentityValue $provided[0].Error)}}
              Ensure-NativeProcessType
              $native=[GbbNativeProcess]::GetCurrentDirectory([int]$ProcessId)
              return [pscustomobject]@{pid=$ProcessId;success=[bool]$native.Success;value=(Normalize-IdentityValue $native.Value);source=(Normalize-IdentityValue $native.Source);error=(Normalize-IdentityValue $native.Error)}
            }
            function Classify-ProcessIdentity([string]$PaneJson,[string]$ProcessInfoJson,[int]$RunnerSessionId,[object[]]$NativeRows=@(),[object[]]$ProcessRows=@(),[object[]]$NativeCwdRows=@()){
              $evidence=[ordered]@{
                native_query='Get-CimInstance Win32_Process + Get-Process + native PEB current directory'
                pane_id=''; foreground_group_id=''; shell_pid=''; foreground_pid=''; foreground_count=0
                herdr_foreground=[ordered]@{pid='';name='';path='';cmdline='';cwd=''}
                native_shell=[ordered]@{pid='';name='';path='';cmdline='';parent_pid='';session_id='';cwd=''}
                native_foreground=[ordered]@{pid='';name='';path='';cmdline='';parent_pid='';session_id='';cwd=''}
                get_process_shell=[ordered]@{pid='';name='';path='';session_id=''}
                get_process_foreground=[ordered]@{pid='';name='';path='';session_id=''}
                native_shell_cwd=[ordered]@{success=$false;value='';source='';error=''}
                native_foreground_cwd=[ordered]@{success=$false;value='';source='';error=''}
                agreement=[ordered]@{shell_name=$false;shell_path=$false;shell_cmdline=$false;foreground_name=$false;foreground_path=$false;foreground_cmdline=$false;get_process_shell_identity=$false;get_process_foreground_identity=$false;shell_identity=$false;foreground_identity=$false;shell_role=$false;parent=$false;sessions=$false;cwd=$false}
                ownership_classification='UNOBSERVED'; mismatch_reason=''; mismatch_detail=''
              }
              try{
                $paneObject=$PaneJson|ConvertFrom-Json -ErrorAction Stop
                $infoObject=$ProcessInfoJson|ConvertFrom-Json -ErrorAction Stop
                $paneNode=$paneObject.result.pane; $infoNode=$infoObject.result.process_info
                if($null -eq $paneNode -or $null -eq $infoNode){throw 'PROCESS_INFO_SCHEMA_INVALID'}
                $paneId=Normalize-IdentityValue $paneNode.pane_id; $paneCwd=Normalize-IdentityValue $paneNode.cwd
                if($paneId -cne 'w4:p1' -or [string]::IsNullOrWhiteSpace($paneCwd)){throw 'PANE_ID_OR_CWD_INVALID'}
                $evidence.pane_id=$paneId
                $groupPid=[int64]0; $shellPid=[int64]0
                $groupParsed=[int64]::TryParse((Normalize-IdentityValue $infoNode.foreground_process_group_id),[ref]$groupPid)
                $shellParsed=[int64]::TryParse((Normalize-IdentityValue $infoNode.shell_pid),[ref]$shellPid)
                if((-not $groupParsed) -or ($groupPid -le 0)){throw 'FOREGROUND_GROUP_ID_INVALID'}
                if((-not $shellParsed) -or ($shellPid -le 0)){throw 'SHELL_PID_INVALID'}
                if($groupPid -ne $shellPid){throw 'CONSOLE_GROUP_SHELL_MISMATCH'}
                $fpProperty=$infoNode.PSObject.Properties['foreground_processes']
                if(($null -eq $fpProperty) -or ($null -eq $fpProperty.Value) -or (-not ($fpProperty.Value -is [System.Array]))){throw 'FOREGROUND_PROCESS_SCHEMA_NOT_ARRAY'}
                $foreground=@($fpProperty.Value)
                $evidence.foreground_group_id=[string]$groupPid; $evidence.shell_pid=[string]$shellPid; $evidence.foreground_count=$foreground.Count
                if($foreground.Count -ne 1){throw 'FOREGROUND_PROCESS_COUNT_NOT_ONE'}
                $row=$foreground[0]; $foregroundPid=[int64]0
                $foregroundParsed=[int64]::TryParse((Normalize-IdentityValue $row.pid),[ref]$foregroundPid)
                if((-not $foregroundParsed) -or ($foregroundPid -le 0)){throw 'FOREGROUND_PID_INVALID'}
                $rowName=Normalize-IdentityValue $row.name; $rowPath=Normalize-IdentityValue $row.argv0; $rowCommandLine=Get-RawIdentityValue $row.cmdline; $rowCwd=Normalize-IdentityValue $row.cwd
                if([string]::IsNullOrWhiteSpace($rowName) -or [string]::IsNullOrWhiteSpace($rowPath) -or [string]::IsNullOrWhiteSpace($rowCommandLine) -or [string]::IsNullOrWhiteSpace($rowCwd)){throw 'FOREGROUND_IDENTITY_FIELDS_MISSING'}
                if(-not (Same-IdentityValue $rowCwd $paneCwd)){throw 'FOREGROUND_CWD_MISMATCH'}
                $evidence.foreground_pid=[string]$foregroundPid; $evidence.herdr_foreground=[ordered]@{pid=[string]$foregroundPid;name=$rowName;path=$rowPath;cmdline=$rowCommandLine;cwd=$rowCwd}

                if($NativeRows.Count -eq 0){$NativeRows=@(Get-CimInstance -ClassName Win32_Process -ErrorAction Stop|Select-Object ProcessId,Name,ExecutablePath,CommandLine,ParentProcessId,SessionId)}
                if($ProcessRows.Count -eq 0){
                  if($shellPid -eq $foregroundPid){$ProcessRows=@(Get-Process -Id ([int]$shellPid) -ErrorAction Stop|Select-Object Id,SessionId,ProcessName,Path)}
                  else{$ProcessRows=@((Get-Process -Id ([int]$shellPid) -ErrorAction Stop|Select-Object Id,SessionId,ProcessName,Path),(Get-Process -Id ([int]$foregroundPid) -ErrorAction Stop|Select-Object Id,SessionId,ProcessName,Path))}
                }
                $nativeForeground=@($NativeRows|Where-Object{[int64]$_.ProcessId -eq $foregroundPid}); $nativeShell=@($NativeRows|Where-Object{[int64]$_.ProcessId -eq $shellPid})
                if(($nativeForeground.Count -ne 1) -or ($nativeShell.Count -ne 1)){throw 'NATIVE_PROCESS_ROW_MISSING_OR_DUPLICATE'}
                $nativeForegroundRow=$nativeForeground[0]; $nativeShellRow=$nativeShell[0]
                $nativeShellPid=[int64]0; $nativeForegroundNativePid=[int64]0; $nativeShellParent=[int64]0; $nativeForegroundParent=[int64]0; $nativeShellSession=[int64]0; $nativeForegroundSession=[int64]0
                $nativeShellPidParsed=[int64]::TryParse((Normalize-IdentityValue $nativeShellRow.ProcessId),[ref]$nativeShellPid)
                $nativeForegroundPidParsed=[int64]::TryParse((Normalize-IdentityValue $nativeForegroundRow.ProcessId),[ref]$nativeForegroundNativePid)
                if((-not $nativeShellPidParsed) -or ($nativeShellPid -ne $shellPid) -or ($nativeShellPid -le 0)){throw 'NATIVE_SHELL_PID_INVALID'}
                if((-not $nativeForegroundPidParsed) -or ($nativeForegroundNativePid -ne $foregroundPid) -or ($nativeForegroundNativePid -le 0)){throw 'NATIVE_FOREGROUND_PID_INVALID'}
                $shellName=Normalize-IdentityValue $nativeShellRow.Name; $shellPath=Normalize-IdentityValue $nativeShellRow.ExecutablePath; $shellCommandLine=Get-RawIdentityValue $nativeShellRow.CommandLine
                $foregroundNativeName=Normalize-IdentityValue $nativeForegroundRow.Name; $foregroundNativePath=Normalize-IdentityValue $nativeForegroundRow.ExecutablePath; $foregroundNativeCommandLine=Get-RawIdentityValue $nativeForegroundRow.CommandLine
                if([string]::IsNullOrWhiteSpace($shellName) -or [string]::IsNullOrWhiteSpace($shellPath) -or [string]::IsNullOrWhiteSpace($shellCommandLine)){throw 'NATIVE_SHELL_IDENTITY_FIELDS_MISSING'}
