              }
            }
            function New-FixtureInfo([object[]]$Rows,[int]$Group=1234,[int]$Shell=1234){return (@{result=@{process_info=@{foreground_process_group_id=$Group;shell_pid=$Shell;foreground_processes=$Rows}}}|ConvertTo-Json -Depth 12 -Compress)}
            function Assert-FailClosed([string]$Name,[string]$Info,[object[]]$Native,[object[]]$Process,[object[]]$Cwd,[string]$ExpectedReason,[string]$PaneJson){
