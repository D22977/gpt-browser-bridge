            function Invoke-OfflineIdentityFixtures{
              $fixturePane=@{result=@{pane=@{pane_id='w4:p1';cwd='D:\fixture'}}}|ConvertTo-Json -Depth 8 -Compress
              $native=@([pscustomobject]@{ProcessId=1234;Name='powershell.exe';ExecutablePath='C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe';CommandLine='powershell.exe -NoExit';ParentProcessId=100;SessionId=1},[pscustomobject]@{ProcessId=2345;Name='worker.exe';ExecutablePath='D:\fixture\worker.exe';CommandLine='D:\fixture\worker.exe --probe';ParentProcessId=1234;SessionId=1})
              $process=@([pscustomobject]@{Id=1234;SessionId=1;ProcessName='powershell';Path='C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'},[pscustomobject]@{Id=2345;SessionId=1;ProcessName='worker';Path='D:\fixture\worker.exe'})
              $cwd=@([pscustomobject]@{Pid=1234;Success=$true;Value='D:\fixture';Source='fixture-native';Error=''},[pscustomobject]@{Pid=2345;Success=$true;Value='D:\fixture';Source='fixture-native';Error=''})
              $shellRow=@{pid=1234;name='powershell.exe';argv0='C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe';cmdline='powershell.exe -NoExit';cwd='D:\fixture'}
              $childRow=@{pid=2345;name='worker.exe';argv0='D:\fixture\worker.exe';cmdline='D:\fixture\worker.exe --probe';cwd='D:\fixture'}
              $shellInfo=New-FixtureInfo @($shellRow); $childInfo=New-FixtureInfo @($childRow)
              $shell=Classify-ProcessIdentity $fixturePane $shellInfo 1 $native $process $cwd; $child=Classify-ProcessIdentity $fixturePane $childInfo 1 $native $process $cwd
              if($shell.state -ne 'CORROBORATED' -or $shell.classification -cne 'SHELL_OWNS_FOREGROUND' -or $child.state -ne 'CORROBORATED' -or $child.classification -cne 'CHILD_OWNS_FOREGROUND'){throw 'OFFLINE_FIXTURE_VALID_CASE_FAILED'}
              $shellEvidenceJson=$shell|ConvertTo-Json -Depth 20 -Compress; $shellRoundTrip=$shellEvidenceJson|ConvertFrom-Json
              if($shellRoundTrip.evidence.herdr_foreground.cmdline -cne 'powershell.exe -NoExit' -or $shellRoundTrip.evidence.native_shell.cmdline -cne 'powershell.exe -NoExit'){throw 'OFFLINE_FIXTURE_EVIDENCE_ROUNDTRIP_FAILED'}
              $longCommand='powershell.exe '+('x'*16000); $longRow=@{pid=1234;name='powershell.exe';argv0='C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe';cmdline=$longCommand;cwd='D:\fixture'}
              $longNative=@([pscustomobject]@{ProcessId=1234;Name='powershell.exe';ExecutablePath='C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe';CommandLine=$longCommand;ParentProcessId=100;SessionId=1})
              $longProcess=@([pscustomobject]@{Id=1234;SessionId=1;ProcessName='powershell';Path='C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'}); $longCwd=@([pscustomobject]@{Pid=1234;Success=$true;Value='D:\fixture';Source='fixture-native';Error=''})
              $longResult=Classify-ProcessIdentity $fixturePane (New-FixtureInfo @($longRow)) 1 $longNative $longProcess $longCwd; $longRoundTrip=($longResult|ConvertTo-Json -Depth 20 -Compress)|ConvertFrom-Json
              if($longResult.classification -cne 'SHELL_OWNS_FOREGROUND' -or $longRoundTrip.evidence.herdr_foreground.cmdline.Length -ne $longCommand.Length -or $longRoundTrip.evidence.native_shell.cmdline -cne $longCommand){throw 'OFFLINE_FIXTURE_LONG_CMDLINE_LOSS'}
              $missingCwd=@([pscustomobject]@{Pid=1234;Success=$false;Value='';Source='fixture-native';Error='MISSING'},[pscustomobject]@{Pid=2345;Success=$false;Value='';Source='fixture-native';Error='MISSING'})
              $wrongCwd=@([pscustomobject]@{Pid=1234;Success=$true;Value='D:\other';Source='fixture-native';Error=''},[pscustomobject]@{Pid=2345;Success=$true;Value='D:\other';Source='fixture-native';Error=''})
              $shellSessionProcess=@($process|ForEach-Object{if($_.Id -eq 1234){[pscustomobject]@{Id=$_.Id;SessionId=2;ProcessName=$_.ProcessName;Path=$_.Path}}else{$_}})
              $foregroundSessionProcess=@($process|ForEach-Object{if($_.Id -eq 2345){[pscustomobject]@{Id=$_.Id;SessionId=2;ProcessName=$_.ProcessName;Path=$_.Path}}else{$_}})
              $badShell=@($native|ForEach-Object{if($_.ProcessId -eq 1234){[pscustomobject]@{ProcessId=$_.ProcessId;Name='';ExecutablePath=$_.ExecutablePath;CommandLine=$_.CommandLine;ParentProcessId=$_.ParentProcessId;SessionId=$_.SessionId}}else{$_}})
              $badGetProcessPath=@($process|ForEach-Object{if($_.Id -eq 1234){[pscustomobject]@{Id=$_.Id;SessionId=$_.SessionId;ProcessName=$_.ProcessName;Path='C:\other\powershell.exe'}}else{$_}})
              $badCmdCase=New-FixtureInfo @(@{pid=2345;name='worker.exe';argv0='D:\fixture\worker.exe';cmdline='D:\fixture\worker.exe --PROBE';cwd='D:\fixture'})
              $badCmdWhitespace=New-FixtureInfo @(@{pid=2345;name='worker.exe';argv0='D:\fixture\worker.exe';cmdline='D:\fixture\worker.exe --probe ';cwd='D:\fixture'})
              $zeroPid=New-FixtureInfo @(@{pid=0;name='worker.exe';argv0='D:\fixture\worker.exe';cmdline='D:\fixture\worker.exe --probe';cwd='D:\fixture'})
              $negativePid=New-FixtureInfo @(@{pid=-1;name='worker.exe';argv0='D:\fixture\worker.exe';cmdline='D:\fixture\worker.exe --probe';cwd='D:\fixture'})
              $negativeShell=(New-FixtureInfo @($childRow)) -replace '"shell_pid":1234','"shell_pid":-1'
              $objectSchema=@{result=@{process_info=@{foreground_process_group_id=1234;shell_pid=1234;foreground_processes=$childRow}}}|ConvertTo-Json -Depth 12 -Compress
              $zeroForeground='{"result":{"process_info":{"foreground_process_group_id":1234,"shell_pid":1234,"foreground_processes":[]}}}'
              $multiple=New-FixtureInfo @($shellRow,$childRow)
              $unsupportedShellRow=@{pid=1234;name='worker.exe';argv0='D:\fixture\worker.exe';cmdline='D:\fixture\worker.exe --shell';cwd='D:\fixture'}
              $unsupportedNative=@([pscustomobject]@{ProcessId=1234;Name='worker.exe';ExecutablePath='D:\fixture\worker.exe';CommandLine='D:\fixture\worker.exe --shell';ParentProcessId=100;SessionId=1})
              $unsupportedProcess=@([pscustomobject]@{Id=1234;SessionId=1;ProcessName='worker';Path='D:\fixture\worker.exe'})
              $missingNativeShell=@($native|Where-Object{$_.ProcessId -ne 1234}); $duplicateNativeShell=@($native+$native[0]); $missingNativeForeground=@($native|Where-Object{$_.ProcessId -ne 2345}); $duplicateNativeForeground=@($native+$native[1])
              $missingProcessShell=@($process|Where-Object{$_.Id -ne 1234}); $duplicateProcessShell=@($process+$process[0])
              $badParent=@($native|ForEach-Object{if($_.ProcessId -eq 2345){[pscustomobject]@{ProcessId=$_.ProcessId;Name=$_.Name;ExecutablePath=$_.ExecutablePath;CommandLine=$_.CommandLine;ParentProcessId=9999;SessionId=$_.SessionId}}else{$_}})
              $badName=@($native|ForEach-Object{if($_.ProcessId -eq 2345){[pscustomobject]@{ProcessId=$_.ProcessId;Name='other.exe';ExecutablePath=$_.ExecutablePath;CommandLine=$_.CommandLine;ParentProcessId=$_.ParentProcessId;SessionId=$_.SessionId}}else{$_}})
              $badPath=@($native|ForEach-Object{if($_.ProcessId -eq 2345){[pscustomobject]@{ProcessId=$_.ProcessId;Name=$_.Name;ExecutablePath='D:\other\worker.exe';CommandLine=$_.CommandLine;ParentProcessId=$_.ParentProcessId;SessionId=$_.SessionId}}else{$_}})
              $badNativeSession=@($native|ForEach-Object{if($_.ProcessId -eq 2345){[pscustomobject]@{ProcessId=$_.ProcessId;Name=$_.Name;ExecutablePath=$_.ExecutablePath;CommandLine=$_.CommandLine;ParentProcessId=$_.ParentProcessId;SessionId=2}}else{$_}})
              $malformed='{"result":'; $missingSchema='{"result":{}}'
              $cases=@(
                [pscustomobject]@{name='native-cwd-missing';native=$native;process=$process;cwd=$missingCwd;info=$childInfo;reason='NATIVE_CWD_UNAVAILABLE'}
                [pscustomobject]@{name='native-native-equal-herdr-different-cwd';native=$native;process=$process;cwd=$wrongCwd;info=$childInfo;reason='NATIVE_CWD_MISMATCH'}
                [pscustomobject]@{name='cim-getprocess-shell-session-disagreement';native=$native;process=$shellSessionProcess;cwd=$cwd;info=$childInfo;reason='NATIVE_GET_PROCESS_SESSION_MISMATCH'}
                [pscustomobject]@{name='cim-getprocess-foreground-session-disagreement';native=$native;process=$foregroundSessionProcess;cwd=$cwd;info=$childInfo;reason='NATIVE_GET_PROCESS_SESSION_MISMATCH'}
                [pscustomobject]@{name='missing-native-shell-identity';native=$badShell;process=$process;cwd=$cwd;info=$childInfo;reason='NATIVE_SHELL_IDENTITY_FIELDS_MISSING'}
                [pscustomobject]@{name='get-process-only-path-disagreement';native=$native;process=$badGetProcessPath;cwd=$cwd;info=$childInfo;reason='NATIVE_PROCESS_IDENTITY_MISMATCH'}
                [pscustomobject]@{name='cmdline-case-mismatch';native=$native;process=$process;cwd=$cwd;info=$badCmdCase;reason='NATIVE_PROCESS_IDENTITY_MISMATCH'}
                [pscustomobject]@{name='cmdline-raw-whitespace-mismatch';native=$native;process=$process;cwd=$cwd;info=$badCmdWhitespace;reason='NATIVE_PROCESS_IDENTITY_MISMATCH'}
                [pscustomobject]@{name='zero-foreground-pid';native=$native;process=$process;cwd=$cwd;info=$zeroPid;reason='FOREGROUND_PID_INVALID'}
                [pscustomobject]@{name='negative-foreground-pid';native=$native;process=$process;cwd=$cwd;info=$negativePid;reason='FOREGROUND_PID_INVALID'}
                [pscustomobject]@{name='negative-shell-pid';native=$native;process=$process;cwd=$cwd;info=$negativeShell;reason='SHELL_PID_INVALID'}
                [pscustomobject]@{name='foreground-process-object-not-array';native=$native;process=$process;cwd=$cwd;info=$objectSchema;reason='FOREGROUND_PROCESS_SCHEMA_NOT_ARRAY'}
                [pscustomobject]@{name='zero-foreground-rows';native=$native;process=$process;cwd=$cwd;info=$zeroForeground;reason='FOREGROUND_PROCESS_COUNT_NOT_ONE'}
                [pscustomobject]@{name='multiple-foreground-rows';native=$native;process=$process;cwd=$cwd;info=$multiple;reason='FOREGROUND_PROCESS_COUNT_NOT_ONE'}
                [pscustomobject]@{name='unsupported-shell-role';native=$unsupportedNative;process=$unsupportedProcess;cwd=$cwd;info=(New-FixtureInfo @($unsupportedShellRow));reason='SHELL_ROLE_UNSUPPORTED'}
                [pscustomobject]@{name='missing-native-shell-row';native=$missingNativeShell;process=$process;cwd=$cwd;info=$childInfo;reason='NATIVE_PROCESS_ROW_MISSING_OR_DUPLICATE'}
                [pscustomobject]@{name='duplicate-native-shell-row';native=$duplicateNativeShell;process=$process;cwd=$cwd;info=$shellInfo;reason='NATIVE_PROCESS_ROW_MISSING_OR_DUPLICATE'}
                [pscustomobject]@{name='missing-native-foreground-row';native=$missingNativeForeground;process=$process;cwd=$cwd;info=$childInfo;reason='NATIVE_PROCESS_ROW_MISSING_OR_DUPLICATE'}
                [pscustomobject]@{name='duplicate-native-foreground-row';native=$duplicateNativeForeground;process=$process;cwd=$cwd;info=$childInfo;reason='NATIVE_PROCESS_ROW_MISSING_OR_DUPLICATE'}
                [pscustomobject]@{name='missing-get-process-row';native=$native;process=$missingProcessShell;cwd=$cwd;info=$childInfo;reason='GET_PROCESS_ROW_MISSING_OR_DUPLICATE'}
                [pscustomobject]@{name='duplicate-get-process-row';native=$native;process=$duplicateProcessShell;cwd=$cwd;info=$shellInfo;reason='GET_PROCESS_ROW_MISSING_OR_DUPLICATE'}
                [pscustomobject]@{name='parent-mismatch';native=$badParent;process=$process;cwd=$cwd;info=$childInfo;reason='CHILD_PARENT_MISMATCH'}
                [pscustomobject]@{name='session-mismatch';native=$badNativeSession;process=$process;cwd=$cwd;info=$childInfo;reason='NATIVE_GET_PROCESS_SESSION_MISMATCH'}
                [pscustomobject]@{name='native-name-mismatch';native=$badName;process=$process;cwd=$cwd;info=$childInfo;reason='NATIVE_PROCESS_IDENTITY_MISMATCH'}
                [pscustomobject]@{name='native-path-mismatch';native=$badPath;process=$process;cwd=$cwd;info=$childInfo;reason='NATIVE_PROCESS_IDENTITY_MISMATCH'}
                [pscustomobject]@{name='malformed-non-json';native=$native;process=$process;cwd=$cwd;info=$malformed;reason='MALFORMED_JSON'}
                [pscustomobject]@{name='missing-schema';native=$native;process=$process;cwd=$cwd;info=$missingSchema;reason='PROCESS_INFO_SCHEMA_INVALID'}
              )
              foreach($case in $cases){Assert-FailClosed $case.name $case.info @($case.native) @($case.process) @($case.cwd) $case.reason $fixturePane}
              return 'PASS:shell,child,native-cwd,session,identity,cmdline-raw,pid,schema,parent,role,all-mandatory-fail-closed,evidence-roundtrip,long-cmdline-no-loss,lazy-native-init'
            }
            $offlineFixtureResult='NOT_RUN'
            if($prior.Count -gt 0){
              $state='NO_OP_DUPLICATE'; $classification='NO_OP_DUPLICATE';
          }else{
            try{
              if($adapter -cne $adapterAuthority -or $swWake -cne $controlSwitch -or $csWake -cne $currentStart -or $bWake -cne $sourceBlocker -or $pWake -cne $sourceProbe -or $pdWake -cne $sourcePaneBlocked -or $ebWake -cne $sourceExecutorBoundary -or $pane -cne $targetPane){throw 'WAKE_BINDING_MISMATCH'}
              if($launcher -cne $env:GITHUB_SHA){throw 'LAUNCHER_HEAD_MISMATCH'}
              if($runnerName -cne $expectedRunner){throw 'RUNNER_NAME_MISMATCH'}

              $authBody=[string](GetComment $adapterAuthority).body
              if(-not $authBody.StartsWith('CONTROL_G13_ISSUE162_SELF_HOSTED_W4P1_READONLY_TRANSPORT_ADAPTER_AUTHORITY_V1') -or $authBody -notmatch '(?m)^control_generation:\s*013\s*$'){throw 'ADAPTER_AUTHORITY_INVALID'}
              $activationBody=[string](GetComment $activation).body
              if(-not $activationBody.StartsWith('CONTROL_G13_ISSUE162_W4P1_PANE_READONLY_DIAGNOSTIC_ACTIVATION_V1') -or $activationBody -notmatch '(?m)^state:\s*EXECUTE_ONCE\s*$' -or $activationBody -notmatch '(?m)^source_adapter_authority:\s*5646011204\s*$' -or $activationBody -notmatch '(?m)^control_generation:\s*013\s*$' -or $activationBody -notmatch '(?m)^target_pane:\s*w4:p1\s*$' -or $activationBody -notmatch '(?m)^diagnostic_execution_authorized:\s*true\s*$'){throw 'ACTIVATION_AUTHORITY_INVALID'}

              $switchObj=GetComment $controlSwitch; $switchBody=[string]$switchObj.body
              if(-not $switchBody.StartsWith('CONTROL_GENERATION_SWITCH_V1') -or $switchBody -notmatch '(?m)^state:\s*SWITCH_COMMITTED\s*$' -or $switchBody -notmatch '(?m)^new_generation:\s*013\s*$' -or $switchBody -notmatch '(?m)^new_status:\s*ACTIVE\s*$'){throw 'CONTROL013_NOT_ACTIVE'}
              $since=[uri]::EscapeDataString([string]$switchObj.created_at)
              $switchRows=@(Invoke-RestMethod "https://api.github.com/repos/$repo/issues/88/comments?since=$since&per_page=100" -Headers $headers -Method Get -TimeoutSec 30)
              $newerSwitch=@($switchRows|Where-Object{[int64]$_.id -gt [int64]$controlSwitch -and [string]$_.body -match '(?m)^CONTROL_GENERATION_SWITCH_V1\s*$' -and [string]$_.body -match '(?m)^state:\s*SWITCH_COMMITTED\s*$'})
              if($newerSwitch.Count -gt 0){$state='STALE'; throw 'NEWER_CONTROL_SWITCH_EXISTS'}

              $currentBody=[string](GetComment $currentStart).body
              if(-not $currentBody.StartsWith('CURRENT_REHYDRATION_INDEX_V117') -or $currentBody -notmatch '(?m)^state:\s*CURRENT_START_HERE\s*$' -or $currentBody -notmatch '(?m)^control_generation:\s*013\s*$' -or $currentBody -notmatch '(?m)^control_status:\s*ACTIVE\s*$'){throw 'CURRENT_START_INVALID'}
              $blkBody=[string](GetComment $sourceBlocker).body
              if(-not $blkBody.StartsWith('GBB_ISSUE162_EXISTING_WORKSPACE_AGENT_START_RECOVERY_RESULT_V1') -or $blkBody -notmatch '(?m)^state:\s*BLOCKED\s*$'){throw 'SOURCE_BLOCKER_INVALID'}
              $probeBody=[string](GetComment $sourceProbe).body
              if(-not $probeBody.StartsWith('GBB_ISSUE162_AGENT_START_TIMEOUT_READONLY_PROBE_RESULT_V1') -or $probeBody -notmatch '(?m)^classification:\s*NO_NAMED_AGENT_EXACT_WORKSPACE_PRESENT\s*$'){throw 'SOURCE_PROBE_INVALID'}
              $paneBlockedBody=[string](GetComment $sourcePaneBlocked).body
              if(-not $paneBlockedBody.StartsWith('GBB_ISSUE162_PANE_LEVEL_READONLY_DIAGNOSTIC_RESULT_V1') -or $paneBlockedBody -notmatch '(?m)^state:\s*BLOCKED\s*$'){throw 'SOURCE_PANE_BLOCKED_INVALID'}
              $boundaryBody=[string](GetComment $sourceExecutorBoundary).body
              if(-not $boundaryBody.StartsWith('CONTROL_G13_ISSUE162_EXECUTOR_ADMISSION_BOUNDARY_DECISION_V1') -or $boundaryBody -notmatch '(?m)^state:\s*BLOCKED\s*$'){throw 'SOURCE_EXECUTOR_BOUNDARY_INVALID'}

              $offlineFixtureResult=Invoke-OfflineIdentityFixtures
              if(-not(Test-Path -LiteralPath $h -PathType Leaf)){throw 'HERDR_EXE_MISSING'}
              $paneGetCount=1
              $paneGet=((& $h pane get $targetPane 2>&1)|Out-String).Trim(); $paneGetExit=$LASTEXITCODE
              $processInfoCount=1
              $processInfo=((& $h pane process-info --pane $targetPane 2>&1)|Out-String).Trim(); $processInfoExit=$LASTEXITCODE
              $paneReadCount=1
              $paneRead=((& $h pane read $targetPane --source recent-unwrapped 2>&1)|Out-String).Trim(); $paneReadExit=$LASTEXITCODE

               if($paneGetExit -ne 0){$classification='PANE_ABSENT_OR_UNREADABLE'}
               elseif($processInfoExit -ne 0 -or $paneReadExit -ne 0){$classification='HERDR_READONLY_COMMAND_FAILED'}
               else{
                 $identity=Classify-ProcessIdentity $paneGet $processInfo ([int]$runnerSessionId)
                 $classification=[string]$identity.classification
                 $foregroundOwnership=$classification
                 $processIdentity=($identity|ConvertTo-Json -Depth 10 -Compress)
               }
               $state='READONLY_DIAGNOSTIC_COMPLETE'
             }catch{
              if($state -ne 'STALE'){$state='BLOCKED'}
              if($classification -eq 'TRANSPORT_IDENTITY_MISMATCH'){$classification='TRANSPORT_IDENTITY_MISMATCH'}
              if($paneGetCount -gt 0 -and ($paneGetExit -ne 0 -or $processInfoExit -ne 0 -or $paneReadExit -ne 0)){$classification='HERDR_READONLY_COMMAND_FAILED'}
            }
          }

          $result=@(
            'GBB_ISSUE162_G13_W4P1_PANE_READONLY_TRANSPORT_RESULT_V1'
            "state: $state"
            "classification: $classification"
            "authority_receipt: $activation"
            "wake_comment_id: $wake"
            "idempotency_key: $idem"
            'control_generation: 013'
            "source_control_switch: $controlSwitch"
            "source_current_start: $currentStart"
            "source_blocker: $sourceBlocker"
            "source_probe_result: $sourceProbe"
            "source_pane_diagnostic_blocked: $sourcePaneBlocked"
            "source_executor_boundary_blocked: $sourceExecutorBoundary"
            "source_adapter_authority: $adapterAuthority"
            "launcher_head_sha: $launcher"
            "runner_name: $(Safe $runnerName 200)"
            "runner_user: $(Safe $runnerUser 300)"
            "runner_session_id: $(Safe $runnerSessionId 100)"
            'target_pane: w4:p1'
            "pane_get_exit: $paneGetExit"
            "pane_get_output: $(Safe $paneGet 2600)"
            "process_info_exit: $processInfoExit"
            "process_info_output: $(Safe $processInfo 2600)"
            "pane_read_exit: $paneReadExit"
            "recent_output: $(Safe $paneRead 2600)"
            "pane_foreground_interactive_ownership: $(Safe $foregroundOwnership 400)"
            "process_identity: $processIdentity"
            "process_identity_length: $($processIdentity.Length)"
            "herdr_pane_get_count: $paneGetCount"
            "herdr_pane_process_info_count: $processInfoCount"
            "herdr_pane_read_count: $paneReadCount"
            'forbidden_herdr_command_count: 0'
            'agent_start_count: 0'
            'agent_prompt_count: 0'
            'workspace_mutation_count: 0'
            'pane_mutation_count: 0'
            'git_mutation_count: 0'
            'file_mutation_count: 0'
            'worker_product_mutation_count: 0'
            'scheduled_task_mutation_count: 0'
            'workflow_dispatch_count: 0'
            'old_wake_retry_count: 0'
            'readback_verified: true'
          ) -join "`n"
          [void](Publish $result)
