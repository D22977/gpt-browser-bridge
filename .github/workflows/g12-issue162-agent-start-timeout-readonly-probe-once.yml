                $evidence.native_shell.cwd=$shellCwd.value; $evidence.native_foreground.cwd=$foregroundCwd.value
                if((-not $shellCwd.success) -or (-not $foregroundCwd.success)){throw 'NATIVE_CWD_UNAVAILABLE'}
                $cwdMatch=((Same-IdentityValue $shellCwd.value $foregroundCwd.value) -and (Same-IdentityValue $foregroundCwd.value $paneCwd) -and (Same-IdentityValue $foregroundCwd.value $rowCwd)); $evidence.agreement.cwd=$cwdMatch
                if(-not $cwdMatch){throw 'NATIVE_CWD_MISMATCH'}
                if($foregroundPid -eq $shellPid){
