                $nativeForegroundParentParsed=[int64]::TryParse((Normalize-IdentityValue $nativeForegroundRow.ParentProcessId),[ref]$nativeForegroundParent)
                $nativeShellSessionParsed=[int64]::TryParse((Normalize-IdentityValue $nativeShellRow.SessionId),[ref]$nativeShellSession)
                $nativeForegroundSessionParsed=[int64]::TryParse((Normalize-IdentityValue $nativeForegroundRow.SessionId),[ref]$nativeForegroundSession)
                if((-not $nativeShellParentParsed) -or ($nativeShellParent -lt 0)){throw 'NATIVE_SHELL_PARENT_INVALID'}
                if((-not $nativeForegroundParentParsed) -or ($nativeForegroundParent -lt 0)){throw 'NATIVE_FOREGROUND_PARENT_INVALID'}
                if((-not $nativeShellSessionParsed) -or ($nativeShellSession -lt 0)){throw 'NATIVE_SHELL_SESSION_INVALID'}
                if((-not $nativeForegroundSessionParsed) -or ($nativeForegroundSession -lt 0)){throw 'NATIVE_FOREGROUND_SESSION_INVALID'}
                $evidence.native_shell=[ordered]@{pid=[string]$shellPid;name=$shellName;path=$shellPath;cmdline=$shellCommandLine;parent_pid=[string]$nativeShellParent;session_id=[string]$nativeShellSession;cwd=''}
                $evidence.native_foreground=[ordered]@{pid=[string]$foregroundPid;name=$foregroundNativeName;path=$foregroundNativePath;cmdline=$foregroundNativeCommandLine;parent_pid=[string]$nativeForegroundParent;session_id=[string]$nativeForegroundSession;cwd=''}
                $shellGet=@($ProcessRows|Where-Object{[int64]$_.Id -eq $shellPid}); $foregroundGet=@($ProcessRows|Where-Object{[int64]$_.Id -eq $foregroundPid})
                if(($shellGet.Count -ne 1) -or ($foregroundGet.Count -ne 1)){throw 'GET_PROCESS_ROW_MISSING_OR_DUPLICATE'}
                $getShellSession=[int64]0; $getForegroundSession=[int64]0
                $getShellSessionParsed=[int64]::TryParse((Normalize-IdentityValue $shellGet[0].SessionId),[ref]$getShellSession)
                $getForegroundSessionParsed=[int64]::TryParse((Normalize-IdentityValue $foregroundGet[0].SessionId),[ref]$getForegroundSession)
                if((-not $getShellSessionParsed) -or ($getShellSession -lt 0)){throw 'GET_PROCESS_SHELL_SESSION_INVALID'}
                if((-not $getForegroundSessionParsed) -or ($getForegroundSession -lt 0)){throw 'GET_PROCESS_FOREGROUND_SESSION_INVALID'}
                $getShellName=Normalize-IdentityValue $shellGet[0].ProcessName; $getShellPath=Normalize-IdentityValue $shellGet[0].Path; $getForegroundName=Normalize-IdentityValue $foregroundGet[0].ProcessName; $getForegroundPath=Normalize-IdentityValue $foregroundGet[0].Path
                if([string]::IsNullOrWhiteSpace($getShellName) -or [string]::IsNullOrWhiteSpace($getShellPath) -or [string]::IsNullOrWhiteSpace($getForegroundName) -or [string]::IsNullOrWhiteSpace($getForegroundPath)){throw 'GET_PROCESS_IDENTITY_FIELDS_MISSING'}
                $getShellNameMatch=(Same-ProcessName $getShellName $shellName); $getShellPathMatch=(Same-IdentityValue $getShellPath $shellPath)
                $getForegroundNameMatch=(Same-ProcessName $getForegroundName $foregroundNativeName); $getForegroundPathMatch=(Same-IdentityValue $getForegroundPath $foregroundNativePath)
                $getShellIdentity=(($getShellNameMatch) -and ($getShellPathMatch)); $getForegroundIdentity=(($getForegroundNameMatch) -and ($getForegroundPathMatch))
                $evidence.get_process_shell=[ordered]@{pid=[string]$shellPid;name=$getShellName;path=$getShellPath;session_id=[string]$getShellSession}; $evidence.get_process_foreground=[ordered]@{pid=[string]$foregroundPid;name=$getForegroundName;path=$getForegroundPath;session_id=[string]$getForegroundSession}
                $shellNameMatch=(Same-ProcessName $shellName $rowName); $shellPathMatch=(Same-IdentityValue $shellPath $rowPath); $shellCmdlineMatch=(Same-CmdlineValue $shellCommandLine $rowCommandLine)
                $foregroundNameMatch=(Same-ProcessName $foregroundNativeName $rowName); $foregroundPathMatch=(Same-IdentityValue $foregroundNativePath $rowPath); $foregroundCmdlineMatch=(Same-CmdlineValue $foregroundNativeCommandLine $rowCommandLine)
                $shellIdentityMatch=(($getShellIdentity) -and (($foregroundPid -ne $shellPid) -or (($shellNameMatch) -and ($shellPathMatch) -and ($shellCmdlineMatch))))
                $foregroundIdentityMatch=(($foregroundNameMatch) -and ($foregroundPathMatch) -and ($foregroundCmdlineMatch) -and ($getForegroundIdentity))
                $nativeSessionMatch=(($nativeShellSession -eq $nativeForegroundSession) -and ($nativeShellSession -eq [int64]$RunnerSessionId) -and ($getShellSession -eq $nativeShellSession) -and ($getForegroundSession -eq $nativeForegroundSession))
                $nativeShellRole=(Test-SupportedShellRole $shellName $shellPath $shellCommandLine); $getProcessShellRole=(Test-SupportedShellRole $getShellName $getShellPath $shellCommandLine); $shellRoleMatch=(($nativeShellRole) -and ($getProcessShellRole))
                $evidence.agreement.shell_name=$shellNameMatch; $evidence.agreement.shell_path=$shellPathMatch; $evidence.agreement.shell_cmdline=$shellCmdlineMatch; $evidence.agreement.foreground_name=$foregroundNameMatch; $evidence.agreement.foreground_path=$foregroundPathMatch; $evidence.agreement.foreground_cmdline=$foregroundCmdlineMatch; $evidence.agreement.get_process_shell_identity=$getShellIdentity; $evidence.agreement.get_process_foreground_identity=$getForegroundIdentity; $evidence.agreement.shell_identity=$shellIdentityMatch; $evidence.agreement.foreground_identity=$foregroundIdentityMatch; $evidence.agreement.sessions=$nativeSessionMatch; $evidence.agreement.shell_role=$shellRoleMatch
                if((-not $shellIdentityMatch) -or (-not $foregroundIdentityMatch)){throw 'NATIVE_PROCESS_IDENTITY_MISMATCH'}
                if(-not $nativeSessionMatch){throw 'NATIVE_GET_PROCESS_SESSION_MISMATCH'}
                if(-not $shellRoleMatch){throw 'SHELL_ROLE_UNSUPPORTED'}
