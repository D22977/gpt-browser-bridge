name: G12 Issue162 Agent Start Timeout Readonly Probe Once

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: g12-issue162-agent-timeout-readonly-probe-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  probe:
    if: >-
      github.event.issue.number == 162 &&
      github.event.comment.user.login == 'D22977' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, 'ISSUE162_AGENT_START_TIMEOUT_READONLY_PROBE_WAKE_V1')
    runs-on: [self-hosted, Windows, GBB-REVIEWER]
    timeout-minutes: 8
    defaults:
      run:
        shell: pwsh -NoProfile -File {0}
    steps:
      - name: Probe current partial-start state without local mutation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $repo='D22977/gpt-browser-bridge'
          $issue=162
          $authority='5645797743'
          $controlAdoption='5645738398'
          $sourceBlocker='5645790077'
          $sourceRun='34692826096'
          $sourceJob='103551008845'
          $agentName='g12-i162-resident-repair-02'
          $worktree='D:\AIWORK_WT\GPT_BROWSER_BRIDGE\g12-i162-resident-repair-02'
          $workerBranch='worker/g12-issue162-resident-consumer-herdr-loop-repair-02'
          $workerBase='20c540da6036926dbb1be687868e0a55e03bfcde'
          $h='C:\Users\Lupun\AppData\Local\Programs\Herdr\bin\herdr.exe'
          $headers=@{Authorization="Bearer $env:GH_TOKEN";'User-Agent'='g13-issue162-agent-timeout-readonly-probe';Accept='application/vnd.github+json'}

          function Safe([string]$s,[int]$max=1800){
            if($null -eq $s){return ''}
            $v=(($s -replace '[\r\n]+',' | ') -replace '[\x00-\x1F]',' ').Trim()
            if($v.Length -gt $max){return $v.Substring(0,$max)}
            return $v
          }
          function Publish([string]$body){
            $payload=@{body=$body}|ConvertTo-Json -Compress
            $p=Invoke-RestMethod "https://api.github.com/repos/$repo/issues/$issue/comments" -Headers $headers -Method Post -Body $payload -ContentType 'application/json' -TimeoutSec 30
            $rb=Invoke-RestMethod "https://api.github.com/repos/$repo/issues/comments/$($p.id)" -Headers $headers -Method Get -TimeoutSec 30
            if([string]$rb.body -cne $body){throw 'PROBE_RESULT_READBACK_MISMATCH'}
            return [string]$p.id
          }
          function Need([string]$body,[string]$pattern,[string]$name){
            $m=[regex]::Match($body,$pattern)
            if(-not $m.Success){throw "MALFORMED_WAKE_$name"}
            return $m.Groups[1].Value
          }

          $ev=Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw|ConvertFrom-Json
          $wake=[string]$ev.comment.id
          $body=[string]$ev.comment.body
          $a=Need $body '(?m)^source_authority:\s*(\d+)\s*$' 'AUTHORITY'
          $c=Need $body '(?m)^source_control_adoption:\s*(\d+)\s*$' 'CONTROL_ADOPTION'
          $b=Need $body '(?m)^source_blocker:\s*(\d+)\s*$' 'BLOCKER'
          $launcher=Need $body '(?m)^launcher_head_sha:\s*([0-9a-f]{40})\s*$' 'LAUNCHER'
          $idem=Need $body '(?m)^idempotency_key:\s*([A-Za-z0-9._:-]+)\s*$' 'IDEMPOTENCY'
          if($a -cne $authority -or $c -cne $controlAdoption -or $b -cne $sourceBlocker){throw 'WAKE_AUTHORITY_MISMATCH'}
          if($launcher -cne $env:GITHUB_SHA){throw 'LAUNCHER_HEAD_MISMATCH'}

          $auth=Invoke-RestMethod "https://api.github.com/repos/$repo/issues/comments/$authority" -Headers $headers -Method Get -TimeoutSec 30
          if(-not ([string]$auth.body).StartsWith('CONTROL_G13_ISSUE162_POST_TIMEOUT_READONLY_RECONCILIATION_V1')){throw 'WRONG_AUTHORITY_PROTOCOL'}
          $adoption=Invoke-RestMethod "https://api.github.com/repos/$repo/issues/comments/$controlAdoption" -Headers $headers -Method Get -TimeoutSec 30
          if(-not ([string]$adoption.body).StartsWith('CONTROL_G13_ISSUE162_PARSER_REPAIR_AUTHORITY_ADOPTION_V1')){throw 'WRONG_CONTROL_ADOPTION_PROTOCOL'}
          $blk=Invoke-RestMethod "https://api.github.com/repos/$repo/issues/comments/$sourceBlocker" -Headers $headers -Method Get -TimeoutSec 30
          $blkBody=[string]$blk.body
          if(-not $blkBody.StartsWith('GBB_ISSUE162_EXISTING_WORKSPACE_AGENT_START_RECOVERY_RESULT_V1')){throw 'WRONG_BLOCKER_PROTOCOL'}
          if($blkBody -notmatch '(?m)^state:\s*BLOCKED\s*$' -or $blkBody -notmatch '(?m)^classification:\s*AGENT_START_OR_REVALIDATION_FAILED_NO_SECOND_START\s*$'){throw 'WRONG_BLOCKER_CLASSIFICATION'}

          $switch=Invoke-RestMethod "https://api.github.com/repos/$repo/issues/comments/5645732538" -Headers $headers -Method Get -TimeoutSec 30
          $sw=[string]$switch.body
          if($sw -notmatch '(?m)^state:\s*SWITCH_COMMITTED\s*$' -or $sw -notmatch '(?m)^new_generation:\s*013\s*$' -or $sw -notmatch '(?m)^new_status:\s*ACTIVE\s*$'){throw 'CONTROL013_NOT_ACTIVE'}
          $since=[uri]::EscapeDataString([string]$switch.created_at)
          $switchRows=@(Invoke-RestMethod "https://api.github.com/repos/$repo/issues/88/comments?since=$since&per_page=100" -Headers $headers -Method Get -TimeoutSec 30)
          $newer=@($switchRows|Where-Object{[int64]$_.id -gt 5645732538 -and [string]$_.body -match '(?m)^CONTROL_GENERATION_SWITCH_V1\s*$' -and [string]$_.body -match '(?m)^state:\s*SWITCH_COMMITTED\s*$'})
          if($newer.Count -gt 0){throw 'NEWER_CONTROL_SWITCH_EXISTS'}

          if(-not(Test-Path -LiteralPath $h -PathType Leaf)){throw 'HERDR_EXE_MISSING'}
          $version=((& $h --version 2>&1)|Out-String).Trim()
          $server=((& $h status server 2>&1)|Out-String).Trim()
          $serverExit=$LASTEXITCODE

          $agentRaw=((& $h agent list 2>&1)|Out-String).Trim()
          $agentExit=$LASTEXITCODE
          $agents=@()
          if($agentExit -eq 0){
            try{$agents=@(($agentRaw|ConvertFrom-Json).result.agents)}catch{throw 'HERDR_AGENT_LIST_UNPARSEABLE'}
          }
          $matches=@($agents|Where-Object{[string]$_.name -ceq $agentName})
          $agentCount=$matches.Count
          $agentStatus='ABSENT'; $agentPane=''; $agentSession=''; $agentCwd=''; $agentRead=''; $agentGet=''
          if($agentCount -eq 1){
            $x=$matches[0]
            $agentStatus=[string]$x.agent_status
            $agentPane=[string]$x.pane_id
            $agentSession=[string]$x.agent_session.value
            $agentCwd=[string]$x.cwd
            $agentGet=((& $h agent get $agentName 2>&1)|Out-String).Trim()
            $getExit=$LASTEXITCODE
            if($getExit -ne 0){$agentGet="GET_FAILED:$agentGet"}
            $agentRead=((& $h agent read $agentName --source recent-unwrapped --lines 80 2>&1)|Out-String).Trim()
            $readExit=$LASTEXITCODE
            if($readExit -ne 0){$agentRead="READ_FAILED:$agentRead"}
          }

          $workspaceRaw=((& $h workspace list 2>&1)|Out-String).Trim()
          $workspaceExit=$LASTEXITCODE
          $workspaceMentionsTarget=($workspaceRaw -match [regex]::Escape($agentName) -or $workspaceRaw -match [regex]::Escape($worktree))

          $wtExists=Test-Path -LiteralPath $worktree -PathType Container
          $localHead='ABSENT'; $localBranch='ABSENT'; $localStatus=''; $localDiff=''; $localCached=''
          if($wtExists){
            $localHead=((& git -C $worktree rev-parse HEAD 2>&1)|Out-String).Trim()
            if($LASTEXITCODE -ne 0){$localHead='UNREADABLE'}
            $localBranch=((& git -C $worktree symbolic-ref -q --short HEAD 2>&1)|Out-String).Trim()
            if([string]::IsNullOrWhiteSpace($localBranch)){$localBranch='DETACHED'}
            $localStatus=((& git -C $worktree status --porcelain=v1 --untracked-files=all 2>&1)|Out-String).Trim()
            $localDiff=((& git -C $worktree diff --name-only 2>&1)|Out-String).Trim()
            $localCached=((& git -C $worktree diff --cached --name-only 2>&1)|Out-String).Trim()
          }

          $classification='AMBIGUOUS_FAIL_CLOSED'
          if($agentCount -gt 1){
            $classification='MULTIPLE_NAMED_AGENTS_FAIL_CLOSED'
          }elseif($agentCount -eq 1 -and $agentCwd -ceq $worktree -and $agentPane -and $agentSession){
            if($agentStatus -in @('idle','done')){$classification='EXACT_NAMED_AGENT_PROMPTABLE'}
            elseif($agentStatus -in @('working','blocked')){$classification='EXACT_NAMED_AGENT_LIVE_NOT_PROMPTABLE'}
            else{$classification='EXACT_NAMED_AGENT_UNSUPPORTED_STATE'}
          }elseif($agentCount -eq 0 -and $workspaceMentionsTarget -and $wtExists){
            $classification='NO_NAMED_AGENT_EXACT_WORKSPACE_PRESENT'
          }elseif($agentCount -eq 0 -and -not $workspaceMentionsTarget -and $wtExists){
            $classification='NO_NAMED_AGENT_WORKTREE_ONLY'
          }elseif($agentCount -eq 0 -and -not $wtExists){
            $classification='NO_NAMED_AGENT_NO_WORKTREE'
          }

          $inventory=@($agents|ForEach-Object{"pane=$($_.pane_id);name=$($_.name);agent=$($_.agent);status=$($_.agent_status);cwd=$($_.cwd);session=$($_.agent_session.value)"}) -join ' || '
          $result=@(
            'GBB_ISSUE162_AGENT_START_TIMEOUT_READONLY_PROBE_RESULT_V1'
            "state: READONLY_RECONCILED"
            "classification: $classification"
            "source_authority: $authority"
            "source_control_adoption: $controlAdoption"
            "source_blocker: $sourceBlocker"
            "source_failed_run: $sourceRun"
            "source_failed_job: $sourceJob"
            "source_probe_wake: $wake"
            "launcher_head_sha: $launcher"
            "herdr_version: $(Safe $version 300)"
            "herdr_server_exit: $serverExit"
            "herdr_server: $(Safe $server 700)"
            "target_agent_name: $agentName"
            "target_agent_count: $agentCount"
            "target_agent_status: $agentStatus"
            "target_agent_pane: $agentPane"
            "target_agent_session: $agentSession"
            "target_agent_cwd: $agentCwd"
            "target_agent_get: $(Safe $agentGet 1200)"
            "target_agent_read: $(Safe $agentRead 1800)"
            "agent_inventory: $(Safe $inventory 2500)"
            "workspace_list_exit: $workspaceExit"
            "workspace_mentions_target: $($workspaceMentionsTarget.ToString().ToLowerInvariant())"
            "workspace_inventory: $(Safe $workspaceRaw 2500)"
            "worktree_exists: $($wtExists.ToString().ToLowerInvariant())"
            "worktree_head: $(Safe $localHead 120)"
            "worktree_branch: $(Safe $localBranch 180)"
            "worktree_status: $(Safe $localStatus 1800)"
            "worktree_diff_paths: $(Safe $localDiff 1200)"
            "worktree_cached_paths: $(Safe $localCached 1200)"
            'herdr_agent_start_count: 0'
            'herdr_prompt_count: 0'
            'workspace_create_count: 0'
            'local_git_mutation_count: 0'
            'scheduled_task_mutation_count: 0'
            'worker_product_mutation_count: 0'
            'user_relay_count: 0'
            'readback_verified: true'
            "idempotency_key: $idem"
          ) -join "`n"
          [void](Publish $result)
