name: G11 Issue142 Continuation Repair03 Worker V2 Once

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: g11-issue142-repair03-worker-v2-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  launch:
    if: >-
      github.event.issue.number == 142 &&
      github.event.comment.user.login == 'D22977' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, 'CONTINUATION_REPAIR03_FRESH_WORKER_WAKE_V1')
    runs-on: [self-hosted, Windows, GBB-REVIEWER]
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh -NoProfile -File {0}
    steps:
      - name: Launch and guard one fresh Worker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $repo='D22977/gpt-browser-bridge'; $card='5576331984'; $adj='5576316600'; $switch='5559192452'; $index='5570750943'
          $branch='worker/g11-control-continuation-repair-03'
          $herdr='C:\Users\Lupun\AppData\Local\Programs\Herdr\bin\herdr.exe'
          $repoRoot='D:\AIWORK\GPT_BROWSER_BRIDGE'; $skill='C:\Users\Lupun\.codex\skills\local-control-tower\SKILL.md'
          $headers=@{Authorization="Bearer $env:GH_TOKEN";'User-Agent'='g11-r03-worker-v2';Accept='application/vnd.github+json'}
          function Need([string]$b,[string]$p,[string]$n){$m=[regex]::Match($b,$p);if(-not $m.Success){throw "Malformed $n"};$m.Groups[1].Value}
          function Safe([string]$x){if($null -eq $x){return ''};$x=($x-replace '[\r\n]+',' ').Trim();if($x.Length-gt 800){$x=$x.Substring(0,800)};$x}
          function Publish([string]$text){$payload=@{body=$text}|ConvertTo-Json -Compress;$r=Invoke-RestMethod "https://api.github.com/repos/$repo/issues/142/comments" -Headers $headers -Method Post -Body $payload -ContentType 'application/json';$rb=Invoke-RestMethod "https://api.github.com/repos/$repo/issues/comments/$($r.id)" -Headers $headers;if([string]$rb.body -cne $text){throw 'readback mismatch'};[string]$r.id}
          function FindR([string]$proto,[string]$wake,[string]$since){for($p=1;$p-le 10;$p++){$a=@(Invoke-RestMethod "https://api.github.com/repos/$repo/issues/142/comments?since=$since&per_page=100&page=$p" -Headers $headers);foreach($i in $a){$b=[string]$i.body;if($b.StartsWith($proto)-and $b-match "(?m)^source_bootstrap_wake:\s*$wake\s*$"){return $i}};if($a.Count-lt 100){break}};$null}

          $ev=Get-Content $env:GITHUB_EVENT_PATH -Raw|ConvertFrom-Json; $body=[string]$ev.comment.body; $wake=[string]$ev.comment.id; $since=[uri]::EscapeDataString([string]$ev.comment.created_at)
          $wakeCard=Need $body '(?m)^repair_card_receipt:\s*(\d+)\s*$' card
          $wakeAdj=Need $body '(?m)^adjudication_receipt:\s*(\d+)\s*$' adjudication
          $baseReceipt=Need $body '(?m)^base_supersession_receipt:\s*(\d+)\s*$' base_supersession_receipt
          $workerBase=Need $body '(?m)^worker_base_sha:\s*([0-9a-f]{40})\s*$' worker_base_sha
          $idem=Need $body '(?m)^idempotency_key:\s*([A-Za-z0-9._:-]+)\s*$' idempotency_key
          if($wakeCard-cne $card-or $wakeAdj-cne $adj){throw 'wake authority mismatch'}
          $phase='PREFLIGHT';$named='';$ws='';$pane='';$agent='';$native='UNREPORTED_NATIVE_SESSION';$pc=0;$server=$false;$park=$false
          $stateRoot='D:\AIWORK_RUNTIME\GPT_BROWSER_BRIDGE\issue142-repair03-worker-v2';New-Item -Force -ItemType Directory $stateRoot|Out-Null;$state=Join-Path $stateRoot "$wake.json"
          if(Test-Path $state){[void](Publish ((@('CONTINUATION_REPAIR03_FRESH_WORKER_BOOTSTRAP_RESULT_V1','state: NO_OP_DUPLICATE',"source_bootstrap_wake: $wake",'second_physical_prompt: false',"idempotency_key: $idem",'readback_verified: true'))-join "`n"));exit 0}
          try{
            foreach($rid in @($card,$adj,$switch,$index,$baseReceipt)){$r=Invoke-RestMethod "https://api.github.com/repos/$repo/issues/comments/$rid" -Headers $headers;if([string]::IsNullOrWhiteSpace([string]$r.body)){throw "unreadable authority $rid"}}
            $bs=Invoke-RestMethod "https://api.github.com/repos/$repo/issues/comments/$baseReceipt" -Headers $headers;$bb=[string]$bs.body
            if(-not $bb.StartsWith('CONTROL_G11_CONTINUATION_REPAIR03_BASE_SUPERSESSION_V1')-or $bb-notmatch '(?m)^state:\s*READY_FOR_FRESH_WORKER_WAKE\s*$'-or $bb-notmatch "(?m)^source_card:\s*$card\s*$"-or $bb-notmatch "(?m)^exact_worker_mutation_base:\s*$workerBase\s*$"-or $bb-notmatch '(?m)^required_worker_branch:\s*worker/g11-control-continuation-repair-03\s*$'){throw 'base supersession mismatch'}
            $sw=Invoke-RestMethod "https://api.github.com/repos/$repo/issues/comments/$switch" -Headers $headers;$sb=[string]$sw.body
            if($sb-notmatch '(?m)^state:\s*SWITCH_COMMITTED\s*$'-or $sb-notmatch '(?m)^new_generation:\s*011\s*$'-or $sb-notmatch '(?m)^new_generation_status:\s*ACTIVE\s*$'){throw 'generation011 not ACTIVE'}
            $new=@(Invoke-RestMethod 'https://api.github.com/repos/D22977/gpt-browser-bridge/issues/88/comments?since=2026-09-06T12%3A24%3A24Z&per_page=100' -Headers $headers|Where-Object{[string]$_.body-match '(?m)^CONTROL_GENERATION_SWITCH_V1\s*$'-and [string]$_.body-match '(?m)^state:\s*SWITCH_COMMITTED\s*$'-and [string]$_.id-ne $switch});if($new.Count-gt 0){throw 'newer Control switch exists'}
            $br=Invoke-RestMethod 'https://api.github.com/repos/D22977/gpt-browser-bridge/branches/review-base%2Fgbb-gh-01' -Headers $headers;if([string]$br.commit.sha-cne $workerBase){throw "default drift $([string]$br.commit.sha)"}
            try{$x=Invoke-RestMethod 'https://api.github.com/repos/D22977/gpt-browser-bridge/branches/worker%2Fg11-control-continuation-repair-03' -Headers $headers;if($null-ne $x){throw 'Worker branch exists'}}catch{$s=0;try{$s=[int]$_.Exception.Response.StatusCode}catch{};if($s-ne 404-and $_.Exception.Message-notmatch '404'){throw}}
            if($env:RUNNER_NAME-cne 'gbb-reviewer-win-01'-or -not [Environment]::UserInteractive-or [Diagnostics.Process]::GetCurrentProcess().SessionId-eq 0){throw 'runner admission failed'}
            $hv=((& $herdr --version 2>&1)|Out-String).Trim();if($LASTEXITCODE-ne 0-or $hv-notmatch '0\.8\.2'){throw "Herdr version $hv"}
            if(-not(Test-Path $repoRoot -PathType Container)){throw 'repo root missing'};$inside=((& git -C $repoRoot rev-parse --is-inside-work-tree 2>&1)|Out-String).Trim();if($LASTEXITCODE-ne 0-or $inside-notmatch 'true'){throw 'repo root invalid'}
            if(-not(Test-Path $skill -PathType Leaf)){throw 'skill missing'};$null=Get-Content $skill -TotalCount 1 -ErrorAction Stop

            $phase='NAMED_SERVER';$suffix=$wake.Substring([Math]::Max(0,$wake.Length-8));$named="g142-r03-$suffix";$agent="g142r03$suffix";if($agent.Length-gt 32){$agent=$agent.Substring(0,32)}
            $p=Start-Process $herdr -ArgumentList @('--session',$named,'server') -PassThru -WindowStyle Hidden -RedirectStandardOutput (Join-Path $stateRoot "$wake.out") -RedirectStandardError (Join-Path $stateRoot "$wake.err")
            $ok=$false;for($i=0;$i-lt 30;$i++){Start-Sleep -Milliseconds 500;try{$sr=((& $herdr --session $named status server 2>&1)|Out-String).Trim();if($LASTEXITCODE-eq 0-and $sr-notmatch 'protocol_mismatch|protocol 19'){$ok=$true;break}}catch{};if($p.HasExited){break}};if(-not $ok){throw 'named server unavailable'};$server=$true
            $phase='AGENT_START';$cr=((& $herdr --session $named workspace create --cwd $repoRoot --label "g142-r03-$wake" --no-focus 2>&1)|Out-String).Trim();if($LASTEXITCODE-ne 0){throw "workspace $(Safe $cr)"};$co=$cr|ConvertFrom-Json;$ws=[string]$co.result.workspace.workspace_id;$pane=[string]$co.result.root_pane.pane_id
            $args=@('--session',$named,'agent','start',$agent,'--kind','codex','--pane',$pane,'--timeout','90000','--','--sandbox','workspace-write','--ask-for-approval','on-request','-c','approvals_reviewer="auto_review"');$ar=((& $herdr @args 2>&1)|Out-String).Trim();if($LASTEXITCODE-ne 0){throw "agent start $(Safe $ar)"}
            $gr=((& $herdr --session $named agent get $agent 2>&1)|Out-String).Trim();$go=$gr|ConvertFrom-Json;if([string]$go.result.agent.name-cne $agent-or [string]$go.result.agent.pane_id-cne $pane){throw 'agent identity mismatch'};$ns=[string]$go.result.agent.agent_session.value;if($ns){$native=$ns}

            $phase='PROMPT';@{status='SENDING';wake=$wake;named=$named;agent=$agent;prompt_count=0}|ConvertTo-Json|Set-Content $state -Encoding utf8
            $prompt="Read GitHub directly. Rehydrate Issue #142 card $card, adjudication $adj, and base supersession $baseReceipt. Execute only GBB-G11-CONTROL-CONTINUATION-REPAIR-03-W1 from exact base $workerBase. Before tracked mutation publish/read back GBB_CONTROL_CONTINUATION_REPAIR_CONSUMED_STARTED_V1 with source_bootstrap_wake: $wake and exact fresh identity/base/branch. Never retry wake 5570904521. Stop at GBB_CONTROL_CONTINUATION_REPAIR_RESULT_V1."
            $pc=1;$raw=((& $herdr --session $named agent prompt $agent $prompt 2>&1)|Out-String).Trim();$pe=$LASTEXITCODE;@{status='SENT';wake=$wake;named=$named;agent=$agent;prompt_count=1;prompt_exit=$pe}|ConvertTo-Json|Set-Content $state -Encoding utf8
            [void](Publish ((@('CONTINUATION_REPAIR03_FRESH_WORKER_BOOTSTRAP_DELIVERY_V1','state: PROMPT_SUBMITTED_WAIT_WORKER_RECEIPT',"source_bootstrap_wake: $wake","repair_card_receipt: $card","base_supersession_receipt: $baseReceipt","worker_base_sha: $workerBase","named_session: $named","fresh_workspace: $ws","fresh_pane: $pane","fresh_agent: $agent","fresh_agent_session: $native",'structured_approval_mode: workspace-write/on-request + approvals_reviewer=auto_review',"physical_prompt_count: $pc","prompt_exit: $pe",'owner_enter_count: 0','manual_enter_used: false','send_keys_used: false','orca_used: false',"workflow_run_id: $env:GITHUB_RUN_ID",'readback_verified: true'))-join "`n"));if($pe-ne 0){throw "prompt exit $pe"}

            $phase='GUARD';$consumed=$null;$terminal=$null
            for($i=0;$i-lt 1440;$i++){$terminal=FindR 'GBB_CONTROL_CONTINUATION_REPAIR_RESULT_V1' $wake $since;if($terminal){break};if(-not $consumed){$consumed=FindR 'GBB_CONTROL_CONTINUATION_REPAIR_CONSUMED_STARTED_V1' $wake $since};$graw=((& $herdr --session $named agent get $agent 2>&1)|Out-String).Trim();if($LASTEXITCODE-ne 0){throw "agent lost $(Safe $graw)"};$g=$graw|ConvertFrom-Json;if([string]$g.result.agent.status-eq 'blocked'){$rr=((& $herdr --session $named agent read $agent --source recent-unwrapped --lines 100 2>&1)|Out-String).Trim();[void](Publish ((@('CONTINUATION_REPAIR03_FRESH_WORKER_BOOTSTRAP_RESULT_V1','state: CONTROL_REQUIRED_TOOL_APPROVAL_OR_INPUT_BLOCK',"source_bootstrap_wake: $wake","source_head: $workerBase","named_session: $named","fresh_workspace: $ws","fresh_pane: $pane","fresh_agent: $agent","fresh_agent_session: $native","consumed_started_receipt: $([string]$consumed.id)","blocked_readback: $(Safe $rr)","physical_prompt_count: $pc",'owner_enter_count: 0','send_keys_used: false','orca_used: false',"workflow_run_id: $env:GITHUB_RUN_ID",'readback_verified: true'))-join "`n"));return};Start-Sleep -Seconds 5}
            if(-not $terminal){throw 'Worker terminal timeout'};$tb=[string]$terminal.body;$d='UNKNOWN';if($tb-match '(?m)^state:\s*READY_FOR_FRESH_REVIEW\s*$'){$d='READY_FOR_FRESH_REVIEW';$park=$true}elseif($tb-match '(?m)^state:\s*(BLOCKED|CONTROL_REQUIRED|STALE|NO_OP_DUPLICATE)\s*$'){$d=$Matches[1]}
            [void](Publish ((@('CONTINUATION_REPAIR03_FRESH_WORKER_BOOTSTRAP_RESULT_V1',"state: WORKER_TERMINAL_OBSERVED_$d","source_bootstrap_wake: $wake","source_head: $workerBase","worker_terminal_receipt: $([string]$terminal.id)","named_session: $named","fresh_workspace: $ws","fresh_pane: $pane","fresh_agent: $agent","fresh_agent_session: $native","consumed_started_receipt: $([string]$consumed.id)","physical_prompt_count: $pc",'owner_enter_count: 0','send_keys_used: false','orca_used: false',"workflow_run_id: $env:GITHUB_RUN_ID",'readback_verified: true'))-join "`n"));if($park){for($j=0;$j-lt 720;$j++){Start-Sleep -Seconds 5}}
          }catch{$detail=Safe $_.Exception.Message;try{[void](Publish ((@('CONTINUATION_REPAIR03_FRESH_WORKER_BOOTSTRAP_RESULT_V1','state: CONTROL_REQUIRED_BOOTSTRAP_OR_GUARD_FAILURE',"phase: $phase","source_bootstrap_wake: $wake","source_head: $workerBase","named_session: $named","fresh_workspace: $ws","fresh_pane: $pane","fresh_agent: $agent","fresh_agent_session: $native","physical_prompt_count: $pc",'owner_enter_count: 0','send_keys_used: false','orca_used: false',"diagnostic: $detail","workflow_run_id: $env:GITHUB_RUN_ID",'readback_verified: true'))-join "`n"))}catch{};throw}finally{if($server-and-not $park){try{& $herdr --session $named server stop 2>&1|Out-Null}catch{}}}
