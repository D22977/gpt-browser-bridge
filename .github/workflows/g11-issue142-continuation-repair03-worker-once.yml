name: G11 Issue142 Continuation Repair03 Worker Once

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: g11-issue142-repair03-worker-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  repair03-worker-bootstrap:
    if: >-
      github.event.issue.number == 142 &&
      github.event.comment.user.login == 'D22977' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, 'CONTINUATION_REPAIR03_FRESH_WORKER_WAKE_V1')
    runs-on: [self-hosted, Windows, GBB-REVIEWER]
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh -NoProfile -File {0}
    steps:
      - name: Fresh task-bound Worker bootstrap and guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = 'D22977/gpt-browser-bridge'
          $expectedCard = '5576331984'
          $expectedAdjudication = '5576316600'
          $expectedSwitch = '5559192452'
          $expectedIndex = '5570750943'
          $expectedBase = 'aad9cb13e1e9f9ed9d8bba765d6b8d42112b6505'
          $requiredBranch = 'worker/g11-control-continuation-repair-03'
          $herdr = 'C:\Users\Lupun\AppData\Local\Programs\Herdr\bin\herdr.exe'
          $repoRoot = 'D:\AIWORK\GPT_BROWSER_BRIDGE'
          $skillPath = 'C:\Users\Lupun\.codex\skills\local-control-tower\SKILL.md'
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; 'User-Agent'='g11-issue142-repair03-bootstrap'; Accept='application/vnd.github+json' }

          function Need([string]$body,[string]$pattern,[string]$name) {
            $m = [regex]::Match($body,$pattern)
            if (-not $m.Success) { throw "Malformed field: $name" }
            return $m.Groups[1].Value
          }
          function Safe([string]$v) {
            if ($null -eq $v) { return '' }
            $x = ($v -replace '[\r\n]+',' ' -replace '[\x00-\x1F]',' ').Trim()
            if ($x.Length -gt 900) { return $x.Substring(0,900) }
            return $x
          }
          function Publish([string]$text) {
            $payload = @{ body=$text } | ConvertTo-Json -Compress
            $r = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/issues/142/comments" -Headers $headers -Method Post -Body $payload -ContentType 'application/json' -TimeoutSec 30
            $rb = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/issues/comments/$($r.id)" -Headers $headers -Method Get -TimeoutSec 30
            if ([string]$rb.body -cne $text) { throw "readback mismatch receipt=$($r.id)" }
            return [string]$r.id
          }
          function FindReceipt([string]$protocol,[string]$wake,[string]$since) {
            for ($page=1; $page -le 10; $page++) {
              $items = @(Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/issues/142/comments?since=$since&per_page=100&page=$page" -Headers $headers -Method Get -TimeoutSec 30)
              foreach ($item in $items) {
                $b=[string]$item.body
                if ($b.StartsWith($protocol) -and $b -match "(?m)^source_bootstrap_wake:\s*$wake\s*$") { return $item }
              }
              if ($items.Count -lt 100) { break }
            }
            return $null
          }

          $event = Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
          $body = [string]$event.comment.body
          $wakeId = [string]$event.comment.id
          $created = [uri]::EscapeDataString([string]$event.comment.created_at)
          $card = Need $body '(?m)^repair_card_receipt:\s*(\d+)\s*$' 'repair_card_receipt'
          $adj = Need $body '(?m)^adjudication_receipt:\s*(\d+)\s*$' 'adjudication_receipt'
          $base = Need $body '(?m)^worker_base_sha:\s*([0-9a-f]{40})\s*$' 'worker_base_sha'
          $idem = Need $body '(?m)^idempotency_key:\s*([A-Za-z0-9._:-]+)\s*$' 'idempotency_key'
          if ($card -cne $expectedCard -or $adj -cne $expectedAdjudication -or $base -cne $expectedBase) { throw 'wake authority mismatch' }

          $phase='PREFLIGHT'; $named=''; $workspace=''; $pane=''; $agent=''; $native='UNREPORTED_NATIVE_SESSION'; $promptCount=0; $serverStarted=$false; $ready=$false
          $stateRoot='D:\AIWORK_RUNTIME\GPT_BROWSER_BRIDGE\issue142-repair03-worker'
          New-Item -ItemType Directory -Force -Path $stateRoot | Out-Null
          $statePath=Join-Path $stateRoot "$wakeId.json"
          if (Test-Path -LiteralPath $statePath) {
            [void](Publish ((@('CONTINUATION_REPAIR03_FRESH_WORKER_BOOTSTRAP_RESULT_V1','state: NO_OP_DUPLICATE',"source_bootstrap_wake: $wakeId",'second_physical_prompt: false',"idempotency_key: $idem",'readback_verified: true')) -join "`n"))
            exit 0
          }

          try {
            foreach ($rid in @($expectedCard,$expectedAdjudication,$expectedSwitch,$expectedIndex)) {
              $r=Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/issues/comments/$rid" -Headers $headers -Method Get -TimeoutSec 30
              if ([string]::IsNullOrWhiteSpace([string]$r.body)) { throw "authority unreadable $rid" }
            }
            $sw=Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/issues/comments/$expectedSwitch" -Headers $headers -Method Get -TimeoutSec 30
            if ([string]$sw.body -notmatch '(?m)^state:\s*SWITCH_COMMITTED\s*$' -or [string]$sw.body -notmatch '(?m)^new_generation:\s*011\s*$' -or [string]$sw.body -notmatch '(?m)^new_generation_status:\s*ACTIVE\s*$') { throw 'generation011 not ACTIVE' }
            $recent=@(Invoke-RestMethod -Uri 'https://api.github.com/repos/D22977/gpt-browser-bridge/issues/88/comments?since=2026-09-06T12%3A24%3A24Z&per_page=100' -Headers $headers -Method Get -TimeoutSec 30)
            $newSwitch=@($recent | Where-Object { [string]$_.body -match '(?m)^CONTROL_GENERATION_SWITCH_V1\s*$' -and [string]$_.body -match '(?m)^state:\s*SWITCH_COMMITTED\s*$' -and [string]$_.id -ne $expectedSwitch })
            if ($newSwitch.Count -gt 0) { throw 'newer committed Control switch exists' }
            $br=Invoke-RestMethod -Uri 'https://api.github.com/repos/D22977/gpt-browser-bridge/branches/review-base%2Fgbb-gh-01' -Headers $headers -Method Get -TimeoutSec 30
            if ([string]$br.commit.sha -cne $expectedBase) { throw "default head drifted $([string]$br.commit.sha)" }
            try {
              $existing=Invoke-RestMethod -Uri 'https://api.github.com/repos/D22977/gpt-browser-bridge/branches/worker%2Fg11-control-continuation-repair-03' -Headers $headers -Method Get -TimeoutSec 30
              if ($null -ne $existing) { throw 'required Worker branch already exists' }
            } catch {
              $s=0; try { $s=[int]$_.Exception.Response.StatusCode } catch {}
              if ($s -ne 404 -and $_.Exception.Message -notmatch '404') { throw }
            }
            if ($env:RUNNER_NAME -cne 'gbb-reviewer-win-01') { throw "unexpected runner=$env:RUNNER_NAME" }
            if (-not [Environment]::UserInteractive -or [Diagnostics.Process]::GetCurrentProcess().SessionId -eq 0) { throw 'runner not interactive' }
            if (-not (Test-Path -LiteralPath $herdr)) { throw 'Herdr CLI missing' }
            $hv=((& $herdr --version 2>&1)|Out-String).Trim(); if ($LASTEXITCODE -ne 0 -or $hv -notmatch '0\.8\.2') { throw "Herdr not 0.8.2: $hv" }
            if (-not (Test-Path -LiteralPath $repoRoot -PathType Container)) { throw 'local repo root missing' }
            $inside=((& git -C $repoRoot rev-parse --is-inside-work-tree 2>&1)|Out-String).Trim(); if ($LASTEXITCODE -ne 0 -or $inside -notmatch 'true') { throw 'local repo root is not git worktree' }
            if (-not (Test-Path -LiteralPath $skillPath -PathType Leaf)) { throw 'required local Control skill missing' }
            $null=Get-Content -LiteralPath $skillPath -TotalCount 1 -ErrorAction Stop

            $phase='NAMED_SERVER_START'
            $suffix=$wakeId.Substring([Math]::Max(0,$wakeId.Length-8)); $named="g142-r03-$suffix"; $agent="g142r03$suffix"; if ($agent.Length -gt 32) { $agent=$agent.Substring(0,32) }
            $stdout=Join-Path $stateRoot "$wakeId-server.out.log"; $stderr=Join-Path $stateRoot "$wakeId-server.err.log"
            $p=Start-Process -FilePath $herdr -ArgumentList @('--session',$named,'server') -PassThru -WindowStyle Hidden -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            $ok=$false
            for($i=0;$i -lt 30;$i++){ Start-Sleep -Milliseconds 500; try { $sr=((& $herdr --session $named status server 2>&1)|Out-String).Trim(); if($LASTEXITCODE -eq 0 -and $sr -notmatch 'protocol_mismatch|protocol 19'){ $ok=$true; break } } catch {}; if($p.HasExited){break} }
            if(-not $ok){throw 'named Herdr server failed'}; $serverStarted=$true

            $phase='FRESH_AGENT_START'
            $cr=((& $herdr --session $named workspace create --cwd $repoRoot --label "g142-r03-$wakeId" --no-focus 2>&1)|Out-String).Trim(); if($LASTEXITCODE -ne 0){throw "workspace create failed $(Safe $cr)"}
            $co=$cr|ConvertFrom-Json; $workspace=[string]$co.result.workspace.workspace_id; $pane=[string]$co.result.root_pane.pane_id; if([string]::IsNullOrWhiteSpace($pane)){throw 'pane missing'}
            $startArgs=@('--session',$named,'agent','start',$agent,'--kind','codex','--pane',$pane,'--timeout','90000','--','--sandbox','workspace-write','--ask-for-approval','on-request','-c','approvals_reviewer="auto_review"')
            $ar=((& $herdr @startArgs 2>&1)|Out-String).Trim(); if($LASTEXITCODE -ne 0){throw "agent start failed $(Safe $ar)"}
            $gr=((& $herdr --session $named agent get $agent 2>&1)|Out-String).Trim(); if($LASTEXITCODE -ne 0){throw "agent get failed $(Safe $gr)"}; $go=$gr|ConvertFrom-Json; if([string]$go.result.agent.name -cne $agent -or [string]$go.result.agent.pane_id -cne $pane){throw 'agent identity mismatch'}
            $ns=[string]$go.result.agent.agent_session.value; if(-not [string]::IsNullOrWhiteSpace($ns)){$native=$ns}

            $phase='PROMPT_SEND'
            @{status='SENDING';wake=$wakeId;named_session=$named;workspace=$workspace;pane=$pane;agent=$agent;prompt_count=0;updated_at=(Get-Date).ToString('o')}|ConvertTo-Json|Set-Content -LiteralPath $statePath -Encoding utf8
            $prompt="Read GitHub directly. Rehydrate D22977/gpt-browser-bridge Issue #142 card receipt 5576331984 and adjudication 5576316600, then execute only card GBB-G11-CONTROL-CONTINUATION-REPAIR-03-W1 from exact base aad9cb13e1e9f9ed9d8bba765d6b8d42112b6505. Before tracked mutation publish/read back GBB_CONTROL_CONTINUATION_REPAIR_CONSUMED_STARTED_V1 with source_bootstrap_wake: $wakeId and exact fresh identity/base/branch. Do not reuse wake5570904521. Stop at GBB_CONTROL_CONTINUATION_REPAIR_RESULT_V1 READY/BLOCKED/CONTROL_REQUIRED/STALE."
            $promptCount=1
            $pr=((& $herdr --session $named agent prompt $agent $prompt 2>&1)|Out-String).Trim(); $pexit=$LASTEXITCODE
            @{status='PROMPT_SENT';wake=$wakeId;named_session=$named;workspace=$workspace;pane=$pane;agent=$agent;prompt_count=1;prompt_exit=$pexit;updated_at=(Get-Date).ToString('o')}|ConvertTo-Json|Set-Content -LiteralPath $statePath -Encoding utf8
            $delivery=@('CONTINUATION_REPAIR03_FRESH_WORKER_BOOTSTRAP_DELIVERY_V1','state: PROMPT_SUBMITTED_WAIT_WORKER_RECEIPT',"source_bootstrap_wake: $wakeId","repair_card_receipt: $expectedCard","worker_base_sha: $expectedBase","named_session: $named","fresh_workspace: $workspace","fresh_pane: $pane","fresh_agent: $agent","fresh_agent_session: $native",'structured_approval_mode: workspace-write/on-request + approvals_reviewer=auto_review',"physical_prompt_count: $promptCount","prompt_exit: $pexit",'owner_enter_count: 0','manual_enter_used: false','send_keys_used: false','orca_used: false','historical_pane_reused: false',"workflow_run_id: $env:GITHUB_RUN_ID",'readback_verified: true') -join "`n"
            [void](Publish $delivery)
            if($pexit -ne 0){throw "prompt command nonzero exit=$pexit"}

            $phase='GUARD'
            $consumed=$null; $terminal=$null
            for($i=0;$i -lt 1440;$i++){
              $terminal=FindReceipt 'GBB_CONTROL_CONTINUATION_REPAIR_RESULT_V1' $wakeId $created
              if($null -ne $terminal){break}
              if($null -eq $consumed){$consumed=FindReceipt 'GBB_CONTROL_CONTINUATION_REPAIR_CONSUMED_STARTED_V1' $wakeId $created}
              $graw=((& $herdr --session $named agent get $agent 2>&1)|Out-String).Trim(); $gx=$LASTEXITCODE
              if($gx -ne 0){
                $t=@('CONTINUATION_REPAIR03_FRESH_WORKER_BOOTSTRAP_RESULT_V1','state: CONTROL_REQUIRED_AGENT_EXIT_OR_LOST',"source_bootstrap_wake: $wakeId","source_head: $expectedBase","named_session: $named","fresh_workspace: $workspace","fresh_pane: $pane","fresh_agent: $agent","fresh_agent_session: $native","consumed_started_receipt: $([string]$consumed.id)","diagnostic: $(Safe $graw)","physical_prompt_count: $promptCount",'owner_enter_count: 0','send_keys_used: false','orca_used: false',"workflow_run_id: $env:GITHUB_RUN_ID",'readback_verified: true') -join "`n"; [void](Publish $t); return
              }
              $g=$graw|ConvertFrom-Json; $status=[string]$g.result.agent.status
              if($status -eq 'blocked'){
                $rr=((& $herdr --session $named agent read $agent --source recent-unwrapped --lines 100 2>&1)|Out-String).Trim()
                $t=@('CONTINUATION_REPAIR03_FRESH_WORKER_BOOTSTRAP_RESULT_V1','state: CONTROL_REQUIRED_TOOL_APPROVAL_OR_INPUT_BLOCK',"source_bootstrap_wake: $wakeId","source_head: $expectedBase","named_session: $named","fresh_workspace: $workspace","fresh_pane: $pane","fresh_agent: $agent","fresh_agent_session: $native","consumed_started_receipt: $([string]$consumed.id)","blocked_readback: $(Safe $rr)","physical_prompt_count: $promptCount",'owner_enter_count: 0','send_keys_used: false','orca_used: false',"workflow_run_id: $env:GITHUB_RUN_ID",'readback_verified: true') -join "`n"; [void](Publish $t); return
              }
              Start-Sleep -Seconds 5
            }
            if($null -eq $terminal){
              $t=@('CONTINUATION_REPAIR03_FRESH_WORKER_BOOTSTRAP_RESULT_V1','state: CONTROL_REQUIRED_TIMEOUT',"source_bootstrap_wake: $wakeId","source_head: $expectedBase","named_session: $named","fresh_workspace: $workspace","fresh_pane: $pane","fresh_agent: $agent","fresh_agent_session: $native","consumed_started_receipt: $([string]$consumed.id)","physical_prompt_count: $promptCount",'owner_enter_count: 0','send_keys_used: false','orca_used: false',"workflow_run_id: $env:GITHUB_RUN_ID",'readback_verified: true') -join "`n"; [void](Publish $t); return
            }
            $tb=[string]$terminal.body
            $decision='UNKNOWN'; if($tb -match '(?m)^state:\s*READY_FOR_FRESH_REVIEW\s*$'){$decision='READY_FOR_FRESH_REVIEW';$ready=$true}elseif($tb -match '(?m)^state:\s*(BLOCKED|CONTROL_REQUIRED|STALE|NO_OP_DUPLICATE)\s*$'){$decision=$Matches[1]}
            $obs=@('CONTINUATION_REPAIR03_FRESH_WORKER_BOOTSTRAP_RESULT_V1',"state: WORKER_TERMINAL_OBSERVED_$decision","source_bootstrap_wake: $wakeId","source_head: $expectedBase","worker_terminal_receipt: $([string]$terminal.id)","named_session: $named","fresh_workspace: $workspace","fresh_pane: $pane","fresh_agent: $agent","fresh_agent_session: $native","consumed_started_receipt: $([string]$consumed.id)","physical_prompt_count: $promptCount",'owner_enter_count: 0','send_keys_used: false','orca_used: false',"workflow_run_id: $env:GITHUB_RUN_ID",'readback_verified: true') -join "`n"; [void](Publish $obs)
            if($ready){
              # PARK: keep this workflow and named runtime alive for the preauthorized one repair round.
              for($j=0;$j -lt 720;$j++){ Start-Sleep -Seconds 5; try { $null=& $herdr --session $named agent get $agent 2>&1 } catch {} }
            }
          } catch {
            $detail=Safe $_.Exception.Message
            $t=@('CONTINUATION_REPAIR03_FRESH_WORKER_BOOTSTRAP_RESULT_V1','state: CONTROL_REQUIRED_BOOTSTRAP_FAILURE',"phase: $phase","source_bootstrap_wake: $wakeId","source_head: $expectedBase","named_session: $named","fresh_workspace: $workspace","fresh_pane: $pane","fresh_agent: $agent","fresh_agent_session: $native","physical_prompt_count: $promptCount",'owner_enter_count: 0','send_keys_used: false','orca_used: false',"diagnostic: $detail","workflow_run_id: $env:GITHUB_RUN_ID",'readback_verified: true') -join "`n"; try{[void](Publish $t)}catch{}; throw
          } finally {
            if($serverStarted -and -not $ready){ try{& $herdr --session $named server stop 2>&1|Out-Null}catch{} }
          }
