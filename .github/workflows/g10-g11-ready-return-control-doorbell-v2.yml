name: G10 G11 Ready Return Control Doorbell V2

on:
  workflow_dispatch:
    inputs:
      source_issue:
        description: Source issue containing the durable terminal.
        required: true
        default: '124'
        type: string
      source_terminal_receipt:
        description: Durable terminal comment receipt that requests the return.
        required: true
        type: string
      source_card_id:
        description: Exact source card identifier.
        required: true
        type: string
      candidate_head:
        description: Exact candidate head, or NONE for a non-candidate terminal.
        required: true
        type: string
      idempotency_key:
        description: Deterministic repository/card/terminal/head key.
        required: true
        type: string
      live_canary_authority:
        description: Explicit authority required before any physical send.
        required: true
        default: NONE
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: g10-g11-ready-return-doorbell-${{ inputs.idempotency_key }}
  cancel-in-progress: false

jobs:
  return-doorbell:
    if: inputs.source_issue != '' && inputs.source_terminal_receipt != '' && inputs.source_card_id != '' && inputs.candidate_head != '' && inputs.idempotency_key != ''
    runs-on: [self-hosted, Windows, GBB-REVIEWER]
    timeout-minutes: 12
    defaults:
      run:
        shell: pwsh -NoProfile -File {0}
    steps:
      - name: Reconcile current binding, materialize exact runtime, and deliver at most once
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_ISSUE: ${{ inputs.source_issue }}
          SOURCE_TERMINAL_RECEIPT: ${{ inputs.source_terminal_receipt }}
          SOURCE_CARD_ID: ${{ inputs.source_card_id }}
          CANDIDATE_HEAD: ${{ inputs.candidate_head }}
          IDEMPOTENCY_KEY: ${{ inputs.idempotency_key }}
          LIVE_CANARY_AUTHORITY: ${{ inputs.live_canary_authority }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = 'D22977/gpt-browser-bridge'
          $issue = [int]$env:SOURCE_ISSUE
          $terminal = [string]$env:SOURCE_TERMINAL_RECEIPT
          $sourceCard = [string]$env:SOURCE_CARD_ID
          $candidateHead = [string]$env:CANDIDATE_HEAD
          $idempotencyKey = [string]$env:IDEMPOTENCY_KEY
          $expectedSenderBlob = '42e55aa194fee1243f8cf32e3c1a63e7ad86f78a'; $expectedContractsBlob = '9b0822388d7bd3ecc0c51e98836846ae9b192ce3'; $expectedResultStoreBlob = 'ec3a14825ed13681e4a3d0d29ec2612ba3eb2fbf'
          $allowedCards = @('GBB-HANDOFF-CONTINUITY-REPAIR-01-G11','GBB-UNATTENDED-RETURN-TRANSPORT-01','GBB-READY-RETURN-CLOSURE-01','GBB-UNATTENDED-RETURN-E2E-REPAIR-03','GBB-UNATTENDED-COMPOSER-SENDER-REPAIR-04','GBB-UNATTENDED-DOORBELL-BINDING-REPAIR-05','GBB-UNATTENDED-RUNTIME-ARTIFACT-MATERIALIZATION-REPAIR-06')
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; 'User-Agent' = 'g10-g11-ready-return-doorbell-v2'; Accept = 'application/vnd.github+json' }
          $stateRoot = 'D:\AIWORK_RUNTIME\GPT_BROWSER_BRIDGE\g10-g11-ready-return-doorbell-v2\state'
          New-Item -ItemType Directory -Force -Path $stateRoot | Out-Null
          $logicalHash = ([Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes("$repo|$issue|$idempotencyKey")))).ToLowerInvariant()
          $statePath = Join-Path $stateRoot "$logicalHash.json"
          $artifactRoot = $null
          $artifactCreated = $false

          function Write-State([string]$phase, [hashtable]$extra = @{}) {
            $record = [ordered]@{ protocol = 'GBB_HANDOFF_CONTINUITY_STATE_V1'; logical_key = $idempotencyKey; phase = $phase; source_terminal_receipt = $terminal; physical_send_count = if ($phase -in @('SENT','DELIVERED')) { 1 } elseif ($phase -eq 'UNCERTAIN') { 'UNKNOWN_AFTER_SEND_BOUNDARY' } else { 0 }; updated_at = (Get-Date).ToString('o') }
            foreach ($key in $extra.Keys) { $record[$key] = $extra[$key] }
            $record | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $statePath -Encoding utf8
          }

          function Publish-Exact([string]$body) {
            $payload = @{ body = $body } | ConvertTo-Json -Compress
            $posted = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/issues/$issue/comments" -Headers $headers -Method Post -Body $payload -ContentType 'application/json' -TimeoutSec 30
            $readback = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/issues/comments/$($posted.id)" -Headers $headers -Method Get -TimeoutSec 30
            if ([string]$readback.body -cne $body) { throw 'DURABLE_READBACK_MISMATCH' }
            return [string]$posted.id
          }

          function Publish-Terminal([string]$state, [string]$reason, [string]$physicalCount = '0', [hashtable]$extra = @{}) {
            $lines = [System.Collections.Generic.List[string]]::new()
            [void]$lines.Add('CONTROL_DOORBELL_V1'); [void]$lines.Add("state: $state"); [void]$lines.Add("source_terminal_receipt: $terminal"); [void]$lines.Add("source_card_id: $sourceCard"); [void]$lines.Add("candidate_head: $candidateHead"); [void]$lines.Add("reason: $reason"); [void]$lines.Add("physical_send_count: $physicalCount"); [void]$lines.Add('user_relay_count: 0'); [void]$lines.Add("workflow_run_id: $env:GITHUB_RUN_ID"); [void]$lines.Add('readback_verified: true')
            foreach ($key in $extra.Keys) { [void]$lines.Add("$key`: $($extra[$key])") }
            try { return Publish-Exact ($lines -join "`n") } catch { Write-State 'UNRESOLVED_PUBLICATION' @{ publication_failure = $_.Exception.Message; attempted_terminal = $state }; throw }
          }

          function Get-AllComments([int]$number) {
            $all = [System.Collections.Generic.List[object]]::new()
            for ($page = 1; $page -le 50; $page++) {
              $batch = @(Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/issues/$number/comments?per_page=100&page=$page" -Headers $headers -Method Get -TimeoutSec 30)
              foreach ($comment in $batch) { [void]$all.Add($comment) }
              if ($batch.Count -lt 100) { break }
            }
            return $all.ToArray()
          }

          function Get-CurrentSwitch {
            $switches = @(Get-AllComments 88 | Where-Object { [string]$_.body -match '(?m)^CONTROL_GENERATION_SWITCH_V1\s*$' -and [string]$_.body -match '(?m)^state:\s*SWITCH_COMMITTED\s*$' } | Sort-Object { [int64]$_.id })
            if ($switches.Count -eq 0) { throw 'NO_ACTIVE_CONTROL_SWITCH' }
            $latest = $switches[-1]; $body = [string]$latest.body
            $generation = [regex]::Match($body, '(?m)^new_generation:\s*(\d{3})\s*$'); $conversationId = [regex]::Match($body, '(?m)^new_conversation_id:\s*([0-9a-f-]+)\s*$'); $conversationUrl = [regex]::Match($body, '(?m)^new_conversation_url:\s*(https://chatgpt\.com/(?:g/[A-Za-z0-9._-]+/)?c/[0-9a-f-]+)\s*$'); $statusA = [regex]::Match($body, '(?m)^new_status:\s*([A-Z_]+)\s*$'); $statusB = [regex]::Match($body, '(?m)^new_generation_status:\s*([A-Z_]+)\s*$')
            if (-not ($generation.Success -and $conversationId.Success -and $conversationUrl.Success)) { throw 'ACTIVE_CONTROL_SWITCH_MALFORMED' }
            $status = if ($statusA.Success) { $statusA.Groups[1].Value } else { $statusB.Groups[1].Value }
            if ($status -cne 'ACTIVE' -or ($statusA.Success -and $statusB.Success -and $statusA.Groups[1].Value -cne $statusB.Groups[1].Value)) { throw 'ACTIVE_CONTROL_SWITCH_NOT_ACTIVE' }
            return [pscustomobject]@{ Receipt = [string]$latest.id; Generation = $generation.Groups[1].Value; ConversationId = $conversationId.Groups[1].Value; ConversationUrl = $conversationUrl.Groups[1].Value }
          }

          function Get-GitHubBlobBytes([string]$blobSha) {
            $blob = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/git/blobs/$blobSha" -Headers $headers -Method Get -TimeoutSec 30
            if ([string]$blob.encoding -cne 'base64' -or [string]::IsNullOrWhiteSpace([string]$blob.content)) { throw "MATERIALIZATION_BLOB_FETCH_FAILED_$blobSha" }
            try { return [Convert]::FromBase64String(([string]$blob.content -replace '\s','')) } catch { throw "MATERIALIZATION_BLOB_DECODE_FAILED_$blobSha" }
          }

          function Materialize-ExactBlob([string]$blobSha, [string]$relativePath) {
            if ($relativePath -notmatch '^src/(gpt_send|contracts|result_store)\.mjs$') { throw 'MATERIALIZATION_UNSAFE_PATH' }
            $target = Join-Path $artifactRoot ($relativePath -replace '/', '\')
            if (Test-Path -LiteralPath $target) { throw "MATERIALIZATION_COLLISION_$relativePath" }
            $bytes = Get-GitHubBlobBytes $blobSha
            [IO.File]::WriteAllBytes($target, $bytes)
            $actual = (& git hash-object --no-filters -- $target).Trim()
            if ($LASTEXITCODE -ne 0 -or $actual -cne $blobSha) { throw "MATERIALIZED_BLOB_MISMATCH_${relativePath}_$actual" }
            return $target
          }

          function Fail-NoSend([string]$reason) {
            Write-State 'SEND_NOT_STARTED' @{ terminal_reason = $reason }
            $id = Publish-Terminal 'CONTROL_REQUIRED_NO_SEND' $reason '0' @{ no_blind_retry = 'true' }
            throw "CONTROL_REQUIRED_NO_SEND receipt=$id"
          }

          if ($terminal -notmatch '^\d+$' -or $sourceCard -notin $allowedCards -or ($candidateHead -ne 'NONE' -and $candidateHead -notmatch '^[0-9a-f]{40}$')) { Fail-NoSend 'INVALID_SOURCE_BINDING' }
          try { $active = Get-CurrentSwitch } catch { Fail-NoSend "CURRENT_SWITCH_PARSE_FAILED_$($_.Exception.Message)" }
          if (Test-Path -LiteralPath $statePath) {
            $priorState = Get-Content -LiteralPath $statePath -Raw | ConvertFrom-Json
            if ([string]$priorState.phase -in @('SENT','DELIVERED','WAIT_ACK')) {
              $id = Publish-Terminal 'NO_OP_DUPLICATE' 'DURABLE_SEND_ALREADY_RECORDED' '0' @{ no_blind_retry = 'true'; duplicate_of_logical_key = $idempotencyKey }
              Write-Output "NO_OP_DUPLICATE receipt=$id"
              exit 0
            }
            if ([string]$priorState.phase -eq 'UNCERTAIN') {
              $id = Publish-Terminal 'UNCERTAIN_SEND_NO_BLIND_RETRY' 'PERSISTED_UNCERTAIN_SEND' 'UNKNOWN_AFTER_SEND_BOUNDARY' @{ no_blind_retry = 'true' }
              throw "UNCERTAIN_SEND_NO_BLIND_RETRY receipt=$id"
            }
          }
          Write-State 'SEND_NOT_STARTED' @{ active_switch_receipt = $active.Receipt; target_generation = $active.Generation; target_conversation_id = $active.ConversationId }

          # The integrated bootstrap path is outside this Worker card and remains forbidden: .github/workflows/control-return-comment-bridge.yml
          if ($env:LIVE_CANARY_AUTHORITY -cne 'EXPLICIT_LIVE_CANARY_AUTHORITY') {
            $id = Publish-Terminal 'CONTROL_REQUIRED_NO_SEND' 'EXPLICIT_LIVE_CANARY_AUTHORITY_MISSING' '0' @{ active_switch_receipt = $active.Receipt; target_control_generation = $active.Generation; live_canary_authority = 'NONE' }
            Write-State 'WAIT_ACK' @{ terminal_receipt = $id; live_canary_authority = 'NONE' }
            Write-Output "No live canary authorized; receipt=$id"
            exit 0
          }

          $repoRoot = 'D:\AIWORK\GPT_BROWSER_BRIDGE'
          $repoFull = [IO.Path]::GetFullPath($repoRoot); $repoPrefix = $repoFull.TrimEnd([IO.Path]::DirectorySeparatorChar) + [IO.Path]::DirectorySeparatorChar
          $artifactRoot = Join-Path $repoRoot ".gbb-runtime-artifact-$logicalHash-$env:GITHUB_RUN_ID"
          $artifactFull = [IO.Path]::GetFullPath($artifactRoot)
          if (-not $artifactFull.StartsWith($repoPrefix, [StringComparison]::OrdinalIgnoreCase) -or (Split-Path -Leaf $artifactFull) -notmatch '^\.gbb-runtime-artifact-[0-9a-f]{64}-\d+$') { Fail-NoSend 'MATERIALIZATION_UNSAFE_PATH' }
          if (Test-Path -LiteralPath $artifactRoot) { Fail-NoSend 'MATERIALIZATION_COLLISION' }
          try {
            New-Item -ItemType Directory -Path $artifactRoot | Out-Null; $artifactCreated = $true
            New-Item -ItemType Directory -Path (Join-Path $artifactRoot 'src') | Out-Null
            $senderPath = Materialize-ExactBlob $expectedSenderBlob 'src/gpt_send.mjs'
            [void](Materialize-ExactBlob $expectedContractsBlob 'src/contracts.mjs')
            [void](Materialize-ExactBlob $expectedResultStoreBlob 'src/result_store.mjs')
            $env:GBB_SENDER_PATH = $senderPath
            $importPath = Join-Path $env:RUNNER_TEMP "gbb-g11-import-$logicalHash.mjs"
            Set-Content -LiteralPath $importPath -Encoding utf8 -Value "import { pathToFileURL } from 'node:url';`nconst mod = await import(pathToFileURL(process.env.GBB_SENDER_PATH).href);`nif (typeof mod.sendJob !== 'function' || typeof mod.readBaseline !== 'function') throw new Error('MATERIALIZED_IMPORT_FAILED_EXPORTS');"
            try { & node $importPath 2>&1 | Out-String | Write-Output; if ($LASTEXITCODE -ne 0) { throw 'MATERIALIZED_IMPORT_FAILED' } } finally { Remove-Item -LiteralPath $importPath -Force -ErrorAction SilentlyContinue }
            Write-State 'PRE_CLICK' @{ materialized_sender_blob = $expectedSenderBlob; materialized_contracts_blob = $expectedContractsBlob; materialized_result_store_blob = $expectedResultStoreBlob; canonical_tracked_source_mutated = $false }

            $final = Get-CurrentSwitch
            if ($final.Receipt -cne $active.Receipt -or $final.Generation -cne $active.Generation -or $final.ConversationId -cne $active.ConversationId -or $final.ConversationUrl -cne $active.ConversationUrl) { Fail-NoSend 'CONTROL_BINDING_CHANGED_AT_SEND_BOUNDARY' }
            # Physical sending is guarded by explicit authority and is never part of this Worker execution.
            Write-State 'WAIT_ACK' @{ active_switch_receipt = $final.Receipt; physical_live_canary_send_count = 0; user_relay_count = 0 }
            $id = Publish-Terminal 'CONTROL_REQUIRED_NO_SEND' 'LIVE_ACCEPTANCE_CANARY_NOT_EXECUTED_BY_WORKER' '0' @{ active_switch_receipt = $final.Receipt; target_control_generation = $final.Generation; physical_live_canary_send_count = 0 }
            Write-Output "Physical send intentionally not executed; receipt=$id"
          } catch {
            $detail = ($_.Exception.Message -replace '[\r\n]+',' ')
            if ($detail -match 'MATERIALIZED_IMPORT_FAILED|MATERIALIZATION_') { Write-State 'CHILD_FAILED' @{ error = $detail } }
            elseif ($detail -match 'CONTROL_BINDING_CHANGED') { Write-State 'CONTROL_REQUIRED' @{ error = $detail } }
            else { Write-State 'UNCERTAIN' @{ error = $detail; no_blind_retry = $true } }
            throw
          } finally {
            if ($artifactCreated -and $null -ne $artifactRoot -and (Test-Path -LiteralPath $artifactRoot)) {
              $cleanup = [IO.Path]::GetFullPath($artifactRoot)
              if (-not $cleanup.StartsWith($repoPrefix, [StringComparison]::OrdinalIgnoreCase)) { throw 'MATERIALIZATION_CLEANUP_PATH_INVALID' }
              Remove-Item -LiteralPath $artifactRoot -Recurse -Force -ErrorAction Stop
            }
          }
