name: G10 G11 Ready Return Control Doorbell V2

on:
  workflow_dispatch:
    inputs:
      source_terminal_receipt:
        description: Durable terminal comment receipt that requests the return.
        required: true
        type: string
      source_card_id:
        description: Exact source card identifier.
        required: true
        type: string
      candidate_head:
        description: Exact candidate head, or NONE for a non-candidate terminal.
        required: true
        type: string
      idempotency_key:
        description: Deterministic repository/card/terminal/head key.
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: g10-g11-ready-return-doorbell-${{ inputs.idempotency_key }}
  cancel-in-progress: false

jobs:
  return-doorbell:
    if: inputs.source_terminal_receipt != '' && inputs.source_card_id != '' && inputs.candidate_head != '' && inputs.idempotency_key != ''
    runs-on: [self-hosted, Windows, GBB-REVIEWER]
    timeout-minutes: 12
    defaults:
      run:
        shell: pwsh -NoProfile -File {0}
    steps:
      - name: Deliver exact current Control doorbell once
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TERMINAL_RECEIPT: ${{ inputs.source_terminal_receipt }}
          SOURCE_CARD_ID: ${{ inputs.source_card_id }}
          CANDIDATE_HEAD: ${{ inputs.candidate_head }}
          IDEMPOTENCY_KEY: ${{ inputs.idempotency_key }}
        run: |
          $ErrorActionPreference='Stop'
          $repo='D22977/gpt-browser-bridge'; $issue=88
          $expectedSwitch='5555495204'; $expectedGeneration='010';$expectedConversationId='6a9c2234-f4b4-83ee-ba4b-82c3ee3a2562';$expectedConversationUrl='https://chatgpt.com/c/6a9c2234-f4b4-83ee-ba4b-82c3ee3a2562'
          $expectedSenderBlob='42e55aa194fee1243f8cf32e3c1a63e7ad86f78a'
          $allowedSourceCards=@('GBB-UNATTENDED-RETURN-TRANSPORT-01','GBB-READY-RETURN-CLOSURE-01','GBB-UNATTENDED-RETURN-E2E-REPAIR-03','GBB-UNATTENDED-COMPOSER-SENDER-REPAIR-04','GBB-UNATTENDED-DOORBELL-BINDING-REPAIR-05')
          $headers=@{Authorization="Bearer $env:GH_TOKEN";'User-Agent'='g10-g11-ready-return-doorbell-v2';Accept='application/vnd.github+json'}
          $stateRoot='D:\AIWORK_RUNTIME\GPT_BROWSER_BRIDGE\g10-g11-ready-return-doorbell-v2\state'
          New-Item -ItemType Directory -Force -Path $stateRoot | Out-Null

          $terminal=[string]$env:SOURCE_TERMINAL_RECEIPT
          $sourceCard=[string]$env:SOURCE_CARD_ID
          $candidateHead=[string]$env:CANDIDATE_HEAD
          $idempotencyKey=[string]$env:IDEMPOTENCY_KEY
          $activeSwitch=$null

          function Publish([string]$text){
            $payload=@{body=$text}|ConvertTo-Json -Compress
            $r=Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/issues/$issue/comments" -Headers $headers -Method Post -Body $payload -ContentType 'application/json' -TimeoutSec 30
            $rb=Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/issues/comments/$($r.id)" -Headers $headers -Method Get -TimeoutSec 30
            if([string]$rb.body-cne$text){throw 'readback mismatch'}
            return [string]$r.id
          }

          $nodeScanPath=Join-Path $env:RUNNER_TEMP "g10-g11-ready-return-doorbell-comment-scan-$env:GITHUB_RUN_ID.mjs"
          $nodeScan=@'
          const mode = process.env.GBB_COMMENT_SCAN_MODE;
          const value = process.env.GBB_COMMENT_SCAN_VALUE ?? '';
          const token = process.env.GBB_GH_TOKEN;
          const root = 'https://api.github.com/repos/D22977/gpt-browser-bridge';
          if (!token) throw new Error('GH_TOKEN missing');
          async function getJson(url) {
            const response = await fetch(url, { headers: { authorization: `Bearer ${token}`, accept: 'application/vnd.github+json', 'user-agent': 'g10-g11-ready-return-doorbell-v2-node-scan' } });
            const text = await response.text();
            let body;
            try { body = JSON.parse(text); } catch { throw new Error(`GitHub JSON parse failed status=${response.status}`); }
            if (!response.ok) throw new Error(`GitHub request failed status=${response.status}`);
            return body;
          }
          function normalize(comment) {
            if (!comment || Array.isArray(comment.id) || !/^\d+$/.test(String(comment.id ?? ''))) throw new Error('comment id is not a scalar decimal');
            if (typeof comment.body !== 'string' || typeof comment.created_at !== 'string' || typeof comment.issue_url !== 'string') throw new Error(`comment ${comment.id} shape malformed`);
            return { id: String(comment.id), body: comment.body, created_at: comment.created_at, issue_url: comment.issue_url };
          }
          if (mode === 'single') {
            process.stdout.write(JSON.stringify(normalize(await getJson(`${root}/issues/comments/${encodeURIComponent(value)}`))));
          } else if (mode === 'recent') {
            for (let page = 1; ; page += 1) {
              const batch = await getJson(`${root}/issues/88/comments?since=${encodeURIComponent(value)}&per_page=100&page=${page}`);
              if (!Array.isArray(batch)) throw new Error('GitHub comment list is not an array');
              for (const comment of batch) process.stdout.write(`${JSON.stringify(normalize(comment))}\n`);
              if (batch.length < 100) break;
            }
          } else {
            throw new Error(`unsupported comment scan mode: ${mode}`);
          }
          '@
          Set-Content -LiteralPath $nodeScanPath -Value $nodeScan -Encoding utf8
          function Invoke-NodeCommentScan([string]$mode,[string]$value){
            $env:GBB_GH_TOKEN=$env:GH_TOKEN;$env:GBB_COMMENT_SCAN_MODE=$mode;$env:GBB_COMMENT_SCAN_VALUE=$value
            $raw=& node $nodeScanPath 2>&1|Out-String;if($LASTEXITCODE-ne0){throw "Node GitHub comment scan failed: $raw"};return $raw.Trim()
          }

          function Get-Comment([string]$id){
            $raw=Invoke-NodeCommentScan 'single' $id
            try{$c=$raw|ConvertFrom-Json}catch{throw "comment $id JSON readback malformed"}
            if($null-eq$c-or[string]$c.issue_url-notmatch'/issues/88$'){throw "comment $id is not on Issue #88"}
            return $c
          }

          function Get-Recent88([string]$since){
            $all=[System.Collections.Generic.List[object]]::new();$raw=Invoke-NodeCommentScan 'recent' $since
            foreach($line in ($raw-split"`r?`n")){
              if([string]::IsNullOrWhiteSpace($line)){continue}
              try{$comment=$line|ConvertFrom-Json}catch{throw 'Node GitHub comment scan emitted malformed JSON'}
              if($null-eq$comment){throw 'Node GitHub comment scan emitted null comment'}
              [void]$all.Add($comment)
            }
            return $all.ToArray()
          }

          function Get-CommentId([object]$comment){
            $property=$comment.PSObject.Properties['id'];if($null-eq$property){throw 'comment id property missing'}
            $raw=$property.Value;if($null-eq$raw-or$raw-is[System.Array]){throw 'comment id is not a scalar'}
            $text=[string]$raw;if($text-notmatch'^\d+$'){throw "comment id is not decimal: $text"}
            return [System.Int64]::Parse($text,[System.Globalization.CultureInfo]::InvariantCulture)
          }

          function Get-ProtocolFirstLine([object]$comment){
            $first=[string]((([string]$comment.body)-split"`r?`n",2)[0]);return $first.Trim()
          }

          function Has-Protocol([object]$comment,[string]$marker){return ((Get-ProtocolFirstLine $comment)-ceq$marker)}

          function Parse-Switch([object]$comment){
            $body=[string]$comment.body
            if(-not(Has-Protocol $comment 'CONTROL_GENERATION_SWITCH_V1')-or$body-notmatch'(?m)^state:\s*SWITCH_COMMITTED\s*$'){throw "committed switch header malformed id=$(Get-CommentId $comment)"}
            $generation=[regex]::Match($body,'(?m)^new_generation:\s*(\d{3})\s*$')
            $conversationId=[regex]::Match($body,'(?m)^new_conversation_id:\s*([0-9a-f-]+)\s*$')
            $conversationUrl=[regex]::Match($body,'(?m)^new_conversation_url:\s*(https://chatgpt\.com/(?:g/[A-Za-z0-9._-]+/)?c/[0-9a-f-]+)\s*$')
            $statusA=[regex]::Match($body,'(?m)^new_status:\s*([A-Z_]+)\s*$')
            $statusB=[regex]::Match($body,'(?m)^new_generation_status:\s*([A-Z_]+)\s*$')
            if(-not($generation.Success-and$conversationId.Success-and$conversationUrl.Success)){throw "committed switch fields malformed id=$(Get-CommentId $comment)"}
            if(-not$statusA.Success-and-not$statusB.Success){throw "committed switch status missing id=$(Get-CommentId $comment)"}
            if($statusA.Success-and$statusB.Success-and$statusA.Groups[1].Value-cne$statusB.Groups[1].Value){throw "committed switch status conflict id=$(Get-CommentId $comment)"}
            $status=if($statusA.Success){$statusA.Groups[1].Value}else{$statusB.Groups[1].Value}
            if($status-cne'ACTIVE'){throw "committed switch is not ACTIVE id=$(Get-CommentId $comment)"}
            if($null-eq$comment.created_at){throw "committed switch created_at missing id=$(Get-CommentId $comment)"}
            return [pscustomobject]@{Receipt=([string](Get-CommentId $comment));Generation=$generation.Groups[1].Value;ConversationId=$conversationId.Groups[1].Value;ConversationUrl=$conversationUrl.Groups[1].Value;Since=([DateTimeOffset]$comment.created_at).ToString('o')}
          }

          function Get-CurrentSwitch{
            $anchor=Get-Comment $expectedSwitch
            $anchorSwitch=Parse-Switch $anchor
            $recent=@(Get-Recent88 $anchorSwitch.Since)
            $latest=$anchor
            $latestId=Get-CommentId $latest
            $switchEvidence=@($recent|Where-Object{Has-Protocol $_ 'CONTROL_GENERATION_SWITCH_V1'})
            foreach($candidate in $switchEvidence){
              $candidateId=Get-CommentId $candidate
              if($candidateId-gt$latestId){$null=Parse-Switch $candidate;$latest=$candidate;$latestId=$candidateId}
            }
            return Parse-Switch $latest
          }

          function Need([string]$body,[string]$pattern,[string]$name){
            $match=[regex]::Match($body,$pattern);if(-not$match.Success){throw "missing $name"};return $match.Groups[1].Value
          }

          function Publish-Canary([string]$state,[string]$physicalSendCount,[string]$secondPhysicalSend,[string]$activeSwitchReceipt,[string]$targetGeneration,[string]$targetConversationId,[string]$targetConversationUrl,[string]$extra=''){
            $lines=[System.Collections.Generic.List[string]]::new()
            [void]$lines.Add('CONTROL_UNATTENDED_RETURN_DOORBELL_CANARY_V1')
            [void]$lines.Add("state: $state")
            [void]$lines.Add("source_terminal_receipt: $terminal")
            [void]$lines.Add("source_card_id: $sourceCard")
            [void]$lines.Add("candidate_head: $candidateHead")
            [void]$lines.Add("active_switch_receipt: $activeSwitchReceipt")
            [void]$lines.Add("target_control_generation: $targetGeneration")
            [void]$lines.Add("target_control_conversation_id: $targetConversationId")
            [void]$lines.Add("target_control_conversation_url: $targetConversationUrl")
            [void]$lines.Add("physical_send_count: $physicalSendCount")
            [void]$lines.Add("second_physical_send: $secondPhysicalSend")
            [void]$lines.Add('user_relay_count: 0')
            [void]$lines.Add("workflow_run_id: $env:GITHUB_RUN_ID")
            if(-not[string]::IsNullOrWhiteSpace($extra)){[void]$lines.Add($extra)}
            [void]$lines.Add('readback_required: true')
            return Publish ($lines -join "`n")
          }

          function Fail-NoSend([string]$reason){
            $switchReceipt='NONE';$generation='NONE';$conversationId='NONE';$conversationUrl='NONE'
            if($null-ne$activeSwitch){$switchReceipt=$activeSwitch.Receipt;$generation=$activeSwitch.Generation;$conversationId=$activeSwitch.ConversationId;$conversationUrl=$activeSwitch.ConversationUrl}
            $safe=($reason-replace'[\r\n]+',' ');if($safe.Length-gt500){$safe=$safe.Substring(0,500)}
            $id=Publish-Canary 'CONTROL_REQUIRED_NO_SEND' '0' 'false' $switchReceipt $generation $conversationId $conversationUrl "reason: $safe"
            throw "CONTROL_REQUIRED_NO_SEND receipt=$id"
          }

          if([string]::IsNullOrWhiteSpace($terminal)-or$terminal-notmatch'^\d+$'){Fail-NoSend 'INVALID_SOURCE_TERMINAL_RECEIPT'}
          if($sourceCard-notin$allowedSourceCards){Fail-NoSend 'INVALID_SOURCE_CARD'}
          if($candidateHead-ne'NONE'-and$candidateHead-notmatch'^[0-9a-f]{40}$'){Fail-NoSend 'INVALID_CANDIDATE_HEAD'}
          $expectedIdempotency="$sourceCard`:$terminal`:$candidateHead"
          if($idempotencyKey-cne$expectedIdempotency){Fail-NoSend 'IDEMPOTENCY_KEY_MISMATCH'}

          try{$terminalComment=Get-Comment $terminal}catch{Fail-NoSend "SOURCE_TERMINAL_READ_FAILED: $($_.Exception.Message)"}
          $terminalBody=[string]$terminalComment.body
          $isTransportTerminal=Has-Protocol $terminalComment 'GBB_UNATTENDED_RETURN_TRANSPORT_READY_V1'
          $isClosureTerminal=Has-Protocol $terminalComment 'CONTROL_G10_G11_READY_RETURN_GUARD_V2_TERMINAL_V1'
          $isRepair03Terminal=Has-Protocol $terminalComment 'GBB_UNATTENDED_RETURN_E2E_REPAIR03_READY_V1'
          $isRepair04Terminal=Has-Protocol $terminalComment 'GBB_UNATTENDED_COMPOSER_SENDER_REPAIR04_READY_V1'
          $isRepair05Terminal=Has-Protocol $terminalComment 'GBB_UNATTENDED_DOORBELL_BINDING_REPAIR05_READY_V1'
          if(-not($isTransportTerminal-or$isClosureTerminal-or$isRepair03Terminal-or$isRepair04Terminal-or$isRepair05Terminal)){Fail-NoSend 'UNRECOGNIZED_SOURCE_TERMINAL'}
          $terminalCard=[regex]::Match($terminalBody,'(?m)^card_id:\s*([A-Za-z0-9._:-]+)\s*$')
          if(-not$terminalCard.Success-or$terminalCard.Groups[1].Value-cne$sourceCard){Fail-NoSend 'SOURCE_TERMINAL_CARD_MISMATCH'}
          $terminalState=[regex]::Match($terminalBody,'(?m)^state:\s*(READY_FOR_CONTROL_CANARY|BLOCKED|CONTROL_REQUIRED)\s*$')
          if(-not$terminalState.Success){Fail-NoSend 'SOURCE_TERMINAL_STATE_MALFORMED'}
          $terminalHead=[regex]::Match($terminalBody,'(?m)^candidate_head:\s*(\S+)\s*$')
          if($terminalHead.Success-and$terminalHead.Groups[1].Value-cne$candidateHead){Fail-NoSend 'SOURCE_TERMINAL_HEAD_MISMATCH'}
          if(-not$terminalHead.Success-and$candidateHead-ne'NONE'){Fail-NoSend 'SOURCE_TERMINAL_HEAD_MISSING'}
          $terminalMechanism=[regex]::Match($terminalBody,'(?m)^selected_return_mechanism:\s*([A-Z_]+)\s*$')
          if($terminalState.Groups[1].Value-eq'READY_FOR_CONTROL_CANARY' -and(-not$terminalMechanism.Success-or$terminalMechanism.Groups[1].Value-cne'WORKFLOW_DISPATCH')){Fail-NoSend 'SOURCE_TERMINAL_MECHANISM_MISMATCH'}
          if($terminalState.Groups[1].Value-ne'READY_FOR_CONTROL_CANARY'){Fail-NoSend "SOURCE_TERMINAL_$($terminalState.Groups[1].Value)"}

          try{$activeSwitch=Get-CurrentSwitch}catch{Fail-NoSend "CURRENT_SWITCH_PARSE_FAILED: $($_.Exception.Message)"}
          if($activeSwitch.Receipt-cne$expectedSwitch-or$activeSwitch.Generation-cne$expectedGeneration-or$activeSwitch.ConversationId-cne$expectedConversationId-or$activeSwitch.ConversationUrl-cne$expectedConversationUrl){Fail-NoSend "CONTROL_BINDING_SUPERSEDED switch=$($activeSwitch.Receipt) generation=$($activeSwitch.Generation) conversation=$($activeSwitch.ConversationId)"}

          $logicalKey="$repo|$sourceCard|$terminal|$candidateHead"
          $keyHash=([Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($logicalKey)))).ToLowerInvariant()
          $statePath=Join-Path $stateRoot "$keyHash.json"
          $recent=@(Get-Recent88 $activeSwitch.Since)
          $prior=@($recent|Where-Object{
            $c=$_;$b=[string]$c.body
            (Has-Protocol $c 'CONTROL_UNATTENDED_RETURN_DOORBELL_CANARY_V1') -and
            $b-match'(?m)^state:\s*DELIVERED\s*$' -and
            $b-match("(?m)^source_terminal_receipt:\s*$([regex]::Escape($terminal))\s*$") -and
            $b-match("(?m)^source_card_id:\s*$([regex]::Escape($sourceCard))\s*$") -and
            $b-match("(?m)^candidate_head:\s*$([regex]::Escape($candidateHead))\s*$")
          })
          if($prior.Count-gt1){Fail-NoSend 'CONFLICTING_DELIVERED_CANARY_RECEIPTS'}
          if($prior.Count-eq1){$priorId=[string](Get-CommentId $prior[0]);$priorReadback=Get-Comment $priorId;if([string]$priorReadback.body-cne[string]$prior[0].body){Fail-NoSend 'DURABLE_DELIVERED_READBACK_MISMATCH'};$id=Publish-Canary 'NO_OP_DUPLICATE' '0' 'false' $activeSwitch.Receipt $activeSwitch.Generation $activeSwitch.ConversationId $activeSwitch.ConversationUrl "duplicate_of_existing_delivery: true`nexisting_delivery_receipt: $priorId";Write-Output "NO_OP_DUPLICATE receipt=$id";exit 0}

          if(Test-Path -LiteralPath $statePath){
            try{$stored=Get-Content -LiteralPath $statePath -Raw|ConvertFrom-Json}catch{Fail-NoSend 'CORRUPT_LOCAL_SEND_STATE'}
            switch([string]$stored.status){
              'PRE_CLICK' {$id=Publish-Canary 'CONTROL_REQUIRED_NO_SEND' '0' 'false' $activeSwitch.Receipt $activeSwitch.Generation $activeSwitch.ConversationId $activeSwitch.ConversationUrl 'sender_phase: PRE_CLICK`nsender_error_code: PRE_CLICK_INTERRUPTED_BEFORE_SENDER_RESULT';throw "CONTROL_REQUIRED_NO_SEND receipt=$id"}
              'PRE_CLICK_FAILED' {$id=Publish-Canary 'CONTROL_REQUIRED_NO_SEND' '0' 'false' $activeSwitch.Receipt $activeSwitch.Generation $activeSwitch.ConversationId $activeSwitch.ConversationUrl 'sender_phase: PRE_CLICK`nsender_error_code: PRE_CLICK_FAILED`nexisting_pre_click_failure: true';throw "CONTROL_REQUIRED_NO_SEND receipt=$id"}
              'SENDING' {$id=Publish-Canary 'UNCERTAIN_SEND_NO_BLIND_RETRY' 'UNKNOWN_AFTER_SEND_BOUNDARY' 'false' $activeSwitch.Receipt $activeSwitch.Generation $activeSwitch.ConversationId $activeSwitch.ConversationUrl 'reason: existing SENDING state';throw "UNCERTAIN_SEND_NO_BLIND_RETRY receipt=$id"}
              'UNCERTAIN' {$id=Publish-Canary 'UNCERTAIN_SEND_NO_BLIND_RETRY' 'UNKNOWN_AFTER_SEND_BOUNDARY' 'false' $activeSwitch.Receipt $activeSwitch.Generation $activeSwitch.ConversationId $activeSwitch.ConversationUrl 'reason: existing UNCERTAIN state';throw "UNCERTAIN_SEND_NO_BLIND_RETRY receipt=$id"}
              'SENT' {
                if([string]::IsNullOrWhiteSpace([string]$stored.delivery_receipt)){
                  $id=Publish-Canary 'DELIVERED' '0' 'false' $activeSwitch.Receipt $activeSwitch.Generation $activeSwitch.ConversationId $activeSwitch.ConversationUrl 'publication_only_recovery: true'
                  $stored.delivery_receipt=$id;$stored.receipt_published=$true;$stored|ConvertTo-Json|Set-Content -LiteralPath $statePath -Encoding utf8
                  Write-Output "DELIVERED publication-only receipt=$id";exit 0
                }
                $id=Publish-Canary 'NO_OP_DUPLICATE' '0' 'false' $activeSwitch.Receipt $activeSwitch.Generation $activeSwitch.ConversationId $activeSwitch.ConversationUrl 'duplicate_of_existing_delivery: true';Write-Output "NO_OP_DUPLICATE receipt=$id";exit 0
              }
              default {Fail-NoSend "UNKNOWN_LOCAL_SEND_STATE_$($stored.status)"}
            }
          }

          $repoRoot='D:\AIWORK\GPT_BROWSER_BRIDGE';$senderRel='src/gpt_send.mjs';$senderPath=Join-Path $repoRoot $senderRel
          if(-not(Test-Path -LiteralPath $senderPath)){Fail-NoSend 'LOCAL_SENDER_MISSING'}
          $actualBlob=(& git -C $repoRoot hash-object -- $senderRel).Trim();if($actualBlob-cne$expectedSenderBlob){Fail-NoSend "LOCAL_SENDER_BLOB_MISMATCH_$actualBlob"}
          $playwright='C:\Users\Lupun\AppData\Roaming\npm\node_modules\@playwright\cli\node_modules\.bin\playwright.cmd';$senderSession='HERDR-DOORBELL-DB01-G1-20260816';$db01Root='D:\AIWORK_RUNTIME\GPT_BROWSER_BRIDGE\control-doorbell';$db01Profile='D:\AIWORK_RUNTIME\GPT_BROWSER_BRIDGE\control-doorbell\db01-profile';$runtimeRoot='D:\AIWORK_RUNTIME\GPT_BROWSER_BRIDGE\g10-g11-ready-return-doorbell-v2'
          if(-not(Test-Path -LiteralPath $playwright)){Fail-NoSend 'PLAYWRIGHT_CLI_MISSING'}
          if(-not(Test-Path -LiteralPath $db01Root -PathType Container)){Fail-NoSend 'DB01_RUNTIME_ROOT_MISSING'}
          if(-not(Test-Path -LiteralPath $db01Profile -PathType Container)){Fail-NoSend 'DB01_PROFILE_MISSING'}
          Push-Location $db01Root
          try{
            $sessions=(& $playwright cli list 2>&1|Out-String);if($LASTEXITCODE-ne0){Fail-NoSend 'DB01_SESSION_LIST_FAILED'}
            $tabs=(& $playwright cli "-s=$senderSession" tab-list 2>&1|Out-String)
            if($LASTEXITCODE-eq1-and$sessions-notmatch[regex]::Escape($senderSession)){$open=(& $playwright cli "-s=$senderSession" open --persistent "--profile=$db01Profile" --headed 2>&1|Out-String);if($LASTEXITCODE-ne0){Fail-NoSend 'DB01_RESTART_FAILED'}}
            elseif($LASTEXITCODE-ne0){Fail-NoSend 'DB01_SESSION_AMBIGUOUS'}
            $tabs=(& $playwright cli "-s=$senderSession" tab-list 2>&1|Out-String);if($LASTEXITCODE-ne0){Fail-NoSend 'DB01_TAB_LIST_FAILED'}
            if($tabs-notmatch[regex]::Escape($activeSwitch.ConversationId)){$go=(& $playwright cli "-s=$senderSession" goto $activeSwitch.ConversationUrl 2>&1|Out-String);if($LASTEXITCODE-ne0){Fail-NoSend 'DB01_EXACT_NAVIGATION_FAILED'}}
            $tabs2=(& $playwright cli "-s=$senderSession" tab-list 2>&1|Out-String);if($LASTEXITCODE-ne0-or$tabs2-notmatch[regex]::Escape($activeSwitch.ConversationId)){Fail-NoSend 'DB01_EXACT_CONTROL_TAB_NOT_FOUND'}
          }finally{Pop-Location}

          try{$finalSwitch=Get-CurrentSwitch}catch{Fail-NoSend "FINAL_SWITCH_PARSE_FAILED: $($_.Exception.Message)"}
          if($finalSwitch.Receipt-cne$activeSwitch.Receipt-or$finalSwitch.Generation-cne$activeSwitch.Generation-or$finalSwitch.ConversationId-cne$activeSwitch.ConversationId-or$finalSwitch.ConversationUrl-cne$activeSwitch.ConversationUrl){Fail-NoSend 'CONTROL_BINDING_CHANGED_AT_SEND_BOUNDARY'}

          $env:GBB_SENDER_PATH=$senderPath;$env:GBB_SENDER_SESSION=$senderSession;$env:GBB_RUNTIME_ROOT=$runtimeRoot;$env:GBB_TARGET_URL=$finalSwitch.ConversationUrl;$env:GBB_PROMPT="Read GitHub directly. Rehydrate D22977/gpt-browser-bridge #43/#81/#88 and handle terminal receipt $terminal for card $sourceCard as the current ACTIVE Control only. GitHub is durable authority."
          $script=@'
          import { pathToFileURL } from 'node:url';
          function errorEvidence(error){
            return {ok:false,code:error?.code??'SENDER_ERROR',phase:error?.phase??'CLICK_INVOKED',physical_send_count:error?.physicalSendCount??'UNKNOWN_AFTER_SEND_BOUNDARY',terminal_state:error?.terminalState??'UNCERTAIN_SEND_NO_BLIND_RETRY',source_error_code:error?.cause?.code??null,source_error_cause:error?.cause?.cause?.message??error?.cause?.message??error?.message??'unknown sender error'};
          }
          try{
            const mod = await import(pathToFileURL(process.env.GBB_SENDER_PATH).href);
            await mod.readBaseline(process.env.GBB_TARGET_URL,{session:process.env.GBB_SENDER_SESSION,allowBackgroundTab:true});
            const result=await mod.sendJob({prompt:process.env.GBB_PROMPT,attempt:1,conversationUrl:process.env.GBB_TARGET_URL,runtimeRoot:process.env.GBB_RUNTIME_ROOT,session:process.env.GBB_SENDER_SESSION,allowBackgroundTab:true});
            console.log(JSON.stringify({ok:true,job_id:result.job.job_id,prompt_hash:result.job.prompt_hash,phase:result.phaseEvidence.phase,physical_send_count:result.phaseEvidence.physical_send_count,click_invoked:result.phaseEvidence.click_invoked,fill_readback_verified:result.phaseEvidence.fill_readback_verified}));
          }catch(error){console.log(JSON.stringify(errorEvidence(error)));process.exitCode=17}
          '@
          $scriptPath=Join-Path $env:RUNNER_TEMP "ready-return-doorbell-$keyHash-$env:GITHUB_RUN_ID.mjs";Set-Content -LiteralPath $scriptPath -Value $script -Encoding utf8
          @{status='PRE_CLICK';logical_key=$logicalKey;source_card_id=$sourceCard;source_terminal_receipt=$terminal;candidate_head=$candidateHead;active_switch_receipt=$finalSwitch.Receipt;target_generation=$finalSwitch.Generation;target_conversation_id=$finalSwitch.ConversationId;target_conversation_url=$finalSwitch.ConversationUrl;workflow_run_id=$env:GITHUB_RUN_ID;started_at=(Get-Date).ToString('o')}|ConvertTo-Json|Set-Content -LiteralPath $statePath -Encoding utf8
          $senderResult=$null
          try{
            $out=(& node $scriptPath 2>&1|Out-String).Trim();$senderExit=$LASTEXITCODE;$json=($out-split"`n"|Where-Object{$_.Trim().StartsWith('{')}|Select-Object -Last 1);if(-not$json){throw 'No sender JSON'};$senderResult=$json|ConvertFrom-Json;if($senderExit-ne0-or$senderResult.ok-ne$true){throw "sender terminal failure: $out"};$sent=$senderResult
          }catch{
            $phase=if($null-ne$senderResult){[string]$senderResult.phase}else{'CLICK_INVOKED'}
            $senderCode=if($null-ne$senderResult){[string]$senderResult.code}else{'SENDER_RESULT_MISSING'}
            $sourceCode=if($null-ne$senderResult){[string]$senderResult.source_error_code}else{''}
            $sourceCause=if($null-ne$senderResult){[string]$senderResult.source_error_cause}else{[string]$_.Exception.Message}
            $safeCause=($sourceCause-replace'[\r\n]+',' ');if($safeCause.Length-gt500){$safeCause=$safeCause.Substring(0,500)}
            $preClickFailureCodes=@('PRE_CLICK_COMPOSER_TARGET_INVALID','PRE_CLICK_COMPOSER_INSPECTION_FAILED','PRE_CLICK_FILL_FAILED','PRE_CLICK_FILL_READBACK_MISMATCH')
            $isPreClickNoSend=($phase-eq'PRE_CLICK' -and ($senderCode -in $preClickFailureCodes -or [string]::IsNullOrWhiteSpace($senderCode)))
            if($isPreClickNoSend -or $phase-eq'PRE_CLICK'){
              $stored=Get-Content -LiteralPath $statePath -Raw|ConvertFrom-Json;$stored.status='PRE_CLICK_FAILED';$stored.sender_phase=$phase;$stored.sender_error_code=$senderCode;$stored.sender_source_error_code=$sourceCode;$stored.sender_source_error_cause=$safeCause;$stored.physical_send_count=0;$stored|ConvertTo-Json|Set-Content -LiteralPath $statePath -Encoding utf8
              $extra="sender_phase: PRE_CLICK`nsender_error_code: $senderCode`nsender_source_error_code: $sourceCode`nsender_source_error_cause: $safeCause`nsender_physical_send_count: 0"
              $id=Publish-Canary 'CONTROL_REQUIRED_NO_SEND' '0' 'false' $finalSwitch.Receipt $finalSwitch.Generation $finalSwitch.ConversationId $finalSwitch.ConversationUrl $extra;throw "CONTROL_REQUIRED_NO_SEND receipt=$id"
            }
            $stored=Get-Content -LiteralPath $statePath -Raw|ConvertFrom-Json;$stored.status='UNCERTAIN';$stored.sender_phase=$phase;$stored.sender_error_code=$senderCode;$stored.sender_source_error_code=$sourceCode;$stored.sender_source_error_cause=$safeCause;$stored.physical_send_count='UNKNOWN_AFTER_SEND_BOUNDARY';$stored|ConvertTo-Json|Set-Content -LiteralPath $statePath -Encoding utf8
            $extra="sender_phase: $phase`nsender_error_code: $senderCode`nsender_source_error_code: $sourceCode`nsender_source_error_cause: $safeCause"
            $id=Publish-Canary 'UNCERTAIN_SEND_NO_BLIND_RETRY' 'UNKNOWN_AFTER_SEND_BOUNDARY' 'false' $finalSwitch.Receipt $finalSwitch.Generation $finalSwitch.ConversationId $finalSwitch.ConversationUrl $extra;throw "UNCERTAIN_SEND_NO_BLIND_RETRY receipt=$id"
          }finally{Remove-Item -LiteralPath $scriptPath -Force -ErrorAction SilentlyContinue}
          $stored=Get-Content -LiteralPath $statePath -Raw|ConvertFrom-Json;$stored.status='SENT';$stored.sent_at=(Get-Date).ToString('o');$stored.sender_job_id=[string]$sent.job_id;$stored.sender_prompt_hash=[string]$sent.prompt_hash;$stored.sender_phase=[string]$sent.phase;$stored.fill_readback_verified=[string]$sent.fill_readback_verified;$stored.physical_send_count=[string]$sent.physical_send_count;$stored|ConvertTo-Json|Set-Content -LiteralPath $statePath -Encoding utf8
          $delivery=Publish-Canary 'DELIVERED' '1' 'false' $finalSwitch.Receipt $finalSwitch.Generation $finalSwitch.ConversationId $finalSwitch.ConversationUrl "sender_job_id: $($sent.job_id)`nsender_prompt_hash: $($sent.prompt_hash)`nsender_phase: $($sent.phase)`nfill_readback_verified: $($sent.fill_readback_verified)"
          $stored.delivery_receipt=$delivery;$stored.receipt_published=$true;$stored|ConvertTo-Json|Set-Content -LiteralPath $statePath -Encoding utf8
          Write-Output "DELIVERED receipt=$delivery"
