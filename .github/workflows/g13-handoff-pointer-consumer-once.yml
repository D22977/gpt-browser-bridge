name: G13 Pointer-only Handoff Consumer Once

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: g13-handoff-pointer-consumer-serialized
  cancel-in-progress: false

jobs:
  consume:
    if: >-
      github.event.issue.number == 162 &&
      github.event.comment.user.login == 'D22977' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, 'GBB_G13_HANDOFF_POINTER_DISPATCH_REQUEST_V1')
    runs-on: [self-hosted, Windows, GBB-REVIEWER]
    timeout-minutes: 12
    defaults:
      run:
        shell: pwsh -NoProfile -File {0}
    steps:
      - name: Rehydrate card, admit exact consumer, and forward one pointer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $repo = 'D22977/gpt-browser-bridge'
          $issue = 162
          $workflowPath = '.github/workflows/g13-handoff-pointer-consumer-once.yml'
          $herdr = 'C:\Users\Lupun\AppData\Local\Programs\Herdr\bin\herdr.exe'
          $api = "https://api.github.com/repos/$repo"
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; 'User-Agent' = 'g13-pointer-only-handoff-consumer'; Accept = 'application/vnd.github+json' }
          
          function Get-Comment([string]$id) {
            if ($id -cnotmatch '^[1-9][0-9]*$') { throw 'INVALID_COMMENT_ID' }
            return Invoke-RestMethod "$api/issues/comments/$id" -Headers $headers -Method Get -TimeoutSec 30
          }
          
          function Get-AllComments([int]$number, [int]$maxPages = 100) {
            $all = @()
            for ($page = 1; $page -le $maxPages; $page++) {
              $rows = @(Invoke-RestMethod "$api/issues/$number/comments?per_page=100&page=$page" -Headers $headers -Method Get -TimeoutSec 30)
              $all += $rows
              if ($rows.Count -lt 100) {
                if (@($all.id | Sort-Object -Unique).Count -ne $all.Count) { throw 'HISTORY_PAGINATION_OVERLAP' }
                return @{ comments = @($all); eof = $true; pages = $page }
              }
            }
            throw "INCOMPLETE_DURABLE_HISTORY_issue_$number"
          }
          
          # LF and CRLF are equivalent; bare CR, BOM at code point zero, NUL and unknown lines fail.
          # Field identity is ordinal and section scoped. In V117 release_authorized occurs
          # in two declared sections; both are mandatory and independently validated.
          function Test-OrdinalEquals([AllowNull()][string]$left, [AllowNull()][string]$right) {
            return [string]::Equals($left, $right, [System.StringComparison]::Ordinal)
          }

          function Test-OrdinalContains([string[]]$values, [string]$value) {
            foreach ($candidate in $values) {
              if (Test-OrdinalEquals ([string]$candidate) $value) { return $true }
            }
            return $false
          }

          function Read-Record([string]$body, [string]$protocol, [string[]]$keys, [string[]]$sections = @()) {
            if ($body.Length -gt 0 -and (Test-OrdinalEquals ([string]$body[0]) ([string][char]0xFEFF))) { throw 'INVALID_RECORD_ENCODING_BOM' }
            if ($body.Contains([char]0)) { throw 'INVALID_RECORD_ENCODING_NUL' }
            if ($body -match '\r(?!\n)') { throw 'INVALID_RECORD_ENCODING_BARE_CR' }
            $lines = $body -split "\r?\n|\n"
            if (-not (Test-OrdinalEquals $lines[0] $protocol)) { throw 'WRONG_RECORD_PROTOCOL' }
            $fields = [System.Collections.Generic.Dictionary[string,string]]::new([StringComparer]::Ordinal)
            $seenSections = [System.Collections.Generic.HashSet[string]]::new([StringComparer]::Ordinal)
            $section = ''
            foreach ($line in $lines | Select-Object -Skip 1) {
              if (Test-OrdinalEquals $line '') { continue }
              if (Test-OrdinalContains $sections $line) {
                if (-not $seenSections.Add($line)) { throw "DUPLICATE_SECTION_$line" }
                $section = $line
                continue
              }
              if ($line -cmatch '^([a-z][a-z0-9_]*):[ \t]*(.*)$') {
                $key = if ($section) { "$section/$($Matches[1])" } else { $Matches[1] }
                $value = $Matches[2]
              } elseif (Test-OrdinalEquals $section 'BEST_NEXT') {
                $key = 'BEST_NEXT/text'
                $value = $line
              } else { throw 'UNKNOWN_RECORD_LINE' }
              if ($fields.ContainsKey($key)) { throw "DUPLICATE_FIELD_$key" }
              # Register before checking emptiness: an empty duplicate can never be ignored.
              $fields.Add($key, $value)
              if (-not (Test-OrdinalContains $keys $key)) { throw "UNKNOWN_FIELD_$key" }
              if ([string]::IsNullOrWhiteSpace($value) -or -not (Test-OrdinalEquals $value $value.Trim())) { throw "EMPTY_OR_PADDED_FIELD_$key" }
            }
            foreach ($key in $keys) { if (-not $fields.ContainsKey($key)) { throw "MISSING_FIELD_$key" } }
            foreach ($name in $sections) { if (-not $seenSections.Contains($name)) { throw "MISSING_SECTION_$name" } }
            return ,$fields
          }
          
          function Require-Values($fields, $expected) {
            foreach ($key in $expected.Keys) {
              if ([string]::IsNullOrWhiteSpace([string]$expected[$key]) -or -not $fields.ContainsKey($key) -or -not (Test-OrdinalEquals ([string]$fields[$key]) ([string]$expected[$key]))) {
                throw "BINDING_MISMATCH_$key"
              }
            }
          }

          function Assert-ThrowsExact([scriptblock]$action, [string]$expected) {
            try {
              & $action
            } catch {
              if (Test-OrdinalEquals $_.Exception.Message $expected) { return }
              throw "UNEXPECTED_REGRESSION_FAILURE_$($_.Exception.Message)"
            }
            throw "MISSING_EXPECTED_REGRESSION_FAILURE_$expected"
          }

          # These run in the workflow itself.  Turkish dotted-I and composed/decomposed
          # e-acute are distinct protocol/binding values under ordinal comparison.
          function Assert-OrdinalRegressionCases {
            $priorCulture = [System.Threading.Thread]::CurrentThread.CurrentCulture
            $priorUICulture = [System.Threading.Thread]::CurrentThread.CurrentUICulture
            try {
              [System.Threading.Thread]::CurrentThread.CurrentCulture = [Globalization.CultureInfo]::GetCultureInfo('tr-TR')
              [System.Threading.Thread]::CurrentThread.CurrentUICulture = [Globalization.CultureInfo]::GetCultureInfo('tr-TR')
              $keys = @('state')
              $fields = Read-Record "PROTO`nstate: café" 'PROTO' $keys
              Require-Values $fields @{ state='café' }
              Assert-ThrowsExact { Require-Values $fields @{ state="cafe$([char]0x0301)" } } 'BINDING_MISMATCH_state'
              Assert-ThrowsExact { Read-Record "PROT$([char]0x0130)`nstate: READY" 'PROTi' $keys } 'WRONG_RECORD_PROTOCOL'
            } finally {
              [System.Threading.Thread]::CurrentThread.CurrentCulture = $priorCulture
              [System.Threading.Thread]::CurrentThread.CurrentUICulture = $priorUICulture
            }
          }
          
          function Require-Sha([string]$value) {
            if ($value -cnotmatch '^[0-9a-f]{40}$') { throw 'INVALID_SHA' }
          }
          
          function Assert-Comment($comment, [int]$number, [string]$publisher = 'OWNER') {
            if ([string]$comment.id -cnotmatch '^[1-9][0-9]*$' -or -not (Test-OrdinalEquals ([string]$comment.issue_url) "$api/issues/$number")) { throw 'COMMENT_ISSUE_OR_ID_MISMATCH' }
            if (Test-OrdinalEquals $publisher 'OWNER') {
              if (-not (Test-OrdinalEquals ([string]$comment.user.login) 'D22977') -or -not (Test-OrdinalEquals ([string]$comment.author_association) 'OWNER')) { throw 'COMMENT_NOT_OWNER' }
            } elseif (Test-OrdinalEquals $publisher 'WORKFLOW') {
              if (-not (Test-OrdinalEquals ([string]$comment.user.login) 'github-actions[bot]') -or -not (Test-OrdinalEquals ([string]$comment.user.type) 'Bot')) { throw 'RESERVATION_NOT_WORKFLOW' }
            } else { throw 'UNKNOWN_PUBLISHER_SCHEMA' }
            foreach ($key in @('created_at','updated_at')) {
              $stamp = $comment.$key
              # PowerShell 7.5+ may deserialize JSON ISO dates as DateTime.
              if ($stamp -isnot [datetime] -and $stamp -isnot [datetimeoffset] -and [string]$stamp -cnotmatch '^\d{4}-\d\d-\d\dT\d\d:\d\d:\d\dZ$') { throw 'INVALID_COMMENT_TIMESTAMP' }
              if ([datetimeoffset]$stamp -gt [datetimeoffset]::UtcNow) { throw 'FUTURE_COMMENT_TIMESTAMP' }
            }
            if (-not (Test-OrdinalEquals ([string]$comment.created_at) ([string]$comment.updated_at))) { throw 'EDITED_RECEIPT_NO_BLIND_RETRY' }
          }
          
          function Assert-Unchanged($before, $after) {
            foreach ($key in @('id','issue_url','body','created_at','updated_at','author_association')) {
              if (-not (Test-OrdinalEquals ([string]$before.$key) ([string]$after.$key))) { throw "EXACT_GET_CHANGED_$key" }
            }
            if (-not (Test-OrdinalEquals ([string]$before.user.login) ([string]$after.user.login))) { throw 'EXACT_GET_AUTHOR_CHANGED' }
          }
          
          function Read-Exact($comment, [int]$number, [string]$publisher = 'OWNER') {
            $fresh = Get-Comment ([string]$comment.id)
            Assert-Comment $fresh $number $publisher
            Assert-Unchanged $comment $fresh
            return $fresh
          }
          
          function Assert-Order($earlier, $later) {
            if ([int64]$earlier.id -ge [int64]$later.id -or [datetimeoffset]$earlier.created_at -gt [datetimeoffset]$later.created_at) { throw 'RECEIPT_ORDER_INVALID' }
          }
          
          # Inspect every page and every first-line envelope, without author/state filters.
          # Never fall back past a newer malformed, wrong-author or unsupported version.
          # Older versions are archival only; this G13 workflow admits the complete declared
          # G13 switch and V117 schema below, not arbitrary fields from future schemas.
          function Get-Family($rows, [string]$family) {
            $records = @()
            foreach ($row in $rows) {
              $first = ([string]$row.body -split "\r?\n|\n", 2)[0]
              if ($first.Trim().TrimStart([char]0xFEFF) -imatch ('^' + [regex]::Escape($family))) {
                if ($first -cnotmatch ('^' + [regex]::Escape($family) + '[1-9][0-9]*$')) { throw 'MALFORMED_VERSIONED_ENVELOPE' }
                $records += $row
              }
            }
            return @($records | Sort-Object { [int64]$_.id })
          }
          
          function Validate-Switch($comment) {
            Assert-Comment $comment 88
            $keys = @(
              'state','recorded_by_role','issue','source_active_switch_012','source_owner_direct_recovery','source_candidate_binding',
              'source_generation_ack','source_continuity_ack','source_routing_canary','rotation_standard','final_freshness_issue43',
              'final_freshness_issue81','final_freshness_issue88','final_freshness_issue162','latest_issue162_receipt',
              'newer_conflicting_switch','competing_generation013_identity','old_generation','old_display_name','old_conversation_id',
              'old_status','old_stale_wake_behavior','new_generation','new_display_name','new_conversation_id','new_conversation_url',
              'new_status','inherited_issue162_card','inherited_issue162_boundary','wake_5645450149_retry','merge_authorized',
              'release_authorized','workflow_dispatch_authorized','scheduled_task_deployment_authorized','readback_required','idempotency_key'
            )
            $f = Read-Record $comment.body 'CONTROL_GENERATION_SWITCH_V1' $keys
            Require-Values $f @{
              state='SWITCH_COMMITTED'; recorded_by_role='CHATGPT_WEB_CONTROL'; issue='88'; old_generation='012'; old_status='RETIRED'
              old_stale_wake_behavior='NO_OP_RETIRED'; new_generation='013'; new_status='ACTIVE'; readback_required='true'
              newer_conflicting_switch='false'; competing_generation013_identity='false'; wake_5645450149_retry='false'
              merge_authorized='false'; release_authorized='false'; workflow_dispatch_authorized='false'; scheduled_task_deployment_authorized='false'
              final_freshness_issue43='PASS'; final_freshness_issue81='PASS'; final_freshness_issue88='PASS'; final_freshness_issue162='PASS'
            }
            foreach ($key in $keys | Where-Object { $_ -like 'source_*' -or $_ -in @('rotation_standard','latest_issue162_receipt','inherited_issue162_boundary') }) {
              if ($f[$key] -cnotmatch '^[1-9][0-9]*$' -or [int64]$f[$key] -ge [int64]$comment.id) { throw 'SWITCH_SOURCE_ORDER_INVALID' }
            }
            foreach ($key in @('old_conversation_id','new_conversation_id')) {
              if ($f[$key] -cnotmatch '^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$') { throw 'CONTROL_IDENTITY_INVALID' }
            }
            if ((Test-OrdinalEquals $f['new_conversation_id'] $f['old_conversation_id']) -or $f['new_conversation_url'] -cnotmatch ('^https://chatgpt\.com/(g/[^/]+/)?c/' + $f['new_conversation_id'] + '$')) { throw 'CONTROL_URL_IDENTITY_MISMATCH' }
            return ,$f
          }
          
          function Validate-CurrentStart($comment, $switch, $switchFields) {
            Assert-Comment $comment 43
            $keys = @(
              'state','recorded_by_role','supersedes','source_control_switch','current_registry',
              'CURRENT_CONTROL/control_generation','CURRENT_CONTROL/control_status','CURRENT_CONTROL/control_logical_name',
              'CURRENT_CONTROL/control_conversation_id','CURRENT_CONTROL/control_conversation_url','CURRENT_CONTROL/previous_generation','CURRENT_CONTROL/previous_stale_wake_behavior',
              'CURRENT_WORK/repo','CURRENT_WORK/issue','CURRENT_WORK/card_id','CURRENT_WORK/issue_state','CURRENT_WORK/latest_receipt',
              'CURRENT_WORK/current_phase','CURRENT_WORK/wake_5645450149_consumed','CURRENT_WORK/same_wake_retry_authorized',
              'CURRENT_WORK/exact_allowed_path','CURRENT_WORK/exact_required_change','CURRENT_WORK/scheduled_task_deployment_authorized',
              'CURRENT_WORK/worker_merge_authorized','CURRENT_WORK/release_authorized','BEST_NEXT/text','AUTHORITY_BOUNDARY/merge_default',
              'AUTHORITY_BOUNDARY/release_authorized','AUTHORITY_BOUNDARY/workflow_dispatch_authorized','AUTHORITY_BOUNDARY/terminal_does_not_imply_successor',
              'AUTHORITY_BOUNDARY/pass_does_not_imply_merge','AUTHORITY_BOUNDARY/user_task_result_relay_target',
              'AUTHORITY_BOUNDARY/readback_required','AUTHORITY_BOUNDARY/idempotency_key'
            )
            $f = Read-Record $comment.body 'CURRENT_REHYDRATION_INDEX_V117' $keys @('CURRENT_CONTROL','CURRENT_WORK','BEST_NEXT','AUTHORITY_BOUNDARY')
            Require-Values $f @{
              state='CURRENT_START_HERE'; recorded_by_role='CHATGPT_WEB_CONTROL'
              source_control_switch="$($switch.id) / CONTROL_GENERATION_SWITCH_V1"
              'CURRENT_CONTROL/control_generation'=$switchFields['new_generation']; 'CURRENT_CONTROL/control_status'='ACTIVE'
              'CURRENT_CONTROL/control_logical_name'=$switchFields['new_display_name']
              'CURRENT_CONTROL/control_conversation_id'=$switchFields['new_conversation_id']; 'CURRENT_CONTROL/control_conversation_url'=$switchFields['new_conversation_url']
              'CURRENT_CONTROL/previous_generation'='012 / RETIRED'; 'CURRENT_CONTROL/previous_stale_wake_behavior'='NO_OP_RETIRED'
              'CURRENT_WORK/repo'=$repo; 'CURRENT_WORK/issue'='162'; 'CURRENT_WORK/card_id'=$switchFields['inherited_issue162_card']
              'CURRENT_WORK/issue_state'='OPEN_P0'
              'CURRENT_WORK/wake_5645450149_consumed'='true'; 'CURRENT_WORK/same_wake_retry_authorized'='false'
              'CURRENT_WORK/scheduled_task_deployment_authorized'='false'; 'CURRENT_WORK/worker_merge_authorized'='false'; 'CURRENT_WORK/release_authorized'='false'
              'AUTHORITY_BOUNDARY/merge_default'='NOT_AUTHORIZED except exact separately adopted bounded Control repair authority'
              'AUTHORITY_BOUNDARY/release_authorized'='false'; 'AUTHORITY_BOUNDARY/workflow_dispatch_authorized'='false'
              'AUTHORITY_BOUNDARY/terminal_does_not_imply_successor'='true'; 'AUTHORITY_BOUNDARY/pass_does_not_imply_merge'='true'
              'AUTHORITY_BOUNDARY/user_task_result_relay_target'='0'; 'AUTHORITY_BOUNDARY/readback_required'='true'
              'AUTHORITY_BOUNDARY/idempotency_key'="CURRENT-REHYDRATION-INDEX-V117-G13-$($switch.id)"
            }
            if ($f['supersedes'] -cnotmatch '^([1-9][0-9]*) / CURRENT_REHYDRATION_INDEX_V116$' -or [int64]$Matches[1] -ge [int64]$comment.id) { throw 'CURRENT_START_SUPERSESSION_INVALID' }
            if ($f['current_registry'] -cnotmatch '^([1-9][0-9]*) / CURRENT_REGISTRY_INDEX_V19$' -or [int64]$Matches[1] -ge [int64]$comment.id) { throw 'CURRENT_REGISTRY_ORDER_INVALID' }
            Assert-Order $switch $comment
            return ,$f
          }
          
          function Read-Control {
            $h88 = Get-AllComments 88
            $h43 = Get-AllComments 43
            $switches = @(Get-Family $h88.comments 'CONTROL_GENERATION_SWITCH_V')
            $starts = @(Get-Family $h43.comments 'CURRENT_REHYDRATION_INDEX_V')
            if ($switches.Count -eq 0 -or $starts.Count -eq 0) { throw 'CONTROL_HISTORY_MISSING' }
            $switch = Read-Exact $switches[-1] 88
            $sf = Validate-Switch $switch
            $start = Read-Exact $starts[-1] 43
            $cf = Validate-CurrentStart $start $switch $sf
            # The predecessor pointers must resolve in the COMPLETE histories, and must
            # name the immediately preceding records. No state/author-filtered fallback.
            $priorSwitch = @($switches | Where-Object { [int64]$_.id -lt [int64]$switch.id })
            $priorStart = @($starts | Where-Object { [int64]$_.id -lt [int64]$start.id })
            if ($priorSwitch.Count -eq 0 -or -not (Test-OrdinalEquals ([string]$priorSwitch[-1].id) $sf['source_active_switch_012'])) { throw 'SWITCH_SUPERSESSION_CONFLICT' }
            if ($priorStart.Count -eq 0 -or -not (Test-OrdinalEquals "$($priorStart[-1].id) / CURRENT_REHYDRATION_INDEX_V116" $cf['supersedes'])) { throw 'CURRENT_START_SUPERSESSION_CONFLICT' }
            return @{ switch=$switch; start=$start }
          }
          
          function Tuple-Keys {
            return @('executor_identity','executor_session_or_instance','executor_kind','executor_name','executor_pane',
              'executor_workspace','executor_cwd','executor_branch','executor_head','executor_status','executor_visibility')
          }
          
          function Validate-Dispatch($comment) {
            Assert-Comment $comment 162
            $f = Read-Record $comment.body 'GBB_G13_HANDOFF_POINTER_DISPATCH_REQUEST_V1' @('card_receipt','card_id','control_generation','launcher_head_sha','worker_base_sha','dispatch_idempotency_key')
            Require-Values $f @{
              card_id='GBB-G13-HANDOFF-AUTOMATION-ADVERSARIAL-TEST-01'; control_generation='013'
              dispatch_idempotency_key='GBB-G13-HANDOFF-AUTOMATION-ADVERSARIAL-TEST-01-DISPATCH-01'
            }
            if ($f['card_receipt'] -cnotmatch '^[1-9][0-9]*$') { throw 'INVALID_CARD_POINTER' }
            Require-Sha $f['launcher_head_sha']
            Require-Sha $f['worker_base_sha']
            return ,$f
          }
          
          function Validate-Card($comment, $dispatchFields) {
            Assert-Comment $comment 162
            $keys = @('state','card_protocol','card_id','control_generation','source_consumer_acceptance','target_ref_exact','target_ref_head_exact',
              'launcher_head_sha','worker_base_sha','executor_role','requested_action','allowed_actions','forbidden_actions','logical_handoff_count_max',
              'dispatch_idempotency_key','readback_verified','consumer_workflow_path_exact','consumer_workflow_blob_exact',
              'target_agent_name','target_pane','target_cwd_exact','target_agent_status_required')
            $f = Read-Record $comment.body 'GBB_G13_HANDOFF_AUTOMATION_TEST_CARD_V1' $keys
            Require-Values $f @{
              state='READY_FOR_POINTER_DISPATCH'; card_protocol='GBB_G13_HANDOFF_AUTOMATION_TEST_CARD_V1'
              card_id=$dispatchFields['card_id']; control_generation=$dispatchFields['control_generation']; target_ref_exact='refs/heads/review-base/gbb-gh-01'
              launcher_head_sha=$dispatchFields['launcher_head_sha']; worker_base_sha=$dispatchFields['worker_base_sha']
              target_ref_head_exact=$dispatchFields['launcher_head_sha']; executor_role='LOCAL_EXECUTOR'
              requested_action='SYNTHETIC_POINTER_ONLY_HANDOFF_CANARY'; allowed_actions='GITHUB_READBACK_AND_RECEIPTS_ONLY'
              forbidden_actions='PRODUCT_MUTATION,SECOND_RUN,USER_RELAY,MERGE,RELEASE,DEPLOYMENT,WAKE'
              logical_handoff_count_max='1'; dispatch_idempotency_key=$dispatchFields['dispatch_idempotency_key']
              readback_verified='true'; consumer_workflow_path_exact=$workflowPath
            }
            Require-Sha $f['consumer_workflow_blob_exact']
            if ($f['source_consumer_acceptance'] -cnotmatch '^[1-9][0-9]*$' -or $f['target_agent_status_required'] -cnotin @('idle','done')) { throw 'INVALID_CARD_SELECTOR' }
            return ,$f
          }
          
          # Acceptance is a Control-authored selector, distinct from a WORKER receipt.
          # Every tuple field is explicit; LOCAL_EXECUTOR is the action class, worker_role
          # is the selected live role. No kind/workspace/branch/model/visibility defaults.
          function Validate-Acceptance($comment, $cardFields, $control) {
            Assert-Comment $comment 162
            $keys = @('state','recorded_by_role','card_id','control_generation','target_ref_exact','target_ref_head_exact','target_workflow_blob',
              'consumer_workflow_path_exact','launcher_head_sha','worker_base_sha','executor_role','worker_role','requested_action',
              'allowed_actions','forbidden_actions','logical_handoff_count_max','dispatch_idempotency_key','source_control_switch',
              'source_current_start','supersedes','readback_verified') + @(Tuple-Keys)
            $f = Read-Record $comment.body 'GBB_G13_HANDOFF_AUTOMATION_TEST_ACCEPTANCE_V1' $keys
            $expected = @{
              state='PASS'; recorded_by_role='CHATGPT_WEB_CONTROL'; executor_role='LOCAL_EXECUTOR'; worker_role='WORKER'
              target_workflow_blob=$cardFields['consumer_workflow_blob_exact']; source_control_switch=[string]$control.switch.id
              source_current_start=[string]$control.start.id; supersedes='NONE'; readback_verified='true'
              executor_name=$cardFields['target_agent_name']; executor_pane=$cardFields['target_pane']; executor_cwd=$cardFields['target_cwd_exact']
              executor_head=$cardFields['worker_base_sha']; executor_status=$cardFields['target_agent_status_required']
            }
            foreach ($key in @('card_id','control_generation','target_ref_exact','target_ref_head_exact','consumer_workflow_path_exact',
              'launcher_head_sha','worker_base_sha','requested_action','allowed_actions','forbidden_actions','logical_handoff_count_max','dispatch_idempotency_key')) {
              $expected[$key] = $cardFields[$key]
            }
            Require-Values $f $expected
            if ($f['executor_visibility'] -cnotin @('visible','focused','agent_visible')) { throw 'EXECUTOR_NOT_VISIBLE' }
            Assert-Order $control.start $comment
            return ,$f
          }
          
          function Live-Value($agent, [string[]]$names) {
            $values = @()
            foreach ($name in $names) {
              $p = $agent.PSObject.Properties[$name]
              if ($null -ne $p -and -not [string]::IsNullOrWhiteSpace([string]$p.Value)) { $values += [string]$p.Value }
            }
            if ($values.Count -eq 0 -or @($values | Where-Object { -not (Test-OrdinalEquals $_ $values[0]) }).Count -gt 0) { throw "LIVE_FIELD_MISSING_OR_CONFLICTING_$($names[0])" }
            return $values[0]
          }

          function Get-RequiredTrueBoolean($object, [string]$property, [string]$failure) {
            $value = $object.PSObject.Properties[$property]
            if ($null -eq $value -or $value.Value -isnot [bool] -or -not [bool]$value.Value) { throw $failure }
            return $true
          }

          function Get-RequiredBoolean($object, [string]$property, [string]$failure) {
            $value = $object.PSObject.Properties[$property]
            if ($null -eq $value -or $value.Value -isnot [bool]) { throw $failure }
            return [bool]$value.Value
          }

          function Get-RequiredFalseBoolean($object, [string]$property, [string]$failure) {
            $value = $object.PSObject.Properties[$property]
            if ($null -eq $value -or $value.Value -isnot [bool] -or [bool]$value.Value) { throw $failure }
            return $false
          }

          function Get-RequiredString($object, [string]$property, [string]$failure) {
            $value = $object.PSObject.Properties[$property]
            if ($null -eq $value -or [string]::IsNullOrWhiteSpace([string]$value.Value)) { throw $failure }
            return [string]$value.Value
          }
          
          # Herdr 0.8.2 supported AgentInfo properties: agent, agent_session,
          # agent_status (idle|working|blocked|done|unknown), cwd, display_agent,
          # focused, foreground_cwd, interactive_ready, launch_pending, name,
          # pane_id, revision, screen_detection_skipped, state_change_seq, tab_id,
          # terminal_id, terminal_title, terminal_title_stripped, title, tokens,
          # workspace_id. Do not invent identity/kind/branch/head/visibility/role
          # from AgentInfo. Obtain kind/model/identity from pane process-info and
          # branch/head from git in the bound cwd.  AgentSessionInfo supplies only its
          # documented source/agent/kind/value transport evidence.
          function Get-ExecutorTuple($agent) {
            $name = Live-Value $agent @('name')
            $paneId = Live-Value $agent @('pane_id')
            $workspaceId = Live-Value $agent @('workspace_id')
            $cwd = Live-Value $agent @('cwd')
            $status = Live-Value $agent @('agent_status')
            if ($status -cnotin @('idle','working','blocked','done','unknown')) { throw 'INVALID_EXECUTOR_STATUS' }
            $session = $agent.PSObject.Properties['agent_session']
            if ($null -eq $session -or $null -eq $session.Value) { throw 'LIVE_SESSION_MISSING' }
            $sessionValue = Get-RequiredString $session.Value 'value' 'LIVE_SESSION_VALUE_MISSING'
            $sessionAgent = Get-RequiredString $session.Value 'agent' 'LIVE_SESSION_AGENT_MISSING'
            $sessionSource = Get-RequiredString $session.Value 'source' 'LIVE_SESSION_SOURCE_MISSING'
            $sessionKind = Get-RequiredString $session.Value 'kind' 'LIVE_SESSION_KIND_MISSING'
            if (-not (Test-OrdinalEquals $sessionAgent $name)) { throw 'LIVE_SESSION_AGENT_MISMATCH' }
            if ($sessionKind -cnotin @('id','path')) { throw 'LIVE_SESSION_KIND_INVALID' }
            $focused = Get-RequiredBoolean $agent 'focused' 'LIVE_FOCUS_EVIDENCE_MISSING'
            [void](Get-RequiredTrueBoolean $agent 'interactive_ready' 'LIVE_INTERACTIVE_READY_MISSING_OR_FALSE')
            [void](Get-RequiredFalseBoolean $agent 'launch_pending' 'LIVE_LAUNCH_STATE_MISSING_OR_PENDING')
            $foregroundCwd = Get-RequiredString $agent 'foreground_cwd' 'LIVE_FOREGROUND_CWD_MISSING'
            $terminalId = Get-RequiredString $agent 'terminal_id' 'LIVE_TERMINAL_ID_MISSING'
            if (-not (Test-OrdinalEquals $foregroundCwd $cwd)) { throw 'LIVE_FOREGROUND_CWD_MISMATCH' }
            if (-not $paneId.StartsWith("$workspaceId`:", [System.StringComparison]::Ordinal)) { throw 'PANE_NOT_WORKSPACE_QUALIFIED' }

            # The foreground process is the only model/kind/identity source.  Missing,
            # plural or unbound process evidence is ambiguous and therefore rejected.
            if (-not (Test-Path -LiteralPath $herdr -PathType Leaf)) { throw 'HERDR_EXE_MISSING' }
            $piRaw = (& $herdr 'pane' 'process-info' '--pane' $paneId 2>&1 | Out-String).Trim()
            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($piRaw)) { throw 'HERDR_PROCESS_INFO_READ_FAILED' }
            try { $pi = $piRaw | ConvertFrom-Json } catch { throw 'HERDR_PROCESS_INFO_INVALID_JSON' }
            $processInfo = $pi.result.process_info
            if ($null -eq $processInfo) { throw 'HERDR_PROCESS_INFO_MISSING' }
            $processPane = Get-RequiredString $processInfo 'pane_id' 'HERDR_PROCESS_INFO_PANE_MISSING'
            if (-not (Test-OrdinalEquals $processPane $paneId)) { throw 'HERDR_PROCESS_INFO_PANE_MISMATCH' }
            $fgProcs = @($processInfo.foreground_processes)
            if ($fgProcs.Count -ne 1) { throw 'HERDR_FOREGROUND_PROCESS_ABSENT_OR_AMBIGUOUS' }
            $process = $fgProcs[0]
            $processName = Get-RequiredString $process 'name' 'HERDR_FOREGROUND_PROCESS_NAME_MISSING'
            $processCwd = Get-RequiredString $process 'cwd' 'HERDR_FOREGROUND_PROCESS_CWD_MISSING'
            $processPid = $process.PSObject.Properties['pid']
            if ($null -eq $processPid -or ($processPid.Value -isnot [int] -and $processPid.Value -isnot [int64]) -or [int64]$processPid.Value -le 0) { throw 'HERDR_FOREGROUND_PROCESS_PID_MISSING_OR_INVALID' }
            $argv = @($process.argv)
            if ($argv.Count -eq 0 -or @($argv | Where-Object { [string]::IsNullOrWhiteSpace([string]$_) }).Count -ne 0) { throw 'HERDR_FOREGROUND_ARGV_MISSING_OR_INVALID' }
            $argv0 = Get-RequiredString $process 'argv0' 'HERDR_FOREGROUND_ARGV0_MISSING'
            if (-not (Test-OrdinalEquals $argv0 ([string]$argv[0]))) { throw 'HERDR_FOREGROUND_ARGV0_MISMATCH' }
            if (-not (Test-OrdinalEquals $processCwd $cwd) -or -not (Test-OrdinalEquals $processCwd $foregroundCwd)) { throw 'HERDR_FOREGROUND_PROCESS_CWD_MISMATCH' }
            $modelProof = [string]::Join(' ', [string[]]$argv)
            $modelProofSource = 'herdr_pane_process_info_foreground_argv'
            $executorKind = [IO.Path]::GetFileNameWithoutExtension($argv0).ToLowerInvariant()
            if ([string]::IsNullOrWhiteSpace($executorKind)) { throw 'EXECUTOR_KIND_DERIVATION_FAILED' }
            $executorIdentity = "$sessionSource/$($sessionKind):$sessionValue/$processName/$($processPid.Value)/$modelProofSource"

            # Branch/head proof from git in the bound cwd
            $branch = ''
            $headSha = ''
            if (-not (Test-Path -LiteralPath $cwd -PathType Container)) { throw 'EXECUTOR_CWD_MISSING' }
            $branch = (& git -C $cwd rev-parse --abbrev-ref HEAD 2>&1 | Out-String).Trim()
            if ($LASTEXITCODE -ne 0) { throw 'BRANCH_PROOF_READ_FAILED' }
            $headSha = (& git -C $cwd rev-parse HEAD 2>&1 | Out-String).Trim()
            if ($LASTEXITCODE -ne 0) { throw 'HEAD_PROOF_READ_FAILED' }

            if ([string]::IsNullOrWhiteSpace($modelProof)) { throw 'MODEL_PROOF_MISSING' }
            if ($branch -cnotmatch '^[a-zA-Z0-9._/\-]+$') { throw 'BRANCH_PROOF_MISSING_OR_INVALID' }
            if ($headSha -cnotmatch '^[0-9a-f]{40}$') { throw 'HEAD_PROOF_MISSING_OR_INVALID' }

            $tuple = @{
              executor_identity=$executorIdentity
              executor_session_or_instance=$sessionValue
              executor_kind=$executorKind
              executor_name=$name
              executor_pane=$paneId
              executor_workspace=$workspaceId
              executor_cwd=$cwd
              executor_branch=$branch
              executor_head=$headSha
              executor_status=$status
              executor_visibility=if ($focused) { 'focused' } else { 'visible' }
              executor_role='WORKER'
              executor_model_proof_source=$modelProofSource
              executor_model_proof=$modelProof
            }
            return $tuple
          }
          
          function Select-Executor($agents, $expected) {
            # Require both transport name and pane to be unique in the whole inventory.
            $byName = @($agents | Where-Object { Test-OrdinalEquals ([string]$_.name) $expected['executor_name'] })
            $byPane = @($agents | Where-Object { Test-OrdinalEquals ([string]$_.pane_id) $expected['executor_pane'] })
            if ($byName.Count -ne 1 -or $byPane.Count -ne 1) { throw 'EXECUTOR_ABSENT_OR_AMBIGUOUS' }
            $tuple = Get-ExecutorTuple $byName[0]
            foreach ($key in @(Tuple-Keys) + @('executor_role')) {
              $value = if ((Test-OrdinalEquals $key 'executor_role') -and $expected.ContainsKey('worker_role')) { $expected['worker_role'] } else { $expected[$key] }
              Require-Values $tuple @{ $key=$value }
            }
            return $tuple
          }
          
          function Invoke-HerdrJson([string[]]$arguments) {
            if (-not (Test-Path -LiteralPath $herdr -PathType Leaf)) { throw 'HERDR_EXE_MISSING' }
            $raw = (& $herdr @arguments 2>&1 | Out-String).Trim()
            if ($LASTEXITCODE -ne 0) { throw 'HERDR_READ_FAILED' }
            $result = $raw | ConvertFrom-Json
            if ($null -eq $result.result.agents) { throw 'HERDR_INVENTORY_UNAVAILABLE' }
            return $result
          }
          
          function Make-Binding($dispatch, $df, $card, $cf, $executor) {
            $binding = @{
              repo=$repo; issue='162'; source_dispatch_comment=[string]$dispatch.id; source_card_receipt=[string]$card.id
              source_consumer_acceptance=$cf['source_consumer_acceptance']; executor_role='WORKER'
            }
            foreach ($key in @('card_id','control_generation','dispatch_idempotency_key','launcher_head_sha','worker_base_sha',
              'consumer_workflow_path_exact','consumer_workflow_blob_exact','target_ref_exact','target_ref_head_exact')) { $binding[$key] = $cf[$key] }
            foreach ($key in @(Tuple-Keys)) { $binding[$key] = $executor[$key] }
            return $binding
          }
          
          function Logical-Key($binding) {
            # Length-prefixed canonical full tuple; dispatch COMMENT is excluded so two
            # comment IDs carrying one logical event cannot acquire separate reservations.
            $parts = foreach ($key in @($binding.Keys | Sort-Object -CaseSensitive)) {
              if (Test-OrdinalEquals $key 'source_dispatch_comment') { continue }
              $value = [string]$binding[$key]
              if ([string]::IsNullOrWhiteSpace($value)) { throw 'EMPTY_RESERVATION_TUPLE' }
              "$($key.Length):$key$($value.Length):$value"
            }
            return [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes(($parts -join '|')))).ToLowerInvariant()
          }
          
          function Receipt-Body([string]$protocol, $fields) {
            return (@($protocol) + @($fields.Keys | Sort-Object -CaseSensitive | ForEach-Object { "$($_): $($fields[$_])" })) -join "`n"
          }
          
          function Publish([string]$body) {
            # One POST only. A timeout, lost response or failed exact GET is never retried.
            $created = Invoke-RestMethod "$api/issues/162/comments" -Headers $headers -Method Post -Body (@{body=$body} | ConvertTo-Json -Compress) -ContentType 'application/json' -TimeoutSec 30
            $fresh = Read-Exact $created 162 'WORKFLOW'
            if (-not (Test-OrdinalEquals ([string]$fresh.body) $body)) { throw 'PUBLISHED_RECEIPT_READBACK_MISMATCH_NO_BLIND_RETRY' }
            return $fresh
          }
          
          function Validate-Reservation($comment, $binding, [string]$runId, [string]$runAttempt) {
            Assert-Comment $comment 162 'WORKFLOW'
            $expected = @{} + $binding
            $expected += @{ state='RESERVED_NO_RETRY'; recorded_by_role='G13_HANDOFF_CONSUMER_WORKFLOW'; logical_key=(Logical-Key $binding)
              workflow_run_id=$runId; workflow_run_attempt=$runAttempt; physical_prompt_count='0'; supersedes='NONE'; readback_verified='true' }
            $f = Read-Record $comment.body 'GBB_G13_HANDOFF_AUTOMATION_RESERVATION_V1' @($expected.Keys)
            Require-Values $f $expected
            return ,$f
          }
          
          function Assert-NoPriorAttempt($rows, $binding, [string]$ownReservationId = '') {
            foreach ($row in $rows) {
              $first = ([string]$row.body -split "\r?\n|\n",2)[0]
              if ($first.Trim().TrimStart([char]0xFEFF) -imatch '^GBB_G13_HANDOFF_AUTOMATION_(RESERVATION|LIVE_CONSUMER_OBSERVES|CONSUMED_STARTED|HANDOFF_TEST_RESULT|CONSUMER_BLOCKED)_V') {
                if (Test-OrdinalEquals ([string]$row.id) $ownReservationId) { continue }
                # A prior attempt with an incomplete/unknown schema is uncertainty, not an
                # ignorable non-match. This single-card consumer cannot inherit a send.
                throw 'NO_BLIND_RETRY_PRIOR_DURABLE_ATTEMPT'
              }
            }
          }
          
          function Validate-WorkerReceipt($comment, [string]$kind, $binding, $reservation, $consumed = $null) {
            Assert-Comment $comment 162
            $expected = @{} + $binding
            $expected += @{ recorded_by_role='WORKER'; source_reservation_receipt=[string]$reservation.id; supersedes='NONE'; readback_verified='true' }
            if (Test-OrdinalEquals $kind 'CONSUMED') {
              $protocol = 'GBB_G13_HANDOFF_AUTOMATION_CONSUMED_STARTED_V1'
              $expected['state'] = 'CONSUMED_STARTED'
              $expected['executor_status'] = 'working'
              Assert-Order $reservation $comment
            } elseif ((Test-OrdinalEquals $kind 'TERMINAL') -and $null -ne $consumed) {
              $protocol = 'GBB_G13_HANDOFF_AUTOMATION_HANDOFF_TEST_RESULT_V1'
              $expected['state'] = 'TERMINAL_RESULT'
              $expected['source_consumed_started_receipt'] = [string]$consumed.id
              # Decision and status are validated as a pair below, never loosely regexed.
              $expected['decision'] = 'PASS'
              $expected['executor_status'] = 'done'
              $expected['physical_prompt_count'] = '1'
              $expected['second_prompt_count'] = '0'
              $expected['blind_retry'] = 'false'
              Assert-Order $consumed $comment
            } else { throw 'UNKNOWN_WORKER_RECEIPT_SCHEMA' }
            $f = Read-Record $comment.body $protocol @($expected.Keys)
            if (Test-OrdinalEquals $kind 'TERMINAL') {
              if ($f['decision'] -cnotin @('PASS','BLOCKED','CONTROL_REQUIRED')) { throw 'INVALID_TERMINAL_DECISION' }
              $expected['decision'] = $f['decision']
              $expected['executor_status'] = if (Test-OrdinalEquals $f['decision'] 'PASS') { 'done' } else { 'blocked' }
            }
            Require-Values $f $expected
            return ,$f
          }
          
          function Assert-AuthorityHistory($rows, $card, $acceptance) {
            foreach ($row in $rows) {
              $first = ([string]$row.body -split "\r?\n|\n",2)[0]
              if ($first.Trim().TrimStart([char]0xFEFF) -imatch '^GBB_G13_HANDOFF_AUTOMATION_TEST_CARD_V' -and [int64]$row.id -gt [int64]$card.id) { throw 'CARD_SUPERSEDED' }
              if ($first.Trim().TrimStart([char]0xFEFF) -imatch '^GBB_G13_HANDOFF_AUTOMATION_TEST_ACCEPTANCE_V' -and [int64]$row.id -gt [int64]$acceptance.id) { throw 'ACCEPTANCE_SUPERSEDED' }
            }
          }
          
          function Read-FinalAuthority($dispatch, $card, $acceptance, $control) {
            $freshControl = Read-Control
            Assert-Unchanged $control.switch $freshControl.switch
            Assert-Unchanged $control.start $freshControl.start
            $freshDispatch = Read-Exact $dispatch 162
            $df = Validate-Dispatch $freshDispatch
            $freshCard = Read-Exact $card 162
            $cf = Validate-Card $freshCard $df
            $freshAcceptance = Read-Exact $acceptance 162
            $af = Validate-Acceptance $freshAcceptance $cf $freshControl
            Assert-Order $freshAcceptance $freshCard
            Assert-Order $freshCard $freshDispatch
            $ref = Invoke-RestMethod "$api/git/ref/heads/review-base/gbb-gh-01" -Headers $headers -Method Get -TimeoutSec 30
            $blob = Invoke-RestMethod "$api/contents/$($workflowPath)?ref=$($df['launcher_head_sha'])" -Headers $headers -Method Get -TimeoutSec 30
            if (-not (Test-OrdinalEquals ([string]$ref.object.sha) $cf['target_ref_head_exact']) -or -not (Test-OrdinalEquals ([string]$blob.sha) $cf['consumer_workflow_blob_exact']) -or -not (Test-OrdinalEquals ([string]$env:GITHUB_SHA) $df['launcher_head_sha'])) { throw 'FINAL_HEAD_OR_BLOB_STALE' }
            $history = Get-AllComments 162
            Assert-AuthorityHistory $history.comments $freshCard $freshAcceptance
            return $history
          }
          
          function Read-ReceiptPair($rows, $binding, $reservation) {
            foreach ($row in $rows) {
              $first = ([string]$row.body -split "\r?\n|\n",2)[0]
              if ($first.Trim().TrimStart([char]0xFEFF) -imatch '^GBB_G13_HANDOFF_AUTOMATION_(LIVE_CONSUMER_OBSERVES|CONSUMER_BLOCKED)_V') { throw 'NO_BLIND_RETRY_CONFLICTING_ATTEMPT' }
            }
            $consumedRows = @(Get-Family $rows 'GBB_G13_HANDOFF_AUTOMATION_CONSUMED_STARTED_V')
            $terminalRows = @(Get-Family $rows 'GBB_G13_HANDOFF_AUTOMATION_HANDOFF_TEST_RESULT_V')
            $reservations = @(Get-Family $rows 'GBB_G13_HANDOFF_AUTOMATION_RESERVATION_V')
            if ($reservations.Count -ne 1 -or -not (Test-OrdinalEquals ([string]$reservations[0].id) ([string]$reservation.id))) { throw 'NO_BLIND_RETRY_RESERVATION_CONFLICT' }
            $freshReservation = Read-Exact $reservations[0] 162 'WORKFLOW'
            Assert-Unchanged $reservation $freshReservation
            [void](Validate-Reservation $freshReservation $binding $env:GITHUB_RUN_ID $env:GITHUB_RUN_ATTEMPT)
            if ($consumedRows.Count -gt 1 -or $terminalRows.Count -gt 1) { throw 'RECEIPT_DUPLICATE_OR_SUPERSEDED' }
            $consumed = $null
            $terminal = $null
            if ($consumedRows.Count -eq 1) {
              [void](Validate-WorkerReceipt $consumedRows[0] 'CONSUMED' $binding $reservation)
              $consumed = Read-Exact $consumedRows[0] 162
              [void](Validate-WorkerReceipt $consumed 'CONSUMED' $binding $reservation)
            }
            if ($terminalRows.Count -eq 1) {
              if ($null -eq $consumed) { throw 'TERMINAL_WITHOUT_CONSUMED' }
              [void](Validate-WorkerReceipt $terminalRows[0] 'TERMINAL' $binding $reservation $consumed)
              $terminal = Read-Exact $terminalRows[0] 162
              [void](Validate-WorkerReceipt $terminal 'TERMINAL' $binding $reservation $consumed)
            }
            return @{ consumed=$consumed; terminal=$terminal }
          }
          
          [void](Assert-OrdinalRegressionCases)

          # Main: every tuple assignment and validation precedes the final inventory/send.
          # Global workflow concurrency serializes different dispatch comments too.
          # Reservation is a permanent no-retry tombstone across failures/restarts.
          try {
            $event = Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
            if ([int]$event.issue.number -ne 162) { throw 'EVENT_ISSUE_MISMATCH' }
            $dispatch = Get-Comment ([string]$event.comment.id)
            if (-not (Test-OrdinalEquals ([string]$dispatch.body) ([string]$event.comment.body))) { throw 'DISPATCH_EDITED_SINCE_EVENT' }
            $df = Validate-Dispatch $dispatch
            $control = Read-Control
            $card = Get-Comment $df['card_receipt']
            $cf = Validate-Card $card $df
            $acceptance = Get-Comment $cf['source_consumer_acceptance']
            $af = Validate-Acceptance $acceptance $cf $control
            Assert-Order $acceptance $card
            Assert-Order $card $dispatch
            $inventory = Invoke-HerdrJson @('agent','list')
            $admittedExecutor = Select-Executor $inventory.result.agents $af
            $binding = Make-Binding $dispatch $df $card $cf $admittedExecutor
            $history = Read-FinalAuthority $dispatch $card $acceptance $control
            Assert-NoPriorAttempt $history.comments $binding
            if ($env:GITHUB_RUN_ID -cnotmatch '^[1-9][0-9]*$' -or -not (Test-OrdinalEquals ([string]$env:GITHUB_RUN_ATTEMPT) '1')) { throw 'NO_BLIND_RETRY_RERUN_OR_RUN_ID_MISSING' }
            $reservedFields = @{} + $binding
            $reservedFields += @{ state='RESERVED_NO_RETRY'; recorded_by_role='G13_HANDOFF_CONSUMER_WORKFLOW'; logical_key=(Logical-Key $binding)
              workflow_run_id=$env:GITHUB_RUN_ID; workflow_run_attempt=$env:GITHUB_RUN_ATTEMPT; physical_prompt_count='0'; supersedes='NONE'; readback_verified='true' }
            $reservation = Publish (Receipt-Body 'GBB_G13_HANDOFF_AUTOMATION_RESERVATION_V1' $reservedFields)
            [void](Validate-Reservation $reservation $binding $env:GITHUB_RUN_ID $env:GITHUB_RUN_ATTEMPT)
            Assert-Order $dispatch $reservation
            $pointer = [string]$dispatch.body
          
            # Complete card/acceptance/control/ref/blob revalidation after reservation.
            $finalHistory = Read-FinalAuthority $dispatch $card $acceptance $control
            Assert-NoPriorAttempt $finalHistory.comments $binding ([string]$reservation.id)
            $owned = @(Get-Family $finalHistory.comments 'GBB_G13_HANDOFF_AUTOMATION_RESERVATION_V')
            if ($owned.Count -ne 1 -or -not (Test-OrdinalEquals ([string]$owned[0].id) ([string]$reservation.id))) { throw 'NO_BLIND_RETRY_RESERVATION_NOT_EXCLUSIVE' }
            $ownedReadback = Read-Exact $owned[0] 162 'WORKFLOW'
            Assert-Unchanged $reservation $ownedReadback
            [void](Validate-Reservation $ownedReadback $binding $env:GITHUB_RUN_ID $env:GITHUB_RUN_ATTEMPT)
            $finalInventory = Invoke-HerdrJson @('agent','list')
            $finalExecutor = Select-Executor $finalInventory.result.agents $admittedExecutor
            Require-Values $finalExecutor $admittedExecutor
            # Transport resolves the exact workspace-qualified pane, never the name alone.
            # There are no network calls or deferred tuple assignments between here/send.
            $promptOutput = (& $herdr agent prompt $finalExecutor['executor_pane'] $pointer 2>&1 | Out-String)
            if ($LASTEXITCODE -ne 0) { throw 'UNCERTAIN_SEND_NO_BLIND_RETRY' }
          
            $pair = $null
            for ($attempt = 0; $attempt -lt 80; $attempt++) {
              Start-Sleep -Seconds 3
              $rows = Read-FinalAuthority $dispatch $card $acceptance $control
              $pair = Read-ReceiptPair $rows.comments $binding $reservation
              if ($null -ne $pair.terminal) { break }
            }
            if ($null -eq $pair -or $null -eq $pair.terminal) { throw 'RECEIPT_TIMEOUT_NO_BLIND_RETRY' }
            # Re-fetch complete histories and both full receipts once more after polling:
            # a terminal observed once never bypasses order, edit or supersession checks.
            $lastRows = Read-FinalAuthority $dispatch $card $acceptance $control
            $finalPair = Read-ReceiptPair $lastRows.comments $binding $reservation
            if ($null -eq $finalPair.consumed -or $null -eq $finalPair.terminal) { throw 'RECEIPT_DISAPPEARED_NO_BLIND_RETRY' }
            Assert-Unchanged $pair.consumed $finalPair.consumed
            Assert-Unchanged $pair.terminal $finalPair.terminal
            Write-Output "HANDOFF_TEST_TERMINAL_OBSERVED receipt=$($finalPair.terminal.id); Control acceptance remains separate."
          } catch {
            # No second publication/physical prompt in a catch: ambiguous POST/send cannot
            # be repaired by retry. Any existing reservation remains durable and occupied.
            Write-Output "CONTROL_REQUIRED NO_BLIND_RETRY: $($_.Exception.Message)"
            exit 1
          }
