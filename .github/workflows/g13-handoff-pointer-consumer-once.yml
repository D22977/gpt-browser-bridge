name: G13 Pointer-only Handoff Consumer Once

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: g13-handoff-pointer-${{ github.event.issue.number }}-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  consume:
    if: >-
      github.event.issue.number == 162 &&
      github.event.comment.user.login == 'D22977' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, 'GBB_G13_HANDOFF_POINTER_DISPATCH_REQUEST_V1')
    runs-on: [self-hosted, Windows, GBB-REVIEWER]
    timeout-minutes: 12
    defaults:
      run:
        shell: pwsh -NoProfile -File {0}
    steps:
      - name: Rehydrate card, admit exact consumer, and forward one pointer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = 'D22977/gpt-browser-bridge'
          $issue = 162
          $workflowPath = '.github/workflows/g13-handoff-pointer-consumer-once.yml'
          $herdr = 'C:\Users\Lupun\AppData\Local\Programs\Herdr\bin\herdr.exe'
          $api = "https://api.github.com/repos/$repo"
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            'User-Agent' = 'g13-pointer-only-handoff-consumer'
            Accept = 'application/vnd.github+json'
          }

          function Get-Comment([string]$id) {
            return Invoke-RestMethod "$api/issues/comments/$id" -Headers $headers -Method Get -TimeoutSec 30
          }

          function Get-AllComments([int]$number, [int]$maxPages = 100) {
            $all = @()
            for ($page = 1; $page -le $maxPages; $page++) {
              $rows = @(Invoke-RestMethod "$api/issues/$number/comments?per_page=100&page=$page" -Headers $headers -Method Get -TimeoutSec 30)
              $all += $rows
              if ($rows.Count -lt 100) {
                return @{ comments = @($all); eof = $true; pages = $page }
              }
            }
            throw "INCOMPLETE_DURABLE_HISTORY_issue_${number}_pages_${maxPages}"
          }

          function Get-Field([string]$body, [string]$name) {
            $pattern = '(?m)^' + [regex]::Escape($name) + ':\s+(\S[^\r\n]*)$'
            $matches = [regex]::Matches($body, $pattern)
            if ($matches.Count -eq 0) { throw "MISSING_FIELD_$name" }
            if ($matches.Count -gt 1) { throw "DUPLICATE_FIELD_$name" }
            return $matches[0].Groups[1].Value
          }

          function Require-FirstLine([string]$body, [string]$protocol, [string]$label) {
            $nlIdx = $body.IndexOfAny(@([char]13, [char]10))
            $first = if ($nlIdx -ge 0) { $body.Substring(0, $nlIdx) } else { $body }
            if ($first.Length -ne $protocol.Length) { throw "WRONG_${label}_PROTOCOL_LENGTH" }
            for ($ci = 0; $ci -lt $protocol.Length; $ci++) {
              if ([char]$first[$ci] -ne [char]$protocol[$ci]) { throw "WRONG_${label}_PROTOCOL_ORDINAL_$ci" }
            }
          }

          function Require-Exact-FirstLine([string]$body, [string]$protocol, [string]$label) {
            Require-FirstLine $body $protocol $label
            $firstChar = [int][char]$body[0]
            if ($firstChar -eq 0xFEFF) { throw "BOM_DETECTED_IN_${label}" }
          }

          function Require-Sha([string]$value, [string]$label) {
            if ($value -notmatch '^[0-9a-f]{40}$') { throw "MALFORMED_$label" }
          }

          function Publish([string]$body) {
            $payload = @{ body = $body } | ConvertTo-Json -Compress
            $created = Invoke-RestMethod "$api/issues/$issue/comments" -Headers $headers -Method Post -Body $payload -ContentType 'application/json' -TimeoutSec 30
            $readback = Get-Comment ([string]$created.id)
            if ([string]$readback.body -cne $body) { throw 'PUBLISHED_RECEIPT_READBACK_MISMATCH' }
            return [string]$created.id
          }

          function Publish-Blocker([string]$classification, [string]$detail, [string]$dispatchId, [string]$cardReceipt, [string]$cardId, [string]$idempotency, [int]$promptCount) {
            $body = @(
              'GBB_G13_HANDOFF_AUTOMATION_CONSUMER_BLOCKED_V1'
              'state: BLOCKED'
              "classification: $classification"
              'recorded_by_role: G13_HANDOFF_CONSUMER_WORKFLOW'
              'control_generation: 013'
              "source_dispatch_comment: $dispatchId"
              "source_card_receipt: $cardReceipt"
              "card_id: $cardId"
              "dispatch_idempotency_key: $idempotency"
              "detail: $detail"
              "runner_name: $env:RUNNER_NAME"
              "runner_user: $([System.Security.Principal.WindowsIdentity]::GetCurrent().Name)"
              "workflow_run_id: $env:GITHUB_RUN_ID"
              "consumer_workflow_path_exact: $workflowPath"
              "launcher_head_sha_observed: $env:GITHUB_SHA"
              "physical_prompt_count: $promptCount"
              'second_prompt_count: 0'
              'blind_retry: false'
              'handoff_dispatch_count: 1'
              'runtime_run_count: 0'
              'herdr_mutation_count: 0'
              'product_mutation_count: 0'
              'file_mutation_count: 0'
              'readback_verified: true'
            ) -join "`n"
            [void](Publish $body)
          }

          function Invoke-HerdrJson([string[]]$arguments) {
            if (-not (Test-Path -LiteralPath $herdr -PathType Leaf)) { throw 'HERDR_EXE_MISSING' }
            $raw = (& $herdr @arguments 2>&1 | Out-String).Trim()
            $exit = $LASTEXITCODE
            if ($exit -ne 0) { throw "HERDR_READ_FAILED_$exit" }
            try { return ($raw | ConvertFrom-Json) } catch { throw 'HERDR_JSON_INVALID' }
          }

          $event = Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
          if ([int]$event.issue.number -ne $issue) { throw 'ISSUE_NUMBER_MISMATCH' }
          if ([string]$event.comment.user.login -cne 'D22977' -or [string]$event.comment.author_association -cne 'OWNER') { throw 'DISPATCH_AUTHOR_NOT_OWNER' }
          $dispatchId = [string]$event.comment.id
          $dispatchBody = [string]$event.comment.body
          Require-Exact-FirstLine $dispatchBody 'GBB_G13_HANDOFF_POINTER_DISPATCH_REQUEST_V1' 'DISPATCH'

          $allowedDispatchKeys = @('card_receipt', 'card_id', 'control_generation', 'launcher_head_sha', 'worker_base_sha', 'dispatch_idempotency_key')
          $dispatchLines = $dispatchBody -split "`r?`n"
          $seenDispatchKeys = @{}
          for ($i = 1; $i -lt $dispatchLines.Count; $i++) {
            $line = $dispatchLines[$i].Trim()
            if ([string]::IsNullOrWhiteSpace($line)) { continue }
            if ($line -notmatch '^(?<key>[a-z0-9_]+):\s*(?<value>.+)$') { throw 'DISPATCH_BODY_NOT_POINTER_ONLY' }
            if ($allowedDispatchKeys -notcontains $Matches.key) { throw 'DISPATCH_BODY_CONTAINS_TASK_BODY' }
            if ($seenDispatchKeys.ContainsKey($Matches.key)) { throw "DISPATCH_DUPLICATE_KEY_$($Matches.key)" }
            $seenDispatchKeys[$Matches.key] = $true
          }

          $cardReceipt = Get-Field $dispatchBody 'card_receipt'
          $cardId = Get-Field $dispatchBody 'card_id'
          $generation = Get-Field $dispatchBody 'control_generation'
          $launcherHead = Get-Field $dispatchBody 'launcher_head_sha'
          $workerBase = Get-Field $dispatchBody 'worker_base_sha'
          $idempotency = Get-Field $dispatchBody 'dispatch_idempotency_key'
          Require-Sha $launcherHead 'LAUNCHER_HEAD'
          Require-Sha $workerBase 'WORKER_BASE'
          if ($generation -cne '013') { throw 'CONTROL_GENERATION_MISMATCH' }
          if ($idempotency -cne 'GBB-G13-HANDOFF-AUTOMATION-ADVERSARIAL-TEST-01-DISPATCH-01') { throw 'DISPATCH_IDEMPOTENCY_MISMATCH' }
          if ($cardId -cne 'GBB-G13-HANDOFF-AUTOMATION-ADVERSARIAL-TEST-01') { throw 'DISPATCH_CARD_ID_NOT_EXACT_ADVERSARIAL_TEST_01' }

          $card = Get-Comment $cardReceipt
          $cardBody = [string]$card.body
          if ([string]$card.issue_url -notmatch '/issues/162$') { throw 'CARD_ISSUE_MISMATCH' }
          if ([string]$card.user.login -cne 'D22977' -or [string]$card.author_association -cne 'OWNER') { throw 'CARD_AUTHOR_NOT_OWNER' }
          Require-Exact-FirstLine $cardBody 'GBB_G13_HANDOFF_AUTOMATION_TEST_CARD_V1' 'CARD'
          $allowedCardKeys = @('state','card_protocol','card_id','control_generation','source_consumer_acceptance','target_ref_exact','target_ref_head_exact','launcher_head_sha','worker_base_sha','executor_role','requested_action','allowed_actions','forbidden_actions','logical_handoff_count_max','dispatch_idempotency_key','readback_verified','consumer_workflow_path_exact','consumer_workflow_blob_exact','target_agent_name','target_pane','target_cwd_exact','target_agent_status_required')
          $cardLines = $cardBody -split "`r?`n"
          for ($ci = 1; $ci -lt $cardLines.Count; $ci++) {
            $cline = $cardLines[$ci].Trim()
            if ([string]::IsNullOrWhiteSpace($cline)) { continue }
            if ($cline -notmatch '^(?<ckey>[a-z0-9_]+):\s*(?<cval>.+)$') { throw "CARD_BODY_NOT_POINTER_ONLY_LINE_$ci" }
            if ($allowedCardKeys -notcontains $Matches.ckey) { throw "CARD_UNKNOWN_FIELD_$($Matches.ckey)" }
          }
          $cardState = Get-Field $cardBody 'state'
          $cardProtocol = Get-Field $cardBody 'card_protocol'
          $cardIdFromCard = Get-Field $cardBody 'card_id'
          $cardGeneration = Get-Field $cardBody 'control_generation'
          $sourceAcceptance = Get-Field $cardBody 'source_consumer_acceptance'
          $targetRef = Get-Field $cardBody 'target_ref_exact'
          $targetHead = Get-Field $cardBody 'target_ref_head_exact'
          $cardLauncher = Get-Field $cardBody 'launcher_head_sha'
          $cardWorkerBase = Get-Field $cardBody 'worker_base_sha'
          $executorRole = Get-Field $cardBody 'executor_role'
          $requestedAction = Get-Field $cardBody 'requested_action'
          $allowedActions = Get-Field $cardBody 'allowed_actions'
          $forbiddenActions = Get-Field $cardBody 'forbidden_actions'
          $logicalMax = Get-Field $cardBody 'logical_handoff_count_max'
          $cardIdempotency = Get-Field $cardBody 'dispatch_idempotency_key'
          $cardReadback = Get-Field $cardBody 'readback_verified'
          $consumerPath = Get-Field $cardBody 'consumer_workflow_path_exact'
          $consumerBlob = Get-Field $cardBody 'consumer_workflow_blob_exact'
          $targetAgentName = Get-Field $cardBody 'target_agent_name'
          $targetPane = Get-Field $cardBody 'target_pane'
          $targetCwd = Get-Field $cardBody 'target_cwd_exact'
          $targetStatus = Get-Field $cardBody 'target_agent_status_required'

          Require-Sha $targetHead 'TARGET_HEAD'
          Require-Sha $cardLauncher 'CARD_LAUNCHER_HEAD'
          Require-Sha $cardWorkerBase 'CARD_WORKER_BASE'
          if ($cardState -cne 'READY_FOR_POINTER_DISPATCH') { throw 'CARD_NOT_READY_FOR_POINTER_DISPATCH' }
          if ($cardProtocol -cne 'GBB_G13_HANDOFF_AUTOMATION_TEST_CARD_V1') { throw 'CARD_PROTOCOL_MISMATCH' }
          if ($cardIdFromCard -cne 'GBB-G13-HANDOFF-AUTOMATION-ADVERSARIAL-TEST-01') { throw 'CARD_ID_NOT_EXACT_ADVERSARIAL_TEST_01' }
          if ($cardGeneration -cne '013') { throw 'CARD_GENERATION_MISMATCH' }
          if ($sourceAcceptance -notmatch '^\d+$') { throw 'CARD_ACCEPTANCE_INVALID' }
          if ($targetRef -cne 'refs/heads/review-base/gbb-gh-01') { throw 'CARD_TARGET_REF_MISMATCH' }
          if ($targetHead -cne $env:GITHUB_SHA) { throw 'CARD_HEAD_BINDING_MISMATCH' }
          if ($cardLauncher -cne $launcherHead) { throw 'CARD_LAUNCHER_MISMATCH' }
          if ($cardWorkerBase -cne $workerBase) { throw 'CARD_WORKER_BASE_MISMATCH' }
          if ($requestedAction -cne 'SYNTHETIC_POINTER_ONLY_HANDOFF_CANARY') { throw 'CARD_ACTION_INVALID' }
          if ($executorRole -cne 'LOCAL_EXECUTOR') { throw 'CARD_EXECUTOR_ROLE_INVALID' }
          if ($logicalMax -ne '1') { throw 'CARD_LOGICAL_MAX_INVALID' }
          if ($cardIdempotency -cne $idempotency) { throw 'CARD_IDEMPOTENCY_MISMATCH' }
          if ($cardReadback -cne 'true') { throw 'CARD_READBACK_INVALID' }
          if ($consumerPath -cne $workflowPath) { throw 'CARD_CONSUMER_PATH_INVALID' }
          if ($consumerBlob -notmatch '^[0-9a-f]{40}$') { throw 'CARD_CONSUMER_BLOB_INVALID' }
          if ([string]::IsNullOrWhiteSpace($targetAgentName)) { throw 'CARD_TARGET_AGENT_NAME_MISSING' }
          if ([string]::IsNullOrWhiteSpace($targetPane)) { throw 'CARD_TARGET_PANE_MISSING' }
          if ([string]::IsNullOrWhiteSpace($targetCwd)) { throw 'CARD_TARGET_CWD_MISSING' }
          if ($targetStatus -notin @('idle', 'done')) { throw 'CARD_TARGET_STATUS_INVALID' }
          if ($allowedActions -cne 'GITHUB_READBACK_AND_RECEIPTS_ONLY') { throw 'CARD_ALLOWED_ACTIONS_INVALID' }
          $expectedForbidden = 'PRODUCT_MUTATION,SECOND_RUN,USER_RELAY,MERGE,RELEASE,DEPLOYMENT,WAKE'
          if ($forbiddenActions -cne $expectedForbidden) { throw 'CARD_FORBIDDEN_ACTIONS_INVALID' }

          $acceptanceComment = Get-Comment $sourceAcceptance
          $acceptanceBody = [string]$acceptanceComment.body
          if ([string]$acceptanceComment.issue_url -notmatch '/issues/162$') { throw 'SOURCE_ACCEPTANCE_ISSUE_MISMATCH' }
          if ([string]$acceptanceComment.user.login -cne 'D22977') { throw 'SOURCE_ACCEPTANCE_AUTHOR_INVALID' }
          if ([string]$acceptanceComment.author_association -cne 'OWNER') { throw 'SOURCE_ACCEPTANCE_ASSOCIATION_INVALID' }
          $acceptanceFirstLine = (($acceptanceBody -split "`r?`n")[0])
          $acceptanceFirstChar = [int][char]$acceptanceFirstLine[0]
          if ($acceptanceFirstChar -eq 0xFEFF) { throw 'BOM_DETECTED_IN_ACCEPTANCE' }
          if ($acceptanceFirstLine -cne 'GBB_G13_HANDOFF_AUTOMATION_TEST_ACCEPTANCE_V1') { throw 'SOURCE_ACCEPTANCE_PROTOCOL_NOT_EXACT' }
          if ($acceptanceBody -notmatch '(?m)^recorded_by_role:\s*CHATGPT_WEB_CONTROL\s*$') { throw 'SOURCE_ACCEPTANCE_RECORDED_BY_ROLE_INVALID' }
          if ($acceptanceBody -notmatch '(?m)^state:\s*PASS\s*$') { throw 'SOURCE_ACCEPTANCE_STATE_INVALID' }
          if ($acceptanceBody -notmatch '(?m)^card_id:\s*GBB-G13-HANDOFF-AUTOMATION-ADVERSARIAL-TEST-01\s*$') { throw 'SOURCE_ACCEPTANCE_CARD_ID_MISMATCH' }
          if ($acceptanceBody -notmatch '(?m)^control_generation:\s*013\s*$') { throw 'SOURCE_ACCEPTANCE_GENERATION_MISMATCH' }
          if ($acceptanceBody -notmatch '(?m)^target_ref_exact:\s*refs/heads/review-base/gbb-gh-01\s*$') { throw 'SOURCE_ACCEPTANCE_TARGET_REF_MISMATCH' }
          if ($acceptanceBody -notmatch '(?m)^target_ref_head_exact:\s*[0-9a-f]{40}\s*$') { throw 'SOURCE_ACCEPTANCE_TARGET_HEAD_MISMATCH' }
          if ($acceptanceBody -notmatch '(?m)^target_workflow_blob:\s*[0-9a-f]{40}\s*$') { throw 'SOURCE_ACCEPTANCE_WORKFLOW_BLOB_MISMATCH' }
          if ($acceptanceBody -notmatch '(?m)^executor_role:\s*LOCAL_EXECUTOR\s*$') { throw 'SOURCE_ACCEPTANCE_EXECUTOR_ROLE_MISMATCH' }
          if ($acceptanceBody -notmatch '(?m)^card_id:\s*GBB-G13-HANDOFF-AUTOMATION-ADVERSARIAL-TEST-01\s*$') { throw 'SOURCE_ACCEPTANCE_CARD_ID_MISSING' }
          $hasRejected = $acceptanceBody -match '(?m)^state:\s*REJECTED\s*$'
          if ($hasRejected) { throw 'SOURCE_ACCEPTANCE_CONFLICTING_PASS_AND_REJECTED' }
          $acceptanceStateLines = @($acceptanceBody -split "`r?`n" | Where-Object { $_ -match '^state:\s*' })
          if ($acceptanceStateLines.Count -ne 1) { throw 'SOURCE_ACCEPTANCE_DUPLICATE_STATE' }

          $targetRefObject = Invoke-RestMethod "$api/git/ref/heads/review-base/gbb-gh-01" -Headers $headers -Method Get -TimeoutSec 30
          if ([string]$targetRefObject.object.sha -cne $targetHead) { throw 'TARGET_REF_HEAD_STALE' }
          $workflowObject = Invoke-RestMethod "$api/contents/${workflowPath}?ref=$env:GITHUB_SHA" -Headers $headers -Method Get -TimeoutSec 30
          if ([string]$workflowObject.sha -cne $consumerBlob) { throw 'CONSUMER_WORKFLOW_BLOB_MISMATCH' }
          if ([string]$env:GITHUB_SHA -cne $launcherHead) { throw 'LAUNCHER_HEAD_MISMATCH' }

          $issue88Result = Get-AllComments 88
          $issue88 = $issue88Result.comments
          $issue88Eof = $issue88Result.eof
          if (-not $issue88Eof) { throw 'INCOMPLETE_DURABLE_HISTORY_issue_88' }
          $allSwitches = @($issue88 | Where-Object {
            [string]$_.user.login -ceq 'D22977' -and
            [string]$_.author_association -ceq 'OWNER' -and
            [string]$_.body -match '(?m)^CONTROL_GENERATION_SWITCH_V1\s*$' -and
            [string]$_.body -match '(?m)^state:\s*SWITCH_COMMITTED\s*$'
          })
          if ($allSwitches.Count -eq 0) { throw 'NO_COMMITTED_SWITCH_FOUND' }
          $switch = ($allSwitches | Sort-Object { [int64]$_.id } | Select-Object -Last 1)
          Require-Exact-FirstLine ([string]$switch.body) 'CONTROL_GENERATION_SWITCH_V1' 'SWITCH'
          if ([string]$switch.body -notmatch '(?m)^new_generation:\s*013\s*$') { throw 'SWITCH_NOT_GEN013' }
          if ([string]$switch.body -notmatch '(?m)^new_status:\s*ACTIVE\s*$') { throw 'SWITCH_NOT_ACTIVE' }
          if ([string]$switch.body -notmatch '(?m)^recorded_by_role:\s*CHATGPT_WEB_CONTROL\s*$') { throw 'SWITCH_RECORDED_BY_ROLE_INVALID' }
          $allowedSwitchKeys = @('state','new_generation','new_status','recorded_by_role')
          $switchLines = [string]$switch.body -split "`r?`n"
          $seenSwitchKeys = @{}
          for ($si = 1; $si -lt $switchLines.Count; $si++) {
            $sline = $switchLines[$si].Trim()
            if ([string]::IsNullOrWhiteSpace($sline)) { continue }
            if ($sline -notmatch '^(?<sk>[a-z0-9_]+):\s*(?<sv>.+)$') { throw "SWITCH_BODY_NOT_POINTER_ONLY_LINE_$si" }
            if ($allowedSwitchKeys -notcontains $Matches.sk) { throw "SWITCH_UNKNOWN_FIELD_$($Matches.sk)" }
            if ($seenSwitchKeys.ContainsKey($Matches.sk)) { throw "SWITCH_DUPLICATE_FIELD_$($Matches.sk)" }
            $seenSwitchKeys[$Matches.sk] = $true
          }
          $newerSwitchesAfterLatest = @($issue88 | Where-Object {
            [int64]$_.id -gt [int64]$switch.id -and
            [string]$_.body -match '(?m)^CONTROL_GENERATION_SWITCH_V1\s*$' -and
            [string]$_.body -match '(?m)^state:\s*SWITCH_COMMITTED\s*$'
          })
          if ($newerSwitchesAfterLatest.Count -gt 0) { throw 'NEWER_CONTROL_SWITCH_EXISTS' }

          $issue43Result = Get-AllComments 43
          $issue43 = $issue43Result.comments
          $issue43Eof = $issue43Result.eof
          if (-not $issue43Eof) { throw 'INCOMPLETE_DURABLE_HISTORY_issue_43' }
          $allCurrentStarts = @($issue43 | Where-Object {
            [string]$_.user.login -ceq 'D22977' -and
            [string]$_.author_association -ceq 'OWNER' -and
            [string]$_.body -match '(?m)^CURRENT_REHYDRATION_INDEX_V\d+\s*$' -and
            [string]$_.body -match '(?m)^state:\s*CURRENT_START_HERE\s*$'
          })
          if ($allCurrentStarts.Count -eq 0) { throw 'NO_CURRENT_START_FOUND' }
          $currentStart = ($allCurrentStarts | Sort-Object { [int64]$_.id } | Select-Object -Last 1)
          $csNlIdx = [string]$currentStart.body.IndexOfAny(@([char]13, [char]10))
          $csFirstLine = if ($csNlIdx -ge 0) { [string]$currentStart.body.Substring(0, $csNlIdx) } else { [string]$currentStart.body }
          if ($csFirstLine.Length -lt 32) { throw 'CURRENT_START_PROTOCOL_TOO_SHORT' }
          for ($ci = 0; $ci -lt $csFirstLine.Length; $ci++) {
            if ([char]$csFirstLine[$ci] -ne [char]'C' -and $ci -eq 0) { throw 'CURRENT_START_BOM_OR_GARBAGE' }
          }
          $csFirstChar = [int][char]$csFirstLine[0]
          if ($csFirstChar -eq 0xFEFF) { throw 'BOM_DETECTED_IN_CURRENT_START' }
          if ($csFirstLine -cne [string]$csFirstLine.Trim()) { throw 'CURRENT_START_PROTOCOL_LEADING_WHITESPACE' }
          if ($csFirstLine -notmatch '^CURRENT_REHYDRATION_INDEX_V\d+$') { throw 'WRONG_CURRENT_START_PROTOCOL' }
          $csVersion = [int]($csFirstLine -replace '^CURRENT_REHYDRATION_INDEX_V(\d+)$','$1')
          if ($csVersion -lt 1) { throw 'CURRENT_START_VERSION_INVALID' }
          $csBodyLines = [string]$currentStart.body -split "`r?`n"
          $csSeenKeys = @{}
          for ($csLi = 1; $csLi -lt $csBodyLines.Count; $csLi++) {
            $csLine = $csBodyLines[$csLi].Trim()
            if ([string]::IsNullOrWhiteSpace($csLine)) { continue }
            if ($csLine -notmatch '^(?<ck>[a-z0-9_]+):\s*(?<cv>.+)$') { throw "CURRENT_START_BODY_NOT_POINTER_ONLY_LINE_$csLi" }
            if ($csSeenKeys.ContainsKey($Matches.ck)) { throw "CURRENT_START_DUPLICATE_FIELD_$($Matches.ck)" }
            $csSeenKeys[$Matches.ck] = $true
          }
          if ([string]$currentStart.body -notmatch '(?m)^control_generation:\s*013\s*$') { throw 'CURRENT_START_GEN_MISMATCH' }
          if ([string]$currentStart.body -notmatch '(?m)^control_status:\s*ACTIVE\s*$') { throw 'CURRENT_START_NOT_ACTIVE' }
          if ([string]$currentStart.body -notmatch '(?m)^recorded_by_role:\s*CHATGPT_WEB_CONTROL\s*$') { throw 'CURRENT_START_RECORDED_BY_ROLE_INVALID' }
          $allowedCSKeys = @('state','control_generation','control_status','recorded_by_role')
          for ($csLi = 1; $csLi -lt $csBodyLines.Count; $csLi++) {
            $csLine = $csBodyLines[$csLi].Trim()
            if ([string]::IsNullOrWhiteSpace($csLine)) { continue }
            if ($csLine -notmatch '^(?<ck>[a-z0-9_]+):\s*(?<cv>.+)$') { throw "CURRENT_START_BODY_NOT_POINTER_ONLY_LINE_$csLi" }
            if ($allowedCSKeys -notcontains $Matches.ck) { throw "CURRENT_START_UNKNOWN_FIELD_$($Matches.ck)" }
          }
          $newerCurrentStartsAfterLatest = @($issue43 | Where-Object {
            [int64]$_.id -gt [int64]$currentStart.id -and
            [string]$_.body -match '(?m)^CURRENT_REHYDRATION_INDEX_V\d+\s*$' -and
            [string]$_.body -match '(?m)^state:\s*CURRENT_START_HERE\s*$'
          })
          if ($newerCurrentStartsAfterLatest.Count -gt 0) { throw 'NEWER_CURRENT_START_EXISTS' }

          $issue162Result = Get-AllComments $issue
          $comments = $issue162Result.comments
          $issue162Eof = $issue162Result.eof
          if (-not $issue162Eof) { throw 'INCOMPLETE_DURABLE_HISTORY_issue_162' }

          $logicalKey = "${cardReceipt}:${idempotency}:${cardId}:${generation}:${launcherHead}:${workerBase}:${workflowPath}:${targetRef}:${targetHead}:${consumerBlob}"
          $priorLiveObs = @($comments | Where-Object {
            [string]$_.body -match '(?m)^GBB_G13_HANDOFF_AUTOMATION_LIVE_CONSUMER_OBSERVES_V1\s*$' -and
            [string]$_.body -match "(?m)^source_card_receipt:\s*$([regex]::Escape($cardReceipt))\s*$" -and
            [string]$_.body -match "(?m)^dispatch_idempotency_key:\s*$([regex]::Escape($idempotency))\s*$" -and
            [string]$_.body -match "(?m)^card_id:\s*$([regex]::Escape($cardId))\s*$" -and
            [string]$_.body -match "(?m)^control_generation:\s*$([regex]::Escape($generation))\s*$" -and
            [string]$_.body -match "(?m)^launcher_head_sha:\s*$([regex]::Escape($launcherHead))\s*$" -and
            [string]$_.body -match "(?m)^worker_base_sha:\s*$([regex]::Escape($workerBase))\s*$"
          })
          $priorConsumed = @($comments | Where-Object {
            [string]$_.body -match '(?m)^GBB_G13_HANDOFF_AUTOMATION_CONSUMED_STARTED_V1\s*$' -and
            [string]$_.body -match "(?m)^source_card_receipt:\s*$([regex]::Escape($cardReceipt))\s*$" -and
            [string]$_.body -match "(?m)^dispatch_idempotency_key:\s*$([regex]::Escape($idempotency))\s*$" -and
            [string]$_.body -match "(?m)^card_id:\s*$([regex]::Escape($cardId))\s*$" -and
            [string]$_.body -match "(?m)^control_generation:\s*$([regex]::Escape($generation))\s*$"
          })
          $priorTerminal = @($comments | Where-Object {
            [string]$_.body -match '(?m)^GBB_G13_HANDOFF_AUTOMATION_HANDOFF_TEST_RESULT_V1\s*$' -and
            [string]$_.body -match "(?m)^source_card_receipt:\s*$([regex]::Escape($cardReceipt))\s*$" -and
            [string]$_.body -match "(?m)^dispatch_idempotency_key:\s*$([regex]::Escape($idempotency))\s*$" -and
            [string]$_.body -match "(?m)^card_id:\s*$([regex]::Escape($cardId))\s*$" -and
            [string]$_.body -match "(?m)^control_generation:\s*$([regex]::Escape($generation))\s*$"
          })
          $priorBlocked = @($comments | Where-Object {
            [string]$_.body -match '(?m)^GBB_G13_HANDOFF_AUTOMATION_CONSUMER_BLOCKED_V1\s*$' -and
            [string]$_.body -match "(?m)^source_card_receipt:\s*$([regex]::Escape($cardReceipt))\s*$" -and
            [string]$_.body -match "(?m)^dispatch_idempotency_key:\s*$([regex]::Escape($idempotency))\s*$" -and
            [string]$_.body -match "(?m)^card_id:\s*$([regex]::Escape($cardId))\s*$" -and
            [string]$_.body -match "(?m)^control_generation:\s*$([regex]::Escape($generation))\s*$"
          })
          if ($priorTerminal.Count -gt 0) {
            Write-Output "NO_OP_DUPLICATE prior terminal receipt=$($priorTerminal[-1].id)"
            exit 0
          }
          if ($priorConsumed.Count -gt 0) {
            if ($priorBlocked.Count -gt 0) {
              Publish-Blocker 'BLOCKED_PRIOR_CONSUMPTION_WITH_BLOCKER' 'Prior consumption and blocker exist without terminal; reconcile the prior run.' $dispatchId $cardReceipt $cardId $idempotency 0
            } else {
              Publish-Blocker 'BLOCKED_PRIOR_CONSUMPTION_WITHOUT_TERMINAL' 'Existing executor consumption prevents a second prompt; reconcile the prior run.' $dispatchId $cardReceipt $cardId $idempotency 0
            }
            exit 0
          }
          if ($priorLiveObs.Count -gt 0) {
            Publish-Blocker 'BLOCKED_PRIOR_LIVE_OBSERVATION_WITHOUT_CONSUMPTION' 'A prior live observation exists without consumption or terminal; reconcile before resend.' $dispatchId $cardReceipt $cardId $idempotency 0
            exit 0
          }
          if ($priorBlocked.Count -gt 0) {
            Publish-Blocker 'BLOCKED_PRIOR_BLOCKER_WITHOUT_CONSUMPTION' 'A prior blocker exists without consumption or terminal; reconcile before resend.' $dispatchId $cardReceipt $cardId $idempotency 0
            exit 0
          }

          $runnerUser = [System.Security.Principal.WindowsIdentity]::GetCurrent().Name
          $runnerSession = (Get-Process -Id $PID).SessionId

          $liveBody = @(
            'GBB_G13_HANDOFF_AUTOMATION_LIVE_CONSUMER_OBSERVES_V1'
            'state: LIVE_CONSUMER_OBSERVES'
            'recorded_by_role: G13_HANDOFF_CONSUMER_WORKFLOW'
            'control_generation: 013'
            "source_dispatch_comment: $dispatchId"
            "source_card_receipt: $cardReceipt"
            "card_id: $cardId"
            "launcher_head_sha: $launcherHead"
            "worker_base_sha: $workerBase"
            "dispatch_idempotency_key: $idempotency"
            "runner_name: $env:RUNNER_NAME"
            "runner_user: $runnerUser"
            "runner_session_id: $runnerSession"
            "target_agent_name: $targetAgentName"
            "target_pane: $targetPane"
            "target_cwd_exact: $targetCwd"
            "workflow_run_id: $env:GITHUB_RUN_ID"
            'physical_prompt_count: 0'
            'readback_verified: true'
          ) -join "`n"
          [void](Publish $liveBody)

          $before = Invoke-HerdrJson @('agent', 'list')
          $beforeMatches = @($before.result.agents | Where-Object {
            [string]$_.name -ceq $targetAgentName -and
            [string]$_.pane_id -ceq $targetPane -and
            [string]$_.cwd -ceq $targetCwd -and
            [string]$_.head_sha -ceq $workerBase -and
            [string]$_.agent_status -ceq $targetStatus
          })
          if ($beforeMatches.Count -ne 1) {
            Publish-Blocker 'VISIBLE_EXECUTOR_ABSENT_OR_AMBIGUOUS' "target_count=$($beforeMatches.Count)" $dispatchId $cardReceipt $cardId $idempotency 0
            exit 0
          }
          $selected = $beforeMatches[0]
          $targetSession = [string]$selected.agent_session.value
          if ([string]::IsNullOrWhiteSpace($targetSession)) {
            Publish-Blocker 'EXECUTOR_SESSION_MISSING' 'Selected executor has no session identity.' $dispatchId $cardReceipt $cardId $idempotency 0
            exit 0
          }
          $workerBranchName = [string]$selected.branch
          if ([string]::IsNullOrWhiteSpace($workerBranchName)) {
            Publish-Blocker 'EXECUTOR_BRANCH_MISSING' 'Selected executor has no branch.' $dispatchId $cardReceipt $cardId $idempotency 0
            exit 0
          }
          if ([string]$selected.head_sha -cne $workerBase) {
            Publish-Blocker 'EXECUTOR_HEAD_MISMATCH' "expected=$workerBase actual=$([string]$selected.head_sha)" $dispatchId $cardReceipt $cardId $idempotency 0
            exit 0
          }
          $after = Invoke-HerdrJson @('agent', 'list')
          $afterMatches = @($after.result.agents | Where-Object {
            [string]$_.name -ceq $targetAgentName -and
            [string]$_.pane_id -ceq $targetPane -and
            [string]$_.cwd -ceq $targetCwd -and
            [string]$_.branch -ceq $workerBranchName -and
            [string]$_.head_sha -ceq $workerBase -and
            [string]$_.agent_session.value -ceq $targetSession -and
            [string]$_.agent_status -ceq $targetStatus
          })
          if ($afterMatches.Count -ne 1) {
            Publish-Blocker 'EXECUTOR_BINDING_CHANGED' 'Two fresh inventories did not identify the same unique executor.' $dispatchId $cardReceipt $cardId $idempotency 0
            exit 0
          }

          $preSendIssue88 = Get-AllComments 88
          $preSendAllSwitches = @($preSendIssue88.comments | Where-Object {
            [string]$_.user.login -ceq 'D22977' -and
            [string]$_.author_association -ceq 'OWNER' -and
            [string]$_.body -match '(?m)^CONTROL_GENERATION_SWITCH_V1\s*$' -and
            [string]$_.body -match '(?m)^state:\s*SWITCH_COMMITTED\s*$'
          })
          if ($preSendAllSwitches.Count -eq 0) { throw 'PRE_SEND_NO_COMMITTED_SWITCH' }
          $latestPreSendSwitch = ($preSendAllSwitches | Sort-Object { [int64]$_.id } | Select-Object -Last 1)
          Require-Exact-FirstLine ([string]$latestPreSendSwitch.body) 'CONTROL_GENERATION_SWITCH_V1' 'PRE_SEND_SWITCH'
          if ([string]$latestPreSendSwitch.body -notmatch '(?m)^new_generation:\s*013\s*$') { throw 'PRE_SEND_LATEST_SWITCH_NOT_GEN013' }
          if ([string]$latestPreSendSwitch.body -notmatch '(?m)^new_status:\s*ACTIVE\s*$') { throw 'PRE_SEND_LATEST_SWITCH_NOT_ACTIVE' }

          $preSendIssue43 = Get-AllComments 43
          $preSendAllCS = @($preSendIssue43.comments | Where-Object {
            [string]$_.user.login -ceq 'D22977' -and
            [string]$_.author_association -ceq 'OWNER' -and
            [string]$_.body -match '(?m)^CURRENT_REHYDRATION_INDEX_V\d+\s*$' -and
            [string]$_.body -match '(?m)^state:\s*CURRENT_START_HERE\s*$'
          })
          if ($preSendAllCS.Count -eq 0) { throw 'PRE_SEND_NO_CURRENT_START' }
          $latestPreSendCS = ($preSendAllCS | Sort-Object { [int64]$_.id } | Select-Object -Last 1)
          $preSendCSNlIdx = [string]$latestPreSendCS.body.IndexOfAny(@([char]13, [char]10))
          $preSendCSFirstLine = if ($preSendCSNlIdx -ge 0) { [string]$latestPreSendCS.body.Substring(0, $preSendCSNlIdx) } else { [string]$latestPreSendCS.body }
          $preSendCSFirstChar = [int][char]$preSendCSFirstLine[0]
          if ($preSendCSFirstChar -eq 0xFEFF) { throw 'BOM_DETECTED_IN_PRE_SEND_CS' }
          if ($preSendCSFirstLine -cne [string]$preSendCSFirstLine.Trim()) { throw 'PRE_SEND_CS_PROTOCOL_LEADING_WHITESPACE' }
          if ($preSendCSFirstLine -notmatch '^CURRENT_REHYDRATION_INDEX_V\d+$') { throw 'PRE_SEND_WRONG_CS_PROTOCOL' }
          if ([string]$latestPreSendCS.body -notmatch '(?m)^control_generation:\s*013\s*$') { throw 'PRE_SEND_LATEST_CS_NOT_GEN013' }
          if ([string]$latestPreSendCS.body -notmatch '(?m)^control_status:\s*ACTIVE\s*$') { throw 'PRE_SEND_LATEST_CS_NOT_ACTIVE' }

          $preSendCard = Get-Comment $cardReceipt
          $preSendCardBody = [string]$preSendCard.body
          if ([string]$preSendCard.user.login -cne 'D22977') { throw 'PRE_SEND_CARD_AUTHOR_INVALID' }
          if ([string]$preSendCard.author_association -cne 'OWNER') { throw 'PRE_SEND_CARD_ASSOCIATION_INVALID' }
          Require-Exact-FirstLine $preSendCardBody 'GBB_G13_HANDOFF_AUTOMATION_TEST_CARD_V1' 'PRE_SEND_CARD'
          if ($preSendCardBody -notmatch '(?m)^state:\s*READY_FOR_POINTER_DISPATCH\s*$') { throw 'PRE_SEND_CARD_NO_LONGER_READY' }
          if ((Get-Field $preSendCardBody 'card_id') -cne $cardId) { throw 'PRE_SEND_CARD_ID_CHANGED' }
          if ((Get-Field $preSendCardBody 'control_generation') -cne '013') { throw 'PRE_SEND_CARD_GEN_CHANGED' }

          $preSendAcceptance = Get-Comment $sourceAcceptance
          $preSendAccBody = [string]$preSendAcceptance.body
          if ([string]$preSendAcceptance.user.login -cne 'D22977') { throw 'PRE_SEND_ACCEPTANCE_AUTHOR_INVALID' }
          if ([string]$preSendAcceptance.author_association -cne 'OWNER') { throw 'PRE_SEND_ACCEPTANCE_ASSOCIATION_INVALID' }
          if ($preSendAccBody -notmatch '(?m)^recorded_by_role:\s*CHATGPT_WEB_CONTROL\s*$') { throw 'PRE_SEND_ACCEPTANCE_RECORDED_BY_ROLE_INVALID' }
          if ($preSendAccBody -notmatch '(?m)^state:\s*PASS\s*$') { throw 'PRE_SEND_ACCEPTANCE_STATE_INVALID' }
          if ($preSendAccBody -notmatch "(?m)^card_id:\s*$([regex]::Escape($cardId))\s*$") { throw 'PRE_SEND_ACCEPTANCE_CARD_ID_MISMATCH' }

          $preSendRef = Invoke-RestMethod "$api/git/ref/heads/review-base/gbb-gh-01" -Headers $headers -Method Get -TimeoutSec 30
          if ([string]$preSendRef.object.sha -cne $targetHead) { throw 'PRE_SEND_TARGET_REF_HEAD_STALE' }
          $preSendWorkflow = Invoke-RestMethod "$api/contents/${workflowPath}?ref=$env:GITHUB_SHA" -Headers $headers -Method Get -TimeoutSec 30
          if ([string]$preSendWorkflow.sha -cne $consumerBlob) { throw 'PRE_SEND_WORKFLOW_BLOB_MISMATCH' }

          $preSendIssue162 = Get-AllComments $issue
          $preSendComments = $preSendIssue162.comments
          $preSendTerminal = @($preSendComments | Where-Object {
            [string]$_.body -match '(?m)^GBB_G13_HANDOFF_AUTOMATION_HANDOFF_TEST_RESULT_V1\s*$' -and
            [string]$_.body -match "(?m)^source_card_receipt:\s*$([regex]::Escape($cardReceipt))\s*$" -and
            [string]$_.body -match "(?m)^dispatch_idempotency_key:\s*$([regex]::Escape($idempotency))\s*$"
          })
          if ($preSendTerminal.Count -gt 0) {
            Write-Output "NO_OP_PRE_SEND_TERMINAL_EXISTS receipt=$($preSendTerminal[-1].id)"
            exit 0
          }
          $preSendConsumed = @($preSendComments | Where-Object {
            [string]$_.body -match '(?m)^GBB_G13_HANDOFF_AUTOMATION_CONSUMED_STARTED_V1\s*$' -and
            [string]$_.body -match "(?m)^source_card_receipt:\s*$([regex]::Escape($cardReceipt))\s*$" -and
            [string]$_.body -match "(?m)^dispatch_idempotency_key:\s*$([regex]::Escape($idempotency))\s*$"
          })
          if ($preSendConsumed.Count -gt 0) {
            Publish-Blocker 'BLOCKED_PRE_SEND_CONSUMPTION_EXISTS' 'A consumption receipt was observed before physical send; no duplicate dispatch.' $dispatchId $cardReceipt $cardId $idempotency 0
            exit 0
          }
          $preSendLiveObs = @($preSendComments | Where-Object {
            [string]$_.body -match '(?m)^GBB_G13_HANDOFF_AUTOMATION_LIVE_CONSUMER_OBSERVES_V1\s*$' -and
            [string]$_.body -match "(?m)^source_card_receipt:\s*$([regex]::Escape($cardReceipt))\s*$" -and
            [string]$_.body -match "(?m)^dispatch_idempotency_key:\s*$([regex]::Escape($idempotency))\s*$"
          })
          if ($preSendLiveObs.Count -gt 1) {
            Publish-Blocker 'BLOCKED_PRE_SEND_DUPLICATE_LIVE_OBSERVATION' 'Multiple live observations exist for this logical event; no duplicate dispatch.' $dispatchId $cardReceipt $cardId $idempotency 0
            exit 0
          }

          $reservationKey = "${cardReceipt}:${idempotency}:${cardId}:${generation}:${launcherHead}:${workerBase}:${workflowPath}:${targetRef}:${targetHead}:${consumerBlob}"
          if ($reservationKey -cne $logicalKey) { throw 'RESERVATION_KEY_DIVERGENCE' }
          $preSendReservation = @($preSendComments | Where-Object {
            [string]$_.body -match '(?m)^GBB_G13_HANDOFF_AUTOMATION_CONSUMED_STARTED_V1\s*$' -and
            [string]$_.body -match "(?m)^source_card_receipt:\s*$([regex]::Escape($cardReceipt))\s*$" -and
            [string]$_.body -match "(?m)^dispatch_idempotency_key:\s*$([regex]::Escape($idempotency))\s*$" -and
            [string]$_.body -match "(?m)^card_id:\s*$([regex]::Escape($cardId))\s*$" -and
            [string]$_.body -match "(?m)^control_generation:\s*$([regex]::Escape($generation))\s*$" -and
            [string]$_.body -match "(?m)^launcher_head_sha:\s*$([regex]::Escape($launcherHead))\s*$" -and
            [string]$_.body -match "(?m)^worker_base_sha:\s*$([regex]::Escape($workerBase))\s*$" -and
            [string]$_.body -match "(?m)^consumer_workflow_path_exact:\s*$([regex]::Escape($workflowPath))\s*$" -and
            [string]$_.body -match "(?m)^target_ref_exact:\s*$([regex]::Escape($targetRef))\s*$"
          })
          if ($preSendReservation.Count -gt 0) {
            Publish-Blocker 'BLOCKED_PRE_SEND_RESERVATION_CONFLICT' 'A prior consumption exists for this exact logical reservation; no duplicate dispatch.' $dispatchId $cardReceipt $cardId $idempotency 0
            exit 0
          }

          $pointer = @(
            'GBB_G13_HANDOFF_POINTER_DISPATCH_REQUEST_V1'
            "card_receipt: $cardReceipt"
            "card_id: $cardId"
            'control_generation: 013'
            "launcher_head_sha: $launcherHead"
            "worker_base_sha: $workerBase"
            "dispatch_idempotency_key: $idempotency"
          ) -join "`n"
          $promptOutput = (& $herdr agent prompt $targetAgentName $pointer 2>&1 | Out-String).Trim()
          $promptExit = $LASTEXITCODE
          if ($promptExit -ne 0) {
            Publish-Blocker 'HERDR_POINTER_SEND_FAILED' 'The single pointer send failed; no retry is authorized.' $dispatchId $cardReceipt $cardId $idempotency 1
            exit 0
          }

          $consumed = $null
          for ($attempt = 0; $attempt -lt 40; $attempt++) {
            Start-Sleep -Seconds 3
            $rows = Get-AllComments $issue
            $rowsComments = $rows.comments
            $matches = @($rowsComments | Where-Object {
              [string]$_.body -match '(?m)^GBB_G13_HANDOFF_AUTOMATION_CONSUMED_STARTED_V1\s*$' -and
              [string]$_.body -match "(?m)^source_card_receipt:\s*$([regex]::Escape($cardReceipt))\s*$" -and
              [string]$_.body -match "(?m)^dispatch_idempotency_key:\s*$([regex]::Escape($idempotency))\s*$" -and
              [string]$_.body -match '(?m)^readback_verified:\s*true\s*$'
            })
            if ($matches.Count -gt 1) {
              Publish-Blocker 'CONSUMED_STARTED_AMBIGUOUS' 'More than one executor consumption receipt was observed; no semantic decision is made.' $dispatchId $cardReceipt $cardId $idempotency 1
              exit 0
            }
            if ($matches.Count -eq 1) { $consumed = $matches[0]; break }
          }
          if ($null -eq $consumed) {
            Publish-Blocker 'UNCERTAIN_SEND_CONSUMED_STARTED_NOT_OBSERVED' 'The single pointer send may have been delivered; no blind retry is allowed.' $dispatchId $cardReceipt $cardId $idempotency 1
            exit 0
          }

          $consumedReadback = Get-Comment ([string]$consumed.id)
          $consumedReadbackBody = [string]$consumedReadback.body
          Require-Exact-FirstLine $consumedReadbackBody 'GBB_G13_HANDOFF_AUTOMATION_CONSUMED_STARTED_V1' 'CONSUMED_STARTED_READBACK'
          if ([string]$consumedReadback.user.login -cne 'D22977') { throw 'CONSUMED_STARTED_AUTHOR_INVALID' }
          if ([string]$consumedReadback.author_association -cne 'OWNER') { throw 'CONSUMED_STARTED_ASSOCIATION_INVALID' }
          if ((Get-Field $consumedReadbackBody 'source_card_receipt') -cne $cardReceipt) { throw 'CONSUMED_STARTED_READBACK_CARD_RECEIPT_MISMATCH' }
          if ((Get-Field $consumedReadbackBody 'dispatch_idempotency_key') -cne $idempotency) { throw 'CONSUMED_STARTED_READBACK_IDEMPOTENCY_MISMATCH' }
          $admittedExecutorIdentity = [string]$selected.agent
          $admittedSession = $targetSession
          $admittedControlGeneration = $generation
          function Validate-ConsumedStarted([string]$body, [string]$expectedExecutor, [string]$expectedSession, [string]$expectedGeneration) {
            Require-Exact-FirstLine $body 'GBB_G13_HANDOFF_AUTOMATION_CONSUMED_STARTED_V1' 'CONSUMED_STARTED'
            if ((Get-Field $body 'source_card_receipt') -cne $cardReceipt) { throw 'CONSUMED_STARTED_CARD_RECEIPT_MISMATCH' }
            if ((Get-Field $body 'dispatch_idempotency_key') -cne $idempotency) { throw 'CONSUMED_STARTED_IDEMPOTENCY_MISMATCH' }
            if ((Get-Field $body 'card_id') -cne $cardId) { throw 'CONSUMED_STARTED_CARD_ID_MISMATCH' }
            if ((Get-Field $body 'control_generation') -cne $expectedGeneration) { throw 'CONSUMED_STARTED_GENERATION_MISMATCH' }
            if ((Get-Field $body 'readback_verified') -cne 'true') { throw 'CONSUMED_STARTED_READBACK_NOT_VERIFIED' }
            if ((Get-Field $body 'executor_identity') -cne $expectedExecutor) { throw 'CONSUMED_STARTED_EXECUTOR_IDENTITY_MISMATCH' }
            if ((Get-Field $body 'executor_session_or_instance') -cne $expectedSession) { throw 'CONSUMED_STARTED_SESSION_MISMATCH' }
          }
          Validate-ConsumedStarted $consumedReadbackBody $admittedExecutorIdentity $admittedSession $admittedControlGeneration

          $terminal = $null
          for ($attempt = 0; $attempt -lt 40; $attempt++) {
            Start-Sleep -Seconds 3
            $rows = Get-AllComments $issue
            $rowsComments = $rows.comments
            $matches = @($rowsComments | Where-Object {
              [string]$_.body -match '(?m)^GBB_G13_HANDOFF_AUTOMATION_HANDOFF_TEST_RESULT_V1\s*$' -and
              [string]$_.body -match "(?m)^source_card_receipt:\s*$([regex]::Escape($cardReceipt))\s*$" -and
              [string]$_.body -match "(?m)^source_consumed_started_receipt:\s*$([regex]::Escape([string]$consumed.id))\s*$" -and
              [string]$_.body -match "(?m)^dispatch_idempotency_key:\s*$([regex]::Escape($idempotency))\s*$" -and
              [string]$_.body -match '(?m)^decision:\s*(PASS|BLOCKED|CONTROL_REQUIRED)\s*$' -and
              [string]$_.body -match '(?m)^readback_verified:\s*true\s*$'
            })
            if ($matches.Count -gt 1) {
              Publish-Blocker 'HANDOFF_TEST_RESULT_AMBIGUOUS' 'More than one terminal result was observed; no acceptance is inferred.' $dispatchId $cardReceipt $cardId $idempotency 1
              exit 0
            }
            if ($matches.Count -eq 1) { $terminal = $matches[0]; break }
          }
          if ($null -eq $terminal) {
            Publish-Blocker 'HANDOFF_TEST_RESULT_NOT_OBSERVED' 'Consumption was observed but the executor terminal was not observed; no completion is inferred.' $dispatchId $cardReceipt $cardId $idempotency 1
            exit 0
          }

          $terminalReadback = Get-Comment ([string]$terminal.id)
          $terminalReadbackBody = [string]$terminalReadback.body
          Require-Exact-FirstLine $terminalReadbackBody 'GBB_G13_HANDOFF_AUTOMATION_HANDOFF_TEST_RESULT_V1' 'TERMINAL_READBACK'
          if ([string]$terminalReadback.user.login -cne 'D22977') { throw 'TERMINAL_AUTHOR_INVALID' }
          if ([string]$terminalReadback.author_association -cne 'OWNER') { throw 'TERMINAL_ASSOCIATION_INVALID' }
          if ((Get-Field $terminalReadbackBody 'source_card_receipt') -cne $cardReceipt) { throw 'TERMINAL_READBACK_CARD_RECEIPT_MISMATCH' }
          if ((Get-Field $terminalReadbackBody 'dispatch_idempotency_key') -cne $idempotency) { throw 'TERMINAL_READBACK_IDEMPOTENCY_MISMATCH' }
          $terminalDecision = Get-Field $terminalReadbackBody 'decision'
          if ($terminalDecision -notin @('PASS', 'BLOCKED', 'CONTROL_REQUIRED')) { throw 'TERMINAL_DECISION_INVALID' }
          if ((Get-Field $terminalReadbackBody 'source_consumed_started_receipt') -cne [string]$consumed.id) { throw 'TERMINAL_READBACK_CONSUMED_STARTED_MISMATCH' }
          if ((Get-Field $terminalReadbackBody 'executor_identity') -cne $admittedExecutorIdentity) { throw 'TERMINAL_EXECUTOR_IDENTITY_MISMATCH' }
          if ((Get-Field $terminalReadbackBody 'executor_session_or_instance') -cne $admittedSession) { throw 'TERMINAL_SESSION_MISMATCH' }
          if ((Get-Field $terminalReadbackBody 'control_generation') -cne $admittedControlGeneration) { throw 'TERMINAL_GENERATION_MISMATCH' }

          Write-Output "HANDOFF_TEST_TERMINAL_OBSERVED receipt=$($terminal.id) decision=$terminalDecision"
