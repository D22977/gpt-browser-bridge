name: G11 Issue124 Review Coordinator Observe Once

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  observe:
    if: >-
      github.event.issue.number == 124 &&
      github.event.comment.user.login == 'D22977' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, 'HERDR_FRESH_REVIEW_OBSERVE_V1')
    runs-on: [self-hosted, Windows, GBB-REVIEWER]
    timeout-minutes: 6
    defaults:
      run:
        shell: pwsh -NoProfile -File {0}
    steps:
      - name: Read exact prior coordinator state only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $repo='D22977/gpt-browser-bridge'
          $issue=124
          $expectedPane='w2:p1'
          $expectedSession='01a0513f-4e68-7573-bf38-72e2120ebe1d'
          $expectedReview='GBB124-G11-R1-38DA7377-20260906'
          $expectedHead='38da7377f9b9d1610dd44aa869b861bb8500ccc9'
          $expectedSourceWake='5560088261'
          $expectedSourceRequest='5560026863'
          $herdr='C:\Users\Lupun\AppData\Local\Programs\Herdr\bin\herdr.exe'
          $headers=@{Authorization="Bearer $env:GH_TOKEN";'User-Agent'='g11-review-observer';Accept='application/vnd.github+json'}
          function Need([string]$b,[string]$p,[string]$n){$m=[regex]::Match($b,$p);if(-not$m.Success){throw"Malformed observe field: $n"};$m.Groups[1].Value}
          function Publish([string]$text){$payload=@{body=$text}|ConvertTo-Json -Compress;$p=Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/issues/$issue/comments" -Headers $headers -Method Post -Body $payload -ContentType 'application/json' -TimeoutSec 30;$rb=Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/issues/comments/$($p.id)" -Headers $headers -Method Get -TimeoutSec 30;if([string]$rb.body-cne$text){throw"Readback mismatch $($p.id)"};Write-Output "receipt=$($p.id)"}
          $event=Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw|ConvertFrom-Json
          $body=[string]$event.comment.body
          $rr=Need $body '(?m)^review_request_id:\s*([A-Za-z0-9._:-]+)\s*$' 'review_request_id'
          $head=Need $body '(?m)^candidate_head:\s*([0-9a-f]{40})\s*$' 'candidate_head'
          $wake=Need $body '(?m)^source_review_wake:\s*(\d+)\s*$' 'source_review_wake'
          $src=Need $body '(?m)^source_review_request:\s*(\d+)\s*$' 'source_review_request'
          $pane=Need $body '(?m)^coordinator_pane:\s*([^\r\n]+?)\s*$' 'coordinator_pane'
          $session=Need $body '(?m)^coordinator_session:\s*([0-9a-f-]+)\s*$' 'coordinator_session'
          if($rr-cne$expectedReview-or$head-cne$expectedHead-or$wake-cne$expectedSourceWake-or$src-cne$expectedSourceRequest-or$pane-cne$expectedPane-or$session-cne$expectedSession){throw'Exact observation binding mismatch'}
          if(-not(Test-Path -LiteralPath $herdr)){throw'Herdr CLI missing'}
          $listRaw=&$herdr agent list
          if($LASTEXITCODE-ne0){$result=@('GBB_HANDOFF_CONTINUITY_FRESH_REVIEW_OBSERVATION_V1','state: CONTROL_REQUIRED','classification: TARGET_MISSING_OR_IDENTITY_MISMATCH','reason: HERDR_AGENT_LIST_FAILED',"review_request_id: $rr","candidate_head: $head",'agent_prompt_performed: false','browser_action_performed: false','user_relay_count: 0',"workflow_run_id: $env:GITHUB_RUN_ID",'readback_verified: true')-join"`n";Publish $result;exit 0}
          $list=$listRaw|ConvertFrom-Json
          $matches=@($list.result.agents|Where-Object{[string]$_.pane_id-eq$expectedPane-and[string]$_.agent_session.value-eq$expectedSession-and[string]$_.agent-eq'codex'})
          if($matches.Count-ne1){$result=@('GBB_HANDOFF_CONTINUITY_FRESH_REVIEW_OBSERVATION_V1','state: CONTROL_REQUIRED','classification: TARGET_MISSING_OR_IDENTITY_MISMATCH',"match_count: $($matches.Count)","review_request_id: $rr","candidate_head: $head",'agent_prompt_performed: false','browser_action_performed: false','user_relay_count: 0',"workflow_run_id: $env:GITHUB_RUN_ID",'readback_verified: true')-join"`n";Publish $result;exit 0}
          $target=$matches[0];$status=[string]$target.agent_status
          if($status-eq'working'){$result=@('GBB_HANDOFF_CONTINUITY_FRESH_REVIEW_OBSERVATION_V1','state: WAIT','classification: STILL_WORKING',"target_status: $status","review_request_id: $rr","candidate_head: $head",'terminal_read_performed: false','agent_prompt_performed: false','browser_action_performed: false','user_relay_count: 0',"workflow_run_id: $env:GITHUB_RUN_ID",'readback_verified: true')-join"`n";Publish $result;exit 0}
          $raw=(&$herdr agent read $expectedPane --source recent-unwrapped --lines 240 2>&1|Out-String)
          $readExit=$LASTEXITCODE
          $bytes=[Text.Encoding]::UTF8.GetBytes($raw);$hash=[Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($bytes)).ToLowerInvariant()
          $url='';$u=[regex]::Match($raw,'https://chatgpt\.com/(?:g/[A-Za-z0-9._-]+/)?c/[0-9a-f-]+');if($u.Success){$url=$u.Value}
          $launchMarker=$raw-match'GBB_HANDOFF_CONTINUITY_FRESH_REVIEW_LAUNCH_RESULT_V1'
          $reviewMarker=$raw-match'GBB_HANDOFF_CONTINUITY_FRESH_REVIEW_RESULT_V1'
          $blocked=$raw-match'(?im)^state:\s*BLOCKED\s*$|\bBLOCKED\b'
          $cap='';$cm=[regex]::Match($raw,'(?im)^(?:first_missing_capability|first_failed_gate):\s*([^\r\n]+)');if($cm.Success){$cap=$cm.Groups[1].Value.Trim()}
          $pubFail=$raw-match'(?i)(publish|publication|comment).*(fail|error|denied|forbidden|401|403)|(?i)(fail|error).*(publish|publication|comment)'
          if($url-or$launchMarker-or$reviewMarker){if($pubFail){$class='PUBLICATION_FAILURE_AFTER_REVIEWER_CREATION'}else{$class='REVIEWER_CREATED_OR_LAUNCH_EVIDENCE_PRESENT'};$state='EVIDENCE_PRESENT'}elseif($blocked-or$cap){$class='BLOCKED_EVIDENCE_PRESENT';$state='BLOCKED'}else{$class='SETTLED_NO_LAUNCH_EVIDENCE';$state='CONTROL_REQUIRED'}
          $result=@('GBB_HANDOFF_CONTINUITY_FRESH_REVIEW_OBSERVATION_V1',"state: $state","classification: $class","target_status: $status","terminal_read_exit: $readExit","terminal_output_sha256: $hash","launch_marker_seen: $($launchMarker.ToString().ToLowerInvariant())","review_marker_seen: $($reviewMarker.ToString().ToLowerInvariant())","fresh_reviewer_url_seen: $url","blocked_marker_seen: $($blocked.ToString().ToLowerInvariant())","first_missing_capability_or_gate: $cap","publication_error_pattern_seen: $($pubFail.ToString().ToLowerInvariant())","review_request_id: $rr","candidate_head: $head",'raw_terminal_output_published: false','agent_prompt_performed: false','browser_action_performed: false','user_relay_count: 0',"workflow_run_id: $env:GITHUB_RUN_ID",'readback_verified: true')-join"`n"
          Publish $result
