name: G8 DB01 Local Dirty Readonly Diagnostic

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: g8-db01-local-dirty-readonly-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  diagnose:
    name: G8 DB01 Local Dirty Readonly Diagnostic
    if: >-
      github.event.issue.number == 114 &&
      github.event.comment.user.login == 'D22977' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, 'CONTROL_G8_DB01_LOCAL_DIRTY_READONLY_DIAGNOSTIC_EXECUTE_V1')
    runs-on: [self-hosted, Windows, GBB-REVIEWER]
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh -NoProfile -File {0}
    steps:
      - name: Read local git identity, dirtiness, and target blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $event = Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
          if ($event.repository.full_name -cne 'D22977/gpt-browser-bridge' -or [int]$event.issue.number -ne 114) { throw 'Wrong repository/issue' }
          if ($event.comment.user.login -cne 'D22977' -or $event.comment.author_association -cne 'OWNER') { throw 'Wrong actor' }
          $body = [string]$event.comment.body
          function Need([string]$pattern,[string]$name) {
            $m = [regex]::Match($body,$pattern)
            if (-not $m.Success) { throw "Malformed field: $name" }
            return $m.Groups[1].Value
          }
          $null = Need '(?m)^CONTROL_G8_DB01_LOCAL_DIRTY_READONLY_DIAGNOSTIC_EXECUTE_V1\s*$' 'header'
          $null = Need '(?m)^control_generation:\s*(008)\s*$' 'generation'
          $null = Need '(?m)^source_authority:\s*(5495817942)\s*$' 'authority'
          $expectedWorkflowHead = Need '(?m)^expected_workflow_head:\s*([0-9a-f]{40})\s*$' 'workflow_head'
          if ($expectedWorkflowHead -cne $env:GITHUB_SHA) { throw "Workflow head mismatch expected=$expectedWorkflowHead actual=$env:GITHUB_SHA" }

          $repo = 'D:\AIWORK\GPT_BROWSER_BRIDGE'
          if (-not (Test-Path -LiteralPath $repo -PathType Container)) { throw 'Local repo missing' }

          $branch = (git -C $repo branch --show-current | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'git branch read failed' }
          $head = (git -C $repo rev-parse HEAD | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'git rev-parse failed' }
          $status = @(git -C $repo status --porcelain=v1)
          if ($LASTEXITCODE -ne 0) { throw 'git status failed' }
          $diff = @(git -C $repo diff --name-only)
          if ($LASTEXITCODE -ne 0) { throw 'git diff failed' }
          $cached = @(git -C $repo diff --cached --name-only)
          if ($LASTEXITCODE -ne 0) { throw 'git diff --cached failed' }

          $expectedSender = '6b7a523f98a9655ba2ca28f42696b80da365c92b'
          $expectedBaseline = 'b363a3922640909a60184e1b27801ef74cd2855f'
          $expectedBridge = 'ed9c32672df8df9db2ac0b5ff91fb3cb5201f315'
          $senderBlob = (git -C $repo hash-object -- src/gpt_send.mjs | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'sender hash failed' }
          $baselineBlob = (git -C $repo hash-object -- tests/baseline.test.mjs | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'baseline hash failed' }
          $bridgeBlob = (git -C $repo hash-object -- .github/workflows/herdr-control-comment-bridge.yml | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'bridge hash failed' }

          function LinesOrNone([object[]]$items) {
            if ($null -eq $items -or $items.Count -eq 0) { return @('NONE') }
            return @($items | ForEach-Object { [string]$_ })
          }
          $statusLines = LinesOrNone $status
          $diffLines = LinesOrNone $diff
          $cachedLines = LinesOrNone $cached

          $result = @()
          $result += 'CONTROL_G8_DB01_LOCAL_DIRTY_READONLY_DIAGNOSTIC_RESULT_V1'
          $result += ''
          $result += 'state: PASS_READONLY_LOCAL_GIT_DIAGNOSTIC'
          $result += 'control_generation: 008'
          $result += 'source_authority: 5495817942'
          $result += "workflow_head: $env:GITHUB_SHA"
          $result += "runner_name: $env:RUNNER_NAME"
          $result += "local_branch: $branch"
          $result += "local_head: $head"
          $result += ''
          $result += 'git_status_porcelain_v1:'
          $result += @($statusLines | ForEach-Object { "- $_" })
          $result += 'git_diff_name_only:'
          $result += @($diffLines | ForEach-Object { "- $_" })
          $result += 'git_diff_cached_name_only:'
          $result += @($cachedLines | ForEach-Object { "- $_" })
          $result += ''
          $result += "src/gpt_send.mjs_blob: $senderBlob"
          $result += "src/gpt_send.mjs_matches_expected: $($senderBlob -ceq $expectedSender)"
          $result += "tests/baseline.test.mjs_blob: $baselineBlob"
          $result += "tests/baseline.test.mjs_matches_expected: $($baselineBlob -ceq $expectedBaseline)"
          $result += ".github/workflows/herdr-control-comment-bridge.yml_blob: $bridgeBlob"
          $result += ".github/workflows/herdr-control-comment-bridge.yml_matches_expected: $($bridgeBlob -ceq $expectedBridge)"
          $result += ''
          $result += 'mutation_performed: false'
          $result += 'browser_send_performed: false'
          $result += '009_wake_performed: false'
          $result += 'user_relay_target: 0'
          $result += "idempotency_key: GBB114-G8-LOCAL-DIRTY-READONLY-RESULT-$env:GITHUB_RUN_ID"

          $payload = @{ body = ($result -join "`n") } | ConvertTo-Json -Compress
          $payload | gh api repos/D22977/gpt-browser-bridge/issues/114/comments --method POST --input - | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'result publication failed' }
