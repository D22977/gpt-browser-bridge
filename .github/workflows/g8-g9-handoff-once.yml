name: G8 to G9 Bootstrap Herdr Web Handoff

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: g8-g9-handoff-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  handoff:
    name: G8 to G9 Bootstrap Herdr Web Handoff
    if: >-
      github.event.issue.number == 88 &&
      github.event.comment.user.login == 'D22977' &&
      github.event.comment.author_association == 'OWNER' &&
      (
        startsWith(github.event.comment.body, 'CONTROL_G8_G9_HANDOFF_WAKE_EVENT_V1') ||
        startsWith(github.event.comment.body, 'CONTROL_G8_G9_ROUTING_EXAM_EVENT_V1')
      )
    runs-on: [self-hosted, Windows, GBB-REVIEWER]
    timeout-minutes: 12
    defaults:
      run:
        shell: pwsh -NoProfile -File {0}

    steps:
      - name: Validate authority identity and prepare exact target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $event = Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
          if ($event.repository.full_name -cne 'D22977/gpt-browser-bridge') { throw 'Wrong repository' }
          if ([int]$event.issue.number -ne 88) { throw 'Wrong issue' }
          if ($event.comment.user.login -cne 'D22977' -or $event.comment.author_association -cne 'OWNER') { throw 'Wrong actor' }

          $body = [string]$event.comment.body
          $isWake = $body -match '(?m)^CONTROL_G8_G9_HANDOFF_WAKE_EVENT_V1\s*$'
          $isExam = $body -match '(?m)^CONTROL_G8_G9_ROUTING_EXAM_EVENT_V1\s*$'
          if (($isWake -and $isExam) -or (-not $isWake -and -not $isExam)) { throw 'Ambiguous/missing event protocol' }

          function Need([string]$pattern,[string]$name) {
            $m = [regex]::Match($body,$pattern)
            if (-not $m.Success) { throw "Malformed field: $name" }
            return $m.Groups[1].Value
          }

          $authority = Need '(?m)^source_handoff_authority:\s*(5501107432)\s*$' 'source_handoff_authority'
          $runnerAuthority = Need '(?m)^source_runner_authority:\s*(5501127513)\s*$' 'source_runner_authority'
          $binding = Need '(?m)^source_candidate_binding:\s*(5495537900)\s*$' 'source_candidate_binding'
          $targetId = Need '(?m)^target_conversation_id:\s*([0-9a-f-]+)\s*$' 'target_conversation_id'
          $targetUrl = Need '(?m)^target_conversation_url:\s*(https://chatgpt\.com/(?:g/[A-Za-z0-9._-]+/)?c/[0-9a-f-]+)\s*$' 'target_conversation_url'
          $idem = Need '(?m)^idempotency_key:\s*([A-Za-z0-9._:-]+)\s*$' 'idempotency_key'

          if ($targetId -cne '6a957d5b-19e8-83e8-9925-3343facccaf3') { throw 'Wrong generation009 conversation id' }
          if ($targetUrl -cne 'https://chatgpt.com/g/g-p-6a7b34dba7448191ac48d7789054813b-kong-zhi-ta-zhuan-an/c/6a957d5b-19e8-83e8-9925-3343facccaf3') { throw 'Wrong generation009 conversation URL' }

          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; 'User-Agent'='g8-g9-handoff-once'; Accept='application/vnd.github+json' }

          foreach($commentId in @('5501107432','5501127513','5495537900')) {
            $c = Invoke-RestMethod -Uri "https://api.github.com/repos/D22977/gpt-browser-bridge/issues/comments/$commentId" -Headers $headers -Method Get -TimeoutSec 30
            if ([string]$c.issue_url -notmatch '/issues/88$') { throw "Authority $commentId not on Issue88" }
          }

          $all = [System.Collections.Generic.List[object]]::new()
          function AddFlat([object]$value) {
            if ($null -eq $value) { return }
            if ($value -is [System.Array]) { foreach($n in $value){ AddFlat $n }; return }
            [void]$all.Add($value)
          }
          for($p=1;$p -le 30;$p++){
            $before=$all.Count
            AddFlat (Invoke-RestMethod -Uri "https://api.github.com/repos/D22977/gpt-browser-bridge/issues/88/comments?per_page=100&page=$p" -Headers $headers -Method Get -TimeoutSec 30)
            if(($all.Count-$before)-lt 100){break}
          }
          $switches = @($all | Where-Object {
            $_.body -match '(?m)^CONTROL_GENERATION_SWITCH_V1\s*$' -and
            $_.body -match '(?m)^state:\s*SWITCH_COMMITTED\s*$' -and
            $_.body -match '(?m)^new_generation_status:\s*ACTIVE\s*$'
          } | Sort-Object { [int64]$_.id })
          if($switches.Count -eq 0){throw 'No ACTIVE switch'}
          $latest=$switches[-1]
          $gm=[regex]::Match([string]$latest.body,'(?m)^new_generation:\s*(\d{3})\s*$')
          if(-not $gm.Success -or $gm.Groups[1].Value -cne '008'){throw "Generation008 no longer ACTIVE; latest=$($latest.id)"}

          $whoami = (& whoami).Trim()
          $identity = [System.Security.Principal.WindowsIdentity]::GetCurrent().Name
          $sid = [System.Diagnostics.Process]::GetCurrentProcess().SessionId
          if($whoami -notmatch '(?i)^d22977\\lupun$' -or $identity -notmatch '(?i)^d22977\\lupun$'){throw 'Unexpected Windows identity'}
          if(-not [Environment]::UserInteractive -or $sid -eq 0){throw 'Runner not interactive'}
          if($env:RUNNER_NAME -cne 'gbb-reviewer-win-01'){throw "Unexpected runner=$env:RUNNER_NAME"}

          $kind = if($isWake){'WAKE'}else{'EXAM'}
          "HANDOFF_KIND=$kind" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "SOURCE_EVENT_COMMENT_ID=$($event.comment.id)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "TARGET_CONVERSATION_ID=$targetId" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "TARGET_CONVERSATION_URL=$targetUrl" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "SOURCE_HANDFOFF_AUTHORITY=$authority" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "SOURCE_RUNNER_AUTHORITY=$runnerAuthority" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "SOURCE_CANDIDATE_BINDING=$binding" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "SOURCE_IDEMPOTENCY=$idem" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Current Herdr and DB01 access capability check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $herdr='C:\Users\Lupun\AppData\Local\Programs\Herdr\bin\herdr.exe'
          $pw='C:\Users\Lupun\AppData\Roaming\npm\node_modules\@playwright\cli\node_modules\.bin\playwright.cmd'
          $db01Root='D:\AIWORK_RUNTIME\GPT_BROWSER_BRIDGE\control-doorbell'
          $db01Profile='D:\AIWORK_RUNTIME\GPT_BROWSER_BRIDGE\control-doorbell\db01-profile'
          $session='HERDR-DOORBELL-DB01-G1-20260816'

          if(-not(Test-Path -LiteralPath $herdr)){throw 'Herdr CLI missing'}
          if(-not(Test-Path -LiteralPath $pw)){throw 'Playwright CLI missing'}
          if(-not(Test-Path -LiteralPath $db01Root -PathType Container)){throw 'DB01 runtime root missing'}
          if(-not(Test-Path -LiteralPath $db01Profile -PathType Container)){throw 'DB01 profile missing'}

          $herdrVersion=(& $herdr --version 2>&1|Out-String).Trim()
          if($LASTEXITCODE -ne 0){throw 'Herdr version check failed'}
          $agentList=(& $herdr agent list 2>&1|Out-String)
          if($LASTEXITCODE -ne 0){throw 'Herdr agent list failed'}
          try{$null=$agentList|ConvertFrom-Json}catch{throw 'Herdr agent list invalid JSON'}

          Push-Location $db01Root
          try {
            $sessions=(& $pw cli list 2>&1|Out-String)
            if($LASTEXITCODE -ne 0){throw 'Playwright session list failed'}
            $tabs=(& $pw cli "-s=$session" tab-list 2>&1|Out-String)
            $tabExit=$LASTEXITCODE
            if($tabExit -eq 1 -and $sessions -notmatch [regex]::Escape($session)){
              $open=(& $pw cli "-s=$session" open --persistent "--profile=$db01Profile" --headed 2>&1|Out-String)
              if($LASTEXITCODE -ne 0){throw "DB01 same-profile restart failed: $open"}
            }elseif($tabExit -ne 0){
              throw "DB01 session state ambiguous: $tabs"
            }

            $tabs=(& $pw cli "-s=$session" tab-list 2>&1|Out-String)
            if($LASTEXITCODE -ne 0){throw 'DB01 tab-list failed'}
            if($tabs -notmatch [regex]::Escape($env:TARGET_CONVERSATION_ID)){
              $goto=(& $pw cli "-s=$session" goto $env:TARGET_CONVERSATION_URL 2>&1|Out-String)
              if($LASTEXITCODE -ne 0){throw "Navigate exact 009 failed: $goto"}
            }
            $tabs=(& $pw cli "-s=$session" tab-list 2>&1|Out-String)
            if($LASTEXITCODE -ne 0){throw 'Final tab-list failed'}
            $lines=@($tabs -split "`r?`n"|Where-Object{$_ -match [regex]::Escape($env:TARGET_CONVERSATION_ID)})
            if($lines.Count -ne 1){throw "Exact 009 tab count=$($lines.Count)"}
            $ix=[regex]::Match($lines[0],'^\s*-\s*(\d+):')
            if(-not $ix.Success){throw '009 tab index parse failed'}
            $null=(& $pw cli "-s=$session" tab-select $ix.Groups[1].Value 2>&1|Out-String)
            if($LASTEXITCODE -ne 0){throw '009 tab select failed'}
          } finally { Pop-Location }

          "HERDR_VERSION=$herdrVersion" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "DB01_SESSION=$session" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "PLAYWRIGHT_CMD=$pw" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Deliver one bounded message to exact generation009 conversation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $stateRoot='D:\AIWORK_RUNTIME\GPT_BROWSER_BRIDGE\g8-g9-handoff-once\state'
          New-Item -ItemType Directory -Force -Path $stateRoot | Out-Null
          $statePath=Join-Path $stateRoot "$($env:SOURCE_EVENT_COMMENT_ID).json"
          if(Test-Path -LiteralPath $statePath){
            $s=Get-Content -LiteralPath $statePath -Raw|ConvertFrom-Json
            if($s.status -eq 'SENT'){Write-Output 'NO_OP_DUPLICATE';exit 0}
            if($s.status -eq 'SENDING'){throw 'UNCERTAIN_SEND / NO_BLIND_RETRY'}
          }

          $wake = 'Read GitHub directly. Rehydrate D22977/gpt-browser-bridge from Issue #43 latest CURRENT_START_HERE and Issue #88 exact generation009 binding/owner handoff authority 5501107432. You are the generation009 Control candidate at exact conversation 6a957d5b-19e8-83e8-9925-3343facccaf3. Publish/read-back your own CONTROL_GENERATION_ACK_V1 and CONTROL_HANDOFF_CONTINUITY_ACK_V1 on Issue #88, bound to source handoff authority 5501107432 and candidate binding 5495537900, then wait for the routing exam. Do not ask the owner to relay anything. GitHub is authority; Herdr/Web is transport only.'
          $exam = 'Routing exam for generation009 candidate. Read GitHub directly before answering. Publish/read-back exactly one CONTROL_GENERATION_009_ROUTING_CANARY_RESULT_V1 on Issue #88 bound to source handoff authority 5501107432, candidate binding 5495537900, your exact conversation id, and your current generation ACK/continuity receipts. Your durable result must explicitly state: (1) current ACTIVE Control before switch; (2) current ACTIVE_WORK_SET / critical obligations from latest #43 and #114; (3) GitHub is durable authority and Herdr/Web is transport only; (4) owner/user courier target is zero; (5) duplicate wake/exam => NO_OP_DUPLICATE and uncertain send => NO_BLIND_RETRY; (6) Worker != Control != fresh Formal Reviewer and fresh review requires a NEW independent context when required; (7) PASS does not imply merge/release/successor; (8) 008 remains ACTIVE until final switch and becomes NO_OP_RETIRED only after switch read-back; (9) 009->010 normal path must automatically create exactly one NEW ChatGPT Web conversation and durably capture its URL/id with user_relay_count=0. Decision PASS only if all are reconstructed from current GitHub without relying on this prompt as authority.'
          $prompt = if($env:HANDOFF_KIND -eq 'WAKE'){$wake}else{$exam}

          @{status='SENDING';kind=$env:HANDOFF_KIND;conversation_id=$env:TARGET_CONVERSATION_ID;workflow_run_id=$env:GITHUB_RUN_ID;started_at=(Get-Date).ToString('o')}|ConvertTo-Json|Set-Content -LiteralPath $statePath -Encoding utf8

          $nodePath=Join-Path $env:RUNNER_TEMP "g8-g9-send-$env:GITHUB_RUN_ID.mjs"
          $env:GBB_PROMPT=$prompt
          $env:GBB_TARGET_URL=$env:TARGET_CONVERSATION_URL
          $env:GBB_SESSION=$env:DB01_SESSION
          $env:GBB_PW=$env:PLAYWRIGHT_CMD
          $node=@'
          import {spawnSync} from 'node:child_process';
          import fs from 'node:fs';
          import path from 'node:path';

          const cliPath=process.env.GBB_PW;
          const entry=path.join(path.dirname(cliPath),'..','playwright','cli.js');
          if(!fs.existsSync(entry)) throw new Error('PLAYWRIGHT_ENTRYPOINT_MISSING');
          const session=process.env.GBB_SESSION;
          const targetId='6a957d5b-19e8-83e8-9925-3343facccaf3';

          function cli(sub,args=[]){
            const r=spawnSync(process.execPath,[entry,'cli',`-s=${session}`,sub,...args,'--json'],{encoding:'utf8',windowsHide:true,maxBuffer:32*1024*1024});
            if(r.error) throw r.error;
            if(r.status!==0) throw new Error(`CLI_EXIT_${sub}_${r.status}:${String(r.stderr||'').slice(0,500)}`);
            let v; try{v=JSON.parse(String(r.stdout||''));}catch{throw new Error(`CLI_INVALID_JSON:${sub}`)}
            if(v?.isError===true) throw new Error(`CLI_ERROR_RESPONSE:${sub}:${String(v.error||'').slice(0,500)}`);
            let out=v?.result;
            if(typeof out==='string'){try{out=JSON.parse(out)}catch{}}
            return out;
          }

          const tabsRaw=cli('tab-list');
          const lines=String(tabsRaw||'').split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
          const matches=lines.filter(s=>s.includes(targetId));
          if(matches.length!==1) throw new Error(`TARGET_TAB_COUNT_${matches.length}`);
          const m=/^-\s*(\d+):/.exec(matches[0]);
          if(!m) throw new Error('TARGET_TAB_INDEX_MISSING');
          cli('tab-select',[m[1]]);

          let selector=null;
          let lastMeta=null;
          const deadline=Date.now()+60000;
          while(Date.now()<deadline){
            lastMeta=cli('eval',[`() => {
              const id=(location.pathname.match(/\\/c\\/([0-9a-f-]+)/i)||[])[1]||'';
              const texts=Array.from(document.querySelectorAll('textarea')).map((e,i)=>{const r=e.getBoundingClientRect(),s=getComputedStyle(e);return {i,disabled:Boolean(e.disabled),readOnly:Boolean(e.readOnly),display:s.display,visibility:s.visibility,pointerEvents:s.pointerEvents,width:Math.round(r.width),height:Math.round(r.height),aria:e.getAttribute('aria-label')||'',placeholder:e.getAttribute('placeholder')||'',id:e.id||''}});
              return {conversationId:id,texts};
            }`]);
            if(String(lastMeta?.conversationId)!==targetId) throw new Error('CONVERSATION_MISMATCH');
            const enabled=(lastMeta?.texts||[]).filter(x=>!x.disabled&&!x.readOnly&&x.display!=='none'&&x.visibility!=='hidden'&&x.pointerEvents!=='none'&&x.width>250&&x.height>20);
            if(enabled.length===1){
              const e=enabled[0];
              if(e.id==='prompt-textarea') selector='#prompt-textarea';
              else if(e.aria) selector=`textarea[aria-label=${JSON.stringify(e.aria)}]`;
              else if(e.placeholder) selector=`textarea[placeholder=${JSON.stringify(e.placeholder)}]`;
              else selector='textarea:not([disabled])';
              break;
            }
            Atomics.wait(new Int32Array(new SharedArrayBuffer(4)),0,0,1000);
          }
          if(!selector) throw new Error(`EDITOR_NOT_READY:${JSON.stringify(lastMeta).slice(0,800)}`);

          cli('fill',[selector,process.env.GBB_PROMPT]);
          cli('click',['[data-testid="send-button"]']);
          console.log(JSON.stringify({ok:true,selector}));
          '@
          Set-Content -LiteralPath $nodePath -Value $node -Encoding utf8
          try {
            $result=& node $nodePath 2>&1|Out-String
            if($LASTEXITCODE -ne 0){throw $result}
          } catch {
            $detail=($_.Exception.Message -replace '[\r\n]+',' ')
            if($detail.Length -gt 800){$detail=$detail.Substring(0,800)}
            throw "UNCERTAIN_SEND_OR_PRECLICK_FAILURE / NO_BLIND_RETRY: $detail"
          } finally {
            Remove-Item -LiteralPath $nodePath -Force -ErrorAction SilentlyContinue
          }

          @{status='SENT';kind=$env:HANDOFF_KIND;conversation_id=$env:TARGET_CONVERSATION_ID;workflow_run_id=$env:GITHUB_RUN_ID;sent_at=(Get-Date).ToString('o')}|ConvertTo-Json|Set-Content -LiteralPath $statePath -Encoding utf8

          $headers=@{Authorization="Bearer $env:GH_TOKEN";'User-Agent'='g8-g9-handoff-once';Accept='application/vnd.github+json'}
          $receipt=@(
            'HERDR_G8_G9_HANDOFF_DELIVERY_V1',
            'state: SENT_WAIT_CANDIDATE_DURABLE_RESULT',
            "handoff_kind: $env:HANDOFF_KIND",
            "source_event_comment_id: $env:SOURCE_EVENT_COMMENT_ID",
            "source_handoff_authority: $env:SOURCE_HANDFOFF_AUTHORITY",
            "source_runner_authority: $env:SOURCE_RUNNER_AUTHORITY",
            "source_candidate_binding: $env:SOURCE_CANDIDATE_BINDING",
            "target_conversation_id: $env:TARGET_CONVERSATION_ID",
            "target_conversation_url: $env:TARGET_CONVERSATION_URL",
            "herdr_version: $env:HERDR_VERSION",
            "db01_session: $env:DB01_SESSION",
            "workflow_run_id: $env:GITHUB_RUN_ID",
            'physical_send_count: 1',
            'user_relay_count: 0',
            'readback_required: true'
          ) -join "`n"
          $payload=@{body=$receipt}|ConvertTo-Json -Compress
          $pub=Invoke-RestMethod -Uri 'https://api.github.com/repos/D22977/gpt-browser-bridge/issues/88/comments' -Headers $headers -Method Post -Body $payload -ContentType 'application/json' -TimeoutSec 30
          $rb=Invoke-RestMethod -Uri "https://api.github.com/repos/D22977/gpt-browser-bridge/issues/comments/$($pub.id)" -Headers $headers -Method Get -TimeoutSec 30
          if([string]$rb.body -cne $receipt){throw 'Delivery receipt readback mismatch'}
          "DELIVERY_RECEIPT_ID=$($pub.id)"|Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Wait for exact generation009 durable response
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $headers=@{Authorization="Bearer $env:GH_TOKEN";'User-Agent'='g8-g9-handoff-once';Accept='application/vnd.github+json'}
          function GetAll {
            $all=[System.Collections.Generic.List[object]]::new()
            function AF([object]$v){if($null -eq $v){return};if($v -is [System.Array]){foreach($n in $v){AF $n};return};[void]$all.Add($v)}
            for($p=1;$p -le 30;$p++){
              $before=$all.Count
              AF (Invoke-RestMethod -Uri "https://api.github.com/repos/D22977/gpt-browser-bridge/issues/88/comments?per_page=100&page=$p" -Headers $headers -Method Get -TimeoutSec 30)
              if(($all.Count-$before)-lt 100){break}
            }
            return $all.ToArray()
          }
          function Publish([string]$text){
            $payload=@{body=$text}|ConvertTo-Json -Compress
            $r=Invoke-RestMethod -Uri 'https://api.github.com/repos/D22977/gpt-browser-bridge/issues/88/comments' -Headers $headers -Method Post -Body $payload -ContentType 'application/json' -TimeoutSec 30
            $rb=Invoke-RestMethod -Uri "https://api.github.com/repos/D22977/gpt-browser-bridge/issues/comments/$($r.id)" -Headers $headers -Method Get -TimeoutSec 30
            if([string]$rb.body -cne $text){throw 'Guard result readback mismatch'}
            return [string]$r.id
          }

          $deadline=[DateTimeOffset]::UtcNow.AddMinutes(8)
          while([DateTimeOffset]::UtcNow -lt $deadline){
            $c=@(GetAll|Where-Object{[int64]$_.id -gt [int64]$env:SOURCE_EVENT_COMMENT_ID}|Sort-Object{[int64]$_.id})
            if($env:HANDOFF_KIND -eq 'WAKE'){
              $ack=@($c|Where-Object{
                $_.body -match '(?m)^CONTROL_GENERATION_ACK_V1\s*$' -and
                $_.body -match '(?m)^generation:\s*009\s*$' -and
                $_.body -match "(?m)^conversation_id:\s*$([regex]::Escape($env:TARGET_CONVERSATION_ID))\s*$"
              })
              $cont=@($c|Where-Object{
                $_.body -match '(?m)^CONTROL_HANDOFF_CONTINUITY_ACK_V1\s*$' -and
                $_.body -match '(?m)^generation:\s*009\s*$' -and
                $_.body -match "(?m)^conversation_id:\s*$([regex]::Escape($env:TARGET_CONVERSATION_ID))\s*$"
              })
              if($ack.Count -eq 1 -and $cont.Count -eq 1){
                $text=@(
                  'HERDR_G8_G9_HANDOFF_GUARD_RESULT_V1',
                  'state: PASS_WAKE_ACK_CONTINUITY_OBSERVED',
                  'decision: PASS',
                  'handoff_kind: WAKE',
                  "source_event_comment_id: $env:SOURCE_EVENT_COMMENT_ID",
                  "source_delivery_receipt: $env:DELIVERY_RECEIPT_ID",
                  "generation009_ack_receipt: $($ack[0].id)",
                  "generation009_continuity_receipt: $($cont[0].id)",
                  "target_conversation_id: $env:TARGET_CONVERSATION_ID",
                  'user_relay_count: 0',
                  'readback_required: true'
                ) -join "`n"
                $id=Publish $text
                Write-Output "PASS guard=$id"
                exit 0
              }
              if($ack.Count -gt 1 -or $cont.Count -gt 1){throw 'Duplicate/ambiguous 009 ACK or continuity receipts'}
            } else {
              $canary=@($c|Where-Object{
                $_.body -match '(?m)^CONTROL_GENERATION_009_ROUTING_CANARY_RESULT_V1\s*$' -and
                $_.body -match "(?m)^conversation_id:\s*$([regex]::Escape($env:TARGET_CONVERSATION_ID))\s*$"
              })
              if($canary.Count -eq 1){
                $text=@(
                  'HERDR_G8_G9_HANDOFF_GUARD_RESULT_V1',
                  'state: PASS_ROUTING_CANARY_OBSERVED',
                  'decision: PASS',
                  'handoff_kind: EXAM',
                  "source_event_comment_id: $env:SOURCE_EVENT_COMMENT_ID",
                  "source_delivery_receipt: $env:DELIVERY_RECEIPT_ID",
                  "generation009_routing_canary_receipt: $($canary[0].id)",
                  "target_conversation_id: $env:TARGET_CONVERSATION_ID",
                  'user_relay_count: 0',
                  'readback_required: true'
                ) -join "`n"
                $id=Publish $text
                Write-Output "PASS guard=$id"
                exit 0
              }
              if($canary.Count -gt 1){throw 'Duplicate/ambiguous 009 routing canary receipts'}
            }
            Start-Sleep -Seconds 5
          }

          $text=@(
            'HERDR_G8_G9_HANDOFF_GUARD_RESULT_V1',
            'state: BLOCKED_TIMEOUT_WAITING_CANDIDATE_DURABLE_RESULT',
            'decision: BLOCKED',
            "handoff_kind: $env:HANDOFF_KIND",
            "source_event_comment_id: $env:SOURCE_EVENT_COMMENT_ID",
            "source_delivery_receipt: $env:DELIVERY_RECEIPT_ID",
            "target_conversation_id: $env:TARGET_CONVERSATION_ID",
            'physical_resend_authorized: false',
            'user_relay_count: 0',
            'readback_required: true'
          ) -join "`n"
          $id=Publish $text
          throw "Timed out waiting for generation009 durable result; receipt=$id; NO_BLIND_RETRY"
