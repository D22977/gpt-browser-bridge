            $actualBlob=(& git -C $repoRoot hash-object -- $senderRel).Trim();if($actualBlob-cne$expectedSenderBlob){return [pscustomobject]@{State='CONTROL_REQUIRED';PhysicalSendCount='0';SecondPhysicalSend='false';Reason="FALLBACK_LOCAL_SENDER_BLOB_MISMATCH_$actualBlob"}}
