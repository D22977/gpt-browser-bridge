          function Get-ProtocolFirstLine([object]$comment){
            $first=[string]((([string]$comment.body)-split"`r?`n",2)[0]);return $first.Trim()
          }

          function Has-Protocol([object]$comment,[string]$marker){return ((Get-ProtocolFirstLine $comment)-ceq$marker)}

          function Parse-Switch([object]$comment){
            $body=[string]$comment.body
            if(-not(Has-Protocol $comment 'CONTROL_GENERATION_SWITCH_V1')-or$body-notmatch'(?m)^state:\s*SWITCH_COMMITTED\s*$'){throw "committed switch malformed id=$(Get-CommentId $comment)"}
            $generation=[regex]::Match($body,'(?m)^new_generation:\s*(\d{3})\s*$');$conversationId=[regex]::Match($body,'(?m)^new_conversation_id:\s*([0-9a-f-]+)\s*$');$conversationUrl=[regex]::Match($body,'(?m)^new_conversation_url:\s*(https://chatgpt\.com/(?:g/[A-Za-z0-9._-]+/)?c/[0-9a-f-]+)\s*$')
            $statusA=[regex]::Match($body,'(?m)^new_status:\s*([A-Z_]+)\s*$');$statusB=[regex]::Match($body,'(?m)^new_generation_status:\s*([A-Z_]+)\s*$')
