            $promptHash=[Convert]::ToHexString([System.Security.Cryptography.SHA256]::HashData([System.Text.Encoding]::UTF8.GetBytes($prompt))).ToLowerInvariant();@{status='SENDING';logical_key=$fallbackKey;source_terminal_receipt=$sourceTerminal;source_card_id=$sourceCard;candidate_head=$candidateHead;active_switch_receipt=$switch.Receipt;target_generation=$switch.Generation;target_conversation_id=$switch.ConversationId;target_conversation_url=$switch.ConversationUrl;prompt_sha256=$promptHash;workflow_run_id=$env:GITHUB_RUN_ID;started_at=(Get-Date).ToString('o')}|ConvertTo-Json|Set-Content -LiteralPath $fallbackStatePath -Encoding utf8
