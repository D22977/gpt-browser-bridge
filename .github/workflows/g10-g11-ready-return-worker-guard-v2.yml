            $receipt=[string](Get-CommentId $comment);$readback=Get-Comment $receipt;if([string]$readback.body-cne$body){throw "downstream canary readback mismatch id=$receipt"}
            return [pscustomobject]@{Receipt=$receipt;State=$state.Groups[1].Value;Body=$body}
          }

          function Wait-ForDoorbellCanary([string]$since,[string]$sourceTerminal,[string]$sourceCard,[string]$candidateHead){
            for($i=0;$i-lt60;$i++){
              $recent=@(Get-Recent88 $since);$found=[System.Collections.Generic.List[object]]::new()
              foreach($comment in $recent){$record=Read-ExactDoorbellCanary $comment $sourceTerminal $sourceCard $candidateHead;if($null-ne$record){[void]$found.Add($record)}}
              if($found.Count-gt1){throw 'conflicting downstream canary terminals for one logical return'}
              if($found.Count-eq1){return $found[0]}
              Start-Sleep -Seconds 10
            }
            throw 'DOWNSTREAM_CANARY_TIMEOUT_AFTER_WORKFLOW_DISPATCH'
          }

