            $out=& $herdr agent prompt $pane $prompt 2>&1|Out-String;if($LASTEXITCODE-ne0){throw 'UNCERTAIN_SEND_NO_BLIND_RETRY: prompt command crossed send boundary'}
            try{$r=$out|ConvertFrom-Json}catch{throw 'UNCERTAIN_SEND_NO_BLIND_RETRY: prompt response not JSON'}
            if([string]$r.result.type-ne'agent_prompted'-or[string]$r.result.agent.pane_id-cne$pane-or[string]$r.result.agent.agent_session.value-cne$session){throw 'UNCERTAIN_SEND_NO_BLIND_RETRY: prompt binding mismatch'}
            $deliveryReceipt=Publish(@('CONTROL_G10_G11_READY_RETURN_GUARD_V2_DELIVERY_V1','state: DELIVERED','decision: PASS_TRANSPORT_ONLY',"source_dispatch_card: $cardReceipt","source_transport_authority: $authority","source_current_switch: $expectedSwitch","target_pane: $pane","target_agent_session: $session","prompt_sha256: $promptHash",'physical_prompt_count: 1','second_physical_prompt: false','post_dispatch_terminal_guard: ACTIVE','user_relay_count: 0',"workflow_run_id: $env:GITHUB_RUN_ID",'readback_required: true')-join"`n")
            @{status='SENT';pane_id=$pane;agent_session=$session;prompt_sha256=$promptHash;delivery_receipt=$deliveryReceipt;workflow_run_id=$env:GITHUB_RUN_ID;sent_at=(Get-Date).ToString('o')}|ConvertTo-Json|Set-Content -LiteralPath $statePath -Encoding utf8
          }

          $sourceWorkerTerminal='NONE';$normalizedState=$null;$guardEventKey=$null;$reason='';$workerBranch='NONE';$candidateHead='NONE';$idleCount=0
          for($i=0;$i-lt600;$i++){
            $sw=Get-CurrentSwitch;$recent=@(Get-Recent88 $sw.Since);$matches=@($recent|Where-Object{(Has-Protocol $_ 'GBB_READY_RETURN_CLOSURE_READY_V1')-and[string]$_.body-match'(?m)^card_id:\s*GBB-READY-RETURN-CLOSURE-01\s*$'}|Sort-Object{Get-CommentId $_})
            if($matches.Count-gt1){$normalizedState='CONTROL_REQUIRED';$reason='MULTIPLE_WORKER_TERMINALS';$guardEventKey='MULTIPLE_WORKER_TERMINALS';break}
            if($matches.Count-eq1){
              $sourceWorkerTerminal=[string](Get-CommentId $matches[0]);$tb=[string]$matches[0].body;$tm=[regex]::Match($tb,'(?m)^state:\s*(READY_FOR_FRESH_REVIEW|BLOCKED|CONTROL_REQUIRED)\s*$')
              if(-not$tm.Success){$normalizedState='CONTROL_REQUIRED';$reason='MALFORMED_WORKER_TERMINAL_STATE'}else{$normalizedState=$tm.Groups[1].Value}
              $bm=[regex]::Match($tb,'(?m)^worker_branch:\s*(\S+)\s*$');$hm=[regex]::Match($tb,'(?m)^candidate_head:\s*(\S+)\s*$');if($bm.Success){$workerBranch=$bm.Groups[1].Value};if($hm.Success){$candidateHead=$hm.Groups[1].Value}
              $guardEventKey="WORKER_TERMINAL_$sourceWorkerTerminal";break
            }
            if(-not[string]::IsNullOrWhiteSpace($pane)-and-not[string]::IsNullOrWhiteSpace($session)){
              try{$raw2=& $herdr agent list 2>&1|Out-String;if($LASTEXITCODE-ne0){throw 'agent list failed'};$l2=$raw2|ConvertFrom-Json}catch{$normalizedState='CONTROL_REQUIRED';$reason='HERDR_GUARD_AGENT_LIST_FAILED';$guardEventKey="GUARD_AGENT_LIST_FAILED_$deliveryReceipt";break}
              $exact=@($l2.result.agents|Where-Object{[string]$_.pane_id-ceq$pane-and[string]$_.agent_session.value-ceq$session});if($exact.Count-ne1){$normalizedState='CONTROL_REQUIRED';$reason='EXACT_BOUND_SESSION_MISSING';$guardEventKey="ABNORMAL_MISSING_$deliveryReceipt";break}
              $status=[string]$exact[0].agent_status;if($status-in@('idle','done')){$idleCount++}else{$idleCount=0};if($idleCount-ge2){$normalizedState='CONTROL_REQUIRED';$reason='TERMINAL_MISSING_AFTER_BOUND_SESSION_IDLE_OR_DONE';$guardEventKey="ABNORMAL_IDLE_$deliveryReceipt";break}
            }
            Start-Sleep -Seconds 30
          }
          if([string]::IsNullOrWhiteSpace($normalizedState)){$normalizedState='CONTROL_REQUIRED';$reason='GUARD_LIVENESS_BUDGET_EXHAUSTED';$guardEventKey="LIVENESS_$deliveryReceipt"}

          $recent=@(Get-Recent88 $sw.Since);$priorNorm=@($recent|Where-Object{(Has-Protocol $_ 'CONTROL_G10_G11_READY_RETURN_GUARD_V2_TERMINAL_V1')-and[string]$_.body-match("(?m)^guard_event_key:\s*$([regex]::Escape($guardEventKey))\s*$")}|Sort-Object{Get-CommentId $_})
          if($priorNorm.Count-gt1){throw 'conflicting duplicate normalized terminals'}
          if($priorNorm.Count-eq1){$normalizedReceipt=[string](Get-CommentId $priorNorm[0])}else{$normalizedReceipt=Publish(@('CONTROL_G10_G11_READY_RETURN_GUARD_V2_TERMINAL_V1',"state: $normalizedState","card_id: $cardId","source_dispatch_card: $cardReceipt","source_worker_terminal_receipt: $sourceWorkerTerminal","guard_event_key: $guardEventKey","reason: $reason","worker_branch: $workerBranch","candidate_head: $candidateHead","target_pane: $pane","target_agent_session: $session",'user_relay_count: 0',"workflow_run_id: $env:GITHUB_RUN_ID",'readback_required: true')-join"`n")}

          try{$sw2=Verify-Authority}catch{$id=Publish(@('CONTROL_G10_G11_READY_RETURN_GUARD_V2_RESULT_V1','state: CONTROL_REQUIRED_NO_RETURN_REQUEST',"source_normalized_terminal_receipt: $normalizedReceipt",'reason: CURRENT_SWITCH_PARSE_FAILED','user_relay_count: 0',"workflow_run_id: $env:GITHUB_RUN_ID",'readback_required: true')-join"`n");throw "Cannot create return request receipt=$id"}
          $recent=@(Get-Recent88 $sw2.Since);$idem="$cardId`:$normalizedReceipt`:$candidateHead"
          $priorReq=@($recent|Where-Object{(Has-Protocol $_ 'CONTROL_READY_RETURN_REQUEST_V2')-and[string]$_.body-match("(?m)^idempotency_key:\s*$([regex]::Escape($idem))\s*$")});if($priorReq.Count-gt1){throw 'conflicting duplicate return requests'}
          if($priorReq.Count-eq1){$request=[string](Get-CommentId $priorReq[0])}else{$request=Publish(@('CONTROL_READY_RETURN_REQUEST_V2',"source_transport_authority: $authority","source_card_id: $cardId","source_terminal_receipt: $normalizedReceipt","candidate_head: $candidateHead","target_control_generation: $($sw2.Generation)","target_control_conversation_id: $($sw2.ConversationId)","target_control_conversation_url: $($sw2.ConversationUrl)","idempotency_key: $idem",'user_relay_count: 0','readback_required: true')-join"`n")}

          $priorDispatch=@($recent|Where-Object{(Has-Protocol $_ 'CONTROL_G10_G11_UNATTENDED_RETURN_WORKFLOW_DISPATCH_V1')-and[string]$_.body-match("(?m)^idempotency_key:\s*$([regex]::Escape($idem))\s*$")});if($priorDispatch.Count-gt1){throw 'conflicting duplicate workflow dispatch receipts'}
          if($priorDispatch.Count-eq1){$dispatch=[string](Get-CommentId $priorDispatch[0])}else{
            $payload=@{ref=$baseBranch;inputs=@{source_terminal_receipt=$normalizedReceipt;source_card_id=$cardId;candidate_head=$candidateHead;idempotency_key=$idem}}|ConvertTo-Json -Depth 5 -Compress
            Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/actions/workflows/g10-g11-ready-return-control-doorbell-v2.yml/dispatches" -Headers $headers -Method Post -Body $payload -ContentType 'application/json' -TimeoutSec 30|Out-Null
            $dispatch=Publish(@('CONTROL_G10_G11_UNATTENDED_RETURN_WORKFLOW_DISPATCH_V1','state: DISPATCHED',"source_return_request: $request","source_terminal_receipt: $normalizedReceipt","source_card_id: $cardId","candidate_head: $candidateHead","workflow_file: .github/workflows/g10-g11-ready-return-control-doorbell-v2.yml","workflow_ref: $baseBranch","idempotency_key: $idem",'physical_send_count: 0','second_physical_send: false','user_relay_count: 0',"workflow_run_id: $env:GITHUB_RUN_ID",'readback_required: true')-join"`n")
          }

          # HTTP 204/workflow dispatch acceptance is not terminal success. Keep
          # WAIT_CHILD_TERMINAL_GUARD ownership until the exact canary is read back.
          $downstream=$null
          try{$downstream=Wait-ForDoorbellCanary $sw2.Since $normalizedReceipt $cardId $candidateHead}catch{
            $safe=($_.Exception.Message-replace'[\r\n]+',' ');if($safe.Length-gt500){$safe=$safe.Substring(0,500)}
            $timeoutReceipt=Publish(@('CONTROL_G10_G11_UNATTENDED_RETURN_WORKFLOW_RESULT_V1','state: CONTROL_REQUIRED',"source_workflow_dispatch_receipt: $dispatch","source_terminal_receipt: $normalizedReceipt","source_card_id: $cardId","candidate_head: $candidateHead","guard_phase: WAIT_CHILD_TERMINAL_GUARD","reason: $safe",'fallback_invoked: false','physical_send_count: UNKNOWN','second_physical_send: false','user_relay_count: 0',"workflow_run_id: $env:GITHUB_RUN_ID",'readback_required: true')-join"`n")
            throw "DOWNSTREAM_CANARY_NOT_TERMINAL receipt=$timeoutReceipt"
          }
          if($downstream.State-eq'CONTROL_REQUIRED_NO_SEND'){
            $normalizedControl=Publish(@('CONTROL_G10_G11_UNATTENDED_RETURN_WORKFLOW_RESULT_V1','state: CONTROL_REQUIRED',"source_workflow_dispatch_receipt: $dispatch","source_downstream_canary_receipt: $($downstream.Receipt)","source_terminal_receipt: $normalizedReceipt","source_card_id: $cardId","candidate_head: $candidateHead","guard_phase: WAIT_CHILD_TERMINAL_GUARD","reason: DOWNSTREAM_CONTROL_REQUIRED_NO_SEND_BEFORE_PHYSICAL_SEND",'fallback_authorized: true','candidate_pass: false','physical_send_count: 0','second_physical_send: false','user_relay_count: 0',"workflow_run_id: $env:GITHUB_RUN_ID",'readback_required: true')-join"`n")
            try{$fallback=Invoke-AuthorizedDirectControlFallback $sw2 $normalizedReceipt $cardId $candidateHead $downstream.Receipt}catch{$detail=($_.Exception.Message-replace'[\r\n]+',' ');if($detail.Length-gt500){$detail=$detail.Substring(0,500)};$fallback=[pscustomobject]@{State='CONTROL_REQUIRED';PhysicalSendCount='UNKNOWN_AFTER_SEND_BOUNDARY';SecondPhysicalSend='false';Reason="FALLBACK_NOT_RETRIED: $detail"}}
            if([string]$fallback.PhysicalSendCount-eq'1'){$fallbackCountLine='fallback_physical_send_count: 1'}else{$fallbackCountLine="fallback_physical_send_count: $($fallback.PhysicalSendCount)"}
            $fallbackReceipt=Publish(@('CONTROL_G10_G11_UNATTENDED_RETURN_FALLBACK_V1','state: CONTROL_REQUIRED','decision: RECOVERY_ONLY_NOT_CANDIDATE_PASS',"source_normalized_control_required_receipt: $normalizedControl","source_downstream_canary_receipt: $($downstream.Receipt)","source_terminal_receipt: $normalizedReceipt","source_card_id: $cardId","candidate_head: $candidateHead",'direct fallback Control doorbell: bounded and single-attempt',"fallback_result: $($fallback.Reason)",$fallbackCountLine,'second_physical_send: false','candidate_pass: false','user_relay_count: 0',"workflow_run_id: $env:GITHUB_RUN_ID",'readback_required: true')-join"`n")
            Write-Output "CONTROL_REQUIRED fallback_receipt=$fallbackReceipt";exit 0
          }
          $terminalDecision=if($downstream.State-eq'DELIVERED'){'DOWNSTREAM_DELIVERED_NOT_ACCEPTED_BY_WORKER'}else{'DOWNSTREAM_NO_OP_DUPLICATE_NOT_ACCEPTED_BY_WORKER'}
          $terminalReceipt=Publish(@('CONTROL_G10_G11_UNATTENDED_RETURN_WORKFLOW_RESULT_V1','state: DOWNSTREAM_CANARY_TERMINAL',"decision: $terminalDecision","source_workflow_dispatch_receipt: $dispatch","source_downstream_canary_receipt: $($downstream.Receipt)","source_terminal_receipt: $normalizedReceipt","source_card_id: $cardId","candidate_head: $candidateHead",'guard_phase: WAIT_CHILD_TERMINAL_GUARD','fallback_invoked: false','candidate_pass: false','user_relay_count: 0',"workflow_run_id: $env:GITHUB_RUN_ID",'readback_required: true')-join"`n")
          Write-Output "DOWNSTREAM_CANARY_TERMINAL receipt=$terminalReceipt"
