            try{$out=(& node $fallbackScriptPath 2>&1|Out-String).Trim();if($LASTEXITCODE-ne0){throw $out};$json=($out-split"`n"|Where-Object{$_.Trim().StartsWith('{')}|Select-Object -Last 1);if(-not$json){throw 'fallback sender JSON missing'};$sent=$json|ConvertFrom-Json}catch{$stored=@{status='UNCERTAIN';logical_key=$fallbackKey;workflow_run_id=$env:GITHUB_RUN_ID;reason=$_.Exception.Message};$stored|ConvertTo-Json|Set-Content -LiteralPath $fallbackStatePath -Encoding utf8;Remove-Item -LiteralPath $fallbackScriptPath -Force -ErrorAction SilentlyContinue;return [pscustomobject]@{State='CONTROL_REQUIRED';PhysicalSendCount='UNKNOWN_AFTER_SEND_BOUNDARY';SecondPhysicalSend='false';Reason='FALLBACK_UNCERTAIN_SEND_NO_BLIND_RETRY'}}finally{Remove-Item -LiteralPath $fallbackScriptPath -Force -ErrorAction SilentlyContinue}
