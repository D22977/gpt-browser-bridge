            return [pscustomobject]@{Receipt=([string](Get-CommentId $comment));Generation=$generation.Groups[1].Value;ConversationId=$conversationId.Groups[1].Value;ConversationUrl=$conversationUrl.Groups[1].Value;Since=([DateTimeOffset]$comment.created_at).ToString('o')}
          }

          function Get-CurrentSwitch{
            $anchor=Get-Comment $expectedSwitch;$anchorSwitch=Parse-Switch $anchor;$recent=@(Get-Recent88 $anchorSwitch.Since)
            $latest=$anchor;$latestId=Get-CommentId $latest
            $switchEvidence=@($recent|Where-Object{Has-Protocol $_ 'CONTROL_GENERATION_SWITCH_V1'})
            foreach($candidate in $switchEvidence){$candidateId=Get-CommentId $candidate;if($candidateId-gt$latestId){$null=Parse-Switch $candidate;$latest=$candidate;$latestId=$candidateId}}
            return Parse-Switch $latest
          }

          function Verify-Authority{
            foreach($cid in @($authority,$cardReceipt,$amend,$schema,$presendFix,$expectedSwitch)){$null=Get-Comment $cid}
            $sw=Get-CurrentSwitch;if($sw.Receipt-cne$expectedSwitch-or$sw.Generation-cne'010'-or$sw.ConversationId-cne$expectedConversationId-or$sw.ConversationUrl-cne$expectedConversationUrl){throw "current Control superseded switch=$($sw.Receipt) generation=$($sw.Generation) conversation=$($sw.ConversationId)"};return $sw
          }

          function Fail-Presend([string]$gate,[string]$detail=''){
            $safe=($detail-replace'[\r\n]+',' ');if($safe.Length-gt500){$safe=$safe.Substring(0,500)}
