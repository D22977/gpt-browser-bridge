            $fallbackRoot='D:\AIWORK_RUNTIME\GPT_BROWSER_BRIDGE\g10-g11-ready-return-worker-guard-v2\fallback';$fallbackKey="$repo|$sourceCard|$sourceTerminal|$candidateHead|direct-fallback";$fallbackHash=([Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($fallbackKey)))).ToLowerInvariant();$fallbackStatePath=Join-Path $fallbackRoot "$fallbackHash.json";New-Item -ItemType Directory -Force -Path $fallbackRoot|Out-Null
            if(Test-Path -LiteralPath $fallbackStatePath){try{$old=Get-Content -LiteralPath $fallbackStatePath -Raw|ConvertFrom-Json}catch{throw 'CONTROL_REQUIRED: corrupt direct fallback state'};if([string]$old.status-in@('PRECHECKING','SENDING','UNCERTAIN')){throw 'CONTROL_REQUIRED: direct fallback already attempted or send boundary uncertain; no blind retry'};if([string]$old.status-eq'SENT'){return [pscustomobject]@{State='CONTROL_REQUIRED';PhysicalSendCount='0';SecondPhysicalSend='false';Reason='direct fallback already sent; publication/reconciliation only'}}}
