name: G12 Issue162 Visible Herdr Restore Worker Once

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: g12-issue162-visible-herdr-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.event.issue.number == 162 &&
      github.event.comment.user.login == 'D22977' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, 'ISSUE162_VISIBLE_HERDR_RESTORE_WORKER_WAKE_V1')
    runs-on: [self-hosted, Windows, GBB-REVIEWER]
    timeout-minutes: 12
    defaults:
      run:
        shell: pwsh -NoProfile -File {0}
    steps:
      - name: Dispatch one visible fresh child through existing Herdr runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $h='C:\Users\Lupun\AppData\Local\Programs\Herdr\bin\herdr.exe'
          $repo='D22977/gpt-browser-bridge'
          $issue=162
          $workerDispatch='5634122585'
          $transportAuthority='5634127848'
          $ev=Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
          $wake=[string]$ev.comment.id
          $wakeBody=[string]$ev.comment.body
          $m=[regex]::Match($wakeBody,'(?m)^worker_base_sha:\s*([0-9a-f]{40})\s*$')
          if(-not $m.Success){throw 'WORKER_BASE_MISSING'}
          $workerBase=$m.Groups[1].Value
          if($workerBase -cne '959962c1e275658aad97710dbb79d2d72c01ece8'){throw 'WORKER_BASE_MISMATCH'}
          $lm=[regex]::Match($wakeBody,'(?m)^launcher_head_sha:\s*([0-9a-f]{40})\s*$')
          if(-not $lm.Success){throw 'LAUNCHER_HEAD_MISSING'}
          $launcherHead=$lm.Groups[1].Value
          if($launcherHead -cne $env:GITHUB_SHA){throw 'LAUNCHER_HEAD_MISMATCH'}
          if(-not(Test-Path -LiteralPath $h -PathType Leaf)){throw 'HERDR_EXE_MISSING'}
          $status=(& $h status server 2>&1 | Out-String)
          if($LASTEXITCODE -ne 0 -or $status -notmatch '(?m)^status:\s*running\s*$'){throw "HERDR_SERVER_NOT_RUNNING $status"}

          $listRaw=(& $h agent list 2>&1 | Out-String)
          if($LASTEXITCODE -ne 0){throw "HERDR_AGENT_LIST_FAILED $listRaw"}
          $list=($listRaw | ConvertFrom-Json).result.agents
          $eligible=@($list | Where-Object {
            $_.agent -eq 'codex' -and
            $_.agent_status -in @('idle','done') -and
            [string]::IsNullOrWhiteSpace([string]$_.name) -and
            [string]$_.cwd -eq 'C:\WINDOWS\system32'
          })
          if($eligible.Count -ne 1){throw "VISIBLE_HERDR_CONTROLLER_COUNT_$($eligible.Count)"}
          $pane=[string]$eligible[0].pane_id
          $session=[string]$eligible[0].agent_session.value
          if(!$pane -or !$session){throw 'VISIBLE_CONTROLLER_BINDING_MISSING'}
          $before=@($list | ForEach-Object {[string]$_.pane_id})

          $prompt="Read GitHub directly. You are TRANSPORT/COORDINATOR only, not Worker/Reviewer/Control. Rehydrate D22977/gpt-browser-bridge Issue #162, especially Worker dispatch receipt $workerDispatch and transport authority $transportAuthority, source wake $wake. In the existing VISIBLE Herdr console create exactly one NEW visible/focused workspace/pane and start exactly one fresh Codex child Worker. Do not implement yourself. Hand the child the current #162 Worker card. Child exact base is $workerBase; required branch worker/g12-restore-proven-unattended-resident-loop-01. Child must publish/read-back GBB_RESTORE_PROVEN_UNATTENDED_WORKER_CONSUMED_STARTED_V1 before tracked mutation, use only card-authorized paths/runtime reads, reuse #62 resident semantics plus #103 exact Herdr adapter, test, push/read-back candidate, publish GBB_RESTORE_PROVEN_UNATTENDED_WORKER_RESULT_V1, then park on READY. Do not create/modify permanent Scheduled Tasks before fresh review PASS and later Control deployment authority. No hidden server, no --no-focus, no merge/release, no MEP mutation. Keep child visible in Herdr."
          $sent=(& $h agent prompt $pane $prompt 2>&1 | Out-String)
          if($LASTEXITCODE -ne 0){throw "VISIBLE_CONTROLLER_PROMPT_FAILED $sent"}

          $controllerWorking=$false
          $new=@()
          for($i=0;$i-lt 60;$i++){
            Start-Sleep -Seconds 1
            $nowRaw=(& $h agent list 2>&1 | Out-String)
            if($LASTEXITCODE -ne 0){continue}
            $now=($nowRaw | ConvertFrom-Json).result.agents
            $controller=@($now | Where-Object {[string]$_.pane_id -eq $pane -and [string]$_.agent_session.value -eq $session})
            if($controller.Count -eq 1 -and [string]$controller[0].agent_status -eq 'working'){$controllerWorking=$true}
            $new=@($now | Where-Object {$before -notcontains [string]$_.pane_id -and $_.agent -eq 'codex'})
            if($new.Count -ge 1){break}
          }
          if(!$controllerWorking -and $new.Count -eq 0){throw 'VISIBLE_HERDR_WORK_NOT_OBSERVED'}
          $child=if($new.Count){($new | ForEach-Object {"pane=$($_.pane_id),name=$($_.name),status=$($_.agent_status),cwd=$($_.cwd),session=$($_.agent_session.value)"}) -join ';'}else{'PENDING_CHILD_CREATION_CONTROLLER_WORKING'}
          $body="GBB_ISSUE162_VISIBLE_HERDR_RESTORE_DISPATCH_V1`nstate: VISIBLE_CONTROLLER_WORKING`nsource_wake: $wake`nworker_dispatch_receipt: $workerDispatch`ntransport_authority: $transportAuthority`nworker_base_sha: $workerBase`nlauncher_head_sha: $launcherHead`ncontroller_pane: $pane`ncontroller_session: $session`ncontroller_working_observed: $controllerWorking`nchild_agents: $child`nhidden_server_started: false`nno_focus_used: false`nphysical_controller_prompt_count: 1`nnormal_loop_uses_actions: false`nuser_relay_count: 0`nworkflow_run_id: $env:GITHUB_RUN_ID`nreadback_verified: true"
          $payload=@{body=$body}|ConvertTo-Json -Compress
          $headers=@{Authorization="Bearer $env:GH_TOKEN";'User-Agent'='g12-issue162-visible-dispatch';Accept='application/vnd.github+json'}
          $r=Invoke-RestMethod "https://api.github.com/repos/$repo/issues/$issue/comments" -Headers $headers -Method Post -Body $payload -ContentType 'application/json' -TimeoutSec 30
          $rb=Invoke-RestMethod "https://api.github.com/repos/$repo/issues/comments/$($r.id)" -Headers $headers -Method Get -TimeoutSec 30
          if([string]$rb.body -cne $body){throw 'VISIBLE_DISPATCH_READBACK_MISMATCH'}

  g13-result-return:
    if: >-
      github.event.issue.number == 162 &&
      github.event.comment.user.login == 'D22977' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, 'GBB_G13_HERDR_RESULT_RETURN_REGISTERED_WAKE_V1')
    runs-on: [self-hosted, Windows, GBB-REVIEWER]
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh -NoProfile -File {0}
    steps:
      - name: Return current WebGPT result to unique waiting Herdr pane exactly once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          $h='C:\Users\Lupun\AppData\Local\Programs\Herdr\bin\herdr.exe'
          $repo='D22977/gpt-browser-bridge'
          $issue=162
          $request='5714750641'
          $result='5715087486'
          $return='5715176746'
          $authority='5715349551'
          $marker='GBB_G13_CONTROL_TOWER_013_NEXT_RECOMMENDATIONS_RESULT_V1'
          $ev=Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
          $wake=[string]$ev.comment.id
          $wakeBody=[string]$ev.comment.body
          $headers=@{Authorization="Bearer $env:GH_TOKEN";'User-Agent'='g13-registered-result-return';Accept='application/vnd.github+json'}
          $api="https://api.github.com/repos/$repo"

          function GetComment([string]$id){ Invoke-RestMethod "$api/issues/comments/$id" -Headers $headers -Method Get -TimeoutSec 30 }
          function Publish([string]$body){
            $payload=@{body=$body}|ConvertTo-Json -Compress
            $r=Invoke-RestMethod "$api/issues/$issue/comments" -Headers $headers -Method Post -Body $payload -ContentType 'application/json' -TimeoutSec 30
            $rb=GetComment ([string]$r.id)
            if([string]$rb.body -cne $body){throw "READBACK_MISMATCH_$($r.id)"}
            return [string]$r.id
          }
          function Need([string]$pattern,[string]$name){
            $m=[regex]::Match($wakeBody,$pattern)
            if(-not $m.Success){throw "MALFORMED_WAKE_$name"}
            return $m.Groups[1].Value
          }

          if((Need '(?m)^source_result_receipt:\s*(\d+)\s*$' 'result') -cne $result){throw 'RESULT_BINDING_MISMATCH'}
          if((Need '(?m)^source_return_receipt:\s*(\d+)\s*$' 'return') -cne $return){throw 'RETURN_BINDING_MISMATCH'}
          if((Need '(?m)^authority_receipt:\s*(\d+)\s*$' 'authority') -cne $authority){throw 'AUTHORITY_BINDING_MISMATCH'}

          $rc=GetComment $result
          $rr=GetComment $return
          $ra=GetComment $authority
          foreach($c in @($rc,$rr,$ra)){
            if([string]$c.issue_url -cne "$api/issues/$issue"){throw 'SOURCE_WRONG_ISSUE'}
            if([string]$c.user.login -cne 'D22977' -or [string]$c.author_association -cne 'OWNER'){throw 'SOURCE_WRONG_AUTHOR'}
          }
          if(-not([string]$rc.body).StartsWith($marker)){throw 'RESULT_MARKER_MISMATCH'}
          if([string]$rc.body -notmatch '(?m)^decision:\s*RECOMMENDATIONS_READY\s*$'){throw 'RESULT_NOT_READY'}
          if(-not([string]$rr.body).StartsWith('CONTROL_G13_CONTROL_TOWER_013_WEBGPT_RESULT_RETURN_V1')){throw 'RETURN_MARKER_MISMATCH'}
          if(-not([string]$ra.body).StartsWith('GBB_G13_HERDR_RESULT_RETURN_REGISTERED_WORKFLOW_ADAPTER_REPAIR_V1')){throw 'AUTHORITY_MARKER_MISMATCH'}

          $history=@()
          for($page=1;$page-le 30;$page++){
            $rows=@(Invoke-RestMethod "$api/issues/$issue/comments?per_page=100&page=$page" -Headers $headers -Method Get -TimeoutSec 30)
            $history+=$rows
            if($rows.Count-lt100){break}
          }
          $prior=@($history|Where-Object{([string]$_.body).StartsWith('GBB_G13_HERDR_RESULT_RETURN_DOORBELL_RECEIPT_V1') -and [string]$_.body -match "(?m)^source_result_receipt:\s*$result\s*$" -and [string]$_.body -match '(?m)^state:\s*DELIVERED\s*$'})
          if($prior.Count-gt0){
            $body=@('GBB_G13_HERDR_RESULT_RETURN_DOORBELL_RECEIPT_V1','state: NO_OP_DUPLICATE',"source_wake_receipt: $wake","source_result_receipt: $result",'second_physical_prompt: false',"workflow_run_id: $env:GITHUB_RUN_ID",'user_relay_count: 0','readback_verified: true')-join"`n"
            $null=Publish $body
            exit 0
          }

          if(-not(Test-Path -LiteralPath $h -PathType Leaf)){throw 'HERDR_EXE_MISSING'}
          $status=(& $h status server 2>&1|Out-String)
          if($LASTEXITCODE-ne0 -or $status-notmatch '(?m)^status:\s*running\s*$'){
            $body=@('GBB_G13_HERDR_RESULT_RETURN_DOORBELL_RECEIPT_V1','state: BLOCKED_RUNTIME_UNAVAILABLE',"source_wake_receipt: $wake","source_result_receipt: $result",'first_missing_capability: HERDR_SERVER_NOT_RUNNING','physical_prompt_count: 0',"workflow_run_id: $env:GITHUB_RUN_ID",'user_relay_count: 0','readback_verified: true')-join"`n"
            $null=Publish $body
            throw 'HERDR_SERVER_NOT_RUNNING'
          }

          $listRaw=(& $h agent list 2>&1|Out-String)
          if($LASTEXITCODE-ne0){throw 'HERDR_AGENT_LIST_FAILED'}
          $agents=@(($listRaw|ConvertFrom-Json).result.agents)
          $matches=@()
          foreach($a in $agents){
            if([string]$a.agent -ne 'codex'){continue}
            $pane=[string]$a.pane_id
            $session=[string]$a.agent_session.value
            if(!$pane -or !$session){continue}
            $read=(& $h agent read $pane --source recent-unwrapped --lines 240 2>&1|Out-String)
            if($LASTEXITCODE-ne0){continue}
            $bound=($read-match[regex]::Escape($request)) -or ($read-match[regex]::Escape($marker)) -or ($read-match'GBB_G13_CONTROL_TOWER_013_NEXT_RECOMMENDATIONS')
            $waiting=$read-match'(?i)(wait|waiting|await|monitor|webgpt|recommendations|5714750641|5715087486)'
            if($bound -and $waiting){$matches+=[pscustomobject]@{pane=$pane;session=$session;status=[string]$a.agent_status;name=[string]$a.name;cwd=[string]$a.cwd}}
          }

          if($matches.Count-ne1){
            $summary=($matches|ForEach-Object{"pane=$($_.pane),session=$($_.session),status=$($_.status),name=$($_.name),cwd=$($_.cwd)"})-join';'
            if(!$summary){$summary='NONE'}
            $body=@('GBB_G13_HERDR_RESULT_RETURN_DOORBELL_RECEIPT_V1','state: BLOCKED_AMBIGUOUS_TARGET',"source_wake_receipt: $wake","source_result_receipt: $result","candidate_count: $($matches.Count)","candidate_summary: $summary",'physical_prompt_count: 0','blind_retry_performed: false',"workflow_run_id: $env:GITHUB_RUN_ID",'user_relay_count: 0','readback_verified: true')-join"`n"
            $null=Publish $body
            throw "HERDR_WAITING_TARGET_COUNT_$($matches.Count)"
          }

          $t=$matches[0]
          $prompt="WebGPT Control Tower-013 result is durably available. Do not wait for or resend the previously typed ChatGPT-Web prompt. Exact-GET D22977/gpt-browser-bridge Issue #162 comments $result, $return, and $authority. Consume $marker from result $result. Treat prior browser send as NOT_DELIVERED and do not perform a second browser send. Close only the pending recommendations wait/monitor state. Then stop at the required Repair-15 fresh independent exact-head GPT-5.6 Sol High review gate for 3aa61ea6c742e3d659e82c44775257e2418e5e54; do not activate Rank 1/2/3 before review and Control adoption. Publish and exact-read-back one GBB_G13_HERDR_RESULT_RETURN_CONSUMED_ACK_V1 to Issue #162 with state CONSUMED, source_result_receipt $result, source_wake_receipt $wake, target_pane $($t.pane), target_session $($t.session), user_relay_count 0. No merge/release/workflow dispatch/product mutation from this prompt."
          $out=(& $h agent prompt $t.pane $prompt 2>&1|Out-String)
          if($LASTEXITCODE-ne0){
            $body=@('GBB_G13_HERDR_RESULT_RETURN_DOORBELL_RECEIPT_V1','state: UNCERTAIN_SEND',"source_wake_receipt: $wake","source_result_receipt: $result","target_pane: $($t.pane)","target_session: $($t.session)",'physical_prompt_invoked: true','physical_prompt_count: 1','post_prompt_working_observed: false','blind_retry_performed: false',"workflow_run_id: $env:GITHUB_RUN_ID",'user_relay_count: 0','readback_verified: true')-join"`n"
            $null=Publish $body
            throw 'HERDR_PROMPT_NONZERO_NO_RETRY'
          }

          $working=$false
          for($i=0;$i-lt20;$i++){
            Start-Sleep -Seconds 1
            $nowRaw=(& $h agent list 2>&1|Out-String)
            if($LASTEXITCODE-ne0){continue}
            $now=@(($nowRaw|ConvertFrom-Json).result.agents|Where-Object{[string]$_.pane_id-eq$t.pane -and [string]$_.agent_session.value-eq$t.session})
            if($now.Count-eq1 -and [string]$now[0].agent_status-eq'working'){$working=$true;break}
          }
          $state=if($working){'DELIVERED'}else{'UNCERTAIN_SEND'}
          $body=@('GBB_G13_HERDR_RESULT_RETURN_DOORBELL_RECEIPT_V1',"state: $state","source_wake_receipt: $wake","source_result_receipt: $result","source_return_receipt: $return","authority_receipt: $authority","target_pane: $($t.pane)","target_session: $($t.session)",'physical_prompt_invoked: true','physical_prompt_count: 1',"post_prompt_working_observed: $($working.ToString().ToLowerInvariant())",'second_physical_prompt: false','blind_retry_performed: false',"workflow_run_id: $env:GITHUB_RUN_ID",'user_relay_count: 0','readback_verified: true')-join"`n"
          $receipt=Publish $body
          Write-Output "G13 result-return state=$state receipt=$receipt pane=$($t.pane)"
          if(-not$working){throw 'POST_PROMPT_WORKING_NOT_OBSERVED_NO_RETRY'}
